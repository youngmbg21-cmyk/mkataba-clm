<script>
  // HaTi — CLM redesign (teal brand on slate, light/dark via the `dark` class).
  // Inter / Plus Jakarta Sans typography, white surfaces on slate-50, a teal
  // accent (#0d9488), 12px radii and an amber / emerald / rose status model.

        // rose (Closed / Expired / risk / danger)

<!-- The design's two faces, and only those: Inter for body copy, Plus Jakarta
     Sans for headings. Served from the repo rather than Google Fonts so the
     platform renders identically offline, behind a restrictive network and
     inside a strict content policy — a silent fallback to a system face is the
     exact drift this redesign removes. See fonts/fonts.css. -->


<!-- The separate document faces (Google Sans Flex / Google Sans Code) are
     retired: the platform runs on the design's two families throughout, contract
     text included, so --font-doc now resolves to Inter. -->

<style>
  /* ============================================================
     INDUSTRY DESIGN TOKENS — source of truth for the redesign.
     ============================================================ */
  :root{
    --color-bg:#f8fafc;
    --color-surface:#ffffff;
    --color-text:#1e293b;
    --color-accent:#0d9488;
    --color-divider:#e2e8f0;

    --color-neutral-100:#f1f5f9; --color-neutral-200:#e2e8f0; --color-neutral-300:#cbd5e1;
    --color-neutral-400:#94a3b8; --color-neutral-500:#64748b; --color-neutral-600:#475569;
    --color-neutral-700:#334155; --color-neutral-800:#1e293b; --color-neutral-900:#0f172a;

    --color-accent-100:#ccfbf1; --color-accent-200:#99f6e4; --color-accent-300:#5eead4;
    --color-accent-400:#2dd4bf; --color-accent-500:#14b8a6; --color-accent-600:#0d9488;
    --color-accent-700:#0f766e; --color-accent-800:#115e59; --color-accent-900:#134e4a;

    /* solid brand fills that must NOT flip with the theme (nav active, primary
       buttons, the Copilot header) — always teal, always white-on-top */
    --accent-solid:#0d9488; --accent-solid-hover:#0f766e;
    --brand-grad:linear-gradient(135deg,#0d9488,#06b6d4);

    /* HOW TALL A FULL-HEIGHT VIEW MAY BE. The views that fill the window —
       the register, the calendar, the workspace, the queue — used to subtract a
       hardcoded 52px, which was already the wrong number and became wronger
       when the command strip was replaced by a per-page header whose height
       depends on whether the page has a subtitle and whether it wraps.
       renderPageHeader measures the scroll container and writes the real value
       here after every render; this is only the value before the first one. */
    --view-h:calc(100vh - 126px);
    --font-heading:"Plus Jakarta Sans",Inter,system-ui,sans-serif;
    --font-body:Inter,system-ui,sans-serif;
    /* THE FIGURE FACE, not a code face. This token is used ~160 times for
       reference ids, dates, day counts and money — data, not code — and the
       design sets all of that in Inter. Pointing it at a monospace stack made
       every zero in the product a slashed or dotted zero (SF Mono, Consolas and
       DejaVu Sans Mono all draw one), so "0" in a metric did not match "0" in
       the sentence beside it. Inter's digits are uniform-width by default, so
       columns still line up without borrowing a typewriter face to do it. */
    --font-mono:Inter,system-ui,sans-serif;
    /* True monospace, kept for the two things that are genuinely code: a
       SHA-256 fingerprint and a keyboard chip. */
    --font-code:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;

    /* The DOCUMENT faces. These apply to contract text only — the pane you
       read a contract in, the counterparty portal, the template preview and
       the PDF export.
       They used to be a separate pair (Google Sans Flex / Google Sans Code) so
       that "the product" and "the paper" were distinguishable at a glance. The
       redesign runs one type system end to end, so they now resolve to the
       interface faces. Contract text is still governed by its own tokens — the
       .doc-surface size, leading and ink below are unchanged — so the paper
       keeps its own measure even though it shares a family with the app. */
    --font-doc:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-doc-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;

    /* Document text colour. A solid token, deliberately NOT an opacity
       modifier. `text-brand-800/85` composited the blue-grey #2c455d onto the
       #fbfbfc document page and landed at 6.29:1 — under WCAG AAA's 7:1 for
       body copy, and the /65 and /60 labels beside it were 3.67:1 and 3.24:1,
       under AA's 4.5:1. Opacity also means the same class reads differently on
       every background it lands on, which is why the fix is a colour and not a
       smaller number. Measured ratios are in SUMMARY.md.
         --color-doc-text  #15181a on #fbfbfc = 17.25:1  (17.84:1 on white)
         --color-doc-muted #4a4f54 on #fbfbfc =  8.00:1
       Both are measured with the WCAG relative-luminance formula, not judged
       by eye. See also print-color-adjust, further down. */
    --color-doc-text:#15181a;
    --color-doc-muted:#4a4f54;         /* secondary document copy only */
    --color-doc-rule:#c9ccd1;

    --space-1:3.4px; --space-2:6.8px; --space-3:10.2px; --space-4:13.6px; --space-6:20.4px; --space-8:27.2px;
    --radius-sm:8px; --radius-md:12px; --radius-lg:12px;

    --shadow-sm:0 1px 2px rgba(15,23,42,.05), 0 10px 26px -12px rgba(15,23,42,.18);
    --shadow-md:0 4px 10px rgba(15,23,42,.07), 0 18px 40px -14px rgba(15,23,42,.25);
    --shadow-lg:0 12px 32px color-mix(in srgb,#0f172a 22%,transparent);

    /* legacy elevation aliases kept so un-migrated views still separate cleanly */
    --ring:0 0 0 1px var(--color-divider);
    --sh1:var(--shadow-sm); --sh2:var(--shadow-sm); --sh3:var(--shadow-md); --sh4:var(--shadow-lg);
    --focus:0 0 0 2px color-mix(in srgb,var(--color-accent) 45%,transparent);
    --ease:cubic-bezier(.2,.7,.3,1);

    /* danger / destructive-action tone (used by confirmDialog, delete, decline) */
    --danger:#dc2626; --danger-hover:#b91c1c; --red-tint:rgba(220,38,38,.1);

    /* status palette (wash bg / fg / dot) */
    --st-gray-bg:#f1f5f9;  --st-gray-fg:#475569;  --st-gray-dot:#94a3b8;
    --st-amber-bg:#fef3c7; --st-amber-fg:#b45309; --st-amber-dot:#f59e0b;
    --st-green-bg:#d1fae5; --st-green-fg:#047857; --st-green-dot:#10b981;
    --st-ruby-bg:#ffe4e6;  --st-ruby-fg:#be123c;  --st-ruby-dot:#f43f5e;
    --st-steel-bg:#ccfbf1; --st-steel-fg:#115e59; --st-steel-dot:#14b8a6;

    /* tone tiles (icon tiles: tile-bg / tile-fg) */
    --tile-steel-bg:#ccfbf1;   --tile-steel-fg:#115e59;
    --tile-emerald-bg:#d1fae5; --tile-emerald-fg:#047857;
    --tile-amber-bg:#fef3c7;   --tile-amber-fg:#b45309;
    --tile-ruby-bg:#ffe4e6;    --tile-ruby-fg:#be123c;

    /* tone gradients (hero stat cards only) */
    --grad-steel:linear-gradient(135deg,#14b8a6,#0891b2);
    --grad-emerald:linear-gradient(135deg,#34d399,#059669);
    --grad-amber:linear-gradient(135deg,#fbbf24,#d97706);
    --grad-ruby:linear-gradient(135deg,#fb7185,#e11d48);
  }

  /* ============================================================
     DARK THEME — html.dark (toggled from the top header, persisted
     as 'hati-theme'). Surfaces and neutrals flip; the teal accent
     ramp and the document paper (--color-doc-*) deliberately do not:
     a contract still reads as paper in a dark room. Views are being
     re-skinned page-by-page; anything still reading these tokens
     inherits a coherent dark automatically.
     ============================================================ */
  html.dark{
    --color-bg:#020617;
    --color-surface:#0f172a;
    --color-text:#e2e8f0;
    --color-divider:#1e293b;

    --color-neutral-100:#1e293b; --color-neutral-200:#334155; --color-neutral-300:#475569;
    --color-neutral-400:#64748b; --color-neutral-500:#94a3b8; --color-neutral-600:#94a3b8;
    --color-neutral-700:#cbd5e1; --color-neutral-800:#e2e8f0; --color-neutral-900:#f1f5f9;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -12px rgba(0,0,0,.55);
    --shadow-md:0 4px 10px rgba(0,0,0,.45), 0 18px 40px -14px rgba(0,0,0,.6);
    --shadow-lg:0 12px 32px rgba(0,0,0,.6);

    --st-gray-bg:rgba(148,163,184,.14);  --st-gray-fg:#94a3b8;  --st-gray-dot:#64748b;
    --st-amber-bg:rgba(245,158,11,.15);  --st-amber-fg:#fbbf24; --st-amber-dot:#f59e0b;
    --st-green-bg:rgba(16,185,129,.15);  --st-green-fg:#34d399; --st-green-dot:#10b981;
    --st-ruby-bg:rgba(244,63,94,.15);    --st-ruby-fg:#fb7185;  --st-ruby-dot:#f43f5e;
    --st-steel-bg:rgba(20,184,166,.15);  --st-steel-fg:#5eead4; --st-steel-dot:#14b8a6;

    --tile-steel-bg:rgba(20,184,166,.16);  --tile-steel-fg:#5eead4;
    --tile-emerald-bg:rgba(16,185,129,.16);--tile-emerald-fg:#34d399;
    --tile-amber-bg:rgba(245,158,11,.16);  --tile-amber-fg:#fbbf24;
    --tile-ruby-bg:rgba(244,63,94,.16);    --tile-ruby-fg:#fb7185;
  }

  *,*::before,*::after{box-sizing:border-box;}
  .hidden{display:none!important;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    color:var(--color-text);
    font-family:var(--font-body);
    background:var(--color-bg);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    min-height:100vh; font-size:13px; line-height:1.5;
  }
  h1,h2,h3,h4,h5,h6,.font-display{font-family:var(--font-heading);font-weight:600;letter-spacing:-0.01em;}
  a{color:var(--color-accent-700);}
  a:hover{color:var(--color-accent-800);}
  ::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent);}
  input::placeholder,textarea::placeholder{color:var(--color-neutral-500);}

  /* elevation utilities (mapped onto the Industry shadow scale) */
  .elev-1{box-shadow:var(--shadow-sm)} .elev-2{box-shadow:var(--shadow-sm)}
  .elev-3{box-shadow:var(--shadow-md)} .elev-4{box-shadow:var(--shadow-lg)}
  .lift{transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .15s}
  .lift:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .tnum{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  button,[role=button]{transition:background .15s,color .15s,box-shadow .15s,border-color .15s}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px;}

  /* ---- soft card frame: the old "blueprint" corner-registration marks are
     retired in favour of larger radii + diffuse layered shadows. The corner
     adornments are hidden; the element and its (now soft) border remain. ---- */
  .blueprint{position:relative;border:1px solid var(--color-divider);}
  .blueprint>.corner{display:none;}

  /* card rounding */
  .bp-round{border-radius:10px;}
  /* the Doc right panel is a scrolling flex column; its cards carry
     overflow:hidden (→ flex min-height:0), so pin flex-shrink to stop them
     collapsing to zero height when the content is taller than the panel */
  #doc-right>*{flex-shrink:0;}

  /* status badge — pill-shaped chip (optional leading dot) */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap;font-family:var(--font-body);}
  .badge>.dot{width:6px;height:6px;border-radius:50%;flex:none;}

  /* buttons */
  .ui-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:13px;line-height:1.2;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:8px;padding:6px 12px;transition:background .15s,border-color .15s,color .15s;}
  .ui-btn:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent);}
  .ui-btn-primary{background:var(--accent-solid);color:#fff;border-color:var(--accent-solid);box-shadow:0 4px 14px -4px color-mix(in srgb,var(--accent-solid) 55%,transparent);}
  .ui-btn-primary:hover{background:var(--accent-solid-hover);}
  .ui-btn:disabled{opacity:.45;cursor:not-allowed;}

  /* view enter */
  .view-enter{animation:viewIn .24s var(--ease);}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  /* `backwards` (not `forwards`) so the row settles to its normal static state
     after the intro — a lingering forwards-filled transform animation keeps a
     stacking context on every row, which traps absolute popovers (e.g. the row
     ⋯ menu) behind later rows and makes them look transparent. */
  .stagger>*{animation:rowIn .34s var(--ease) backwards}
  @keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* live ping (workspace status + activity live dots) */
  @keyframes livePing{0%{box-shadow:0 0 0 0 rgba(13,148,136,.45)}70%{box-shadow:0 0 0 6px rgba(13,148,136,0)}100%{box-shadow:0 0 0 0 rgba(13,148,136,0)}}
  .live-ping{animation:livePing 2.4s infinite;}
  .live-dot{position:relative;}
  .live-dot::after{content:'';position:absolute;inset:-3px;border-radius:9999px;background:currentColor;opacity:.35;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;}
  @keyframes ping{75%,100%{transform:scale(2.1);opacity:0;}}

  /* scrollbars */
  .scroll-thin::-webkit-scrollbar{width:9px;height:9px;}
  .scroll-thin::-webkit-scrollbar-thumb{background:var(--color-neutral-300);border-radius:8px;}
  .scroll-thin::-webkit-scrollbar-track{background:transparent;}
  main{scrollbar-width:thin;scrollbar-color:var(--color-neutral-300) transparent;}

  /* ============================================================
     SHELL — top header / sidebar / command bar / context panel
     ============================================================ */
  .nav-item{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:1px solid transparent;background:none;color:var(--color-neutral-600);font:inherit;font-family:var(--font-body);font-size:12px;font-weight:600;padding:9px 12px;cursor:pointer;text-align:left;border-radius:12px;transition:background .12s,color .12s,border-color .12s;}
  .nav-item .nav-rail{position:absolute;left:0;top:4px;bottom:4px;width:2px;background:transparent;border-radius:2px;}
  .nav-item svg,.nav-item i{flex:none;opacity:.85;}
  .nav-item:hover{background:var(--color-neutral-100);color:var(--color-text);}
  .nav-item:hover svg{opacity:1;}
  .nav-item.active{background:color-mix(in srgb,var(--accent-solid) 10%,transparent);color:var(--color-accent-600);border-color:color-mix(in srgb,var(--accent-solid) 20%,transparent);}
  html.dark .nav-item.active{color:#2dd4bf;}
  .nav-item.active svg{opacity:1;}
  /* Portfolio Intel keeps the accent whether or not it is the current page —
     the reference tints this one glyph on purpose, because the contract graph
     is the thing it wants a reader's eye to find in the list. */
  .nav-item[data-view="intel"] svg{color:var(--accent-solid);opacity:1;}
  html.dark .nav-item[data-view="intel"] svg{color:#2dd4bf;}
  .nav-item[data-view="intel"].active svg{color:inherit;}
  /* Nav counts as tinted pills (the design's "AI Active" / "3 Open" tags):
     teal for portfolio totals, amber for work waiting on someone, neutral
     gray for everything else — and a zero always renders neutral, because a
     colored tag with nothing behind it is a false alarm. */
  .nav-count{flex:none;font-size:9.5px;font-family:var(--font-mono);font-weight:700;padding:1px 7px;border-radius:999px;background:var(--color-neutral-100);color:var(--color-neutral-500);white-space:nowrap;}
  .nav-count:empty{display:none;}
  .nav-count[data-tone="teal"]{background:color-mix(in srgb,var(--accent-solid) 14%,transparent);color:var(--color-accent-600);}
  html.dark .nav-count[data-tone="teal"]{color:#2dd4bf;}
  .nav-count[data-tone="amber"]{background:rgba(245,158,11,.18);color:#b45309;}
  html.dark .nav-count[data-tone="amber"]{color:#fcd34d;}
  /* the design's right-aligned tag on a nav row ("2 Open" on Redline) */
  .nav-badge{margin-left:auto;flex:none;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;
    background:rgba(245,158,11,.2);color:#b45309;white-space:nowrap;}
  html.dark .nav-badge{color:#fcd34d;}
  /* Collapsible nav sections: the group label is a +/- toggle that shows or
     hides its tabs. Only ADMINISTRATION folds now — its header is the one
     button left carrying data-section-toggle and the +/− glyph; every other
     section is permanently open under a .static label, because a nav that can
     hide its own destinations makes people hunt for tabs they use daily. The
     section holding the active view is still auto-opened in setActiveNav(). */
  .nav-section-head{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;cursor:pointer;font:inherit;font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-400);padding:12px 12px 6px;text-align:left;transition:color .12s;}
  .nav-section:first-child .nav-section-head{padding-top:4px;}
  .nav-section-head:hover{color:var(--color-accent-600);}
  /* a label, not a control: no pointer, no hover invitation, nothing to press */
  .nav-section-head.static{cursor:default;}
  .nav-section-head.static:hover{color:var(--color-neutral-400);}
  .nav-plus{margin-left:auto;position:relative;width:12px;height:12px;flex:none;opacity:.8;}
  .nav-plus::before,.nav-plus::after{content:'';position:absolute;background:currentColor;border-radius:1px;transition:opacity .15s;}
  .nav-plus::before{left:1px;right:1px;top:5px;height:2px;}   /* horizontal bar (always shown) */
  .nav-plus::after{top:1px;bottom:1px;left:5px;width:2px;}    /* vertical bar (hidden when open → minus) */
  .nav-section.open .nav-plus::after{opacity:0;}
  .nav-section-head:hover .nav-plus{opacity:1;}
  .nav-section:not(.open) .nav-section-body{display:none;}

  .panel-tab{flex:1;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-family:var(--font-heading);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:9px 0;cursor:pointer;color:var(--color-neutral-500);}
  .panel-tab.active{border-bottom-color:var(--color-accent);color:var(--color-accent-600);}
  .panel-tab:hover{color:var(--color-text);}

  /* top-header global search (⌘K) — a flex item that may shrink, so the
     jurisdiction switcher and the search never overlap on narrower shells */
  .cmd-search{display:flex;align-items:center;gap:8px;border:1px solid var(--color-divider);background:var(--color-neutral-100);padding:6px 12px;flex:0 1 24rem;min-width:130px;border-radius:12px;transition:border-color .15s,box-shadow .15s;}
  .cmd-search:focus-within{border-color:var(--color-accent-500);box-shadow:0 0 0 1px var(--color-accent-500);}
  .cmd-search input{border:0;outline:0;background:transparent;font:inherit;font-family:var(--font-body);font-size:12.5px;flex:1;min-width:0;color:inherit;}

  /* top-header square icon buttons (theme toggle, notifications) */
  .hdr-icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--color-divider);background:var(--color-neutral-100);border-radius:12px;color:var(--color-neutral-600);cursor:pointer;transition:background .15s,color .15s;}
  .hdr-icon-btn:hover{background:var(--color-neutral-200);color:var(--color-text);}

  /* jurisdiction switcher (Sweden / Kenya) */
  .region-btn{display:flex;align-items:center;gap:6px;border:0;background:none;font:inherit;font-family:var(--font-body);font-size:11px;font-weight:600;padding:4px 10px;border-radius:9px;cursor:pointer;color:var(--color-neutral-500);transition:background .15s,color .15s;white-space:nowrap;}
  .region-btn:hover{color:var(--color-text);}
  .region-btn.active{background:var(--accent-solid);color:#fff;box-shadow:0 1px 4px rgba(15,23,42,.18);}

  /* theme toggle: both glyphs live in the button; html.dark picks which shows */
  #theme-icon-sun{display:none;color:#fbbf24;}
  html.dark #theme-icon-moon{display:none;}
  html.dark #theme-icon-sun{display:block;}
  #side-copilot:hover{filter:brightness(1.07);}
  /* narrow shells: shed the "Jurisdiction:" caption first, then the switcher,
     then the global search and the profile text */
  @media (max-width:1620px){ #region-switch>span:first-child{display:none;} }
  @media (max-width:1430px){ #region-switch{display:none!important;} }
  @media (max-width:1000px){ .cmd-search{display:none!important;} #hdr-profile-meta{display:none!important;} .cmd-ai-label{display:none!important;} }

  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}html{scroll-behavior:auto;}}

  /* ---- Intel contract graph ---- */
  #ig-svg{touch-action:none}
  .ig-link{stroke:var(--color-neutral-400);stroke-width:1.4;fill:none;opacity:.55;transition:stroke .15s,opacity .15s,stroke-width .15s}
  .ig-link.hi{stroke:var(--color-accent);opacity:1;stroke-width:2.2}
  .ig-link.dim{opacity:.08}
  .ig-node{cursor:pointer}
  .ig-chip{stroke:var(--color-divider);stroke-width:1.4;filter:drop-shadow(0 3px 8px rgba(43,43,45,.08));transition:stroke .15s,filter .15s}
  .ig-node.hi .ig-chip{stroke:var(--color-accent);stroke-width:2;filter:drop-shadow(0 6px 14px rgba(43,43,45,.14))}
  .ig-node.dim{opacity:.22;transition:opacity .15s}
  .ig-lab{pointer-events:none;font-size:11.5px;font-family:var(--font-body)}
  .ig-sub{pointer-events:none;font-size:9px;font-family:var(--font-mono)}
  .ig-node.mut{opacity:.28;transition:opacity .15s}
  .ig-node.hit .ig-chip{stroke:var(--color-accent);stroke-width:2;filter:drop-shadow(0 0 7px rgba(89,128,166,.4)) drop-shadow(0 3px 8px rgba(43,43,45,.08))}
  .ig-badge-txt{pointer-events:none;font-size:8px;font-weight:700;font-family:var(--font-mono)}
  #ig-dock{transition:width .25s cubic-bezier(.22,.61,.36,1)}
  .ig-lens{transition:background .15s,border-color .15s,color .15s}

  /* inline editable fields (contract workspace) */
  .field{font-family:var(--font-mono);font-size:.95em;color:var(--color-accent-800);background:var(--color-accent-100);border:none;border-bottom:1.5px dashed var(--color-accent-400);padding:1px 6px;border-radius:4px 4px 0 0;min-width:90px;transition:background .15s,border-color .15s,box-shadow .15s;outline:none;}
  .field:hover{background:var(--color-accent-200);}
  .field:focus{background:#fff;border-bottom-color:var(--color-accent);box-shadow:0 2px 0 0 var(--color-accent),0 0 0 2px color-mix(in srgb,var(--color-accent) 18%,transparent);}
  .field.field-date{min-width:140px;} .field.field-num{text-align:right;min-width:130px;}
  .field:disabled{color:var(--color-text);background:transparent;border-bottom:1.5px solid var(--color-divider);-webkit-text-fill-color:var(--color-text);opacity:1;cursor:default;font-weight:600;}

  /* map graph (folder view) */
  .mlink{stroke:var(--color-neutral-400);stroke-width:1.4;fill:none;opacity:.6;transition:stroke .15s,opacity .15s,stroke-width .15s;}
  .mlink.hi{stroke:var(--color-accent);opacity:1;stroke-width:2.2;}
  .mlink.dim{opacity:.08;}
  .mlabel{fill:var(--color-neutral-700);font-size:9.5px;font-family:var(--font-heading);pointer-events:none;opacity:0;transition:opacity .15s;}
  .mlabel.show{opacity:1;}
  .mnode{cursor:pointer;}
  .mnode .chipbg{fill:var(--color-surface);stroke:var(--color-divider);stroke-width:1.4;transition:stroke .15s;}
  .mnode.hi .chipbg{stroke:var(--color-accent);stroke-width:2;}
  .mnode.sel .chipbg{stroke:var(--color-accent-700);stroke-width:2.4;}
  .mnode.dim{opacity:.18;transition:opacity .15s;}
  #map-svg{cursor:grab;}
  #map-svg.panning{cursor:grabbing;}

  .qdot{cursor:pointer;transition:r .15s;}
  .qdot:hover{stroke:var(--color-accent-900);stroke-width:2;}
  #party-scrim{opacity:0;pointer-events:none;transition:opacity .25s;}
  #party-scrim.open{opacity:1;pointer-events:auto;}
  .modal-in{animation:viewIn .2s cubic-bezier(.22,.61,.36,1);}

  .seal-in{animation:sealIn .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes sealIn{from{opacity:0;transform:scale(.9) rotate(-3deg);}to{opacity:1;transform:none;}}
  .seal-pop{animation:sealIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
  .toast-in{animation:toastIn .3s cubic-bezier(.22,.61,.36,1);}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .anchor-flash{animation:anchorFlash 1.8s ease;border-radius:4px;}
  @keyframes anchorFlash{0%{background:var(--color-accent-100);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-accent) 30%,transparent);}100%{background:transparent;box-shadow:0 0 0 3px transparent;}}
  .scan-pulse{animation:scanPulse 1s ease infinite;}
  @keyframes scanPulse{0%,100%{opacity:.45;}50%{opacity:1;}}

  /* Copilot slide-over */
  #ai-panel{position:fixed;top:0;right:0;bottom:0;z-index:50;transform:translateX(105%);transition:transform .3s cubic-bezier(.22,.61,.36,1),max-width .28s cubic-bezier(.22,.61,.36,1);}
  /* Expanded: the panel stretches leftward (it stays anchored right), giving
     comparison tables and long answers real room. clamp() keeps it sane on
     narrow screens (never below the normal width; w-full caps tiny viewports). */
  #ai-panel.expanded{max-width:clamp(430px,72vw,940px)!important;}
  #ai-scrim{position:fixed;inset:0;z-index:40;}
  #ai-panel.open{transform:none;}
  /* DOCKED: an overlay drawer, and nothing behind it moves.
     The drawer floats on top of the right-hand side of the screen — it does not
     take a column, so no width behind it changes, no clause frame shifts left
     and no line re-wraps at the moment it opens. A reader who selected a phrase
     and pressed a button must be able to find that phrase again in the same
     place. The shadow is what separates the layer from the page now that there
     is no scrim doing it. */
  #ai-panel.docked{
    position:fixed; top:0; right:0; height:100vh; z-index:100;
    box-shadow:-5px 0 25px rgba(0,0,0,.15);
    border-left:1px solid var(--color-divider);
  }
  /* Belt and braces on the shell itself: nothing may reserve room for the
     drawer, whatever else on the page thinks it is doing. */
  #app-shell{right:0!important;}
  /* THE PANEL'S OWN LAYOUT, not borrowed from a utility framework.
     Its column was carried entirely by Tailwind classes, so on a page where the
     CDN does not answer — the offline stage this app is checked on — the header
     grew to fit its content, the feed grew to fit the conversation, and a
     proposal card three messages down sat a thousand pixels below the bottom of
     the window with nothing to scroll. That is survivable for a chat you are
     only reading; it is not survivable now that the panel carries buttons that
     file redlines. These rules say the same thing the classes do, so they are a
     no-op when the framework loads and the whole layout when it does not. */
  /* width, not just max-width: a fixed-position element with only a maximum
     shrinks to fit its content, so without the framework's w-full the panel
     came out about a hundred pixels wide. */
  #ai-panel{display:flex;flex-direction:column;width:100%;box-shadow:var(--shadow-lg);}
  #ai-panel > *{flex:none;}
  #ai-panel > header{display:flex;align-items:center;gap:12px;padding:16px 20px;}
  #ai-feed{flex:1 1 0%;min-height:0;overflow-y:auto;padding:16px 20px;}
  #ai-feed > * + *{margin-top:16px;}
  #ai-panel > footer{padding:12px 20px 20px;}
  #ai-badge.pulse,.ai-badge-dot.pulse{animation:aiPulse 1.6s ease-in-out infinite;}
  @keyframes aiPulse{0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,.6);}50%{box-shadow:0 0 0 8px rgba(13,148,136,0);}}
  #ai-scrim{opacity:0;pointer-events:none;transition:opacity .25s;}
  #ai-scrim.open{opacity:1;pointer-events:auto;}
  .ai-msg{animation:viewIn .25s cubic-bezier(.22,.61,.36,1);}
  .typing span{display:inline-block;width:5px;height:5px;border-radius:9999px;background:var(--color-accent-400);margin-right:3px;animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-2px);}}

  /* ============================================================
     THE DOCUMENT SURFACE
     Everything that renders CONTRACT TEXT — the workspace document pane, the
     counterparty share portal, the template preview and the PDF export — sits
     inside .doc-surface. The application interface does not. One class is what
     keeps "the product" and "the paper" visually distinct, and it is the one
     place the document faces and the document ink are applied. */
  .doc-surface{
    font-family:var(--font-doc);
    color:var(--color-doc-text);
    font-size:13.5px;
    line-height:1.75;
    /* a contract is read, not skimmed: open the letterfit very slightly and
       stop the browser from tightening it on the larger sizes */
    letter-spacing:0;
    font-variant-numeric:tabular-nums;    /* money and clause numbers line up */
    -webkit-font-smoothing:antialiased;
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
  }
  /* The slant-axis rule that used to live here existed because Google Sans Flex
     ships no italic, only a `slnt` axis. Inter ships a true italic, so emphasis
     in a contract is a drawn italic again and the override is not just
     unnecessary but harmful — it would force the upright and lose the emphasis
     entirely. */
  .doc-surface strong,.doc-surface b{font-weight:600;color:var(--color-doc-text);}
  .doc-surface h1,.doc-surface h2,.doc-surface h3,.doc-surface h4,
  .doc-surface h5,.doc-surface h6{font-family:var(--font-doc);color:var(--color-doc-text);}
  /* the columnar blocks — fee schedules drawn with rules, side-by-side
     signature blocks — where character alignment IS the content */
  .doc-surface pre,.doc-surface code,.doc-surface .doc-pre,
  .doc-surface .font-mono,.doc-surface [style*="--font-mono"]{
    font-family:var(--font-doc-mono);
  }
  /* Secondary document copy (the "· working text ·" rubric, the file note under
     a printed transcription). Still 8:1 — a document has no throwaway text. */
  .doc-surface .doc-muted{color:var(--color-doc-muted);}

  /* Retire the washed-out opacity modifiers ON DOCUMENT SURFACES ONLY. The
     same classes elsewhere in the interface are untouched: this is a fix to
     how a contract reads, not a repaint of the application. Specificity here
     beats Tailwind's single-class utilities without !important. */
  .doc-surface .text-brand-800\/85,.doc-surface .text-brand-800\/80,
  .doc-surface .text-brand-800\/75,.doc-surface .text-brand-800\/70,
  .doc-surface .text-brand-900,.doc-surface .text-brand-800{color:var(--color-doc-text);}
  .doc-surface .text-brand-800\/65,.doc-surface .text-brand-800\/60,
  .doc-surface .text-brand-800\/35,.doc-surface .text-brand-700{color:var(--color-doc-muted);}

  /* ---- rich document content (see DESIGN-rich-documents.md) ----
     A rich body carries NO inline styles — the sanitiser strips every one of
     them — so its whole appearance comes from here. That is deliberate: it is
     what makes a pasted contract look like HaTi paper rather than like the
     machine it was written on. */
  .hati-doc{font-size:13.5px;line-height:1.85;font-family:var(--font-doc);color:var(--color-doc-text);
    print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  .hati-doc>*:first-child{margin-top:0;}
  .hati-doc>*:last-child{margin-bottom:0;}
  .hati-doc p{margin:0 0 0.85em;}
  /* the document face, at the document's own weight — a contract's headings
     are set in the same family as its body, not in the interface face */
  .hati-doc h1,.hati-doc h2,.hati-doc h3,.hati-doc h4{
    font-family:var(--font-doc);font-weight:600;line-height:1.3;margin:1.5em 0 0.5em;}
  .hati-doc h1{font-size:1.42em;text-align:center;letter-spacing:-.01em;}
  .hati-doc h2{font-size:1.16em;}
  .hati-doc h3{font-size:1.04em;}
  .hati-doc h4{font-size:1em;}
  .hati-doc strong{font-weight:600;}
  .hati-doc u{text-underline-offset:2px;}
  .hati-doc ul,.hati-doc ol{margin:0 0 0.85em;padding-left:2.1em;}
  .hati-doc ul ul,.hati-doc ol ol,.hati-doc ul ol,.hati-doc ol ul{margin-bottom:0;}
  .hati-doc li{margin:0 0 0.35em;}
  /* a legal document IS its clause numbers — keep the marker legible and
     aligned with the text it governs */
  .hati-doc ol{list-style-type:decimal;}
  .hati-doc ol ol{list-style-type:lower-alpha;}
  .hati-doc ol ol ol{list-style-type:lower-roman;}
  .hati-doc ol[type="a"]{list-style-type:lower-alpha;}
  .hati-doc ol[type="A"]{list-style-type:upper-alpha;}
  .hati-doc ol[type="i"]{list-style-type:lower-roman;}
  .hati-doc ol[type="I"]{list-style-type:upper-roman;}
  .hati-doc li::marker{font-weight:600;}
  .hati-doc blockquote{margin:0 0 0.85em;padding:0 0 0 1.1em;
    border-left:2px solid var(--color-divider);}
  .hati-doc table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.94em;}
  .hati-doc th,.hati-doc td{border:1px solid var(--color-divider);padding:6px 9px;
    text-align:left;vertical-align:top;}
  .hati-doc th{font-weight:600;background:var(--color-neutral-100);}
  /* preformatted blocks carry the columnar layouts — fee schedules drawn with
     rules, side-by-side signature blocks — so their alignment must survive */
  .hati-doc pre{font-family:var(--font-doc-mono);font-size:.86em;line-height:1.5;
    white-space:pre;overflow-x:auto;margin:1em 0;}
  /* An unfilled blank. GREY on purpose: green already means done/positive in
     this design, and an empty space to complete is neither. The dotted rule
     says "blank line on a paper form"; the pointer + hover appear only where
     the blank knows which field it belongs to (data-field-key) and can
     therefore take a click. Filled values render as plain document text with
     none of this — the styling belongs to emptiness, not to fields. */
  .hati-doc .hati-field{background:var(--color-neutral-100);color:var(--color-neutral-600);
    border-bottom:1px dotted var(--color-neutral-500);padding:0 3px;border-radius:2px;}
  .hati-doc .hati-field[data-field-key]{cursor:pointer;}
  .hati-doc .hati-field[data-field-key]:hover{background:var(--color-neutral-200);
    border-bottom-style:solid;}

  /* the paste/edit surface — a contenteditable, because a textarea can only
     ever hold plain text, which is the thing we are trying to stop losing */
  .hati-editor{outline:none;overflow-y:auto;
    border:1px solid var(--color-divider);background:var(--color-surface);
    border-radius:5px;padding:14px 16px;}
  .hati-editor:focus{border-color:var(--color-accent);box-shadow:var(--focus);}
  .hati-editor:empty::before,
  .hati-editor[data-empty="1"]::before{content:attr(data-placeholder);
    color:var(--color-neutral-500);pointer-events:none;display:block;}

  /* A clause that has just been inserted, or that the reader asked to be shown.
     Held long enough to actually find it on a long page, then released — a
     permanent highlight would become part of how the contract looks. */
  .clause-flash{
    animation:clauseFlash 2.6s ease-out;
    border-radius:3px;
    scroll-margin:90px;
    /* In a plain-text document the clause is not an element, so it is wrapped in
       an inline span for the duration of the flash. That span usually spans
       several wrapped lines: clone the decoration so every line box gets the
       highlight, instead of one box stretched around the lot. */
    -webkit-box-decoration-break:clone;
            box-decoration-break:clone;
  }
  @keyframes clauseFlash{
    0%,55%{ background:var(--color-accent-200); box-shadow:0 0 0 3px var(--color-accent-200); }
    100%  { background:transparent;             box-shadow:0 0 0 3px transparent; }
  }
  @media print{ .clause-flash{animation:none!important;background:transparent!important;box-shadow:none!important;} }

  /* PDF export — print only the prepared document */
  #print-root{display:none;}
  @media print{
    body>*{display:none!important;}
    #print-root{display:block!important;}
    body{background:#fff;}
    /* Print the ink that was measured, not whatever the print pipeline decides
       is economical. Without this, browsers and drivers lighten body text and
       drop background fills — which would silently undo the contrast work on
       exactly the artefact that gets filed, emailed and signed. */
    #print-root,#print-root *{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}
    .doc-surface{color:var(--color-doc-text)!important;font-family:var(--font-doc)!important;}
    .doc-surface .doc-muted{color:var(--color-doc-muted)!important;}
    /* a ruled/columnar block scrolls sideways on screen; on paper there is
       nowhere to scroll, so let it wrap rather than clip the right-hand columns */
    .doc-pre{white-space:pre-wrap!important;overflow:visible!important;}
    .hati-doc pre{white-space:pre-wrap!important;overflow:visible!important;}
    /* a document table must not be split mid-row on paper */
    .hati-doc tr,.hati-doc h1,.hati-doc h2,.hati-doc h3,.hati-doc h4{break-inside:avoid;}
    .hati-doc h1,.hati-doc h2,.hati-doc h3,.hati-doc h4{break-after:avoid;}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}

  /* ============ document designs — body typography ============
     A paper div carrying data-doc-body="<designId>" (js/branding.js,
     docDesignPaperAttr) restyles the document BODY to match its design:
     typeface, heading treatment, justification. !important on the faces
     because the print sheet above enforces --font-doc with !important and
     these five looks must survive onto paper — that is the whole feature.
     --doc-design-accent is pinned inline by docDesignPaperStyle. */
  [data-doc-body="classic-letterhead"] .doc-surface,
  [data-doc-body="classic-letterhead"] .doc-surface *:not(.hati-field):not(input):not(textarea){font-family:Georgia,'Times New Roman',Times,serif!important;}
  [data-doc-body="classic-letterhead"] .doc-surface h1{text-align:center;letter-spacing:.06em;}

  [data-doc-body="modern-minimal"] .doc-surface,
  [data-doc-body="modern-minimal"] .doc-surface *:not(.hati-field):not(input):not(textarea){font-family:'Helvetica Neue',Helvetica,Arial,sans-serif!important;}
  [data-doc-body="modern-minimal"] .doc-surface h1{font-weight:400;letter-spacing:-.01em;}
  [data-doc-body="modern-minimal"] .doc-surface h2{font-weight:600;}

  [data-doc-body="formal-legal"] .doc-surface,
  [data-doc-body="formal-legal"] .doc-surface *:not(.hati-field):not(input):not(textarea){font-family:'Times New Roman',Times,Georgia,serif!important;}
  [data-doc-body="formal-legal"] .doc-surface p{text-align:justify;}
  [data-doc-body="formal-legal"] .doc-surface h1{text-align:center;text-transform:uppercase;letter-spacing:.14em;}
  [data-doc-body="formal-legal"] .doc-surface h2{text-transform:uppercase;letter-spacing:.08em;font-size:1em;}

  [data-doc-body="bold-corporate"] .doc-surface,
  [data-doc-body="bold-corporate"] .doc-surface *:not(.hati-field):not(input):not(textarea){font-family:'Segoe UI',Verdana,Arial,sans-serif!important;}
  [data-doc-body="bold-corporate"] .doc-surface h1{font-weight:800;letter-spacing:.01em;}
  [data-doc-body="bold-corporate"] .doc-surface h2{color:var(--doc-design-accent,#37474f);font-weight:700;}

  [data-doc-body="compact-executive"] .doc-surface,
  [data-doc-body="compact-executive"] .doc-surface *:not(.hati-field):not(input):not(textarea){font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif!important;}
  [data-doc-body="compact-executive"] .doc-surface{font-size:.94em;}
  [data-doc-body="compact-executive"] .doc-surface p{line-height:1.55;}
  [data-doc-body="compact-executive"] .doc-surface h1{font-size:1.35em;}
  [data-doc-body="compact-executive"] .doc-surface h2{font-size:1.02em;}
</style>

/* THE PASSAGE A REPHRASE IS ABOUT, shown rather than remembered. The drawer
   covers the right of the screen and the reader is about to type a sentence
   about wording they can no longer necessarily see, so the wording comes with
   the question. Quoted and set in the document face, so it reads as the
   contract's words rather than as the Copilot's. */
#ai-feed .ai-target{border-left:2px solid var(--color-accent-300);
  background:var(--color-bg);border-radius:0 6px 6px 0;padding:8px 11px;margin:0 0 8px}
#ai-feed .ai-target-head{font-size:9.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:4px}

  color:var(--color-neutral-800);max-height:9.6em;overflow:auto;white-space:pre-wrap}

  /* ---- A MESSAGE BOX YOU CAN READ BACK ----
     Every composer in the product was a one-line <input>, so anything past a
     dozen words scrolled out of view as it was typed. These are textareas that
     wrap and grow: one line at rest, taller as you write, and scrolling once
     they hit max-height — a composer that can push its own send button off the
