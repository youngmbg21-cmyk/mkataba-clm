<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HaTi — Owner / counterparty parity, Chromium verification</title>
<script>
/* --view-h is measured by the shell after its header renders. There is no
   shell here, so the page is given the window and the harness measures the
   real three-column layout rather than a collapsed one. */
document.documentElement.style.setProperty('--view-h', '100vh');
</script>
</head>
<body>
<div id="app-shell"></div>
<div id="content"></div>
<div id="modal-root"></div>
<div id="share-root"></div>

<!-- index.html's own stylesheet and Copilot panel, lifted at load rather than
     copied. Copied markup drifts; this harness exists to measure the real
     thing. Synchronous because js/ai.js wires itself to #ai-send and friends
     the moment it loads — a deliberate choice in a harness and nowhere else. -->
<script>
(function(){
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/index.html', false);
  xhr.send(null);
  var doc = new DOMParser().parseFromString(xhr.responseText, 'text/html');
  Array.prototype.forEach.call(doc.querySelectorAll('style'), function(st){
    var el = document.createElement('style'); el.textContent = st.textContent;
    document.head.appendChild(el);
  });
  ['ai-scrim', 'ai-panel'].forEach(function(id){
    var node = doc.getElementById(id);
    if (node) document.body.appendChild(document.importNode(node, true));
  });
})();
</script>

<script>
/* The application shell, stood in for. Everything below that matters is the
   product's own code, loaded unmodified from js/. */
window.FIRST_PARTY = 'Wanjiru Catering Ltd';
window.PORTAL_MODE = false;
try{
  localStorage.setItem('hati.v1.users', JSON.stringify([{ id:'u_w', name:'Wanjiru Kamau', role:'legal', email:'wanjiru@company.co.ke' }]));

window.emailOff = () => true;
window.counterpartySeenState = () => ({ kind: 'opened' });

<script src="../../js/jurisdiction.js"></script>

     calls docBody() from it. W2 deletes that surface; when it goes, so does
     this dependency — which is itself a small proof that the duplicate was
     never part of the counterparty's own page. -->
<script src="../../js/views/contract.js"></script>
<script src="../../js/views/portal.js"></script>

<script>
/* core.js defines its own currentUser, persist, toast and friends over the top
   of the shell above — which is correct, it IS the product — so the few the
   harness genuinely has to stand in for are re-applied after it. */
window.currentUser = () => ({ id:'u_w', name:'Wanjiru Kamau', role:'legal' });
window.canEdit = () => true;
window.persist = () => {};
window.setView = () => {};
window.toast = () => {};
window.FIRST_PARTY = 'Wanjiru Catering Ltd';
if (!window.TEMPLATES.WH) window.TEMPLATES.WH = { id:'WH', name:'Warehousing and Logistics Services Agreement', folder:'dist' };
/* A Copilot double, so the panel route can be exercised without a key and
   without a model's wording appearing in a measurement. */
window.copilotAvailable = () => true;
window.copilotAsk = async () => JSON.stringify({
  advice: 'Same effect, fewer words.',
  proposedText: 'Invoices are payable within thirty (30) days of issue.' });
</script>

<script>
/* A contract with the two things a re-typeset document loses: headings whose
   numbers are not plain integers, and clause bodies made of more than one
   block. Written the way an upload arrives — rich HTML — so the ingestion path
   is the one under measurement. */
const RICH = [
  '<h1>Warehousing and Logistics Services Agreement</h1>',
  '<p>Between Wanjiru Catering Ltd (Nairobi, Kenya) and Nordfrakt Logistik AB (Malmö, Sweden).</p>',
  '<h2>1.1 Definitions</h2>',
  '<p>In this Agreement, <strong>Business Day</strong> means a day other than a Saturday, Sunday or public holiday in Kenya.</p>',
  '<h2>4. Payment Terms</h2>',
  '<p>All invoices are payable within thirty (30) days from the date of issue (Net-30).</p>',
  '<p>Late payments will incur a service charge of 1.5% per month on the outstanding balance.</p>',
  '<h2>8.2(a) Termination for convenience</h2>',
  '<ol>',
  '<li>Either party may terminate by giving not less than sixty (60) days written notice.</li>',
  '<li>Termination shall not affect fees accrued for services already rendered.</li>',
  '</ol>',
  '<h2>12. Governing Law</h2>',
  '<p>This Agreement is governed by the laws of Kenya.</p>',
  /* ---- LONG ENOUGH TO SCROLL, ON PURPOSE ----
     The clause<->card sync is a claim about SCROLLING, and a document short
     enough to fit its column cannot test it: everything is already on screen,
     so "it is visible afterwards" is true whether the code works or not. These
     clauses exist so both ends can be pushed genuinely out of sight first. */
  '<h2>13. Insurance</h2>',
  '<p>The Provider shall maintain warehouse legal liability insurance with a reputable insurer licensed in Kenya, and shall furnish certificates of currency on request.</p>',
  '<h2>14. Confidentiality</h2>',
  '<p>Each party shall keep confidential all information disclosed by the other in connection with this Agreement, and shall not disclose it to any third party without prior written consent.</p>',
  '<h2>15. Data Protection</h2>',
  '<p>Each party shall comply with the Data Protection Act, 2019 and the regulations made under it in respect of any personal data processed under this Agreement.</p>',
  '<h2>16. Force Majeure</h2>',
  '<p>Neither party is liable for failure to perform caused by an event beyond its reasonable control, provided it notifies the other party promptly and resumes performance as soon as practicable.</p>',
  '<h2>17. Assignment</h2>',
  '<p>Neither party may assign this Agreement without the prior written consent of the other, such consent not to be unreasonably withheld.</p>',
  '<h2>18. Notices</h2>',
  '<p>Notices under this Agreement shall be given in writing and delivered by hand, by courier, or by electronic mail to the addresses set out in Annex B.</p>',
  '<h2>19. Entire Agreement</h2>',
  '<p>This Agreement constitutes the entire agreement between the parties and supersedes all prior negotiations, representations and understandings.</p>',
].join('');

window.READY = (async () => {
  const c = { id:'MK-191', name:'WH — YOUNG MBAGAYA',
    counterparty:'Nordfrakt Logistik AB', template:'WH', status:'Under Review',
    folder:'dist', fields:{}, metadata:{}, audit:[], rounds:[], versions:[],
    signatures:[], comments:[], redlineText: RICH, format:'rich' };
  negoInit(c);
  const byNum = n => negoClauseList(c).find(x => (x.headingText || '').indexOf(n) === 0);

  /* THEIR ask, so the document carries a redline and the card carries verbs. */
  await negoEditClause(c, byNum('4.').clauseId,
    '<p>All invoices are payable within forty-five (45) days from the date of issue (Net-45).</p>'
    + '<p>Late payments will incur a service charge of 1.5% per month on the outstanding balance.</p>',
    { side:'counterparty', author:'Amina Wanjiru · Nordfrakt Logistik AB',
      summary:'Payment terms extended from Net-30 to Net-45' });
  /* OURS, unsent, so the batch send has something to count. Deliberately NOT
     on the list clause: a clause under redline is drawn from its stored ops as
     one block per line, which is the redline renderer's own shape — so leaving
     8.2(a) settled is what lets the harness measure that an <ol> survives
     ingestion at all. */
  await negoEditClause(c, byNum('12.').clauseId,
    '<p>This Agreement is governed by the laws of Kenya and the courts of Nairobi have exclusive jurisdiction.</p>',
    { side:'owner', author:'Wanjiru Kamau',
      summary:'Exclusive jurisdiction added to the governing-law clause' });
  /* Enough cards that the Tracked Changes column scrolls too — the other half
     of what the sync claims. Filed as the counterparty's, which also puts
     Accept/Reject on them and leaves our one draft the only unsent thing. */
  const more = [
    ['13.', '<p>The Provider shall maintain warehouse legal liability insurance with a reputable insurer licensed in Kenya, and shall furnish certificates of currency each quarter.</p>'],
    ['14.', '<p>Each party shall keep confidential all information disclosed by the other in connection with this Agreement for a period of five (5) years after termination.</p>'],
    ['16.', '<p>Neither party is liable for failure to perform caused by an event beyond its reasonable control, provided it notifies the other party within five (5) business days.</p>'],
    ['18.', '<p>Notices under this Agreement shall be given in writing and delivered by hand or by electronic mail to the addresses set out in Annex B.</p>'],
  ];
  for (const [num, body] of more){
    const cl = byNum(num);
    if (cl) await negoEditClause(c, cl.clauseId, body,
      { side:'counterparty', author:'Amina Wanjiru · Nordfrakt Logistik AB' });
  }
  negoPostComment(c, negoChanges(c)[0].id,
    'Our AP cycle runs monthly — Net-30 forces out-of-cycle payments.',
    { side:'counterparty', author:'Amina Wanjiru' });

  window.CONTRACT = c;
  /* Into core.js's OWN state, not over the top of it. `state` and
     `getContract` are script-scoped consts in js/core.js, so a window property
     of the same name is a different binding that renderRedline never reads —
     the page would come up on its "No contract open" empty state and the
     harness would be measuring that instead. */
  state.contracts.unshift(c);
  state.activeId = c.id;
  state.view = 'redline';

  /* ---- ONE CONTRACT, TWO SURFACES ----
     The whole point of this harness is that both sides are measured from the
     SAME record, through the product's own code: renderRedline() for the
     owner, renderSharePortal() off a payload from the real buildSharePayload()
     for the counterparty. Two fixtures would let the two pages differ for
     reasons that are nothing to do with the layout under test. */
  /* EMPTIED, not hidden. A display:none page still answers querySelectorAll,
     so leaving the owner's surface mounted behind the counterparty's had the
     harness measuring four sidebar tabs and a 0px document — reading the
     hidden page as though it were the visible one. Only one of these is ever
     mounted in the product; the harness now matches that. */
  window.SHOW_OWNER = function(){
    document.getElementById('share-root').innerHTML = '';
    document.getElementById('app-shell').classList.remove('hidden');
    renderRedline();
  };
  window.SHOW_COUNTERPARTY = function(){
    document.getElementById('content').innerHTML = '';
    const payload = buildSharePayload(c, { purpose: 'negotiate' });
    renderSharePortal(payload, { token: 'harness-token', share: {
      recipientName: 'Amina Wanjiru', recipientEmail: 'amina@nordfrakt.se' } });
  };
  SHOW_OWNER();
  return true;
})();
</script>
</body>
</html>
