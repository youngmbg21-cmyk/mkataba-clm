# THE SPEED MEASURE (owner, 11 Nov 2026: "time it on GitHub first").
# A measuring instrument, not a test: it prints what each press on a long
# contract costs and what one small change costs on each list page, and it
# never fails a run. It runs only when the measuring script itself (or this
# file) changes on a pushed branch, or when somebody starts it by hand, so
# the ordinary checks are not slowed by it.
name: speed measure

on:
  workflow_dispatch:
  push:
    paths:
      - 'test/chromium/_audit/speed-measure.js'
      - '.github/workflows/measure.yml'

concurrency:
  group: speed-measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: speed measure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright-core install chromium
      - run: node test/chromium/_audit/speed-measure.js
        env:
          HATI_AGENTS_AUTO: 'off'
