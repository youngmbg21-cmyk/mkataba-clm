  .of-desc{ resize:vertical; min-height:79px; max-height:140px; line-height:1.5;
    overflow-y:auto; font:inherit; font-size:15px; }
  /* 11px, not 10, and neutral-600 rather than an opacity — opacity multiplies
     against whatever is behind it, and these rows sit on white inside a card
     inside a page, which is three chances to end up paler than intended. */
  .ob-meta{ font-size:12px; line-height:1.5; color:var(--color-neutral-600); }
  .ob-due{ font-size:12px; color:var(--color-neutral-600); }
  .ob-acts button{ font-size:12px; font-weight:600; color:var(--accent-ink); cursor:pointer; }
  .ob-acts button:hover{ text-decoration:underline; text-underline-offset:2px; }
  .ob-acts button.is-del{ color:var(--st-ruby-fg,#be123c); }
  /* The quote is the EVIDENCE — the wording the obligation was read out of —
     so it is the last thing that should be hard to read. Kept italic and
     indented so it still reads as quoted rather than as more of the row. */
  .ob-quote{ font-size:12px; line-height:1.55; font-style:italic;
    color:var(--color-neutral-700); border-left:2px solid var(--color-divider);
    padding-left:8px; }

  /* ---- THE OBLIGATIONS PAIR ---- see the note at their markup (js/obligations.js).
     Written here rather than as utility classes because what they needed was a
     resting FILL, and the utilities that were on them only ever set a border. */
  .ob-btn{ display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    font:inherit; font-size:12px; font-weight:600; line-height:1.2;
    border:1px solid; border-radius:0; padding:6px 12px;
    transition:background .15s, border-color .15s; }
  .ob-btn-add{ color:var(--accent-ink);
    border-color:color-mix(in srgb,var(--color-accent) 45%,var(--color-divider));
    background:color-mix(in srgb,var(--color-accent) 9%,var(--color-surface)); }
  .ob-btn-add:hover{ border-color:var(--color-accent);
    background:color-mix(in srgb,var(--color-accent) 16%,var(--color-surface)); }
  .ob-btn-find{ color:var(--st-amber-fg,#b45309);
    border-color:var(--st-amber-line,#fcd34d);
    background:var(--st-amber-bg,#fef3c7); }
  .ob-btn-find:hover{ border-color:var(--st-amber-fg,#b45309);
    background:color-mix(in srgb,var(--st-amber-line,#fcd34d) 45%,var(--st-amber-bg,#fef3c7)); }

  /* .kt-read-* went with the quoted read-out on Key terms (2026-08-11) — the
     playbook review panel is the one place those quotes are drawn. */
  .risk-row{ display:flex; align-items:center; gap:9px; padding:4px 0; font-size:13px; }
  .risk-k{ flex:0 0 40%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--color-neutral-700); }
  .risk-bar{ flex:1; height:6px; border-radius:0; background:var(--color-neutral-200); overflow:hidden; }
  .risk-bar i{ display:block; height:100%; border-radius:0; }
  .risk-n{ flex:none; font-family:var(--font-mono); font-size:12px; color:var(--color-neutral-500);
    min-width:22px; text-align:right; }

  /* ---- HISTORY: ONE FULL-WIDTH TRAIL (owner-approved render, 24 Aug 2026) ----
     The Versions card that used to take a third of this tab is retired, so the
     trail has the width — which is what lets each entry say WHAT happened and
     WHO did it without wrapping. .hist-grid and .hist-rail are STALE; flag any
     mention. The rail's vertical line went with the two-column layout: it was
     threading 21px ringed glyphs together, and at 8px in a ruled table the rows
     are already a list. */
  .hist-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 16px; border-bottom:1px solid var(--color-divider); }
  .hist-cap{ font-size:12px; color:var(--color-neutral-600); }
  /* THE ROW IS THE DESIGN'S: a fixed time column, the kind as a dot, the event
     over its actor, and the round at the right wall. Ruled edge to edge, which
     is why the pane carries no padding of its own. */
  .hist-ev{ display:flex; gap:14px; align-items:flex-start;
    padding:11px 16px; border-bottom:1px solid var(--rule); }
  .hist-ev:last-child{ border-bottom:0; }
  .hist-ev:hover{ background:var(--nav-well); }
  .hist-when{ flex:none; width:104px; font-size:13px; color:var(--color-neutral-600);
    font-variant-numeric:tabular-nums; line-height:20px; }
  .hist-dot{ flex:none; width:8px; height:8px; border-radius:50%; margin-top:6px; }
  .hist-body{ flex:1; min-width:0; }
  .hist-round{ flex:none; font-size:12px; color:var(--color-neutral-400);
    font-variant-numeric:tabular-nums; line-height:20px; }
  .hist-text{ font-size:14px; line-height:20px; }
  .hist-meta{ font-size:12px; color:var(--color-neutral-500); margin-top:1px; }
  .hist-meta:empty{ display:none; }
  .hist-empty{ padding:22px 16px; font-size:13px; color:var(--color-neutral-600); }
  .hist-fp{ font-family:var(--font-mono); font-size:12px; color:var(--color-neutral-400); }
  /* The redline itself, under the event that made it — the same green-added /
     red-removed convention the exported report prints. */
  .hist-redline{ border:1px solid var(--color-divider); border-radius:0; padding:8px 10px;
    margin-top:6px; font-size:13px; line-height:1.6; background:var(--color-surface); }
  .hist-redline ins{ background:var(--st-green-bg); color:var(--st-green-fg); text-decoration:underline; }
  .hist-redline del{ background:var(--st-ruby-bg); color:var(--st-ruby-fg); }
  .hist-note{ font-size:12px; color:var(--color-neutral-700); margin-top:5px;
    border-left:2px solid var(--color-divider); padding-left:9px; }
  /* The Everyone / Ours / Theirs pill that used to sit on this head is GONE —
     it was a second handle on the Side dropdown below. .hist-segs and .hist-seg
     went with it; flag any mention as stale. The filter row is no longer behind
     a Filter button either, so this rule is what a reader meets on arrival: it
     carries its own bottom rule, which is the line between the controls and the
     record. */
  /* ---- THE FILTERS STAY, AND READ LIKE THE CONTRACTS PAGE'S (owner-asked
     24 Aug 2026: "keep the filters attached") ----
     They were labelled in 11px uppercase micro-caps, which is this product's
     word for a SIGNPOST rather than for a field; the Contracts page's own
     filters were relabelled on the same day and two filter rows in one product
     disagreeing about their own dress is how the next screen picks the wrong
     one. Same 12px sentence-case label, same control metrics. The row is inset
     and ruled like the head above it, because the pane no longer pads itself. */
  .hist-filters{ display:flex; gap:8px 12px; flex-wrap:wrap; align-items:flex-end;
    padding:10px 16px; border-bottom:1px solid var(--color-divider); }
  #hist-filters{ margin:0; }
  .hist-f{ display:flex; flex-direction:column; min-width:0; }
  .hist-f > span{ font-size:12px; font-weight:400; letter-spacing:0; text-transform:none;
    color:var(--color-neutral-600); margin-bottom:3px; white-space:nowrap; }
  .hist-f select{ font:inherit; font-size:13px; font-weight:400; text-transform:none;
    letter-spacing:0; border:1px solid var(--color-divider); border-radius:0;
    padding:5px 9px; background:var(--color-surface); color:var(--color-text);
    max-width:150px; min-width:96px; }

  .sign-grid{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
    gap:14px; max-width:1080px; width:100%; margin:0 auto; }
  @media (max-width:980px){ .sign-grid{ grid-template-columns:1fr; max-width:660px; } }
  .sig-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:11px; }
  .sig-box{ border:1px dashed var(--color-neutral-300); border-radius:0; padding:12px 13px;
    text-align:center; background:var(--color-bg); }
  .sig-box.is-signed{ border-style:solid; border-color:var(--st-green-line);
    background:color-mix(in srgb, var(--st-green-bg) 55%, transparent); }
  .sig-mark{ min-height:46px; display:grid; place-items:center; }
  .sig-mark img{ height:42px; max-width:100%; object-fit:contain; }
  .sig-name{ font-family:var(--font-heading); font-size:19px; font-weight:600;
    color:var(--st-green-fg); }
  .sig-none{ font-size:13px; color:var(--color-neutral-500); }
  .sig-who{ border-top:1px solid var(--color-divider); margin-top:9px; padding-top:8px;
    font-size:12px; line-height:1.5; color:var(--color-neutral-600); }
  .sig-at{ font-family:var(--font-mono); font-size:12px; }
  .pill-x{ font-size:12px; font-weight:700; padding:2px 9px; border-radius:0; white-space:nowrap; }

  /* The Checks card's rows — an icon, a name, and the verb. Replaces two
     full-height cards that each carried a paragraph and a filled button
     before anything had been run. */
  .check-row{ display:flex; align-items:center; gap:10px; padding:8px 0;
    border-top:1px solid var(--color-divider); font-size:14px; }
  .check-row .ci{ flex:none; width:26px; height:26px; border-radius:0; display:grid;
    place-items:center; background:var(--color-accent-100); color:var(--color-accent-700); }
  html.dark .check-row .ci{ background:rgb(var(--color-accent-500-rgb)/.16); color:var(--color-accent-300); }
  .check-row .cn{ flex:1; min-width:0; font-weight:600; }
  .check-row .cg{ flex:none; border:0; background:none; cursor:pointer; font:inherit;
    font-size:13px; font-weight:700; color:var(--accent-ink); padding:2px 0; }
  .check-row .cg:hover{ text-decoration:underline; }

  /* ---- DARK IS A BLACK THEME, INCLUDING ITS TWO BIGGEST SURFACES ----
     Both theme pickers — the desktop menu and the phone's swatch button —
     advertise Dark as slate on near-black (#1e293b → #0f172a). The platform
     delivered that everywhere except the two surfaces you actually look at:
     the sidebar stayed deep green and the dashboard's welcome band stayed a
     green-to-cyan gradient. They were the largest blocks of colour on the
     screen, so the theme read as "green with a dark page behind it".

     The ramp below is the theme's OWN ramp, not a darker green: the sidebar
     sits one step above the page (#020617) so it still reads as its own
     column, the band starts at near-black, and the accent survives as a
     single warm stop at the band's far edge — mixed from --color-accent-600
     rather than typed, so Navy would get a navy glow if it ever went dark.
     GREEN IS NOT BANISHED, it is demoted from ground to accent: the active
     door, the Copilot launcher and every status colour are untouched. */
  html.dark{
    /* THE WHITE COLUMN'S HOVER AND LIVE-DOOR GROUND NEEDS A NIGHT ANSWER.
       --nav-well is #EFF3F3 in :root, and left undefined here the live door
       drew a near-white block behind near-white text — the one row you are
       standing on was the one row you could not read. The classic fault: a
       colour whose only definition works in one theme. */
    --nav-well:#1a2536;
    --nav-bg:#0b1220; --nav-line:#1e293b; --nav-deep:#131f33;
    --nav-ink:#94a3b8; --nav-ink-strong:#f1f5f9;
    --brand-hero-deep:#060c18;
    --brand-hero:linear-gradient(120deg,var(--brand-hero-deep) 0%,#0d1a2b 55%,
      color-mix(in srgb,var(--color-accent-600) 34%,#0d1a2b) 100%);
    --brand-hero-sub:#9fb3c8;
  }
  /* The band's corner light. A 16% white bloom is a highlight on a saturated
     teal and a grey smudge on near-black, so the dark theme turns it most of
     the way down rather than off — the band keeps its top-right lift without
     looking like a stain. */
  /* ---- THE COLUMN IS WHITE AND THE BAR IS DARK (the enterprise design,
     owner-ruled 24 Aug 2026: "side bar should go to white") ----

     THIS REVERSES 23 Aug's "the doors are white and the live one sits deeper",
     and the reasoning behind that decision is exactly what carries over. That
     day the ask was that a door read as strongly as possible against its
     ground and that the live one be marked by DEPTH rather than by a veil.
     Both still hold; the ground moved. On white, "as strongly as possible" is
     the primary ink, and "deeper" is a filled well rather than a darker green.

     WHAT MARKS THE LIVE DOOR IS A 3px LEFT RULE IN THE ACCENT plus that well.
     A left rule cannot be done with a veil and does not depend on the ground
     having anywhere darker to go, which is what makes it survive the dark
     theme with no override of its own.

     THE COUNTS KEEP THEIR ONE EXCEPTION. 23 Aug's rule was that a plain count
     is a fact and an amber count is a warning, and only above zero. That is
     untouched — only the plain ink changes, from white to the label shade,
     because the ground did. */
  #side-nav .nav-item{ color:var(--color-text); min-height:36px; gap:12px;
    padding:0 16px 0 13px; border:0; border-left:3px solid transparent; }
  #side-nav .nav-item svg{ opacity:.8; }
  #side-nav .nav-item:hover{ background:var(--nav-well); color:var(--color-text); }
  #side-nav .nav-item:hover svg{ opacity:1; }
  #side-nav .nav-item.active{ background:var(--nav-well); color:var(--color-text);
    border-left-color:var(--color-accent-600); }
  #side-nav .nav-item.active .nav-lbl{ font-weight:700; }
  #side-nav .nav-item[data-view="intel"] svg{ color:inherit; }

  /* A PLAIN COUNT IS A FACT, AN AMBER ONE IS A WARNING — unchanged from
     23 Aug, and NAV_COUNT_TONE still hands amber out only above zero so an
     empty queue never cries wolf. On white the plain ink is the label shade
     and the amber one takes the semantic pair rather than a typed hex, so the
     dark theme follows with no second rule. */
  #side-nav .nav-count{ background:none; padding:1px 0; color:var(--color-neutral-500);
    font-family:var(--font-body); font-variant-numeric:tabular-nums; }
  #side-nav .nav-count[data-tone="teal"]{ background:none; color:var(--color-neutral-500); }
  #side-nav .nav-count[data-tone="amber"]{ background:var(--st-amber-bg); color:var(--st-amber-fg);
    padding:0 6px; }

  /* "New" ON INSIGHTS IS NOT A COUNT AND KEEPS ITS PILL — it shares the slot,
     not the meaning: a tag announcing a page worth visiting, which stripped to
     bare text reads as a word that has wandered into the count column. */
  #side-nav #nav-intel-new{ background:var(--color-accent-100);
    color:var(--color-accent-800); padding:1px 7px; }
  #side-nav .nav-section-head{ color:var(--color-neutral-400); }
  #side-nav .nav-section-head:hover{ color:var(--color-accent-600); }
  #side-nav .nav-section-head.static:hover{ color:var(--color-neutral-400); }
  #side-nav .nav-plus{ color:var(--color-neutral-400); }
  #app-shell.rail #side-nav .nav-section-head::before{ color:var(--color-neutral-400); }
  /* THE ACTIVE MARKER SNAPS (WO-12 tier 1). Taking the transition off
     `.nav-item` was not enough: `button,[role=button]` carries a blanket 150ms
     fade, so the marker still drifted from the door you left to the door you
     pressed on every navigation — measured, four of these running at once.
     SCOPED TO THE NAV RATHER THAN THE BLANKET RULE, deliberately: that rule is
     every button's hover in the product, and the 111 transition declarations
     are tier 3, which the order says is NOT this work. */
  #side-nav .nav-item{ transition:none; }
  #side-nav .rail-head{ background:var(--color-surface); border-bottom:1px solid var(--color-divider); }
  #side-nav .rail-head-label{ color:var(--color-neutral-500); }
  /* ---- AND THE BUTTON BESIDE THE LABEL (owner-reported 24 Aug 2026: "bring
     back the ability to collapse the nav panel") ----
     IT NEVER WENT ANYWHERE. MEASURED where the owner drew an empty box: 26x26,
     display:grid, opacity 1, visibility visible, perfectly clickable — and its
     chevron, its fill and its ring were all WHITE on a head this very block had
     just painted white. Contrast 1:1. The three colours were written for the
     dark green sidebar and left behind when the column turned white on 24 Aug;
     the label one line up was re-pointed and the button next to it was not.
     THE SAME FAULT AS --n-accept's white tick on white and .rl-wall unstyled
     outside its page — a rule written for a dark ground, outliving the ground.
     Read from the nav's own inks rather than given literals, so the next time
     this column changes colour the button comes with it. */
  #side-nav .rail-toggle{ border-color:var(--color-divider); background:transparent;
    color:var(--color-neutral-600); }
  #side-nav .rail-toggle:hover{ background:var(--nav-well); color:var(--color-text); }
  #side-nav .rail-toggle:focus-visible{ outline-color:var(--color-accent-600); }

  /* ---- THE FOOT OF THE COLUMN: A COPILOT DOOR AND A STATUS LINE ----
     The design puts both here, and HaTi already had the second: the folding
     workspace-status card (owner-asked 20 Aug 2026) whose handle is a dot, a
     title and a chevron — the design's own status line in all but wording. It
     is kept whole and merely re-dressed for a white ground; every id is the id
     updateSidebarStatus has always written to.

     THE CARD IS NO LONGER STYLED FOR A DARK GROUND, which is the whole of this
     block's change. It used to be white-at-an-alpha throughout on the argument
     that the sidebar is dark in every theme. It is not any more, so every one
     of those alphas becomes a real token and the dark theme answers through
     the tokens rather than through a second copy of the rules. */
  #side-nav .foot-wrap{ border-top-color:var(--color-divider); }
  #side-nav .foot-handle{ display:flex; align-items:center; gap:7px; width:100%; min-width:0;
    padding:10px 16px; border:0; background:none; cursor:pointer; font:inherit; text-align:left; }
  #side-nav .foot-handle:hover{ background:var(--nav-well); }
  #side-nav .foot-handle .foot-card-title{ flex:1; min-width:0; }
  #side-nav .foot-chev{ flex:none; color:var(--color-neutral-400); transition:transform .18s var(--ease); }
  #side-nav .foot-wrap.open .foot-chev{ transform:rotate(180deg); }
  #side-nav .foot-sheet{ position:absolute; left:0; right:0; bottom:100%; z-index:6;
    background:var(--color-surface); border-top:1px solid var(--color-divider); padding:12px;
    transform:translateY(10px); opacity:0; visibility:hidden;
    transition:transform .2s var(--ease), opacity .2s, visibility .2s; }
  #side-nav .foot-wrap.open .foot-sheet{ transform:none; opacity:1; visibility:visible; }
  @media (prefers-reduced-motion:reduce){ #side-nav .foot-sheet,#side-nav .foot-chev{ transition:none; } }
  #side-nav .foot-card{ background:var(--color-surface); border:1px solid var(--color-divider);
    border-radius:0; padding:9px 11px 10px; display:flex; flex-direction:column; gap:5px; min-width:0; }
  #side-nav .foot-card-head{ display:flex; align-items:center; gap:7px; min-width:0; padding-bottom:1px; }
  #side-nav .foot-card-title{ font-family:var(--font-heading); font-size:12px; font-weight:400;
    letter-spacing:0; text-transform:none; color:var(--color-neutral-500);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #side-nav .foot-kpi{ display:flex; align-items:baseline; justify-content:space-between;
    gap:8px; min-width:0; font-size:12px; line-height:1.35; }
  #side-nav .foot-k{ color:var(--color-neutral-500); white-space:nowrap; flex:none; }
  #side-nav .foot-v{ color:var(--color-text); font-weight:600; min-width:0;
    text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-variant-numeric:tabular-nums; }
  #side-nav .foot-v[data-tone="on"]{ color:var(--st-green-fg); }
  #side-nav .foot-v[data-tone="off"]{ color:var(--color-neutral-500); font-weight:400; }
  #side-nav .foot-note{ display:block; font-size:12px; line-height:1.35;
    color:var(--color-neutral-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #side-nav #side-ai-usage{ align-items:flex-start; gap:7px; border:0; background:none;
    cursor:pointer; padding:6px 0 0; margin-top:1px; text-align:left; font:inherit;
    color:inherit; min-width:0; border-top:1px solid var(--color-divider); }
  #side-nav #side-ai-usage .foot-ai-dot{ margin-top:4px; }
  #side-nav .foot-ai-body{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  #side-nav #side-ai-usage:hover .foot-v{ text-decoration:underline; }

  /* THE COPILOT DOOR AT THE FOOT — the design's own dress on the button that
     was already there (#side-copilot). Flat accent, not the brand gradient:
     this shell draws depth in 1px lines, and a soft drop shadow under the one
     coloured block in a white column reads as a leftover from another design. */
  #side-nav .copilot-wrap{ flex:none; border-top:1px solid var(--color-divider); padding:8px 10px; }
  #side-nav #side-copilot{ position:relative; width:100%; min-height:36px; display:flex;
    align-items:center; gap:10px; padding:0 10px; background:var(--color-accent-800);
    border:1px solid var(--color-accent-800); color:#fff; cursor:pointer;
    font:inherit; font-family:var(--font-body); font-size:14px; font-weight:600;
    border-radius:0; box-shadow:none; text-align:left; }
  #side-nav #side-copilot:hover{ background:var(--color-accent-700); border-color:var(--color-accent-700); }
  #side-nav #side-copilot .sc-label{ flex:1; min-width:0; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #side-nav #side-copilot .sc-kb{ flex:none; font-size:11px; font-weight:500; opacity:.75;
    font-family:var(--font-code); }
  #app-shell.rail #side-nav .copilot-wrap{ padding:8px 6px; }
  #app-shell.rail #side-nav #side-copilot{ justify-content:center; padding:0; gap:0; }
  #app-shell.rail #side-nav #side-copilot .sc-kb{ display:none; }

  /* The header's icon controls lose their box. Three bordered grey tiles in a
     row read as a toolbar of equal weights; they are secondary to the search
     and the Copilot, and now look it. */
  .hdr-icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:0;color:var(--color-neutral-500);cursor:pointer;transition:background .15s,color .15s;}
  .hdr-icon-btn:hover{background:var(--color-neutral-100);color:var(--color-text);}

  /* ---- THE SHELL BAR'S OWN CHROME (24 Aug 2026) ----
     Everything in a 44px bar on a dark ground: 32px controls, white ink, and a
     hover that lightens the ground rather than tinting the glyph. Scoped to
     #top-header so .hdr-icon-btn keeps its light-ground treatment everywhere
     else it draws — the class is used well outside this bar. */
  #top-header .hdr-icon-btn{width:32px;height:32px;color:#fff;flex:none;}
  #top-header .hdr-icon-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
  #top-header .sh-div{flex:none;width:1px;height:18px;background:rgba(255,255,255,.24);margin:0 4px;}

  #top-header .cmd-search{flex:0 1 360px;min-width:120px;height:26px;padding:0 9px;gap:7px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;}
  #top-header .cmd-search:focus-within{border-color:rgba(255,255,255,.55);box-shadow:none;}
  #top-header .cmd-search input{font-size:13px;color:#fff;}
  #top-header .cmd-search input::placeholder{color:rgba(255,255,255,.8);}
  #top-header #cmd-k-hint{flex:none;font-size:11px;font-family:var(--font-code);
    border:1px solid rgba(255,255,255,.28);background:none;color:rgba(255,255,255,.8);
    padding:1px 5px;border-radius:0;cursor:pointer;}
  #top-header #cmd-k-hint:hover{background:rgba(255,255,255,.14);}

  /* ONE BORDERED GROUP PER QUESTION — language, then appearance. Both are
     26px, which is the bar's own control height and the one size the design
     allows below 32. */
  #top-header .sh-grp{flex:none;display:flex;align-items:center;border:1px solid rgba(255,255,255,.24);}
  #top-header .sh-grp > *{height:26px;border:0;background:none;cursor:pointer;color:#fff;font:inherit;}
  #top-header .sh-grp > *:focus-visible{outline:2px solid #fff;outline-offset:-2px;}
  #top-header .sh-grp button{font-size:12px;font-weight:600;padding:0 9px;}
  #top-header .sh-grp button:hover{background:rgba(255,255,255,.12);}
  #top-header .sh-grp button[aria-pressed="true"]{background:rgba(255,255,255,.16);}
  /* TWO CLASSES, because `#top-header .sh-grp button` sets a 9px side padding
     and scores one class plus one type — MEASURED, it won, and the swatch drew
     an 8px stripe inside a 26px button with the pressed ring covering most of
     it. Never !important: that wins this fight and hides the next. */
  #top-header .sh-grp .sh-sw{width:26px;padding:0;}
  #top-header .sh-sw i{display:block;width:100%;height:100%;}
  #top-header .sh-sw[hidden]{display:none;}
  /* The chosen brand is marked by a ring INSIDE the swatch, so the colour
     itself is never covered by the thing announcing it. */
  #top-header .sh-sw[aria-pressed="true"] i{box-shadow:inset 0 0 0 2px var(--nav-bg),inset 0 0 0 4px rgba(255,255,255,.9);}

  #top-header #side-avatar{width:32px;height:32px;border-radius:50%;
    border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;
    display:grid;place-items:center;font-size:11px;font-weight:700;
    font-family:var(--font-heading);flex:none;}
  #top-header #rail-avatar:hover #side-avatar{background:rgba(255,255,255,.24);}
  #top-header #hdr-notify-dot{position:absolute;top:2px;right:1px;min-width:14px;height:14px;
    padding:0 2px;box-sizing:border-box;border-radius:0;background:var(--st-amber-dot);
    color:#2A1B04;border:0;font:inherit;font-size:10px;font-weight:700;line-height:14px;
    text-align:center;font-variant-numeric:tabular-nums;}
  #top-header #hdr-notify-dot[hidden]{display:none;}

  /* THE LANGUAGE TOGGLE. It took the top-bar space the jurisdiction flags used
     to hold — the market is a workspace setting an admin picks once and it
     lives in Settings now, while this is a personal one somebody flips
     whenever they like, which is what earns a place in the strip your eye
     crosses all day.

     A segmented pair rather than a dropdown: with two languages the choice and
     its current state are the same glance, and a <select> hides the second
     option behind a click. It degrades by dropping the words, not the control,
     so the tap target survives a narrow window. */
  .lang-toggle{display:inline-flex;align-items:center;background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:0;padding:3px;gap:2px;flex:none;}
  .lang-btn{border:0;background:none;font:inherit;font-family:var(--font-body);font-size:12px;font-weight:600;padding:4px 11px;border-radius:0;cursor:pointer;color:var(--color-neutral-500);transition:background .15s,color .15s;white-space:nowrap;}
  .lang-btn:hover{color:var(--color-text);}
  .lang-btn[aria-pressed="true"]{background:var(--accent-solid);color:#fff;box-shadow:0 1px 4px rgba(15,23,42,.18);}
  .lang-btn:focus-visible{outline:2px solid var(--color-accent-500);outline-offset:1px;}
  /* Below 1180 the words go and the two-letter codes carry it; the button
     itself never shrinks below something a thumb can hit. */
  .lang-btn .lang-long{display:inline;}
  .lang-btn .lang-code{display:none;font-weight:700;letter-spacing:.04em;}
  @media (max-width:1180px){ .lang-btn .lang-long{display:none;} .lang-btn .lang-code{display:inline;} }

  /* theme toggle: both glyphs live in the button; html.dark picks which shows */
  /* The theme control. Its face is a swatch of the theme you are wearing —
     the shortest possible answer to "which one am I on", readable without
     opening anything. The rows below carry their own swatch for the same
     reason: naming a colour is slower than showing it. */
  #theme-swatch{ width:15px; height:15px; border-radius:0; display:block;
    background:var(--brand-grad); border:1px solid rgb(0 0 0/.14); }
  html.dark #theme-swatch{ background:var(--color-neutral-800); border-color:rgb(255 255 255/.22); }
  #theme-menu button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    border:0; background:none; cursor:pointer; font:inherit; font-size:14px; font-weight:400;
    color:var(--color-text); border-radius:0; padding:8px 10px; }
  #theme-menu button:hover{ background:var(--color-neutral-100); }
  #theme-menu .tsw{ width:16px; height:16px; border-radius:0; flex:none;
    border:1px solid rgb(0 0 0/.16); }
  html.dark #theme-menu .tsw{ border-color:rgb(255 255 255/.2); }
  #theme-menu .tnote{ display:block; font-size:12px; font-weight:400;
    color:var(--color-neutral-500); }
  #theme-menu .ttick{ margin-left:auto; flex:none; color:var(--color-accent-700); font-weight:700; }
  html.dark #theme-menu .ttick{ color:var(--color-accent-300); }
  #side-copilot:hover{filter:brightness(1.07);}
  /* narrow shells: shed the language words first, then the global search and
     the profile text. Below 900 the toggle itself moves into the nav drawer
     (placeLanguageSwitch, js/app.js), where the full words fit again. */
  @media (max-width:899px){
    #side-nav #lang-switch{margin:0 12px 4px;align-self:stretch;justify-content:center;}
    /* The drawer has room the header did not, so the words come back even
       though the window is narrow — the 1180 rule is about the header's
       crowding, not about the size of the screen. */
    #side-nav #lang-switch .lang-long{display:inline;}
    #side-nav #lang-switch .lang-code{display:none;}
  }
  /* Retuned. The old single step at 1000 fired too late: at 1024 the right-hand
     actions were still 504px wide, which left the brand block 117px of the
     137px it needs and clipped "HaTi" itself. The profile text and the Copilot
     label — the two widest optional things — now stand down a breakpoint
     earlier, before anything has to be cut. */
  @media (max-width:1199px){ #hdr-profile-meta{display:none!important;} .cmd-ai-label{display:none!important;} }
  @media (max-width:1000px){ .cmd-search{display:none!important;} }

  /* ============================================================
     RESPONSIVE SHELL — the two side strips, and what happens to them.

     THE DEFECT THIS REPLACES. The shell was three strips: a 256px sidebar, the
     middle, and a 292px activity column, all three hard numbers with no
     breakpoint anywhere. Neither side strip ever gave up a pixel, so the
     middle was squeezed from both sides — 732px of working room at 1280, 476px
     at 1024, and negative at 390. And because #app-shell is position:fixed the
     page can never grow a horizontal scrollbar, so what did not fit was not
     scrolled to, it was silently CLIPPED. Zooming the browser out was the only
     way to get the room back. Measured: at 1280 the contract's own name on its
     own page rendered in 31px of the 175px it needed.

     Five sizes, named once here and honoured by every view:
       ultrawide >=1800 | desktop 1440-1799 | laptop 1200-1439
       tablet 900-1199  | phone <900
     Desktop is deliberately IDENTICAL to what shipped before — the density is
     the design, and only the widths that were already broken move.
     ============================================================ */

  /* -- ultrawide: the activity column takes a little more -- */
  @media (min-width:1800px){ :root{ --shell-panel-w:320px; } }
  /* -- laptop: trim it before anything has to be clipped -- */
  @media (max-width:1439px){ :root{ --shell-panel-w:264px; } }

  /* -- THE SIDEBAR'S WIDTH IS NOT DECIDED HERE --
        An earlier version of this block collapsed the sidebar to an icon rail
        on a breakpoint. It no longer does, because the rail is already a
        feature: #app-shell.rail, toggled from the header and remembered per
        browser (applyRail in js/app.js, and the rules further up this file).
        That design is deliberate and it argues its case where it is written —
        a sidebar that folds itself while you are reading has moved every door
        you were aiming at for a reason you did not ask for. Two systems both
        claiming the sidebar's width is exactly the duplication this codebase
        keeps paying for, so there is one, and it is that one. applyRail writes
        the column inline, which would beat anything written here in any case.

        The one exception is the phone, below. At 390px an expanded sidebar
        leaves 134px for the page, which is not a choice between two layouts —
        it is the app not working. -- */

  /* -- BELOW 1280 THE SIDEBAR FLOATS INSTEAD OF PUSHING (13 Aug 2026;
       the line moved from 1500 on 24 Aug 2026 — see NAV_DRAWER_W) --
        Owner-asked, from a ThinkPad: expanding the sidebar squeezed every
        page. It took 192px off the page and no layout rule noticed, because
        every rule in this file measures the WINDOW while the page gets the
        window minus the sidebar.

        So under 1280px the sidebar is a FIXED 64px strip of icons — applyRail
        keeps a 64px track under it, and the strip simply widens to --nav-w over
        the page when it is opened. The page's own width never changes, which
        is what makes it safe to leave collapsed: opening and closing move
        nothing. The number is derived — the dashboard needs 1200px of page,
        plus the sidebar, put the line at 1456; it is derived from the tile row
        and the 240px column now — see NAV_DRAWER_W.

        IT USED TO BE 0px AND A MENU BUTTON, at 899 and below. That is right at
        390px and wrong at 1280, where there is ample room for the icons and
        hiding every door behind a press is the worse trade. One behaviour from
        768 to 1279 now, rather than two systems doing the same job. -- */
  @media (max-width:899px){ #nav-toggle{ display:grid!important; } }
  /* 1536 INCLUSIVE — it must match navDrawerActive()'s `<=` exactly, and that
     number is derived from the supported screen sizes; see the note beside
     NAV_DRAWER_W in js/app.js. EVERY LAPTOP IN THAT SET FLOATS; only the
     1920 full-screen case still pushes. It read 1280 for a day and the owner
     reported the shove back on a ThinkPad — 1366, 1440 and 1536 were all
     pushing, and two of them had floated since the feature was built. */
  @media (max-width:1536px){
    #side-nav{
      position:fixed; top:var(--shell-head-h,64px); left:0; bottom:0; z-index:55;
      width:64px; transition:width .22s var(--ease);
    }
    /* Open, it is the FULL sidebar — labels, counts and all: the rail's
       compaction is for a column that has to share the width, and a floating
       panel does not. So the rail rules further up are unwound for the
       duration. */
    /* THE OPEN LAYER IS THE COLUMN'S OWN WIDTH, read from the token rather than
     typed here — the two disagreed the day --nav-w became 240 and the floating
     drawer went on opening to 256. */
  #side-nav.open{ width:var(--nav-w,240px); box-shadow:var(--shadow-lg); }
    /* width:100%, never auto: auto shrinks each button to its own text, so the
       count badges landed ragged down the list (owner-reported 20 Aug 2026,
       "line up the numbers"). Full width lets the label's flex:1 push every
       badge to one straight column at the drawer's right edge — the same line
       the open column above 1280 has always drawn. */
    #app-shell.rail #side-nav.open .nav-item{ width:100%; justify-content:flex-start; padding:9px 12px; gap:11px; margin:0; }
    #app-shell.rail #side-nav.open .nav-item>span:not(.nav-rail){ display:inline!important; }
    #app-shell.rail #side-nav.open .nav-count:not(:empty){ display:inline-block!important; }
    #app-shell.rail #side-nav.open .nav-item .nav-rail{ left:0; }
    #app-shell.rail #side-nav.open .nav-section-head{ font-size:12px; justify-content:flex-start; padding:12px 12px 6px; }
    #app-shell.rail #side-nav.open .nav-section-head::before{ content:none; }
    #app-shell.rail #side-nav.open .nav-plus{ display:block; margin-left:auto; }
    #app-shell.rail #side-nav.open #nav{ padding:12px; align-items:stretch; }
    #app-shell.rail #side-nav.open .copilot-wrap{ padding:12px; display:block; }
    #app-shell.rail #side-nav.open #side-copilot{ width:100%; padding:10px; }
    #app-shell.rail #side-nav.open .sc-label{ display:inline; }
    /* THE DRAWER IS NOT THE RAIL. It is 240px of dark sidebar floating over
       the page, so the card comes back in full — dark ground, dark-ground
       ink. This rule used to hand it a light-grey panel while the ink rules
       above kept writing white on it, which is the washed-out block the
       drawer was showing. */
    #app-shell.rail #side-nav.open .foot-wrap{ padding:12px; }
    /* THE SWEEP THAT CAME WITH THE BUTTON ABOVE FOUND THIS ONE. Its own
       comment still says "dark ground, dark-ground ink" — true when it was
       written and false since the column turned white. It outranks
       `#side-nav .foot-card` on specificity, so in the floating drawer it put
       a white-at-7% wash behind a white-at-13% border on a white column: no
       card at all. Same two tokens the base rule reads, so the two states of
       one card can no longer disagree. */
    #app-shell.rail #side-nav.open .foot-card{ background:var(--color-surface);
      border:1px solid var(--color-divider); padding:9px 11px 10px; align-items:stretch; gap:5px; }
    #app-shell.rail #side-nav.open .foot-card-head{ justify-content:flex-start; }
    #app-shell.rail #side-nav.open .foot-card-title,
    #app-shell.rail #side-nav.open .foot-note{ display:block; }
    #app-shell.rail #side-nav.open .foot-kpi{ display:flex; }
    #app-shell.rail #side-nav.open #side-ai-usage{ justify-content:flex-start;
      border-top:1px solid rgba(255,255,255,.10); padding:6px 0 0; margin-top:1px; }
    #app-shell.rail #side-nav.open #side-ai-usage .foot-ai-dot{ margin-top:4px; }
    /* THE DOOR IS THE ONE ON THE THING IT OPENS. The rail's own chevron stays
       — it is the only control on screen down here, since the header's menu
       button is drawn at 899 and below — and toggleRail reads the width and
       slides the layer instead of writing the reader's stored preference.
       Open, the head is the full bar again with its word back. */
    #app-shell.rail #side-nav.open .rail-head{ justify-content:flex-start; padding:0 12px; }
    #app-shell.rail #side-nav.open .rail-head-label{ display:block; }
    #app-shell.rail #side-nav.open .rail-toggle{ margin-left:auto; }
    /* THE LANGUAGE TOGGLE HAS TO FIT THE STRIP IT NOW SITS IN. Below 900 the
       header is too crowded for it and placeLanguageSwitch posts it into the
       sidebar (which is unchanged) — but the sidebar down here rests at 64px,
       not the 240px drawer it used to be, and "English / Svenska" overflowed
       it by 34px. MEASURED. So at rest it wears its two-letter form, exactly
       as the crowded header does, and the words come back when the layer is
       opened and there is room for them again. It also STACKS: side by side
       even the two-letter pair measures 86px, so the pair runs down the strip
       the way every other thing in a 64px rail does. */
    #app-shell.rail #side-nav:not(.open) #lang-switch{ margin:0 auto 4px; align-self:center;
      flex-direction:column; }
    #app-shell.rail #side-nav:not(.open) #lang-switch .lang-btn{ padding:4px 8px; }
    #app-shell.rail #side-nav:not(.open) #lang-switch .lang-long{ display:none!important; }
    #app-shell.rail #side-nav:not(.open) #lang-switch .lang-code{ display:inline!important; }
    #nav-scrim:not([hidden]){
      display:block; position:fixed; inset:64px 0 0 0; z-index:54;
      background:color-mix(in srgb,#020617 45%,transparent);
    }
  }

  /* ============================================================
     THE SHORT LAPTOP — the dimension the first responsive pass missed.

     THE DEFECT THIS REPLACES. That pass tested nine WIDTHS at a single height
     of 900px. Almost no laptop has 900px of page. A 1920x1080 ThinkPad at the
     Windows-recommended 150% scaling reports 1280x720 to the browser, and once
     Chrome's tabs, address bar and bookmarks bar are taken off, the page gets
     about 590. A 1366x768 laptop gets about 638. Those are the two most common
     machines a customer will first open HaTi on, and the layout was built for
     a canvas half as tall again.

     Measured on the real thing before this block existed:
       · the calendar's last week was cut off inside its card (the grid needs
         392px of day cells and had 287px)
       · the negotiation's change list got 83px of height for a 110px card
       · 61% of the first screen was banners and the hero, with ZERO contracts
         visible — you landed on HaTi and saw nothing it is for

     So the vertical rhythm tightens with the window, exactly as the horizontal
     one does. Nothing is removed and nothing is reordered: this is padding,
     gaps and one type step. Above 820px of page nothing here applies at all,
     so the big-screen design is untouched.
     ============================================================ */

  /* -- short: most laptops, including 1366x768 and 1080p at 125% -- */
  @media (max-height:820px){
    .hm-page{gap:7px!important;padding-top:10px!important;padding-bottom:12px!important;}
    #gs-card{padding:12px 16px 10px!important;}
    #email-setup-banner{padding:9px 14px!important;}
    /* the page header above every view */
    #page-head>div{padding-top:8px!important;padding-bottom:8px!important;}
  }
  /* -- very short: a 1080p panel at 150%, which is the Windows default on a
        14-inch ThinkPad and therefore the most common single configuration -- */
  @media (max-height:680px){
    .hm-page{gap:6px!important;padding-top:8px!important;}
    /* Taken from the card's own frame rather than from the hero: on a 590px
       page the last 8px have to come from somewhere, and a card's padding is
       worth less than the banner a reader actually looks at. */
    .hm-pipe-card{padding:12px 14px!important;}
    .hm-decisions>div>section{padding:12px 14px!important;}
    #gs-card{padding:10px 14px 8px!important;}
    #email-setup-banner{padding:8px 12px!important;}
    #page-head>div{padding-top:6px!important;padding-bottom:6px!important;}
  }

  /* ============================================================
     RESPONSIVE VIEW GRIDS.
     These column counts used to be hard numbers written inline at each call
     site — repeat(4,1fr), 2fr 1fr, 268px … 292px — so a card row that needed
     1013px was still asked to fit 978px and the last card left the window.
     They live here instead: one file, one set of breakpoints, and the same
     five sizes the shell uses. The widest rule in every block is what shipped
     before, so nothing moves at desktop width.
     ============================================================ */

  /* ---- THE DASHBOARD FILLS ITS WINDOW ----
     THE DEFECT THIS REPLACES. Every other full-page view sets its own height
     from --view-h; the dashboard did not, so it was only ever as tall as its
     content and the rest of the window was left blank. The pipeline row is the
     bottom of that content and it never grew — a constant 245px at every size
     — so the taller the screen, the bigger the dead band underneath it.
     Measured: 31px of empty page on a 1280x590 laptop, 162px at 1600x770 and
     306px at 1920x950, which is a third of the screen showing nothing.

     Shrinking the hero for short laptops made that band more visible, which is
     how it was reported, but the band was there before and on a big monitor it
     was three times worse.

     --view-h is the scroll container's own measured height (syncViewHeight,
     js/app.js), so this is the real room the page has rather than a guess. The
     row takes what the hero and the metrics leave, and the columns inside it
     fill and scroll — so the space becomes contracts instead of nothing.

     A DEFINITE height, not a minimum. min-height alone fills an empty page but
     does nothing when there is plenty to show: the flex chain below it stays
     auto-height, so the columns never need to scroll and a real portfolio ran
     303px past the bottom of a 590px laptop instead. height + min-height:0 on
     the chain is the same pattern the register and the queue already use.
     overflow-y:auto on the page is the backstop for a window so short that the
     hero and the metrics alone will not fit — it scrolls rather than clipping,
     and the list keeps a floor so it can never collapse to nothing first. */
  /* ---- THE HOME PAGE, REBUILT TO THE ENTERPRISE DESIGN (24 Aug 2026) ----
     The page is a plain column now — a greeting row, then three sections of
     tiles and rows — rather than a hero over a two-card grid. It no longer
     pins itself to the viewport height: nothing on it scrolls inside itself
     any more, so there is nothing that needs a bounded parent, and a short
     laptop scrolls the page as it would any other document. */
  .hm-page{display:flex;flex-direction:column;gap:0;padding:var(--page-pad);box-sizing:border-box;}
  .hm-page>*{flex:none;}

  .hm-greet{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;}
  .hm-greet h1{margin:0;font-family:var(--font-heading);font-size:20px;font-weight:700;
    letter-spacing:-.01em;color:var(--color-text);}
  .hm-greet-sub{font-size:13px;color:var(--color-neutral-500);min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* THE ONE ACT ON THE PAGE, AND IT IS WHITE (owner-asked 24 Aug 2026). The
     surface token rather than a literal #fff, so it is white in the light
     theme and the panel colour at night and never glares in the dark one; the
     outline is what keeps it plainly a button on a near-white page, and it
     reads --link rather than the accent ramp because only --link has an answer
     in the dark theme. Measured across both themes and both brands: the
     faintest reading is 5.5:1. */
  .hm-primary{flex:none;white-space:nowrap;height:var(--ctl-h);display:inline-flex;
    align-items:center;gap:7px;padding:0 12px;background:var(--color-surface);
    border:1px solid var(--accent-ink);color:var(--accent-ink);
    font:inherit;font-family:var(--font-body);font-size:13px;font-weight:600;
    cursor:pointer;border-radius:0;}
  .hm-primary:hover{background:var(--nav-well);}

  /* A SECTION HEADING IS A WORD, A RULE AND — where there is one — its own
     act at the far end. Customize sits on My work's line because that is the
     row it edits; See all sits on Needs your decision's for the same reason. */
  /* ---- A THIRD OFF (owner-asked 24 Aug 2026: "reduce the highlighted space
     by 1 third") ----
     MEASURED: each heading took 41.6px — 14 above, a 19.6 line, 8 below — and
     My work 44.2 because it carries the Customize link. Three of them, 127px.
     It is not only tidiness: the Home page ALREADY ran off the bottom of a real
     laptop, 50px too tall at 1366x768 and 98px on a 1280 ThinkPad at 150%.
     Taken out of the space above and below AND the heading's own line, measured
     at each step rather than typed: 9 + 17.5 + 4 is about 30.5, a third off.
     ALL THREE MOVE, including "My work" which the owner did not highlight:
     they are one builder drawn three times and leaving one taller reads as a
     fault rather than a decision.
     DIVERGES FROM THE DESIGN REFERENCE, which specifies these exact margins
     (14px 0 8px, h2 14/700) — so what HaTi drew was the design's own number.
     The owner's ruling, recorded. */
  .hm-sec{display:flex;align-items:center;gap:10px;margin:9px 0 4px;}
  .hm-sec h2{margin:0;font-family:var(--font-heading);font-size:14px;font-weight:700;flex:none;
    line-height:1.25;color:var(--color-text);}
  .hm-rule{flex:1 1 auto;height:1px;background:var(--color-divider);}

  .hm-tiles{display:grid;gap:12px;}
  .hm-tiles.is-work{grid-template-columns:repeat(4,minmax(0,1fr));}
  .hm-tiles.is-port{grid-template-columns:1.9fr 1fr 1fr 1fr;}
  /* PURE WHITE, and it is the token that is pure (owner-asked 24 Aug 2026:
     "the white backgrounds have to be pure white with no shade of any kind").
     --color-surface is #ffffff; nothing here mixes it with anything. */
  .hm-tile{position:relative;display:flex;flex-direction:column;min-width:0;
    background:var(--color-surface);border:1px solid var(--color-divider);
    border-top:3px solid var(--color-neutral-300);padding:12px 14px;
    font:inherit;font-family:var(--font-body);color:inherit;text-align:left;
    border-radius:0;cursor:pointer;}
  .hm-tile.is-work{height:141px;}
  .hm-tile.is-port{height:176px;}
  .hm-tile:hover{background:var(--nav-well);}
  .hm-tile:focus-visible{outline:2px solid var(--color-accent-600);outline-offset:-2px;}
  /* A DOOR ONTO NOTHING IS A DEAD PRESS. The zero still draws — it is true —
     and the tile stops being pressable rather than being dimmed into
     illegibility, so nobody presses it to reach an empty list. */
  .hm-tile.is-dead{cursor:default;}
  .hm-tile.is-dead:hover{background:var(--color-surface);}
  /* The zero-count grey is a DELIBERATE SIGNAL — a tile counting zero is not
     a door — and the unit joins the numeral in it. Without this the unit would
     have gone primary with the rule above and left a black "docs" beside a
     grey nought, which is the one state this grey exists to mark. */
  .hm-tile.is-dead .hm-n,.hm-tile.is-dead .hm-u{color:var(--color-neutral-400);}
  .hm-tile.is-life{cursor:default;}
  .hm-tile.is-life:hover{background:var(--color-surface);}
  .hm-t{font-size:14px;font-weight:600;color:var(--color-text);padding-right:18px;}
  .hm-s{font-size:12px;color:var(--color-neutral-500);margin-top:1px;}
  .hm-tile .hm-s{min-height:1.35em;}
  .hm-sp{flex:1 1 auto;min-height:6px;}
  .hm-go{position:absolute;top:11px;right:11px;color:var(--color-neutral-400);}
  .hm-tile:hover .hm-go{color:var(--accent-ink);}
  .hm-big{display:flex;align-items:baseline;gap:7px;min-width:0;}
  .hm-n{font-size:32px;font-weight:700;line-height:1.05;color:var(--color-text);
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ---- THE UNIT TAKES ITS NUMERAL'S INK (the black ink, 24 Aug 2026) ----
     "13 agreements", "8 docs", "74 %" — the figure and its unit are one
     reading, and the unit was 14px text on the secondary shade beside a
     numeral in the primary one. The design gives both the same ink. Matched to
     .hm-n rather than given a colour of its own, so the two cannot drift. */
  .hm-u{font-size:14px;color:var(--color-text);font-weight:400;}
  .hm-foot{margin-top:7px;padding-top:7px;border-top:1px solid var(--color-divider);
    font-size:12px;color:var(--color-neutral-500);line-height:1.35;}
  .hm-foot.crit{color:var(--st-amber-fg);}
  /* Two lines PLUS the rule's own padding — box-sizing is border-box, so
     reserving 2.8em alone still leaves a one-line footnote 7px short and the
     four figures in the row sit on four different lines. */
  .hm-tile.is-port .hm-foot{min-height:calc(2.8em + 7px);}

  /* THE LIFECYCLE TILE'S THREE BLOCKS ARE THREE DOORS. This is what replaced
     the pipeline ring, and the stage list with it: the count is the handle. */
  .hm-life{display:flex;align-items:flex-end;gap:22px;min-width:0;}
  .hm-stack{display:flex;gap:6px;flex:none;}
  .hm-stg-wrap{display:block;}
  .hm-stg{display:flex;flex-direction:column;align-items:stretch;gap:4px;width:100%;
    background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;}
  .hm-stg:hover .hm-bar{filter:brightness(.88);}
  .hm-stg:hover .hm-sl,.hm-stg:hover .hm-sn{color:var(--accent-ink);}
  .hm-stg:focus-visible{outline:2px solid var(--color-accent-600);outline-offset:3px;}
  .hm-stg[disabled]{cursor:default;}
  .hm-sn{font-size:11px;font-weight:700;line-height:1;color:var(--color-text);
    font-variant-numeric:tabular-nums;}
  .hm-bar{width:100%;height:10px;background:var(--color-neutral-300);}
  .hm-stg.is-review .hm-bar{background:var(--st-amber-dot);}
  .hm-stg.is-signed .hm-bar{background:var(--st-green-dot);}
  .hm-stg.is-zero .hm-bar{background:none;border:1px dashed var(--color-neutral-300);}
  .hm-sl{font-size:11px;color:var(--color-neutral-500);line-height:1;white-space:nowrap;}
  .hm-money{flex:1 1 auto;min-width:0;}
  .hm-m{display:block;font-size:26px;font-weight:700;line-height:1.05;white-space:nowrap;
    color:var(--color-text);font-variant-numeric:tabular-nums;}
  .hm-ml{display:block;font-size:12px;color:var(--color-neutral-500);margin-top:3px;line-height:1.3;}

  /* NEEDS YOUR DECISION — full-width rows, the tone on a 3px left rule. */
  .hm-rows{background:var(--color-surface);border:1px solid var(--color-divider);}
  .hm-row{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;
    border:0;border-left:3px solid var(--color-neutral-400);
    border-bottom:1px solid var(--color-divider);
    padding:9px 14px;background:none;color:inherit;font:inherit;font-family:var(--font-body);
    text-align:left;cursor:pointer;}
  .hm-row:last-child{border-bottom:0;}
  .hm-row:hover{background:var(--nav-well);}
  .hm-row:focus-visible{outline:2px solid var(--color-accent-600);outline-offset:-2px;}
  .hm-row.is-crit{border-left-color:var(--st-amber-dot);}
  .hm-row.is-neg{border-left-color:var(--st-ruby-dot);}
  .hm-rb{flex:1 1 auto;min-width:0;}
  .hm-rt{display:block;font-size:14px;font-weight:600;color:var(--color-text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hm-rm{display:block;font-size:12px;color:var(--color-neutral-500);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hm-rtag{flex:none;font-size:13px;font-weight:600;color:var(--color-neutral-500);
    font-variant-numeric:tabular-nums;}
  .hm-row.is-crit .hm-rtag{color:var(--st-amber-fg);}
  .hm-row.is-neg .hm-rtag{color:var(--st-ruby-fg);}
  .hm-rchev{flex:none;color:var(--color-neutral-400);}
  .hm-empty{background:var(--color-surface);border:1px solid var(--color-divider);
    padding:18px 14px;font-size:13px;color:var(--color-neutral-500);}

  /* Below the design's own desktop measure the two tile rows stack two-up
     rather than crushing four labels into a third of a word each. The design
     answers nothing under desktop width; this is HaTi's own answer. */
  @media (max-width:1100px){
    .hm-tiles.is-work,.hm-tiles.is-port{grid-template-columns:repeat(2,minmax(0,1fr));}
    .hm-tile.is-port{height:auto;min-height:176px;}
  }
  @media (max-width:680px){
    .hm-tiles.is-work,.hm-tiles.is-port{grid-template-columns:minmax(0,1fr);}
    .hm-greet{flex-wrap:wrap;}
  }
  /* A FLOOR, so the row cannot be crushed instead of the page scrolling.
     With min-height:0 the row was free to shrink to nothing, so on a workspace
     still showing its setup banners the pipeline was squeezed to a sliver
     while the page reported itself as fitting. The floor makes the page scroll
     — which it is set up to do — once there is genuinely more to show than
     there is room for. */
  .hm-main-row{flex:1 1 auto;min-height:230px;}
  .hm-pipe-card{display:flex;flex-direction:column;min-height:0;}
  .hm-pipe-cols{flex:1;min-height:0;}
  .hm-pipe-list{flex:1;min-height:96px;overflow-y:auto;}

  /* ---- THE PIPELINE CARD'S INSIDE: one ring, one list (13 Aug 2026) ----
     THE CARD'S BOX IS NOT TOUCHED BY ANY OF THIS. Its height comes from
     .hm-main-row above and it is exactly as tall as Decisions due beside it;
     every rule here carries min-height:0 so nothing in the card can push it
     taller. The list scrolls, the same as the three columns did.

     Type comes from the app's own tokens — --font-heading for the figure and
     the stage name, everything else inherits --font-body. */
  .hm-pipe-chart{min-height:0;min-width:0;overflow:hidden;border:0;
    border-radius:0;background:none;padding:6px 2px;
    display:flex;flex-direction:column;justify-content:flex-start;gap:8px;}
  /* A GRID, NOT A FLEX ROW: as flex items the key could be sized below its own
     content, and on a short card its three rows were squeezed into 24px and
     pushed out through the bottom of the pane. Grid items take their content
     as a floor, so if the height runs short it is the RING that gives way —
     which is the right thing to lose. */
  .hm-ring-row{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:18px;min-height:0;}
  .hm-ring-row.hm-stack{grid-template-columns:minmax(0,1fr);justify-items:center;gap:10px;}
  .hm-ring-row.hm-stack .hm-key{width:100%;}
  .hm-ring-block{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
  .hm-ring-stage{position:relative;display:grid;place-items:center;}
  /* --hm-ring is measured off the pane by hmFit and is the ONLY thing that
     sizes the chart: the card's height decides the ring, never the reverse. */
  .hm-ring-stage svg{width:var(--hm-ring,200px);height:var(--hm-ring,200px);display:block;}
  .hm-seg{fill:none;stroke-linecap:butt;cursor:pointer;transition:stroke-width .18s ease;}
  .hm-seg:focus{outline:none;}
  .hm-seg:focus-visible{outline:2px solid var(--accent-solid);outline-offset:4px;}
  .hm-ring-centre{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;}
  .hm-ring-fig{font-family:var(--font-heading);font-weight:600;line-height:1;letter-spacing:-.03em;
    color:var(--color-text);font-size:calc(var(--hm-ring,200px) * .2);font-variant-numeric:tabular-nums;}
  .hm-ring-of{margin-top:4px;font-size:12px;font-weight:600;color:var(--color-neutral-600);}
  /* The stage name sits UNDER the ring, not in it — in the hole it ran wider
     than the hole is, and the fix for that is a slot with room in it. */
  .hm-ring-what{text-align:center;font-family:var(--font-heading);font-size:14px;font-weight:700;color:var(--color-text);}
  .hm-ring-what small{display:block;margin-top:1px;font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--color-neutral-600);}
  .hm-ring-hint{flex:none;text-align:center;font-size:12px;color:var(--color-neutral-500);}
  .hm-ring-hint[hidden],.hm-tight .hm-ring-hint{display:none;}

  .hm-key{min-width:0;display:flex;flex-direction:column;gap:3px;}
  .hm-leg{flex:none;display:grid;grid-template-columns:11px 1fr auto auto;align-items:center;
    gap:3px 10px;width:100%;background:none;border:1px solid transparent;border-radius:0;
    padding:8px 10px;cursor:pointer;text-align:left;font:inherit;color:var(--color-text);}
  .hm-leg:hover{background:var(--color-surface);border-color:var(--color-divider);}
  .hm-leg:focus-visible{outline:2px solid var(--accent-solid);outline-offset:2px;}
  .hm-leg[aria-pressed="true"]{background:var(--color-surface);border-color:var(--color-divider);box-shadow:var(--shadow-sm);}
  .hm-leg-dot{width:11px;height:11px;border-radius:0;}
  .hm-leg-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hm-leg-n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .hm-leg-pct{font-size:12px;color:var(--color-neutral-500);width:30px;text-align:right;font-variant-numeric:tabular-nums;}
  /* The ring says share by angle; the bar says it by length — the same fact in
     the form that is easiest to compare. First thing to go when space is short. */
  .hm-leg-bar{grid-column:2/-1;height:4px;border-radius:0;background:var(--color-neutral-100);overflow:hidden;}
  .hm-leg-bar i{display:block;height:100%;border-radius:0;}
  .hm-vtight .hm-leg-bar{display:none;}
  .hm-vtight .hm-leg{padding:6px 10px;}

  .hm-pipe-side{display:flex;flex-direction:column;min-width:0;min-height:0;
    border:1px solid var(--color-divider);border-radius:0;overflow:hidden;}
  /* ---- THE STAGE HEAD SHARES THE CARD-HEADING LINE (owner-asked 23 Aug 2026)
     It was the first row inside the bordered list box, 34px below the two card
     headings; it is now a grid cell in the pipeline's first row, beside the
     card's own <h4>. Its left padding is the box's own content inset (1px
     border + 9px) so the stage name still starts on the same vertical as the
     rows it names. */
  .hm-pipe-title{display:flex;align-items:center;gap:10px;min-width:0;}
  .hm-side-head{display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0;}
  .hm-side-title{font-family:var(--font-heading);font-size:14px;font-weight:700;margin:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hm-side-count{margin-left:auto;flex:none;border:0;font:inherit;font-size:12px;font-weight:700;
    padding:3px 9px;border-radius:0;cursor:pointer;font-variant-numeric:tabular-nums;}
  .hm-pipe-side .hm-pipe-list{padding:0 9px 5px;display:flex;flex-direction:column;gap:5px;}
  .hm-side-foot{flex:none;padding:6px 11px 7px;}
  .hm-side-foot:not(:empty){border-top:1px solid var(--color-divider);}
  .hm-side-more{border:0;background:none;padding:2px;font:inherit;font-size:12px;font-weight:600;
    color:var(--color-accent-600);cursor:pointer;text-align:left;}

  /* THE PIPELINE CARD'S OWN ROW IS RETIRED with the ring it sat beside
     (24 Aug 2026). Its rules are DELETED rather than left dormant, and that is
     the fix rather than tidiness: `.hm-row` is now the name of the decision
     rows on the new home page, this block sat LATER in the sheet at equal
     specificity, and it won — measured, the tag and the chevron dropped onto
     their own line under the meta because this rule made the row display:block.
     A stale class name is not inert when a live one takes its name.
     .hm-row-name / -meta / -flag / -sep / -cp / -none below belong to the same
     retired card and are kept only because nothing else claims those names. */
  .hm-row-name{display:block;font-size:13px;font-weight:400;color:var(--color-text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hm-row-meta{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:12px;
    color:var(--color-neutral-500);min-width:0;}
  .hm-row-flag{display:inline-flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap;flex:none;}
  .hm-row-sep{color:var(--color-neutral-400);}
  .hm-row-cp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hm-row-none{font-size:12px;color:var(--color-neutral-500);padding:4px 2px;}

  /* The hero banner (Hero B, 20 Aug 2026) — replaces the Portfolio strip.
     The retired hm-strip, hm-foot and hm-foot-card classes are stale — flag
     any mention. THE COLOURS ARE THE ACCENT'S OWN (owner-asked the same day,
     off a marked-up screenshot: "similar to image 1 when in green and act
     accordingly when in blue") — a gradient from the accent tokens, never a
     fixed navy, so the green workspace gets the teal card, the navy one blue,
     and dark mode follows the tokens. The badge chip retired with the words
     it carried (the greeting line took its slot — .hm-banner-greet); the two
     buttons re-dress for the accent ground: ghost translucent white, the CTA
     the white primary with accent ink. */
  /* ---- THE BANNER PAYS FOR THE CUSTOMIZE LINE (owner-asked 20 Aug 2026:
     "create the space by reducing the height of the banner") ---- 20px of
     padding became 12 and the title 27px became 23, which frees the height the
     .hm-kpi-bar below takes — so the KPI cards and everything under them sit
     exactly where they did. Nothing was removed to find the room: the
     greeting, the title, the live facts and the white button all stay. */
  .hm-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 26px;color:#fff;
    /* ---- IT STARTS AT THE SIDEBAR'S OWN COLOUR (owner-asked 20 Aug 2026) ----
       It was a fixed navy taken from the render, so in a green workspace the
       banner and the sidebar beside it were two different colours meeting at an
       edge. The left stop IS --nav-bg now and the gradient lightens rightward
       by mixing toward a neutral slate, which means the banner follows the
       workspace (green, navy) and the dark theme for free, from one rule —
       rather than a second colour somebody has to remember to keep in step.
       The right-hand stop lands mid-tone, not pale: the two buttons sit there
       and white-on-pale would not read. */
    background:linear-gradient(100deg, var(--nav-bg) 0%,
      color-mix(in srgb, var(--nav-bg) 80%, #93a4b5) 46%,
      color-mix(in srgb, var(--nav-bg) 45%, #93a4b5) 100%);
    border:1px solid var(--nav-bg);}
  .hm-banner-greet{font-size:14px;font-weight:600;color:rgba(255,255,255,.88);}
  .hm-banner h2{margin:3px 0 2px;font-size:23px;font-weight:700;letter-spacing:-.3px;
    font-family:var(--font-heading);color:#fff;}
  .hm-banner p{margin:0;font-size:14px;color:rgba(255,255,255,.85);min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hm-banner p b{color:#fff;font-weight:600;}
  .hm-banner-ghost{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.4);color:#fff;
    padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;flex:none;}
  .hm-banner-ghost:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6);color:#fff;}
  /* WHITE, not the mockup's teal (owner-asked 20 Aug 2026). It is the one
     primary act on this banner and white is the strongest thing there is on a
     dark ground — the ghost button beside it stays outlined, so the two are
     still told apart at a glance. Its INK is the sidebar's own colour, which
     is what keeps it part of the workspace rather than a plain white slab,
     and which follows the gradient this banner now starts from. */
  .hm-banner-cta{background:#fff;border:1px solid #fff;color:var(--nav-bg);
    padding:10px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;flex:none;}
  .hm-banner-cta:hover{background:rgba(255,255,255,.9);border-color:#fff;}
  /* ---- THE KPI ROW'S OWN THIN LINE ---- One control, at the end of the line,
     dressed as this page's other quiet links rather than as a button: it is a
     preference about the four cards under it, not an act on the portfolio.
     A fixed height so the line cannot grow and start costing the page more
     than the banner gave up for it. */
  .hm-kpi-bar{display:flex;align-items:center;justify-content:flex-end;height:26px;padding:0 2px;}
  .hm-cz{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;
    font:inherit;font-size:13px;font-weight:600;color:var(--color-accent-600);cursor:pointer;}
  .hm-cz:hover{color:var(--color-accent-800);text-decoration:underline;}
  .hm-cz:focus-visible{outline:2px solid var(--accent-solid);outline-offset:2px;}

  /* Home — lifecycle pipeline: two thirds to the ring, one third to the list
     (was repeat(3,minmax(0,1fr)) when it drew three columns).

     TWO ROWS SINCE 23 Aug 2026. Row 1 holds the card's heading and the stage
     head side by side so the stage name lands on the same line as "Decisions
     due" next door; row 2 takes whatever height is left and hands it to the
     ring and the list. align-self:center on the two row-1 cells is what puts
     the words on one line rather than merely in one row — the h4 and the
     stage title are different sizes and would otherwise sit on their own
     tops. */
  .hm-pipe-cols{grid-template-columns:2fr 1fr;grid-template-rows:auto minmax(0,1fr);
    column-gap:11px;row-gap:12px;}
  .hm-pipe-cols > .hm-pipe-title{grid-column:1;grid-row:1;align-self:center;}
  .hm-pipe-cols > .hm-side-head{grid-column:2;grid-row:1;align-self:center;}
  .hm-pipe-cols > .hm-pipe-chart{grid-column:1;grid-row:2;}
  .hm-pipe-cols > .hm-pipe-side{grid-column:2;grid-row:2;}
  /* Home — pipeline beside decisions (was 2fr 1fr). The decisions card fills
     its column absolutely, so when the row stacks it needs a height to fill. */
  .hm-main-row{grid-template-columns:2fr 1fr;}
  /* ---- ONCE THE TWO CARDS HAVE TO STACK, THE PAGE SCROLLS (13 Aug 2026) ----
     THE DEFECT: below 1200px there is no room for the two cards side by side,
     so the row stacks them — but .hm-page is exactly --view-h tall and refuses
     to scroll, so the SAME leftover height that one card had to itself now has
     to be split between two. Decisions due holds a minimum of its own, so the
     pipeline card was the one that gave: MEASURED at 1024x768 it collapsed to
     26px, a sliver with a slice of chart in it, and at 1024x600 to nothing.
     The old three-column card did exactly the same thing — its headings were
     cut in half — so this is not new, it is simply never fixed.

     Forcing two stacked cards into one screenful is the thing that cannot
     work. Below the breakpoint the page grows instead and the shell's own
     scroller takes it: height:auto with min-height keeps a tall window looking
     exactly as it does now, and a short one scrolls rather than crushing what
     is on it. Each card then asks for the height it actually needs.

     THE CARD'S INSIDE KEEPS ITS TWO COLUMNS DOWN TO 880px. Stacking the ring
     above the list at 1199 was wasteful: with the row already stacked the card
     is the full width of the page there — 728px at a 1024 window — which is
     more room for the ring beside its list than it had at 1440. */
  @media (max-width:1199px){
    .hm-main-row{grid-template-columns:minmax(0,1fr);flex:0 0 auto;}
    .hm-page{height:auto;min-height:var(--view-h);}
    .hm-pipe-card{min-height:440px;}
    .hm-decisions{min-height:320px;}
  }
  @media (max-width:880px){
    /* STACKED, THE HEAD GOES BACK TO ITS LIST. One column has no line to
       share, and leaving the placement in force would print the stage name
       directly under the card's heading with the whole ring between it and
       the rows it names. Placement is released and ORDER puts them back in
       reading order: heading, ring, stage name, list. */
    .hm-pipe-cols{grid-template-columns:minmax(0,1fr);grid-template-rows:none;row-gap:11px;}
    .hm-pipe-cols > *{grid-column:auto;grid-row:auto;align-self:auto;}
    .hm-pipe-cols > .hm-pipe-title{order:1;}
    .hm-pipe-cols > .hm-pipe-chart{order:2;}
    .hm-pipe-cols > .hm-side-head{order:3;padding:0;}
    .hm-pipe-cols > .hm-pipe-side{order:4;}
    .hm-pipe-card{min-height:560px;}
  }

  /* Reports — the four summary cards and the chart pairs */
  .rp-stats{grid-template-columns:repeat(4,1fr);}
  .rp-charts{grid-template-columns:1fr 1fr;}
  @media (max-width:1439px){ .rp-stats{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));} }
  @media (max-width:1099px){ .rp-charts{grid-template-columns:minmax(0,1fr);} }

  /* Insights — negotiation-friction split (was 1fr 1.15fr) */
  .igf-split{grid-template-columns:1fr 1.15fr;}
  @media (max-width:1099px){ .igf-split{grid-template-columns:minmax(0,1fr);} }
  /* The Insights caption is a whole sentence. Given a second line it stays
     whole; below 900 there is no line to give it, and a sentence cut off
     mid-word says less than no sentence — the tab beside it already names the
     report. */
  /* THE SECOND LINE HAS GONE, the hide has not. The caption used to be allowed
     to run to two lines below 1199px rather than be trimmed. Under the tab
     strip that would make the strip grow and the tabs' rule sit at an odd
     height, so between 900 and 1199 the sentence is trimmed with an ellipsis
     instead, and below 899 it still goes entirely. */
  @media (max-width:899px){ .ig-hd-sub{display:none!important;} }

  /* Design step — two rails around the preview (was 268px … 292px, 560px of
     rail before any content). The right rail goes first, then the left. */
  .ds-cols{grid-template-columns:268px minmax(0,1fr) 292px;}
  @media (max-width:1279px){ .ds-cols{grid-template-columns:248px minmax(0,1fr);}
    .ds-cols>:nth-child(3){display:none;} }
  @media (max-width:999px){ .ds-cols{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,auto);overflow-y:auto;}
    .ds-cols>:nth-child(1){min-height:220px;} }

  /* Templates — the library rail beside the cards (was 196px 1fr) */
  .tpl-cols{grid-template-columns:196px 1fr;}
  @media (max-width:899px){ .tpl-cols{grid-template-columns:minmax(0,1fr);} }

  /* The contract-essentials form asked by every creation path. Two columns
     where there is room, one where there is not — the same rule every other
     grid on the page follows. */
  @media (max-width:639px){ .ce-grid{grid-template-columns:minmax(0,1fr)!important;} }

  /* Settings & Rules — members beside the settings stack (was 1.5fr 1fr) */
  .tm-cols{grid-template-columns:1.5fr 1fr;}
  @media (max-width:1099px){ .tm-cols{grid-template-columns:minmax(0,1fr);} }

  /* Our standards — clause library beside the playbook (was 1.4fr 1fr) */

  /* ---- THE KPI RIBBON'S OWN BREAKPOINTS ARE RETIRED (24 Aug 2026) ----
     They were two `auto-fit` overrides carrying !important, written when the
     ribbon could hold anything from one card to eleven. The row is exactly
     four now and .hm-tiles owns how it stacks — two-up under 1100, one-up
     under 680 — and an auto-fit rule sitting later in the sheet with
     !important behind it beat that: MEASURED at 900px, the four tiles drew
     THREE across and the fourth wrapped alone onto a second line.

     A retired rule with !important on it is not inert; it is the loudest thing
     in the room. */

  /* ---- A PHONE CANNOT AFFORD DESKTOP GUTTERS ----
     Every view sets its own 16-18px side padding inline, which is right on a
     laptop and is 36px of a 390px screen — enough, repeatedly, to be the
     difference between a row fitting and being clipped. Padding only: no
     view's content, order or density changes. */
  @media (max-width:479px){
    .view-enter{padding-left:10px!important;padding-right:10px!important;}
  }

  /* ---- THE TOP HEADER ON A PHONE ----
     The brand block is flex:none and the action buttons are flex:none, so at
     390px the brand was squeezed to 59px of the 216px it needs and "HaTi"
     itself was unreadable. The mark stays — it is the identity — and the
     wordmark's caption and the CLM pill stand down, which buys back the room
     without removing a single control. */
  /* The caption is the widest thing in the wordmark, and the first to go: the
     brand block is flex:none inside a container that shrinks, so it was being
     clipped rather than compressed. */
  @media (max-width:1199px){ #brand-caption{display:none;} }
  @media (max-width:899px){
    #top-header{padding:0 10px!important;gap:8px!important;}
    #brand-wordmark{display:none;}
    /* Every control stays reachable — they are tightened, never dropped. */
    #top-header #brand-mark{width:30px!important;height:30px!important;border-radius:0!important;}
    #top-header .hdr-icon-btn{width:30px!important;height:30px!important;}
    #top-header #side-logout{width:30px!important;height:30px!important;}
    #top-header #side-avatar{width:28px!important;height:28px!important;}
    #top-header #cmd-ai{padding:7px 8px!important;}
    #top-header>div:last-child{gap:4px!important;}
    #top-header>div:last-child>div:last-child{padding-left:4px!important;gap:4px!important;border-left:0!important;}
    #top-header>div:first-child{gap:8px!important;}
  }

  /* ---- BOARDS SCROLL SIDEWAYS INSIDE THEIR OWN FRAME ----
     The advice desk is five columns and the queue is four. Inside the squeezed
     middle they simply overflowed and were clipped — at 1024 the advice board
     ran roughly 500px past the edge with no scrollbar offering to take you
     there. Below tablet they keep a readable column width and the BOARD takes
     the horizontal scroll; the page itself never scrolls sideways. */
  .board-5{grid-template-columns:repeat(5,minmax(190px,1fr));}
  .board-4{grid-template-columns:repeat(4,minmax(200px,1fr));}
  @media (max-width:1199px){
    .board-cols{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
    .board-5{grid-template-columns:repeat(5,minmax(190px,1fr));}
    .board-4{grid-template-columns:repeat(4,minmax(200px,1fr));}
  }

  /* ---- WIDE TABLES SCROLL INSIDE THEIR OWN CONTAINER ----
     Never the page. A table given only width:100% compresses until its columns
     collide and, where a parent clips, disappears entirely — measured at 390px
     the templates table sat 690px past the right edge and the team table 628px.
     The wrapper takes the scroll; the min-width keeps every column readable.
     NO COLUMN IS EVER HIDDEN — the density is the design. */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  .table-scroll::-webkit-scrollbar{height:9px;}
  .table-scroll::-webkit-scrollbar-thumb{background:var(--color-neutral-300);border-radius:0;}
  /* THE FLOOR ONLY APPLIES WHERE THERE IS NO ROOM.
     It was unconditional, and that was a regression on the machine most
     customers use: on a 1280-wide laptop the members table was forced to
     640px inside a 530px column, so it grew a horizontal scrollbar and cut a
     column off a table that would otherwise have fitted. A floor is for
     stopping columns collapsing on a phone; on a laptop the table should just
     fit, and below 900 it gets its floor back. */
  @media (max-width:899px){
    .table-scroll>table{min-width:640px;}
    #reg-scroll>table{min-width:820px;}
  }
  /* The register carries seven columns and a pager, so it needs its floor a
     little earlier than the rest — but still only where it cannot fit. */
  @media (max-width:1099px){ #reg-scroll>table{min-width:760px;} }

  /* ---- ANCHORED POPOVERS STAY ON SCREEN ----
     Row menus and the export menu are position:absolute with a fixed width, so
     on a narrow window they hung off the right edge with nothing to scroll to.
     A ceiling costs nothing on a wide screen and keeps them reachable on a
     small one. */
  #new-menu,#ws-export-menu,.rd-menu,[data-menu-pop]{
    max-width:calc(100vw - 24px);
  }

  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}html{scroll-behavior:auto;}}

  /* ---- Intel contract graph ---- */
  #ig-svg{touch-action:none}
  .ig-link{stroke:var(--color-neutral-400);stroke-width:1.4;fill:none;opacity:.55;transition:stroke .15s,opacity .15s,stroke-width .15s}
  .ig-link.hi{stroke:var(--color-accent);opacity:1;stroke-width:2.2}
  .ig-link.dim{opacity:.08}
  .ig-node{cursor:pointer}
  .ig-chip{stroke:var(--color-divider);stroke-width:1.4;filter:drop-shadow(0 3px 8px rgba(43,43,45,.08));transition:stroke .15s,filter .15s}
  .ig-node.hi .ig-chip{stroke:var(--color-accent);stroke-width:2;filter:drop-shadow(0 6px 14px rgba(43,43,45,.14))}
  .ig-node.dim{opacity:.22;transition:opacity .15s}
  .ig-lab{pointer-events:none;font-size:13px;font-family:var(--font-body)}
  .ig-sub{pointer-events:none;font-size:10px;font-family:var(--font-mono)}
  .ig-node.mut{opacity:.28;transition:opacity .15s}
  .ig-node.hit .ig-chip{stroke:var(--color-accent);stroke-width:2;filter:drop-shadow(0 0 7px rgba(89,128,166,.4)) drop-shadow(0 3px 8px rgba(43,43,45,.08))}
  .ig-badge-txt{pointer-events:none;font-size:8px;font-weight:700;font-family:var(--font-mono)}
  #ig-dock{transition:width .25s cubic-bezier(.22,.61,.36,1)}
  .ig-lens{transition:background .15s,border-color .15s,color .15s}

  /* inline editable fields (contract workspace) */
  .field{font-family:var(--font-mono);font-size:.95em;color:var(--color-accent-800);background:var(--color-accent-100);border:none;border-bottom:1.5px dashed var(--color-accent-400);padding:1px 6px;border-radius:0;min-width:90px;transition:background .15s,border-color .15s,box-shadow .15s;outline:none;}
  .field:hover{background:var(--color-accent-200);}
  .field:focus{background:#fff;border-bottom-color:var(--color-accent);box-shadow:0 2px 0 0 var(--color-accent),0 0 0 2px color-mix(in srgb,var(--color-accent) 18%,transparent);}
