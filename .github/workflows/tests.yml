# Every check, on every push — the proofreader, the node suite, and ALL of the
# browser harnesses.
#
# The browser checks existed and were green-capable for a day while nine of
# them sat red, because they only ran when somebody remembered to run them:
# a deliberate redesign (the floated sheet, the soft-wash verbs, the menu
# rename to "Edit with Copilot") updated the jsdom tests and sailed straight
# past the assertions nobody's routine touched. A check that does not run on
# every change is a diary, not an alarm. This workflow is the alarm.
#
# IT WAS STILL A DIARY FOR FIFTY-THREE OF THEM. This file ran redline-verify
# and selection-verify; the other fifty-three browser harnesses ran only by
# hand, which is the very habit the paragraph above was written about. They
# were left out for a real reason rather than an oversight — each starts a
# Chromium and takes minutes, so run one after another they cost hours — and
# the answer to that is to run them SIDE BY SIDE. test/chromium/run-all.js
# does that, four at a time, and this workflow puts four machines on it, so
# the whole set lands in about the time a single slow one used to take.
#
# A FILE THAT IS EXPECTED TO FAIL IS NAMED IN run-all.js's KNOWN_RED, with the
# reason, and is printed on every run. Everything else must pass. That is what
# keeps a red run meaningful: there is nowhere for a new failure to hide.
name: tests

# ONE CHECK PER PUSH, AND ONLY THE NEWEST ONE ON A BRANCH (owner-asked 18 Oct
# 2026: "stop the waste for good"). MEASURED that morning: 50 checks stood in
# GitHub's line and 15 were worth having. 21 tested a version of a branch that
# a later push had already replaced — nobody would ever read them, and five
# were holding machines. 14 were TWINS: this file ran on `push` AND on
# `pull_request`, so every push to a branch with an open pull request tested
# the same commit twice. GitHub lends this account about 20 machines and a
# check takes six, so a check that works for 16 minutes waited up to two hours.
#
# PUSH ONLY. A push's checks hang on the commit, and a pull request shows the
# checks of the commit it points at, so nothing disappears from its page; a
# branch pushed before its pull request is opened is still checked. What
# `pull_request` added was a test of the branch as merged into main, and a
# branch here is brought up to date with main before it merges.
#
# A NEWER PUSH ON A BRANCH CANCELS THE OLDER CHECK, waiting or running. MAIN IS
# THE EXCEPTION: every merge keeps its own check (one group per commit),
# because main's record is what "red on the base branch too" is measured
# against.
# WHEN THIS RUNS (owner-asked 24 Oct 2026): only when the owner says so.
# Every commit carries [skip ci], which GitHub honours on push, so this
# workflow sits still until the owner asks for it — either by saying so in
# the chat (that commit goes up without the marker) or by pressing
# "Run workflow" here, which is what workflow_dispatch is for.
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # The proofreader runs first and alone: it takes seconds, needs no browser,
  # and a name that does not exist is worth knowing before anything is booted.
  lint:
    name: proofreader (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  node:
    name: node suite (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install, not npm ci: the lockfile is deliberately untracked
      # (see .gitignore), so there is nothing for ci to hold the build to.
      - run: npm install
      # The suite's output is kept in a file so that a failure can be NAMED at
      # the end of the log. Twelve thousand tests print thousands of lines, and
      # "fail 1" at the bottom tells nobody which one: for a week in October
      # 2026 main stayed red with one unnamed failing test because the line
      # that named it sat far above what anyone reads. The exit code is the
      # suite's own, not tee's.
      - run: |
          set -o pipefail
          npm test 2>&1 | tee node-suite.log
      - name: name the failing tests
        if: failure()
        run: |
          echo "=== FAILING TESTS (every 'not ok' line, with its reason) ==="
          grep -n -A 12 -E '^\s*not ok ' node-suite.log | grep -v -E '^\S*-\s*(ok |# Subtest|\.\.\.$|---$|type:|duration_ms)' || echo "(no 'not ok' line found — the run died before a result)"

  browser:
    name: browser checks ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # ONE SHARD'S FAILURE MUST NOT CANCEL THE OTHER THREE. The point of a run
      # is the whole picture — "these four broke" is a diagnosis, "one broke and
      # we stopped looking" is another push to find out the rest.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # playwright-core ships no browser of its own; the harnesses resolve
      # the registry copy this installs (see EXEC in test/chromium/*.js —
      # the dev sandbox's fixed path wins only where it exists).
      - run: npx playwright-core install --with-deps chromium
      - run: node test/chromium/run-all.js --shard ${{ matrix.shard }}/4 --jobs 2
      # The measurements are numbers, but a failure is usually a LOOK — keep
      # the screenshots so a red run can be seen, not only read.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-screenshots-${{ matrix.shard }}
          path: test/chromium/shots/
          if-no-files-found: ignore
          retention-days: 14
