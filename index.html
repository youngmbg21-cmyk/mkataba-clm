  /* On the dark paper the solid mint ramp would sit as a light chip; a
     translucent teal wash reads as the same affordance on both themes. */
  html.dark .field{background:rgb(var(--color-accent-500-rgb)/.16);color:var(--color-accent-300);border-bottom-color:rgb(var(--color-accent-400-rgb)/.55);}
  html.dark .field:hover{background:rgb(var(--color-accent-500-rgb)/.28);}
  html.dark .field:focus{background:var(--color-surface);}
  .field.field-date{min-width:140px;} .field.field-num{text-align:right;min-width:130px;}
  .field:disabled{color:var(--color-text);background:transparent;border-bottom:1.5px solid var(--color-divider);-webkit-text-fill-color:var(--color-text);opacity:1;cursor:default;font-weight:600;}

  /* map graph (folder view) */
  .mlink{stroke:var(--color-neutral-400);stroke-width:1.4;fill:none;opacity:.6;transition:stroke .15s,opacity .15s,stroke-width .15s;}
  .mlink.hi{stroke:var(--color-accent);opacity:1;stroke-width:2.2;}
  .mlink.dim{opacity:.08;}
  .mlabel{fill:var(--color-neutral-700);font-size:12px;font-family:var(--font-heading);pointer-events:none;opacity:0;transition:opacity .15s;}
  .mlabel.show{opacity:1;}
  .mnode{cursor:pointer;}
  .mnode .chipbg{fill:var(--color-surface);stroke:var(--color-divider);stroke-width:1.4;transition:stroke .15s;}
  .mnode.hi .chipbg{stroke:var(--color-accent);stroke-width:2;}
  .mnode.sel .chipbg{stroke:var(--color-accent-700);stroke-width:2.4;}
  .mnode.dim{opacity:.18;transition:opacity .15s;}
  #map-svg{cursor:grab;}
  #map-svg.panning{cursor:grabbing;}

  .qdot{cursor:pointer;transition:r .15s;}
  .qdot:hover{stroke:var(--color-accent-900);stroke-width:2;}
  #party-scrim{opacity:0;pointer-events:none;transition:opacity .25s;}
  #party-scrim.open{opacity:1;pointer-events:auto;}
  .modal-in{animation:viewIn .2s cubic-bezier(.22,.61,.36,1);}
  /* The right-docked panel arrives FROM the right, so the movement says where
     it came from and that the page underneath was never replaced. */
  .side-panel-in{animation:sidePanelIn .22s cubic-bezier(.22,.61,.36,1);}
  @keyframes sidePanelIn{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){ .side-panel-in{animation:none;} }

  .seal-in{animation:sealIn .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes sealIn{from{opacity:0;transform:scale(.9) rotate(-3deg);}to{opacity:1;transform:none;}}
  .seal-pop{animation:sealIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
  .toast-in{animation:toastIn .3s cubic-bezier(.22,.61,.36,1);}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .anchor-flash{animation:anchorFlash 1.8s ease;border-radius:0;}
  @keyframes anchorFlash{0%{background:var(--color-accent-100);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-accent) 30%,transparent);}100%{background:transparent;box-shadow:0 0 0 3px transparent;}}
  .scan-pulse{animation:scanPulse 1s ease infinite;}
  @keyframes scanPulse{0%,100%{opacity:.45;}50%{opacity:1;}}

  /* Activity slide-over — the same mechanics as the Copilot below it, one
     layer lower, so opening the Copilot on top of the Activity panel puts them
     in the order you would expect rather than the order they were written in.
     Off-screen by default and NOT display:none: a transform can be animated,
     and a panel that simply appears is a panel that looks like a bug. */
  /* ---- IT STARTS BELOW THE SHELL BAR, exactly as its scrim already does ----
     The scrim was given `top:var(--shell-head-h)` because at inset:0 it
     swallowed clicks on the two icons that OWN this panel, so the swap between
     Alerts and Activity was unreachable. The panel itself was left at top:0 and
     got away with it only because the old 64px header pushed the bell further
     left than the panel is wide. The 44px bar is more compact, the bell moved
     under it, and the fault came back — the same fault, through the other
     element. Both halves now start below the bar. */
  #context-panel{
    position:fixed;top:var(--shell-head-h,44px);right:0;bottom:0;z-index:46;
    width:min(var(--shell-panel-w,292px),88vw);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
    box-shadow:var(--shadow-lg);
    transform:translateX(105%);
    transition:transform .3s cubic-bezier(.22,.61,.36,1);
  }
  #context-panel.open{transform:none;}
  /* ---- AN ALERT ROW'S TONE, AND WHETHER IT IS NEWS (owner-asked 23 Aug 2026)
     Two classes, two facts. `al-good` is the TONE and lasts as long as the row:
     green ink on the title and a green edge down the left, so the one piece of
     good news on a list of chores cannot be mistaken for one more of them.
     `al-news` is whether this reader has SEEN it, and it is over in three
     seconds — the floating bell's own rule (see .rl-notices-fab.is-news), the
     same count, so the two say one thing about one signal.
     THE FLASH IS THE BACKGROUND AND THAT IS DELIBERATE. The row carries inline
     onmouseover/onmouseout handlers that write style.background directly, and a
     CSS animation outranks a style attribute for as long as it runs — so the
     flash plays over the hover and hands the row back afterwards, with nothing
     to undo and no !important anywhere. */
  #panel-body .al-row.al-good{padding-left:9px!important;
    box-shadow:inset 3px 0 0 var(--st-green-dot);}
  #panel-body .al-row.al-good .al-t{color:var(--st-green-fg);}
  #panel-body .al-row.al-news{animation:al-row-news 1s ease-in-out 0s 3;}
  @keyframes al-row-news{
    0%,100%{background:transparent;}
    35%{background:var(--st-green-bg);}
  }
  @media (prefers-reduced-motion:reduce){
    /* Not "no signal" — a steady wash says the same thing without moving. */
    #panel-body .al-row.al-news{animation:none;background:var(--st-green-bg);}
  }
  /* ---- THE BELL TURNS GREEN, AND IT IS THE HEADER'S NOW (23 Aug 2026) ----
     The owner asked for this on 23 Aug — "the bell should loudly turn green and
     blink" — and it was built on the FLOATING bell in the bottom-right corner.
     That bell is gone (owner-asked, same day: "I do not want anything floating
     over the page"), so the treatment moves to the one bell that is left rather
     than being lost with the button that used to carry it.
     THE RULES ARE THE FLOATING BELL'S OWN, kept to the letter: green while the
     news is UNSEEN, three blinks and no more (a bell that blinks for ever is
     furniture), and opening the panel marks it seen and hands the bell back to
     amber with the work still counted on it. A tone is about the work; green is
     about a thing you have not yet looked at. */
  /* THE RESTING TONE LIVES HERE, NOT INLINE, and that is what makes the green
     below possible at all: an inline background cannot be beaten by a class
     rule without !important — the same trap this product already paid for with
     91 inline `outline:none` declarations defeating its one focus rule. */
  #hdr-notify-dot{background:var(--st-amber-dot);color:#1c1206;}
  #hdr-notify.is-news #hdr-notify-dot{background:var(--st-green-dot);color:#04231a;}
  #hdr-notify.is-news{animation:hdr-bell-news 1s ease-in-out 0s 3;}
  @keyframes hdr-bell-news{
    0%,100%{background:transparent;}
    35%{background:var(--st-green-bg);}
  }
  @media (prefers-reduced-motion:reduce){
    #hdr-notify.is-news{animation:none;background:var(--st-green-bg);}
  }
  /* ---- THE SCRIM STARTS BELOW THE HEADER, AND THAT IS THE WHOLE POINT ----
     It was inset:0, so with the panel open it lay across the top bar and
     swallowed clicks on the two icons that control the panel — measured in the
     browser, which named the scrim as the interceptor. Pressing the bell while
     Activity was showing therefore did nothing at all, which is not a swap
     between two contents, it is a dead control.

     Raising the buttons instead does not work and it is worth writing down why:
     #app-shell is position:fixed, which makes it a stacking context, so nothing
     inside it can be lifted above a sibling of the shell however high its
     z-index goes. The scrim gives way instead.

     --shell-head-h is the shell's own header row (grid-template-rows begins
     with it), declared once so the two cannot drift. The header stays lit while
     the page dims, which reads correctly: the control that owns this panel is
     the one thing still live. Everything else still dismisses on a click. */
  /* ---- THE SHELL'S FOUR NUMBERS (the enterprise design, 24 Aug 2026) ----
     The bar is 44px and the nav column is 240, which is the design's own
     rhythm; --ctl-h stays at HaTi's 28 (owner-ruled: "buttons should stay at
     28 but the rest should stick to the new design"). Change these together or
     not at all — they are what every other measurement on the shell hangs off.

     THE BAR IS THE DARK GROUND AND THE COLUMN IS WHITE. That is the swap:
     --nav-bg has always meant "the deep brand ground, deeper than the accent
     ramp reaches", and it still does — it has simply moved from the left edge
     to the top one. Nothing that reads it (the hero's gradient, the phone)
     needs to know. --nav-well is new and belongs to the WHITE column: the
     ground a hovered or live door sits on. */
  :root{ --shell-head-h:44px; --nav-w:240px; --nav-well:#EFF3F3; }
  #panel-scrim{
    position:fixed;left:0;right:0;bottom:0;top:var(--shell-head-h,64px);z-index:45;
    background:color-mix(in srgb,#020617 45%,transparent);
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #panel-scrim.open{opacity:1;pointer-events:auto;}
  /* Motion is a preference, not a decoration: with it reduced the panel still
     arrives, it simply stops sliding. */
  @media (prefers-reduced-motion:reduce){
    #context-panel{transition:none;}
    #panel-scrim{transition:none;}
  }

  /* Copilot slide-over */
  #ai-panel{position:fixed;top:0;right:0;bottom:0;z-index:50;transform:translateX(105%);transition:transform .3s cubic-bezier(.22,.61,.36,1),max-width .28s cubic-bezier(.22,.61,.36,1);}
  /* Expanded: the panel stretches leftward (it stays anchored right), giving
     comparison tables and long answers real room. clamp() keeps it sane on
     narrow screens (never below the normal width; w-full caps tiny viewports). */
  #ai-panel.expanded{max-width:clamp(430px,72vw,940px)!important;}
  #ai-scrim{position:fixed;inset:0;z-index:40;}
  #ai-panel.open{transform:none;}
  /* DOCKED: an overlay drawer, and nothing behind it moves.
     The drawer floats on top of the right-hand side of the screen — it does not
     take a column, so no width behind it changes, no clause frame shifts left
     and no line re-wraps at the moment it opens. A reader who selected a phrase
     and pressed a button must be able to find that phrase again in the same
     place. The shadow is what separates the layer from the page now that there
     is no scrim doing it. */
  #ai-panel.docked{
    position:fixed; top:0; right:0; height:100vh; z-index:100;
    box-shadow:-5px 0 25px rgba(0,0,0,.15);
    border-left:1px solid var(--color-divider);
  }
  /* Belt and braces on the shell itself: nothing may reserve room for the
     drawer, whatever else on the page thinks it is doing. */
  #app-shell{right:0!important;}
  /* THE PANEL'S OWN LAYOUT, not borrowed from a utility framework.
     Its column was carried entirely by Tailwind classes, so on a page where the
     CDN does not answer — the offline stage this app is checked on — the header
     grew to fit its content, the feed grew to fit the conversation, and a
     proposal card three messages down sat a thousand pixels below the bottom of
     the window with nothing to scroll. That is survivable for a chat you are
     only reading; it is not survivable now that the panel carries buttons that
     file redlines. These rules say the same thing the classes do, so they are a
     no-op when the framework loads and the whole layout when it does not. */
  /* width, not just max-width: a fixed-position element with only a maximum
     shrinks to fit its content, so without the framework's w-full the panel
     came out about a hundred pixels wide. */
  #ai-panel{display:flex;flex-direction:column;width:100%;box-shadow:var(--shadow-lg);}
  #ai-panel > *{flex:none;}
  #ai-panel > header{display:flex;align-items:center;gap:12px;padding:16px 20px;}
  /* The title block must be allowed to give way. Without min-width:0 it holds
     its content's width, so on a phone the four header verbs — expand, delete,
     minimise, close — were pushed off the right edge of a panel that was
     itself exactly the width of the window. Same for the composer: a textarea
     has an intrinsic minimum that stops flex:1 from shrinking it, which pushed
     Send off screen. */
  #ai-panel > header > .flex-1{min-width:0;overflow:hidden;}
  #ai-panel textarea.chat-field{min-width:0;}
  @media (max-width:479px){
    #ai-panel > header{padding:12px;gap:8px;}
    #ai-panel > header button{width:28px;height:28px;}
    /* the "searching your live contract data" line — the panel's own status,
       not the reader's answer; it is what the narrow header can afford to lose */
    #ai-brain-sub{display:none;}
    #ai-feed,#ai-panel > footer,#ai-suggest{padding-left:12px;padding-right:12px;}
  }
  #ai-feed{flex:1 1 0%;min-height:0;overflow-y:auto;padding:16px 20px;}
  #ai-feed > * + *{margin-top:16px;}
  #ai-panel > footer{padding:12px 20px 20px;}
  #ai-badge.pulse,.ai-badge-dot.pulse{animation:aiPulse 1.6s ease-in-out infinite;}
  @keyframes aiPulse{0%,100%{box-shadow:0 0 0 0 rgb(var(--color-accent-600-rgb)/.6);}50%{box-shadow:0 0 0 8px rgb(var(--color-accent-600-rgb)/0);}}
  #ai-scrim{opacity:0;pointer-events:none;transition:opacity .25s;}
  #ai-scrim.open{opacity:1;pointer-events:auto;}
  .ai-msg{animation:viewIn .25s cubic-bezier(.22,.61,.36,1);}
  .typing span{display:inline-block;width:5px;height:5px;border-radius:0;background:var(--color-accent-400);margin-right:3px;animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-2px);}}

  /* ============================================================
     THE DOCUMENT SURFACE
     Everything that renders CONTRACT TEXT — the workspace document pane, the
     counterparty share portal, the template preview and the PDF export — sits
     inside .doc-surface. The application interface does not. One class is what
     keeps "the product" and "the paper" visually distinct, and it is the one
     place the document faces and the document ink are applied. */
  .doc-surface{
    font-family:var(--font-doc);
    color:var(--color-doc-text);
    /* --doc-scale is the reader's own text-size choice as a plain RATIO — the
       A⁻/A⁺ stepper, one stored value for the whole product, 1 at the default.
       A ratio rather than a size because the three screens that draw a
       document have three different bases and one shared setting; what travels
       between them is the proportion. Only the zoom wrappers define it (see
       applyDocZoom), so a print, an export and a portal copy take the 1. */
    font-size:calc(14px * var(--doc-scale,1));
    line-height:1.75;
    /* a contract is read, not skimmed: open the letterfit very slightly and
       stop the browser from tightening it on the larger sizes */
    letter-spacing:0;
    font-variant-numeric:tabular-nums;    /* money and clause numbers line up */
    -webkit-font-smoothing:antialiased;
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
  }
  /* The slant-axis rule that used to live here existed because Google Sans Flex
     ships no italic, only a `slnt` axis. Inter ships a true italic, so emphasis
     in a contract is a drawn italic again and the override is not just
     unnecessary but harmful — it would force the upright and lose the emphasis
     entirely. */
  .doc-surface strong,.doc-surface b{font-weight:600;color:var(--color-doc-text);}
  .doc-surface h1,.doc-surface h2,.doc-surface h3,.doc-surface h4,
  .doc-surface h5,.doc-surface h6{font-family:var(--font-doc);color:var(--color-doc-text);}
  /* the columnar blocks — fee schedules drawn with rules, side-by-side
     signature blocks — where character alignment IS the content */
  .doc-surface pre,.doc-surface code,.doc-surface .doc-pre,
  .doc-surface .font-mono,.doc-surface [style*="--font-mono"]{
    font-family:var(--font-doc-mono);
  }
  /* Secondary document copy (the "· working text ·" rubric, the file note under
     a printed transcription). Still 8:1 — a document has no throwaway text. */
  .doc-surface .doc-muted{color:var(--color-doc-muted);}

  /* Retire the washed-out opacity modifiers ON DOCUMENT SURFACES ONLY. The
     same classes elsewhere in the interface are untouched: this is a fix to
     how a contract reads, not a repaint of the application. Specificity here
     beats Tailwind's single-class utilities without !important. */
  .doc-surface .text-brand-800\/85,.doc-surface .text-brand-800\/80,
  .doc-surface .text-brand-800\/75,.doc-surface .text-brand-800\/70,
  .doc-surface .text-brand-900,.doc-surface .text-brand-800{color:var(--color-doc-text);}
  .doc-surface .text-brand-800\/65,.doc-surface .text-brand-800\/60,
  .doc-surface .text-brand-800\/35,.doc-surface .text-brand-700{color:var(--color-doc-muted);}

  /* ---- rich document content (see DESIGN-rich-documents.md) ----
     A rich body carries NO inline styles — the sanitiser strips every one of
     them — so its whole appearance comes from here. That is deliberate: it is
     what makes a pasted contract look like HaTi paper rather than like the
     machine it was written on. */
  /* Same reading as .doc-surface above: --doc-scale is the reader's choice as a
     ratio, 1 where nobody has expressed one. Everything else in this block is
     in em, so that one number sizes the whole page. */
  .hati-doc{font-size:calc(14px * var(--doc-scale,1));line-height:1.85;font-family:var(--font-doc);color:var(--color-doc-text);
    print-color-adjust:exact;-webkit-print-color-adjust:exact;}
  .hati-doc>*:first-child{margin-top:0;}
  .hati-doc>*:last-child{margin-bottom:0;}
  .hati-doc p{margin:0 0 0.85em;}
  /* the document face, at the document's own weight — a contract's headings
     are set in the same family as its body, not in the interface face */
  .hati-doc h1,.hati-doc h2,.hati-doc h3,.hati-doc h4{
    font-family:var(--font-doc);font-weight:600;line-height:1.3;margin:1.5em 0 0.5em;}
  .hati-doc h1{font-size:1.42em;text-align:center;letter-spacing:-.01em;}
  .hati-doc h2{font-size:1.16em;}
  .hati-doc h3{font-size:1.04em;}
  .hati-doc h4{font-size:1em;}
  .hati-doc strong{font-weight:600;}
  .hati-doc u{text-underline-offset:2px;}
  .hati-doc ul,.hati-doc ol{margin:0 0 0.85em;padding-left:2.1em;}
  .hati-doc ul ul,.hati-doc ol ol,.hati-doc ul ol,.hati-doc ol ul{margin-bottom:0;}
  .hati-doc li{margin:0 0 0.35em;}
  /* a legal document IS its clause numbers — keep the marker legible and
     aligned with the text it governs */
  .hati-doc ol{list-style-type:decimal;}
  .hati-doc ol ol{list-style-type:lower-alpha;}
  .hati-doc ol ol ol{list-style-type:lower-roman;}
  .hati-doc ol[type="a"]{list-style-type:lower-alpha;}
  .hati-doc ol[type="A"]{list-style-type:upper-alpha;}
  .hati-doc ol[type="i"]{list-style-type:lower-roman;}
  .hati-doc ol[type="I"]{list-style-type:upper-roman;}
  .hati-doc li::marker{font-weight:600;}
  .hati-doc blockquote{margin:0 0 0.85em;padding:0 0 0 1.1em;
    border-left:2px solid var(--color-divider);}
  .hati-doc table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.94em;}
  .hati-doc th,.hati-doc td{border:1px solid var(--color-divider);padding:6px 9px;
    text-align:left;vertical-align:top;}
  .hati-doc th{font-weight:600;background:var(--color-neutral-100);}
  /* preformatted blocks carry the columnar layouts — fee schedules drawn with
     rules, side-by-side signature blocks — so their alignment must survive */
  .hati-doc pre{font-family:var(--font-doc-mono);font-size:.86em;line-height:1.5;
    white-space:pre;overflow-x:auto;margin:1em 0;}
  /* An unfilled blank. GREY on purpose: green already means done/positive in
     this design, and an empty space to complete is neither. The dotted rule
     says "blank line on a paper form"; the pointer + hover appear only where
     the blank knows which field it belongs to (data-field-key) and can
     therefore take a click. Filled values render as plain document text with
     none of this — the styling belongs to emptiness, not to fields. */
  .hati-doc .hati-field{background:var(--color-neutral-100);color:var(--color-neutral-600);
    border-bottom:1px dotted var(--color-neutral-500);padding:0 3px;border-radius:0;}
  .hati-doc .hati-field[data-field-key]{cursor:pointer;}
  .hati-doc .hati-field[data-field-key]:hover{background:var(--color-neutral-200);
    border-bottom-style:solid;}

  /* the paste/edit surface — a contenteditable, because a textarea can only
     ever hold plain text, which is the thing we are trying to stop losing */
  .hati-editor{outline:none;overflow-y:auto;
    border:1px solid var(--color-divider);background:var(--color-surface);
    border-radius:0;padding:14px 16px;}
  .hati-editor:focus{border-color:var(--color-accent);box-shadow:var(--focus);}
  .hati-editor:empty::before,
  .hati-editor[data-empty="1"]::before{content:attr(data-placeholder);
    color:var(--color-neutral-500);pointer-events:none;display:block;}

  /* A clause that has just been inserted, or that the reader asked to be shown.
     Held long enough to actually find it on a long page, then released — a
     permanent highlight would become part of how the contract looks. */
  .clause-flash{
    animation:clauseFlash 2.6s ease-out;
    border-radius:0;
    scroll-margin:90px;
    /* In a plain-text document the clause is not an element, so it is wrapped in
       an inline span for the duration of the flash. That span usually spans
       several wrapped lines: clone the decoration so every line box gets the
       highlight, instead of one box stretched around the lot. */
    -webkit-box-decoration-break:clone;
            box-decoration-break:clone;
  }
  @keyframes clauseFlash{
    0%,55%{ background:var(--color-accent-200); box-shadow:0 0 0 3px var(--color-accent-200); }
    100%  { background:transparent;             box-shadow:0 0 0 3px transparent; }
  }
  @media print{ .clause-flash{animation:none!important;background:transparent!important;box-shadow:none!important;} }

  /* PDF export — print only the prepared document */
  #print-root{display:none;}
  @media print{
    body>*{display:none!important;}
    #print-root{display:block!important;}
    body{background:#fff;}
    /* Ink on white regardless of the on-screen theme: the filed artefact is
       not themed. Every token the document surfaces read is pinned back to
       its measured light value here, so a dark-mode session prints the same
       page a light-mode session does. */
    html.dark,html.dark #print-root,#print-root{
      --color-doc-text:#1B2A28; --color-doc-muted:#43524F; --color-doc-rule:#c9ccd1;
      --color-doc-surface:#fff; --color-bg:#fff; --color-surface:#fff;
      /* Paper prints white, warm or not — cream is a screen affordance and an
         inkjet would render it as a grey wash across every page. */
      --color-doc-warm:#fff; --color-doc-warm-line:#e2e8f0; --shadow-paper:none;
      --color-text:#1B2A28; --color-divider:#e2e8f0;
      --color-neutral-100:#f1f5f9; --color-neutral-200:#e2e8f0; --color-neutral-300:#cbd5e1;
      --color-neutral-400:#93A09E; --color-neutral-500:#5F6D6B; --color-neutral-600:#5F6D6B;
      --color-neutral-700:#1B2A28; --color-neutral-800:#1B2A28; --color-neutral-900:#1B2A28;
    }
    /* Print the ink that was measured, not whatever the print pipeline decides
       is economical. Without this, browsers and drivers lighten body text and
       drop background fills — which would silently undo the contrast work on
       exactly the artefact that gets filed, emailed and signed. */
    #print-root,#print-root *{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}
    .doc-surface{color:var(--color-doc-text)!important;font-family:var(--font-doc)!important;}
    .doc-surface .doc-muted{color:var(--color-doc-muted)!important;}
    /* a ruled/columnar block scrolls sideways on screen; on paper there is
       nowhere to scroll, so let it wrap rather than clip the right-hand columns */
    .doc-pre{white-space:pre-wrap!important;overflow:visible!important;}
    .hati-doc pre{white-space:pre-wrap!important;overflow:visible!important;}
    /* a document table must not be split mid-row on paper */
    .hati-doc tr,.hati-doc h1,.hati-doc h2,.hati-doc h3,.hati-doc h4{break-inside:avoid;}
    .hati-doc h1,.hati-doc h2,.hati-doc h3,.hati-doc h4{break-after:avoid;}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}

  /* ============ document designs — body typography ============
     A paper div carrying data-doc-body="<designId>" (js/branding.js,
     docDesignPaperAttr) restyles the document BODY to match its design:
     typeface, heading treatment, justification. !important on the faces
     because the print sheet above enforces --font-doc with !important and
     these five looks must survive onto paper — that is the whole feature.
     --doc-design-accent is pinned inline by docDesignPaperStyle. */
  [data-doc-body="classic-letterhead"] .doc-surface,
  [data-doc-body="classic-letterhead"] .doc-surface *:not(.hati-field):not(input):not(textarea){font-family:Georgia,'Times New Roman',Times,serif!important;}
  [data-doc-body="classic-letterhead"] .doc-surface h1{text-align:center;letter-spacing:.06em;}

  [data-doc-body="modern-minimal"] .doc-surface,
  [data-doc-body="modern-minimal"] .doc-surface *:not(.hati-field):not(input):not(textarea){font-family:'Helvetica Neue',Helvetica,Arial,sans-serif!important;}
  [data-doc-body="modern-minimal"] .doc-surface h1{font-weight:400;letter-spacing:-.01em;}
  [data-doc-body="modern-minimal"] .doc-surface h2{font-weight:600;}

  [data-doc-body="formal-legal"] .doc-surface,

  /* ============ document structures — page architecture ============
     A paper div carrying data-doc-structure="<structureId>" (js/branding.js,
     docDesignPaperAttr) re-lays out the document BODY. This is the second,
     independent choice: a design says what the document WEARS, a structure
     says how the page is BUILT. Both attributes sit on the same div, so any
     design pairs with any structure the Design step allows.

     Every rule below is presentation only. None of them reorders, rewords or
     renumbers anything — the markup underneath is identical to Standard Flow,
     which is what keeps data-clause-id (and every negotiation change filed
     against it) pointing where it always did. Standard Flow emits no
     attribute at all, so a document without a structure is untouched.

     !important on nothing here: unlike the typefaces above, none of these
     properties is enforced with !important by the print sheet, so ordinary
     specificity carries them onto paper. */

  /* -- Margin Numbers: the BODY steps in, so clause headings are left standing
        in a ruled margin of their own and the numbers stack in a column.

        THE DEFECT THIS REPLACES. The heading was pulled left twice — once by a
        negative margin to take the block out, and again by text-indent on its
        first line. Two pulls, one indent's worth of room: the first line landed
        3.4em outside the sheet and the words ran off the paper. Reported from
        the Design step preview, visible on any heading long enough to matter.

        Now the surface indents and the heading steps back by exactly what the
        surface stepped forward — no text-indent, nothing to overshoot with. The
        rule is drawn at the indent by a pseudo-element rather than as a border
        on the surface, so it sits BETWEEN the numbers and the body instead of
        outside both. -- */
  [data-doc-structure="margin-numbers"] .doc-surface{position:relative;padding-left:3.4em;}
  [data-doc-structure="margin-numbers"] .doc-surface::before{
    content:"";position:absolute;left:3.4em;top:0;bottom:0;width:1px;
    background:var(--color-doc-rule,#c9ccd1);z-index:0;}
  /* The heading steps back by exactly what the surface stepped forward, and
     carries the paper's own colour so the rule BREAKS behind it rather than
     being drawn through the words. A clause heading is longer than a number
     column is wide, so it must cross the rule's line — the only question is
     whether it crosses over or under, and a rule struck through "Orders and
     Deliveries" is the defect that was reported. The colour is the paper's
     token, so it stays right in dark mode and prints white on paper. */
  [data-doc-structure="margin-numbers"] .doc-surface h1,
  [data-doc-structure="margin-numbers"] .doc-surface h2,
  [data-doc-structure="margin-numbers"] .doc-surface h3,
  [data-doc-structure="margin-numbers"] .doc-surface h4{
    margin-left:-3.4em;padding-right:.6em;position:relative;z-index:1;
    background:var(--color-doc-surface,#fff);}

  /* -- Two Columns: the body sets in two narrow columns. Headings, tables and
        signature blocks are kept whole rather than split across the gutter. -- */
  [data-doc-structure="two-column"] .doc-surface{column-count:2;column-gap:2.4em;
    column-rule:1px solid var(--color-doc-rule,#c9ccd1);}
  [data-doc-structure="two-column"] .doc-surface > h1{column-span:all;}
  [data-doc-structure="two-column"] .doc-surface h2,
  [data-doc-structure="two-column"] .doc-surface h3,
  [data-doc-structure="two-column"] .doc-surface h4,
  [data-doc-structure="two-column"] .doc-surface table,
  [data-doc-structure="two-column"] .doc-surface blockquote,
  [data-doc-structure="two-column"] .doc-surface pre{break-inside:avoid;}
  /* a heading orphaned at the foot of a column reads as a heading for nothing */
  [data-doc-structure="two-column"] .doc-surface h2,
  [data-doc-structure="two-column"] .doc-surface h3{break-after:avoid;}
  [data-doc-structure="two-column"] .doc-surface p{text-align:justify;hyphens:auto;}

  /* -- Ruled Clauses: a rule above every clause and room around it, so the
        document reads as a list of separable obligations rather than prose. -- */
  [data-doc-structure="ruled-clauses"] .doc-surface h2,
  [data-doc-structure="ruled-clauses"] .doc-surface h3{
    border-top:1px solid var(--color-doc-rule,#c9ccd1);padding-top:.85em;margin-top:1.6em;}
  [data-doc-structure="ruled-clauses"] .doc-surface h1 + h2,
  [data-doc-structure="ruled-clauses"] .doc-surface > h2:first-child{border-top:0;padding-top:0;margin-top:0;}
  [data-doc-structure="ruled-clauses"] .doc-surface h2{break-before:auto;}

  /* -- Contents First: the prepended nav is markup (docStructureBodyHtml), and
        it already carries its own page break inline. All it needs here is not
        to be split across two pages. Deliberately NOT wrapped in @media print:
        the server scrapes these rules out of this file by regex to style the
        executed copy (docBodyDesignCss in server/server.js), and a rule nested
        inside a media query would be lifted out of its wrapper. -- */
  .doc-surface [data-doc-contents]{break-inside:avoid;}
</style>

            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><use href="#i-chat"/></svg>
            <span style="flex:1;" data-i18n="nav_advice_desk">Advice Desk</span><span class="nav-count" data-count="advice"></span>
          </button>
          <!-- Bulk import has a door again, and it is in here rather than in
               the everyday five. It was retired to the "+ New contract" menu on
               the reasoning that the three ways a contract gets in belong
               together — true of DRAFTING one and UPLOADING one, both a single
               act that ends with a contract on screen a moment later.
               Importing a back-catalogue is not that: it is a job of work with
               a queue, a review pass and a Copilot budget, and you come back to
               it across days. A menu called "+ New contract" is where you go to
               START one, not where you go to RESUME one — which is the whole
               case for a door. ADMINISTRATION is the right shelf for it: the
               fold is for what is reached rarely and by choice, and a
               back-catalogue import is a setup job, not a daily destination.
               The menu entry stays; the two doors reach the same page. -->
          <button data-view="migration" class="nav-item" title="Import contracts — bring a whole back-catalogue in at once, with Copilot extraction and a human review pass" data-i18n-title="nav_import_title">
            <span class="nav-rail"></span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><use href="#i-import"/></svg>
            <span style="flex:1;" data-i18n="nav_import">Import contracts</span><span class="nav-count" data-count="migration"
              title="Imported contracts still waiting on a human review pass" data-i18n-title="nav_import_count_title"></span>
          </button>
        </div>
      </div>
    </nav>

    <!-- THE COPILOT DOOR AT THE FOOT OF THE COLUMN.
         Same button it has always been — same id, same handler, same badge —
         re-dressed to the design's own: a full-width flat accent block with the
         keyboard hint at its right. The gradient and the soft drop shadow went
         with the rest of them: this shell draws depth in 1px lines. -->
    <div class="copilot-wrap">
      <button id="side-copilot" title="Open HaTi Copilot — your contract-intelligence assistant" data-i18n-title="nav_copilot_title">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><use href="#i-spark"/></svg>
        <span class="sc-label" data-i18n="sh_ask_copilot">Ask Copilot</span>
        <span class="sc-kb" aria-hidden="true">⌘K</span>
        <span id="ai-badge" data-ai-badge class="ai-badge-dot hidden" style="position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#f59e0b;"></span>
      </button>
    </div>

    <!-- footer: live status card (the profile badge lives in the top header)

         IT HAS TO SAY WHAT IT IS. This was two unlabelled sentences run
         together — "Server mode · SQLite ✦ Claude Copilot · 2 online" over
         "Copilot today: $1.02 / $10.00 · 15 req" — which wrapped into a knot
         and never told a reader what any of it measured. It is now a titled
         card of named readings: each line states what it is showing on the
         left and the figure on the right.

         AND IT FOLDS (owner-asked 20 Aug 2026): at rest only a slim handle
         shows — dot, title, chevron — and pressing it slides the card UP
         over the nav, the way the left-hand panels slide over the page.
         The freed height goes to the nav list, which is what stops it
         scrolling. Open state is per sitting, in memory; Escape and the
         handle both close it. The card's ids are untouched, so
         updateSidebarStatus writes exactly where it always wrote. -->
    <div class="foot-wrap" id="foot-wrap" style="position:relative;border-top:1px solid var(--color-divider);">
      <button id="foot-toggle" type="button" class="foot-handle" aria-expanded="false" aria-controls="foot-sheet" title="Workspace status" data-i18n-title="foot_status_title">
        <span class="live-ping status-pulse" style="width:7px;height:7px;border-radius:50%;background:#10b981;flex:none;"></span>
        <span class="foot-card-title" data-i18n="foot_status_title">Workspace status</span>
        <svg class="foot-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
      </button>
      <div id="foot-sheet" class="foot-sheet" aria-hidden="true">
      <div class="foot-card">
        <div class="foot-kpi" title="Where this workspace keeps your contracts." data-i18n-title="foot_storage_title">
          <span class="foot-k" data-i18n="foot_storage">Storage</span><span class="foot-v" id="side-status-mode">—</span>
        </div>
        <div class="foot-kpi" title="Whether Claude is answering the Copilot, or it is falling back to keyword matching." data-i18n-title="foot_copilot_title">
          <span class="foot-k" data-i18n="foot_copilot">Copilot</span><span class="foot-v" id="side-status-ai">—</span>
        </div>
        <div class="foot-kpi" title="People with a login on this workspace." data-i18n-title="foot_team_title">
          <span class="foot-k" data-i18n="foot_team">Team</span><span class="foot-v" id="side-status-online">—</span>
        </div>
        <button id="side-ai-usage" type="button" title="What the Copilot has cost today across the whole workspace in real Anthropic API calls — resets at local midnight. Click to set the daily limit." data-i18n-title="foot_spend_title" style="display:none;">
          <span class="foot-ai-dot" style="width:7px;height:7px;border-radius:50%;background:#f59e0b;flex:none;"></span>
          <span class="foot-ai-body">
            <span class="foot-kpi">
              <span class="foot-k" id="side-ai-usage-label" data-i18n="foot_spend">Copilot spend</span>
              <span class="foot-v" id="side-ai-usage-txt" style="font-variant-numeric:tabular-nums;"></span>
            </span>
            <span class="foot-note" id="side-ai-usage-sub"></span>
          </span>
        </button>
      </div>
      </div>
    </div>
  </aside>

  <!-- Drawer scrim — only ever visible below 1500, where the sidebar floats
       over the page rather than widening its column. -->
  <div id="nav-scrim" hidden></div>

  <!-- ================= MAIN COLUMN ================= -->
  <!-- grid-column:2 is PINNED, not left to auto-placement. Below 1500 the
       sidebar becomes position:fixed, which takes it out of grid flow entirely
       — and an auto-placed main column would then slide into the sidebar's own
       track. (The track is held at 64px there rather than collapsed, so the
       strip has somewhere to sit; that is a reason to name the track, not to
       stop naming it.) Naming it means the content column is the content
       column at every size. -->
  <div style="grid-column:2;display:flex;flex-direction:column;min-width:0;min-height:0;">

    <!-- ---- THE PAGE'S OWN HEADER, not a bar over it ----
         This was a 48px strip on its own surface with its own bottom rule,
         carrying a title, Export, "+ New contract" and the panel toggle on
         every screen. It stacked a second chrome layer above content that
         already had a header of its own — most visibly on the dashboard, where
         "+ New contract" sat directly above a hero whose whole job is to offer
         "Draft new agreement". Two buttons, one act, one on top of the other.

         The reference has no such strip: a page states its own name and offers
         its own verbs, and the dashboard states nothing because its hero is the
         statement. So this is now a transparent block on the page ground that
         renderPageHeader fills per view — empty on the dashboard — and the
         panel toggle has moved up beside the bell, where the global chrome
         lives. -->
    <div id="page-head" style="flex:none;"></div>
    <!-- Anchored at body level and positioned under whichever button opened it,
         because the trigger is now re-rendered per view rather than living in a
         strip that never moved. -->
    <div id="new-menu" class="hidden" style="position:fixed;width:300px;background:var(--color-surface);border:1px solid var(--color-divider);box-shadow:var(--shadow-md);border-radius:0;padding:6px;z-index:60;max-height:70vh;overflow-y:auto;"></div>

    <!-- body grid: content only.
         The Activity panel USED TO TAKE A COLUMN HERE, and opening it re-laid
         the page out — the contract narrowed, its lines re-wrapped, and
         whatever the reader was looking at moved sideways. It is a slide-over
         now (see #context-panel below, beside the Copilot it borrows its
         behaviour from), so this grid has one track and never changes. -->
    <div id="body-grid" style="flex:1;display:grid;grid-template-columns:1fr;min-height:0;">
      <!-- scrollbar-gutter keeps the gutter reserved whether or not this page
           scrolls: without it, moving between a scrolling page (Home, Reports)
           and a fixed-height one (Register, Queue) made the scrollbar appear
           and vanish, shifting every pixel of content sideways — a horizontal
           jolt on every navigation wherever scrollbars take up space. -->
      <main id="content-scroll" class="scroll-thin" style="overflow:auto;min-width:0;min-height:0;scrollbar-gutter:stable;">
        <div id="content"></div>
      </main>

    </div>
  </div>
</div>

<!-- ================= THE PHONE =================
     Below 768px the desktop shell above is hidden outright and this root is
     drawn instead — a bottom tab bar, a slim header and one screen at a time.
     It is NOT a re-styling of the shell: a 256px sidebar, a 292px activity
     column and a 64px header of icon buttons have no phone-sized arrangement
     worth having, so the phone gets its own arrangement over exactly the same
     data. Everything inside is built by js/mobile.js, which renders nothing at
     all above the breakpoint. See the rules at the top of that file. -->
<div id="m-root" hidden></div>

<!-- ================= ACTIVITY PANEL (slide-over) =================
     It lived in #body-grid as a 292px column, so opening it took 292px away
     from the page and gave the reader a different layout of the thing they
     were reading. It is a layer now, on the same pattern as the Copilot below
     — fixed to the right edge, over a scrim, dismissed by the scrim, Escape or
     the header button that opened it. Nothing behind it moves.

     Being a layer also means it no longer has to be suppressed on a narrow
     window: it took a column it could not afford there, and now it takes
     none. -->
<div id="panel-scrim"></div>
<aside id="context-panel" aria-labelledby="panel-title" style="background:var(--color-surface);border-left:1px solid var(--color-divider);">
  <!-- A HEADER, NOT A TAB STRIP. The old one was a single full-width .panel-tab
       — an underlined tab, alone, with nothing to switch to — which read as a
       column heading only because a column is what it sat on. Full height and
       over the page it needs a title and a way out, in that order. -->
  <header style="flex:none;display:flex;align-items:center;gap:10px;padding:13px 10px 13px 16px;border-bottom:1px solid var(--color-divider);">
    <!-- THE HEADING IS FILLED BY renderContextPanel, because this one shell now
         carries two contents — Activity (the whole workspace) and Alerts (this
         person). A panel that does not say which it is showing is a panel a
         reader will believe the wrong half of. -->
    <h2 id="panel-title" style="flex:1;margin:0;font-family:var(--font-heading);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text);">Activity</h2>
    <button id="panel-close" class="hdr-icon-btn" title="Close the panel" aria-label="Close the panel">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div id="panel-body" class="scroll-thin" style="flex:1;overflow-y:auto;"></div>
</aside>

<!-- ================= Copilot ASSISTANT (slide-over) ================= -->
<div id="ai-scrim" class="fixed inset-0 z-40" style="background:color-mix(in srgb,#020617 45%,transparent);"></div>
<section id="ai-panel" class="hati-copilot-panel fixed top-0 right-0 bottom-0 w-full z-50 flex flex-col" style="max-width:430px;background:var(--color-surface);border-left:1px solid var(--color-divider);">
  <header class="px-5 py-4 flex items-center gap-3" style="background:var(--color-accent-900);color:#fff;">
    <div class="h-9 w-9 grid place-items-center shrink-0" style="background:var(--color-accent);color:#fff;border-radius:0;" data-ic-big="sparkle"></div>
    <div class="flex-1 leading-tight">
      <div class="font-display font-600">HaTi Copilot</div>
      <div id="ai-brain-sub" class="text-[11px] flex items-center gap-1.5" style="color:var(--color-accent-200);"><span class="h-1.5 w-1.5 rounded-full live-dot" style="background:var(--st-green-dot);"></span><span data-i18n="ai_searching_live">Searching your live contract data</span></div>
    </div>
    <button id="ai-expand" title="Expand the panel" data-i18n-title="ai_expand_panel" class="h-8 w-8 grid place-items-center rounded hover:bg-white/10 transition" style="color:var(--color-accent-200);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></svg></button>
    <button id="ai-clear" title="Delete conversation" data-i18n-title="ai_delete_conversation" class="h-8 w-8 grid place-items-center rounded hover:bg-white/10 transition" style="color:var(--color-accent-200);" data-ic-big="trash"></button>
    <button id="ai-min" title="Minimize — you'll be notified when an answer arrives" data-i18n-title="ai_minimize_hint" class="h-8 w-8 grid place-items-center rounded hover:bg-white/10 transition" style="color:var(--color-accent-200);" data-ic-big="minus"></button>
    <button id="ai-close" title="Close" data-i18n-title="act_close" class="h-8 w-8 grid place-items-center rounded hover:bg-white/10 transition" style="color:var(--color-accent-200);" data-ic-big="x"></button>
  </header>

  <div id="ai-feed" class="flex-1 overflow-y-auto scroll-thin px-5 py-4 space-y-4" style="background:var(--color-chat-bg);"></div>

  <!-- How much to say, and in what register. Above the input because it
       changes the NEXT answer, not the ones already on the screen. -->
  <div class="px-5 pt-2 flex items-center gap-2" style="background:var(--color-bg);">
    <span class="text-[10px] font-600 uppercase tracking-wider" data-i18n="ai_answers_caption" style="color:var(--color-neutral-500);">Answers</span>
    <div id="ai-style" class="flex items-center gap-1"></div>
  </div>

  <div id="ai-suggest" class="px-5 pb-2 flex flex-wrap gap-1.5" style="background:var(--color-bg);"></div>

  <footer class="px-5 pb-5 pt-3" style="border-top:1px solid var(--color-divider);background:var(--color-surface);">
    <div class="flex items-center gap-2">
      <textarea id="ai-input" rows="1" data-i18n-ph="ai_input_ph" placeholder="Search, summarize, or ask about your contracts…  (Shift+Enter for a new line)" class="chat-field flex-1 px-3.5 py-2.5 text-sm outline-none transition" style="border:1px solid var(--color-divider);background:var(--color-bg);border-radius:0;"></textarea>
      <button id="ai-send" class="h-10 w-10 shrink-0 grid place-items-center text-white transition" style="background:var(--color-accent);border-radius:0;" data-ic-big="send"></button>
    </div>
  </footer>
</section>

<div id="modal-root"></div>
<div id="toast-root" class="fixed bottom-6 right-6 z-[60] space-y-2"></div>
<div id="print-root"></div>

<style>
/* Copilot answers: markdown, tone markers and charts. Scoped to #ai-feed so a
   model's output can never restyle the application around it. */
#ai-feed .ai-p{margin:0 0 .5em}
#ai-feed .ai-p:last-child{margin-bottom:0}
#ai-feed .ai-h{font-family:var(--font-heading);font-weight:600;font-size:15px;margin:.7em 0 .3em}
#ai-feed .ai-list{margin:.3em 0 .5em;padding-left:1.15rem}
#ai-feed ul.ai-list{list-style:disc}
#ai-feed ol.ai-list{list-style:decimal}
#ai-feed .ai-list li{margin:.15em 0}
#ai-feed .ai-quote{border-left:2px solid var(--color-divider);padding-left:.65rem;margin:.4em 0;color:var(--color-neutral-700)}
#ai-feed .ai-code{background:var(--color-bg);border:1px solid var(--color-divider);border-radius:0;
  padding:.5rem .65rem;overflow-x:auto;font-family:var(--font-mono);font-size:12px;margin:.4em 0}
#ai-feed .ai-table-wrap{overflow-x:auto;margin:.45em 0}
#ai-feed .ai-table{width:100%;border-collapse:collapse;font-size:13px}
#ai-feed .ai-table th,#ai-feed .ai-table td{border:1px solid var(--color-divider);padding:4px 7px;text-align:left}
#ai-feed .ai-table th{background:var(--color-bg);font-weight:600}
#ai-feed hr{border:0;border-top:1px solid var(--color-divider);margin:.6em 0}
/* THE PASSAGE A REPHRASE IS ABOUT, shown rather than remembered. The drawer
   covers the right of the screen and the reader is about to type a sentence
   about wording they can no longer necessarily see, so the wording comes with
   the question. Quoted and set in the document face, so it reads as the
   contract's words rather than as the Copilot's. */
#ai-feed .ai-target{border-left:2px solid var(--color-accent-300);
  background:var(--color-bg);border-radius:0;padding:8px 11px;margin:0 0 8px}
#ai-feed .ai-target-head{font-size:11px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--color-neutral-500);margin-bottom:4px}
#ai-feed .ai-target-body{font-family:var(--font-doc);font-size:14px;line-height:1.6;
  color:var(--color-neutral-800);max-height:9.6em;overflow:auto;white-space:pre-wrap}
#ai-feed .ai-target-ask{font-size:14px;line-height:1.55}
/* Suggested-question chips: shown on an empty panel only (js/ai.js). */
.ai-chip{border:1px dashed var(--color-divider);background:var(--color-surface);color:var(--color-neutral-700);
  font-size:12px;font-weight:400;border-radius:0;padding:4px 10px;cursor:pointer;
  transition:border-color .12s,color .12s,background .12s}
.ai-chip:hover{border-color:var(--color-accent);color:var(--color-accent-800);border-style:solid;background:var(--color-surface)}
.ai-tone{font-weight:600;border-radius:0;padding:0 3px}
.ai-tone-pos{color:var(--st-green-fg);background:var(--st-green-bg)}
.ai-tone-neg{color:var(--st-ruby-fg);background:var(--st-ruby-bg)}
.ai-tone-warn{color:var(--st-amber-fg);background:var(--st-amber-bg)}
.ai-tone-mut{color:var(--color-neutral-600)}
/* Copilot's read (Insights → Negotiation Friction): the chat feed's paragraph
   rhythm is scoped to #ai-feed, so this out-of-feed surface sets its own —
   and the bolded takeaway opening each paragraph reads as its heading. */
.igf-ai-read .ai-p{margin:0 0 12px}
.igf-ai-read .ai-p:last-child{margin-bottom:0}
.igf-ai-read .ai-p>strong:first-child{color:var(--color-accent-700)}
.ai-chart{border:1px solid var(--color-divider);background:var(--color-surface);border-radius:0;
  padding:10px 12px;margin:.5em 0;position:relative}
/* The way out of the screen: copy image / PNG / CSV, on every chart card. */
.ai-chart-actions{position:absolute;top:6px;right:6px;display:flex;gap:2px;z-index:2}
.ai-chart-btn{display:grid;place-items:center;height:22px;width:22px;border:0;cursor:pointer;
  border-radius:0;background:transparent;color:var(--color-neutral-500);transition:background .12s,color .12s}
.ai-chart-btn:hover{background:var(--color-bg);color:var(--color-accent-700)}
.ai-chart-title{font-family:var(--font-heading);font-weight:600;font-size:13px;margin-bottom:6px;padding-right:76px}
.ai-chart-canvas{position:relative;height:200px}
.ai-chart-src{font-size:12px;color:var(--color-neutral-600);margin-top:6px;line-height:1.45}
.ai-chart-note{font-size:13px;color:var(--color-neutral-700);line-height:1.5}
@media (max-width:640px){ .ai-chart-canvas{height:168px} }

  /* ---- A MESSAGE BOX YOU CAN READ BACK ----
     Every composer in the product was a one-line <input>, so anything past a
     dozen words scrolled out of view as it was typed. These are textareas that
     wrap and grow: one line at rest, taller as you write, and scrolling once
     they hit max-height — a composer that can push its own send button off the
     panel has traded one problem for a worse one. Wired by chatFieldWire
     (js/components.js), which also owns Enter-sends / Shift+Enter-newline. */
  textarea.chat-field{resize:none;overflow-y:auto;max-height:7.5em;line-height:1.5;
    white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;box-sizing:border-box;
    scrollbar-width:thin}
  textarea.chat-field::-webkit-scrollbar{width:6px}
  textarea.chat-field::-webkit-scrollbar-thumb{background:var(--color-divider);border-radius:0}
</style>

<script type="module" src="js/app.js"></script>
</body>
</html>
