<title>HaTi S/4HANA Skin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..700;1,400&display=swap">
<style>
/* ============================================================================
   HaTi rendered in SAP Fiori's visual language (SAP S/4HANA).
   Every token below is SAP's own: Quartz Light (sap_fiori_3), Quartz Dark
   (sap_fiori_3_dark) and Morning Horizon (sap_horizon). Nothing is invented.
   ========================================================================= */

/* ---- QUARTZ LIGHT — the default, and the light answer ------------------- */
:root{
  --f:"72","72full","72-Web","Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --fmono:"72Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --shell:#354a5f;          /* sapShellColor */
  --shell-ink:#ffffff;      /* sapShell_TextColor */
  --shell-hover:rgba(255,255,255,.12);
  --shell-line:transparent;
  --shell-shadow:none;

  --bg:#f7f7f7;             /* sapBackgroundColor */
  --surface:#ffffff;        /* sapTile_Background / sapList_Background */
  --surface-2:#fafafa;
  --hover:#f2f2f2;          /* sapList_Hover_Background */
  --sel:#e5f0fa;            /* sapList_SelectionBackgroundColor */

  --ink:#32363a;            /* sapTextColor */
  --label:#6a6d70;          /* sapContent_LabelColor */
  --line:#e5e5e5;           /* sapGroup_ContentBorderColor */
  --line-2:#d9d9d9;

  --brand:#0a6ed1;          /* sapLinkColor / sapContent_IconColor */
  --brand-hover:#0854a0;
  --emph-bg:#0a6ed1;        /* sapButton_Emphasized_Background */
  --emph-ink:#ffffff;
  --brand-tint:#ebf5fe;

  --pos:#107e3e;  --pos-bg:#f1fdf6;  /* sapPositiveColor */
  --crit:#e9730c; --crit-bg:#fef7f1; /* sapCriticalColor */
  --neg:#bb0000;  --neg-bg:#ffebeb;  /* sapNegativeColor */
  --neu:#6a6d70;  --neu-bg:#f4f4f4;  /* sapNeutralColor */
  --info:#0a6ed1; --info-bg:#f5faff; /* sapInformativeColor */

  --r:.25rem;               /* Fiori 3 radius */
  --r-tile:.25rem;
  --sh-1:0 0 0 1px rgba(0,0,0,.05),0 .0625rem .125rem 0 rgba(0,0,0,.10);
  --sh-2:0 0 0 1px rgba(0,0,0,.05),0 .25rem .5rem 0 rgba(0,0,0,.16);
  --sh-3:0 0 0 1px rgba(0,0,0,.05),0 .625rem 1.25rem 0 rgba(0,0,0,.22);
}

/* ---- QUARTZ DARK — the dark answer, for the un-stamped viewer ----------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --shell:#12171c; --shell-ink:#eaecee; --shell-hover:rgba(255,255,255,.10);
    --shell-line:#2a3138;
    --bg:#1d232a; --surface:#2b3138; --surface-2:#242a30; --hover:#333b43; --sel:#1c3a56;
    --ink:#eaecee; --label:#a9b4be; --line:#3c444d; --line-2:#4a535c;
    --brand:#91c8f6; --brand-hover:#b8ddff; --emph-bg:#0a6ed1; --emph-ink:#ffffff;
    --brand-tint:#1f3345;
    --pos:#4db56a; --pos-bg:#1e2f24; --crit:#f5a04a; --crit-bg:#33291b;
    --neg:#ff8888; --neg-bg:#3a2224; --neu:#a9b4be; --neu-bg:#333b43;
    --info:#91c8f6; --info-bg:#1f3345;
    --sh-1:0 0 0 1px rgba(0,0,0,.4),0 .0625rem .125rem 0 rgba(0,0,0,.5);
    --sh-2:0 0 0 1px rgba(0,0,0,.4),0 .25rem .5rem 0 rgba(0,0,0,.6);
    --sh-3:0 0 0 1px rgba(0,0,0,.4),0 .625rem 1.25rem 0 rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --shell:#12171c; --shell-ink:#eaecee; --shell-hover:rgba(255,255,255,.10);
  --shell-line:#2a3138;
  --bg:#1d232a; --surface:#2b3138; --surface-2:#242a30; --hover:#333b43; --sel:#1c3a56;
  --ink:#eaecee; --label:#a9b4be; --line:#3c444d; --line-2:#4a535c;
  --brand:#91c8f6; --brand-hover:#b8ddff; --emph-bg:#0a6ed1; --emph-ink:#ffffff;
  --brand-tint:#1f3345;
  --pos:#4db56a; --pos-bg:#1e2f24; --crit:#f5a04a; --crit-bg:#33291b;
  --neg:#ff8888; --neg-bg:#3a2224; --neu:#a9b4be; --neu-bg:#333b43;
  --info:#91c8f6; --info-bg:#1f3345;
  --sh-1:0 0 0 1px rgba(0,0,0,.4),0 .0625rem .125rem 0 rgba(0,0,0,.5);
  --sh-2:0 0 0 1px rgba(0,0,0,.4),0 .25rem .5rem 0 rgba(0,0,0,.6);
  --sh-3:0 0 0 1px rgba(0,0,0,.4),0 .625rem 1.25rem 0 rgba(0,0,0,.7);
}

/* ---- The reader's own SAP theme choice beats both of the above ---------- */
#app[data-sap="light"]{
  --shell:#354a5f; --shell-ink:#fff; --shell-hover:rgba(255,255,255,.12); --shell-line:transparent; --shell-shadow:none;
  --bg:#f7f7f7; --surface:#fff; --surface-2:#fafafa; --hover:#f2f2f2; --sel:#e5f0fa;
  --ink:#32363a; --label:#6a6d70; --line:#e5e5e5; --line-2:#d9d9d9;
  --brand:#0a6ed1; --brand-hover:#0854a0; --emph-bg:#0a6ed1; --emph-ink:#fff; --brand-tint:#ebf5fe;
  --pos:#107e3e; --pos-bg:#f1fdf6; --crit:#e9730c; --crit-bg:#fef7f1;
  --neg:#bb0000; --neg-bg:#ffebeb; --neu:#6a6d70; --neu-bg:#f4f4f4; --info:#0a6ed1; --info-bg:#f5faff;
  --r:.25rem; --r-tile:.25rem;
  --sh-1:0 0 0 1px rgba(0,0,0,.05),0 .0625rem .125rem 0 rgba(0,0,0,.10);
  --sh-2:0 0 0 1px rgba(0,0,0,.05),0 .25rem .5rem 0 rgba(0,0,0,.16);
  --sh-3:0 0 0 1px rgba(0,0,0,.05),0 .625rem 1.25rem 0 rgba(0,0,0,.22);
}
#app[data-sap="dark"]{
  --shell:#12171c; --shell-ink:#eaecee; --shell-hover:rgba(255,255,255,.10); --shell-line:#2a3138; --shell-shadow:none;
  --bg:#1d232a; --surface:#2b3138; --surface-2:#242a30; --hover:#333b43; --sel:#1c3a56;
  --ink:#eaecee; --label:#a9b4be; --line:#3c444d; --line-2:#4a535c;
  --brand:#91c8f6; --brand-hover:#b8ddff; --emph-bg:#0a6ed1; --emph-ink:#fff; --brand-tint:#1f3345;
  --pos:#4db56a; --pos-bg:#1e2f24; --crit:#f5a04a; --crit-bg:#33291b;
  --neg:#ff8888; --neg-bg:#3a2224; --neu:#a9b4be; --neu-bg:#333b43; --info:#91c8f6; --info-bg:#1f3345;
  --r:.25rem; --r-tile:.25rem;
  --sh-1:0 0 0 1px rgba(0,0,0,.4),0 .0625rem .125rem 0 rgba(0,0,0,.5);
  --sh-2:0 0 0 1px rgba(0,0,0,.4),0 .25rem .5rem 0 rgba(0,0,0,.6);
  --sh-3:0 0 0 1px rgba(0,0,0,.4),0 .625rem 1.25rem 0 rgba(0,0,0,.7);
}
/* Morning Horizon — S/4HANA's current default theme */
#app[data-sap="horizon"]{
  --shell:#ffffff; --shell-ink:#1d2d3e; --shell-hover:#eaecee; --shell-line:#d9d9d9;
  --shell-shadow:0 .125rem .25rem 0 rgba(34,54,79,.08);
  --bg:#f5f6f7; --surface:#ffffff; --surface-2:#fafafa; --hover:#eaecee; --sel:#ebf8ff;
  --ink:#1d2d3e; --label:#556b82; --line:#d9d9d9; --line-2:#c9c9c9;
  --brand:#0064d9; --brand-hover:#0058c4; --emph-bg:#0070f2; --emph-ink:#fff; --brand-tint:#ebf8ff;
  --pos:#256f3a; --pos-bg:#f5fae5; --crit:#e76500; --crit-bg:#fff8d6;
  --neg:#aa0808; --neg-bg:#ffeaf4; --neu:#556b82; --neu-bg:#eaecee; --info:#0070f2; --info-bg:#ebf8ff;
  --r:.5rem; --r-tile:.75rem;
  --sh-1:0 0 .125rem 0 rgba(34,54,79,.10),0 .125rem .25rem 0 rgba(34,54,79,.08);
  --sh-2:0 0 .25rem 0 rgba(34,54,79,.10),0 .25rem .5rem 0 rgba(34,54,79,.12);
  --sh-3:0 0 .5rem 0 rgba(34,54,79,.12),0 .75rem 1.5rem 0 rgba(34,54,79,.16);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:.875rem;line-height:1.4;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
[hidden]{display:none!important}
:focus-visible{outline:.0625rem dotted var(--ink);outline-offset:.0625rem}
.sb :focus-visible,.tile:focus-visible{outline-color:var(--shell-ink)}
.tile:focus-visible{outline-color:var(--ink)}
.icon{width:1rem;height:1rem;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.i-lg{width:1.25rem;height:1.25rem}
.i-sm{width:.875rem;height:.875rem}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}

#app{min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}#view{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}#view > *{flex:0 0 auto}

/* ===================== SHELL BAR (sap.ushell.ui.ShellHeader) ============= */
.sb{
  height:2.75rem;flex:0 0 auto;display:flex;align-items:center;gap:.125rem;
  background:var(--shell);color:var(--shell-ink);padding:0 .5rem;
  position:sticky;top:0;z-index:60;border-bottom:.0625rem solid var(--shell-line);
  box-shadow:var(--shell-shadow);
}
.sb-btn{
  width:2.25rem;height:2.25rem;border-radius:var(--r);display:grid;place-items:center;
  color:var(--shell-ink);position:relative;flex:0 0 auto;
}
.sb-btn:hover{background:var(--shell-hover)}
.sb-logo{
  height:1.5rem;padding:0 .5rem;margin-right:.25rem;border-radius:.125rem;
  display:flex;align-items:center;font-weight:700;font-size:.9375rem;letter-spacing:.02em;
  background:var(--emph-bg);color:#fff;flex:0 0 auto;
}
#app[data-sap="horizon"] .sb-logo{background:var(--emph-bg)}
.sb-title{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:0 .5rem;
  border-radius:var(--r);height:2.25rem;max-width:min(30rem,42vw)}
.sb-title:hover{background:var(--shell-hover)}
.sb-t1{font-size:.875rem;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-t2{font-size:.75rem;line-height:1.15;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sp{flex:1 1 auto}
.sb-search{display:flex;align-items:center;gap:.375rem;height:2.25rem;border-radius:var(--r);
  border:.0625rem solid var(--shell-hover);background:var(--shell-hover);padding:0 .5rem;
  width:0;opacity:0;overflow:hidden;transition:width .2s ease,opacity .15s ease}
.sb-search.on{width:min(22rem,32vw);opacity:1}
.sb-search input{border:0;background:none;outline:none;width:100%;color:var(--shell-ink);font-size:.875rem}
.sb-search input::placeholder{color:var(--shell-ink);opacity:.7}
.sb-badge{
  position:absolute;top:.125rem;right:.125rem;min-width:1rem;height:1rem;padding:0 .1875rem;
  border-radius:.5rem;background:var(--neg);color:#fff;font-size:.6875rem;font-weight:700;
  display:grid;place-items:center;border:.0625rem solid var(--shell);line-height:1;
}
#app[data-sap="horizon"] .sb-badge{border-color:#fff}
.avatar{width:1.75rem;height:1.75rem;border-radius:50%;background:var(--emph-bg);color:#fff;
  display:grid;place-items:center;font-size:.6875rem;font-weight:700;letter-spacing:.02em}
.sb-btn.on{background:var(--shell-hover)}

/* ===================== LAUNCHPAD ======================================== */
.lp-tabs{display:flex;gap:0;background:var(--surface);border-bottom:.0625rem solid var(--line);
  padding:0 1rem;overflow-x:auto;position:sticky;top:2.75rem;z-index:30}
.lp-tab{padding:0 1rem;height:2.75rem;display:flex;align-items:center;white-space:nowrap;
  color:var(--label);border-bottom:.1875rem solid transparent;font-size:.875rem}
.lp-tab:hover{color:var(--ink);background:var(--hover)}
.lp-tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.lp{padding:1rem 1rem 3rem}
.lp-group{margin-bottom:1.75rem}
.lp-group-h{display:flex;align-items:baseline;gap:.5rem;margin:0 0 .5rem;padding:0 .0625rem}
.lp-group-h h2{margin:0;font-size:1rem;font-weight:400;color:var(--ink)}
.lp-group-h .cnt{font-size:.75rem;color:var(--label)}
.tiles{display:flex;flex-wrap:wrap;gap:.5rem}
.tile{
  width:11rem;height:11rem;background:var(--surface);border-radius:var(--r-tile);
  border:.0625rem solid transparent;box-shadow:var(--sh-1);
  padding:.75rem;display:flex;flex-direction:column;text-align:left;color:var(--ink);
  transition:box-shadow .1s ease,background .1s ease;position:relative;
}
.tile:hover{background:var(--hover);box-shadow:var(--sh-2)}
.tile:active{background:var(--sel)}
.tile.w2{width:22.5rem}
.tile-h{flex:0 0 auto}
.tile-t{font-size:.875rem;font-weight:700;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-s{font-size:.75rem;color:var(--label);margin-top:.125rem;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tile-b{flex:1 1 auto;display:flex;align-items:center;min-height:0;padding:.25rem 0;overflow:hidden}
.tile-f{flex:0 0 auto;font-size:.75rem;color:var(--label);display:flex;justify-content:space-between;
  gap:.5rem;align-items:baseline;border-top:.0625rem solid var(--line);padding-top:.375rem}
.tile-icon{width:2.5rem;height:2.5rem;color:var(--brand)}
.tile-icon .icon{width:2.5rem;height:2.5rem;stroke-width:1.1}
.kpi{display:flex;align-items:baseline;gap:.25rem;line-height:1;flex-wrap:wrap;max-width:100%}.kpi.sm .kpi-n{font-size:1.75rem}.kpi.sm .kpi-u{font-size:.875rem}
.kpi-n{font-size:2.25rem;font-weight:300;letter-spacing:-.01em}
.kpi-u{font-size:1rem;font-weight:400;color:var(--label)}
.kpi-d{font-size:.875rem;font-weight:400;padding-bottom:.25rem}
.s-pos{color:var(--pos)} .s-crit{color:var(--crit)} .s-neg{color:var(--neg)}
.s-neu{color:var(--neu)} .s-info{color:var(--info)}
.lp-note{max-width:44rem;margin:2rem .0625rem 0;padding-top:1rem;border-top:.0625rem solid var(--line);
  font-size:.75rem;color:var(--label);line-height:1.6}

/* micro charts inside tiles */
.mc{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:.125rem;overflow:hidden}
.mc-row{display:grid;grid-template-columns:4.5rem 1fr auto;align-items:center;gap:.375rem;font-size:.625rem;line-height:1.1}
.mc-lbl{color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-bar{height:.375rem;background:var(--neu-bg);border-radius:.0625rem;overflow:hidden}
.mc-bar i{display:block;height:100%;background:var(--brand);border-radius:.0625rem}
.mc-val{color:var(--label);font-variant-numeric:tabular-nums}
.spark{width:100%;height:3.25rem;display:block;overflow:visible}
.bullet{height:1.25rem;background:var(--neu-bg);position:relative;border-radius:.0625rem}
.bullet i{position:absolute;inset:0 auto 0 0;background:var(--pos);border-radius:.0625rem}
.bullet b{position:absolute;top:-.1875rem;bottom:-.1875rem;width:.125rem;background:var(--ink)}
</style>
<style>
/* ===================== BUTTONS (sap.m.Button) =========================== */
.btn{
  height:2.25rem;min-width:2.25rem;padding:0 .625rem;border-radius:var(--r);
  border:.0625rem solid var(--brand);color:var(--brand);background:transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:.375rem;
  font-size:.875rem;white-space:nowrap;transition:background .1s ease;
}
.btn:hover{background:var(--brand-tint)}
.btn:active{background:var(--sel)}
.btn-emph{background:var(--emph-bg);border-color:var(--emph-bg);color:var(--emph-ink);font-weight:700}
.btn-emph:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn-tr{border-color:transparent}
.btn-tr:hover{background:var(--hover)}
.btn-neg{color:var(--neg);border-color:var(--neg)}
.btn-neg:hover{background:var(--neg-bg)}
.btn-icon{padding:0;width:2.25rem}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-sm{height:1.75rem;min-width:1.75rem;font-size:.8125rem;padding:0 .5rem}

/* ===================== PAGE HEADER (sap.f.DynamicPageTitle) ============== */
.ph{background:var(--surface);padding:.5rem 1rem .25rem;border-bottom:.0625rem solid var(--line)}
.ph-top{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.ph-t{margin:0;font-size:1.25rem;font-weight:400;line-height:1.3}
.ph-t b{font-weight:700}
.ph-s{font-size:.875rem;color:var(--label);margin-top:.0625rem}
.ph-acts{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:.25rem;font-size:.75rem;color:var(--label);margin-bottom:.25rem}
.crumbs a{color:var(--brand)}
.crumbs .sep{opacity:.6}

/* ===================== FILTER BAR (sap.fe FilterBar) ==================== */
.fb{background:var(--surface);padding:.5rem 1rem .75rem;border-bottom:.0625rem solid var(--line)}
.fb-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.variant{display:inline-flex;align-items:center;gap:.25rem;font-size:1rem;font-weight:700;
  padding:.25rem .375rem;border-radius:var(--r);color:var(--ink)}
.variant:hover{background:var(--hover)}
.fb-fields{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:.125rem;min-width:10rem}
.fld > label{font-size:.75rem;color:var(--label)}
.inp{
  height:2.25rem;border:.0625rem solid var(--line-2);border-bottom-color:var(--label);
  border-radius:var(--r);background:var(--surface);padding:0 .5rem;color:var(--ink);
  font-size:.875rem;outline:none;width:100%;
}
.inp:hover{border-color:var(--label)}
.inp:focus{outline:.0625rem dotted var(--ink);outline-offset:-.1875rem;border-color:var(--brand)}
select.inp{appearance:none;padding-right:1.5rem;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - .75rem) 1.0625rem,calc(100% - .5rem) 1.0625rem;
  background-size:.25rem .25rem,.25rem .25rem;background-repeat:no-repeat}
.fb-go{margin-left:auto;display:flex;gap:.5rem;align-items:flex-end;padding-bottom:0}
.fb-tokens{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:.5rem}
.token{display:inline-flex;align-items:center;gap:.375rem;height:1.5rem;padding:0 .5rem;
  border-radius:var(--r);background:var(--sel);color:var(--ink);font-size:.75rem;
  border:.0625rem solid transparent}
.token button{color:var(--label);display:grid;place-items:center}
.token button:hover{color:var(--neg)}

/* ===================== TABLE (sap.m.Table, responsive) ================== */
.tblwrap{margin:.5rem 1rem 1rem;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}
.tbl-tb{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;min-height:3rem;flex-wrap:wrap}
.tbl-tb h3{margin:0;font-size:1rem;font-weight:700}
.tbl-tb .cnt{color:var(--label);font-weight:400}
.tbl-tb-acts{margin-left:auto;display:flex;gap:.25rem;align-items:center}
.tbl-scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.875rem}
table.t th{
  text-align:left;font-weight:400;color:var(--ink);padding:.5rem .75rem;height:2.75rem;
  border-bottom:.0625rem solid var(--line-2);white-space:nowrap;background:var(--surface);
  position:sticky;top:0;z-index:5;
}
table.t th.sortable{cursor:pointer}
table.t th.sortable:hover{background:var(--hover)}
table.t th .sortmark{color:var(--brand);font-size:.6875rem;margin-left:.25rem}
table.t th.num,table.t td.num{text-align:right}
table.t td{padding:.5rem .75rem;border-bottom:.0625rem solid var(--line);vertical-align:middle;height:2.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20rem}table.t.fixed{table-layout:fixed}table.t.fixed td,table.t.fixed th{max-width:none}.oid b,.oid span{max-width:100%}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:var(--hover)}
table.t tbody tr.sel{background:var(--sel)}
table.t tbody tr.sel:hover{background:var(--sel)}
.oid{display:flex;flex-direction:column;gap:.0625rem;min-width:0}
.oid b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oid span{font-size:.75rem;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ostat{display:inline-flex;align-items:center;gap:.25rem;white-space:nowrap}

.cb{width:1.125rem;height:1.125rem;border:.0625rem solid var(--label);border-radius:.125rem;

.cb.on{background:var(--emph-bg);border-color:var(--emph-bg);color:#fff}
.group-row td{background:var(--surface-2);font-weight:700;color:var(--ink);

.group-row td .cnt{font-weight:400;color:var(--label)}

/* ===================== OBJECT PAGE ===================================== */
.oh{background:var(--surface);padding:.75rem 1rem .5rem;border-bottom:.0625rem solid var(--line)}

.itb-i.on .pill{background:var(--brand);color:#fff}
.op{padding:.75rem 1rem 5rem;display:flex;flex-direction:column;gap:.75rem}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(20rem,100%),1fr));

.frow{display:grid;grid-template-columns:11rem 1fr;gap:.75rem;align-items:baseline;

.mstrip.err{background:var(--neg-bg);border-color:var(--neg);color:var(--ink)}
.mstrip.ok{background:var(--pos-bg);border-color:var(--pos);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:3rem;transform:translateX(-50%);z-index:90;

const fdate= s => { const d=dt(s); return d ? d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear() : '—'; };

/* ===================== overlay plumbing ================================= */
function closePops(){ $('#pops').innerHTML=''; $$('.sb-btn.on').forEach(function(b){ b.classList.remove('on'); }); }
function popAt(anchor, html, opts){
  closePops(); opts=opts||{};
  const host=$('#pops');
  host.innerHTML='<div class="pop-scrim" style="position:fixed;inset:0;z-index:75"></div><div class="pop" role="dialog">'+html+'</div>';
  const pop=$('.pop',host), r=anchor.getBoundingClientRect();
  pop.style.visibility='hidden'; pop.style.top='0px'; pop.style.left='0px';
  requestAnimationFrame(function(){
    const w=pop.offsetWidth, h=pop.offsetHeight;
    let left = opts.align==='left' ? r.left : r.right-w;
    left = Math.min(Math.max(8,left), window.innerWidth-w-8);
    let top = r.bottom+6;
    if(top+h > window.innerHeight-8) top = Math.max(8, r.top-h-6);
    pop.style.left=left+'px'; pop.style.top=top+'px'; pop.style.visibility='visible';
  });
  $('.pop-scrim',host).addEventListener('click', closePops);
  return pop;
}
function closeDlg(){ $('#dlgs').innerHTML=''; }
function dialog(title, body, footer, wide){
  $('#dlgs').innerHTML =
    '<div class="scrim"><div class="dlg'+(wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'+
      '<div class="dlg-h"><h2>'+esc(title)+'</h2></div>'+
      '<div class="dlg-b">'+body+'</div>'+
      '<div class="dlg-f">'+footer+'</div></div></div>';
  const sc=$('#dlgs .scrim');
  sc.addEventListener('click', function(e){ if(e.target===sc) closeDlg(); });
  const f=$('#dlgs .dlg-f .btn-emph')||$('#dlgs .dlg-f .btn'); if(f) f.focus();
}
let toastT=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); },2600);
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ if($('#dlgs').innerHTML) closeDlg(); else if($('#pops').innerHTML) closePops(); }
});

/* ===================== navigation ======================================= */
function go(app, opts){
  opts=opts||{};
  closePops(); closeDlg();
  S.app=app; S.edit=false; S.sel={}; S.grow=12; S.strip=true;
  if(opts.cid) S.cid=opts.cid;
  if(opts.tab) S.tab=opts.tab; else if(app==='object') S.tab='general';
  if(opts.filters) S.filters=Object.assign({stream:'',status:'',owner:'',cp:''}, opts.filters);
  else if(app==='list' && !opts.keep) S.filters={stream:'',status:'',owner:'',cp:''};
  if(opts.variant!==undefined) S.variant=opts.variant;
  if(app!=='list') S.q='';

}

}

<script>
/* ===================== LAUNCHPAD ======================================== */
function tile(o){
  return '<button class="tile'+(o.w2?' w2':'')+'" '+(o.act?'data-act="'+o.act+'"':'')+'>'+
    '<span class="tile-h"><span class="tile-t">'+esc(o.t)+'</span>'+
      (o.s?'<span class="tile-s">'+esc(o.s)+'</span>':'')+'</span>'+
    '<span class="tile-b">'+(o.body||'')+'</span>'+
    '<span class="tile-f"><span>'+esc(o.foot||'')+'</span><span>'+(o.footR||'')+'</span></span></button>';
}
function kpiBody(n,unit,tone,delta){
  return '<span class="kpi '+(String(n).length>4?'sm ':'')+(tone||'')+'"><span class="kpi-n num">'+n+'</span>'+
    (unit?'<span class="kpi-u">'+esc(unit)+'</span>':'')+
    (delta?'<span class="kpi-d">'+delta+'</span>':'')+'</span>';
}
function iconBody(name){ return '<span class="tile-icon">'+ic(name)+'</span>'; }
function mcBars(rows){
  const max = Math.max.apply(null, rows.map(function(r){ return r.v; }));
  return '<span class="mc">'+rows.map(function(r){
    return '<span class="mc-row"><span class="mc-lbl">'+esc(r.l)+'</span>'+
      '<span class="mc-bar"><i style="width:'+Math.round(r.v/max*100)+'%;background:'+r.c+'"></i></span>'+
      '<span class="mc-val">'+esc(r.d)+'</span></span>';
  }).join('')+'</span>';
}
function sparkline(vals,w,h){
  const max=Math.max.apply(null,vals), min=Math.min.apply(null,vals), sp=(max-min)||1;
  const pts=vals.map(function(v,i){ return [i/(vals.length-1)*w, h-((v-min)/sp)*(h-6)-3]; });
  const d=pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  const area=d+' L'+w+' '+h+' L0 '+h+' Z';
  const last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+area+'" fill="var(--brand)" opacity=".12"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--brand)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.5" fill="var(--brand)"/></svg>';
}
const LP_PAGES=[
  {id:'home',  t:'My Home'},

             '<span class="bullet"><i style="width:64%"></i><b style="left:75%"></b></span></span>',
        foot:'Target 21 days'}),
      tile({t:'Rounds Closed per Week', s:'Last 10 weeks', act:'app:nego',

      tile({t:'Contract Analytics', s:'Value, risk and cycle time', act:'app:anal', body:iconBody('i-bar'), foot:'Updated today'}),

  if(page==='cm') return [

        body:kpiBody(cntStatus('Draft'),'','s-neu'), foot:'Oldest 18 Jul 2026'}),

    ]},
  ];
  if(page==='neg') return [
    {t:'Negotiation', tiles:[

      tile({t:'Waiting on You', s:'Their ask, undecided', act:'move:you', body:kpiBody(MINE.length,'','s-crit'), foot:'Oldest 4 days'}),

      tile({t:'Negotiation Playbook', s:'Our standard positions', act:'toast:The playbook is out of scope for this design study.',
        body:iconBody('i-shield'), foot:'18 standards'}),

  return [

      tile({t:'Signature Assurance', s:'Weakest rung on the ladder', act:'toast:Assurance ladder — signed-in account with two-step.',
        body:'<span class="mc"><span class="kpi"><span class="kpi-n num s-pos">4</span><span class="kpi-u">of 6</span></span>'+

function applyFilters(rows){
  const f=S.filters, q=S.q.trim().toLowerCase();
  return rows.filter(function(c){
    if(f.stream && c.stream!==f.stream) return false;
    if(f.status && c.status!==f.status) return false;
    if(f.owner  && c.owner!==f.owner) return false;
    if(f.cp && c.cp.toLowerCase().indexOf(f.cp.toLowerCase())<0) return false;
    if(S.variant==='Expiring in 90 Days'){ const d=days(c.expiry); if(!(d!=null&&d>=0&&d<=90)) return false; }
    if(S.variant==='High Risk' && c.risk!=='high') return false;
    if(q && (c.name+' '+c.cp+' '+c.id+' '+c.type).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function sortRows(rows){
  const k=S.sort.k, d=S.sort.d;
  return rows.slice().sort(function(a,b){
    let x=a[k], y=b[k];
    if(k==='expiry'){ x=x?dt(x).getTime():Infinity; y=y?dt(y).getTime():Infinity; }
    if(typeof x==='string') return x.localeCompare(y)*d;
    return (x-y)*d;
  });
}

function detail(c){
  const h = c.id.charCodeAt(4)+c.name.length;
  const notice = [30,60,90][h%3];

  const end    = c.expiry || '2027-12-31';
  const start  = (dt(end).getFullYear()-1)+'-'+String(dt(end).getMonth()+1).padStart(2,'0')+'-01';
  const dd     = dt(end); dd.setDate(dd.getDate()-notice);
  const dec    = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
  return { notice:notice, pay:pay, start:start, end:end, decision:dec,
    cap: c.val ? Math.round(c.val*0.5) : 0, autoRenew: h%2===0, law:'Republic of Kenya',
    reg:'PVT-'+(h*7919%900000+100000), addr:['Enterprise Road, Industrial Area','Nairobi, Kenya'].join(', ') };
}
const OBL_POOL=[
  ['Quarterly volume report','Supply Chain','Quarterly'],
  ['Certificate of analysis with each lot','Quality','Per delivery'],
  ['Maintain product liability cover of KES 50M','Finance','Annual'],
  ['Annual price review meeting','Procurement','Annual'],
  ['Cold-chain temperature logs','Operations','Monthly'],
  ['Food safety audit access','Quality','Annual'],
  ['Minimum offtake of 1,200 MT','Sales','Annual'],
  ['Notify recall within 24 hours','Quality','On event'],
  ['Data protection impact review','Legal','Annual'],
  ['Sustainability sourcing declaration','Procurement','Annual'],
  ['Monthly reconciliation statement','Finance','Monthly'],
];
function oblRows(c){
  const d=detail(c), out=[];
  for(let i=0;i<c.obl;i++){
    const p=OBL_POOL[(c.name.length+i*3)%OBL_POOL.length];
    const late = i<c.oblLate;
    const due  = late ? '2026-08-19' : ['2026-09-30','2026-10-15','2026-12-31','2027-01-31'][(i+c.round)%4];
    out.push({t:p[0], who:p[1], rec:p[2], due:due, late:late});
  }
  return out;
}
function changeRows(c){
  const base=[
    ['Clause 7.2 — Limitation of liability','Cap raised from 50% to 100% of annual charges','them','Open'],
    ['Clause 4.1 — Payment terms','45 days from invoice, was 30','you','Accepted'],

    ['Clause 3.4 — Volume commitment','Minimum offtake reduced by 10%','them','Refused'],
    ['Clause 15 — Assignment','Consent not to be unreasonably withheld','you','Accepted'],

  return base.slice(0, Math.max(2, Math.min(6, c.round+2))).map(function(r,i){
    return {id:'CHG-'+String(i+1).padStart(3,'0'), clause:r[0], what:r[1], by:r[2], st:r[3]};
  });

      '<div class="tbl-scroll"><table class="t">'+groups.map(function(g){
        return (g.head?'<thead><tr>'+g.head.map(function(h){ return '<th'+(h[1]?' class="num"':'')+'>'+esc(h[0])+'</th>'; }).join('')+'<th></th></tr></thead>':'')+

function donut(parts){
  const total=parts.reduce(function(s,p){ return s+p.v; },0); let acc=0;
  const seg=parts.map(function(p){
    const pct=p.v/total*100, off=25-acc; acc+=pct;
    return '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+p.c+'" stroke-width="7" '+
      'stroke-dasharray="'+pct.toFixed(2)+' '+(100-pct).toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/>';
  }).join('');
  return '<svg viewBox="0 0 42 42" width="132" height="132" aria-hidden="true">'+
    '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="7"/>'+seg+
    '<text x="21" y="20.5" text-anchor="middle" font-size="6" font-weight="700" fill="var(--ink)">'+total+'</text>'+
    '<text x="21" y="25.5" text-anchor="middle" font-size="3" fill="var(--label)">CONTRACTS</text></svg>';
}

      '<div class="card-b"><div style="height:7rem">'+sparkline([26,24,25,22,21,23,19,20,18,18],320,110)+'</div>'+

    '<section class="card"><div class="card-h"><h3>Largest Agreements</h3></div>'+

      tops.map(function(c){
        return '<tr data-cid="'+c.id+'"><td><span class="oid"><b>'+esc(c.name)+'</b><span>'+esc(c.cp)+'</span></span></td>'+

      '</tbody></table></div></section>'+

      [['high','s-neg','Deviates from the playbook'],['med','s-crit','Worth a look'],['low','s-pos','Within our standards']].map(function(r){
        const n=LIVE.filter(function(c){ return c.risk===r[0]; }).length;

/* ---- actions ---------------------------------------------------------- */
function doAct(act, node){
  if(act.indexOf('toast:')===0){ closePops(); closeDlg(); toast(act.slice(6)); return; }
  if(act.indexOf('app:')===0){ go(act.slice(4)); return; }
  if(act.indexOf('open:')===0){ closePops(); go('object',{cid:act.slice(5)}); return; }
  if(act.indexOf('st:')===0){ go('list',{filters:{status:act.slice(3)}, variant:'Standard'}); return; }
  if(act.indexOf('move:')===0){ go('nego'); return; }
  switch(act){
    case 'expiring':  go('list',{variant:'Expiring in 90 Days'}); break;
    case 'risk':      go('list',{variant:'High Risk'}); break;
    case 'create':    closeDlg(); createDlg(); break;
    case 'docreate':  closeDlg(); toast('Draft '+BOOK[4].id+' created. Fill in the key terms to continue.'); go('object',{cid:BOOK[4].id, tab:'terms'}); break;
    case 'closedlg':  closeDlg(); break;
    case 'about':     closePops(); aboutDlg(); break;
    case 'adapt':     adaptDlg(); break;
    case 'dlgfilter': readFilters($('#dlgs')); closeDlg(); doAct('go'); break;
    case 'go':        S.busy=true; S.grow=12; render();
                      setTimeout(function(){ S.busy=false; render(); }, 420); break;
    case 'clearall':  S.filters={stream:'',status:'',owner:'',cp:''}; S.variant='Standard'; S.q=''; $('#sb-search-in').value=''; render(); break;
    case 'more':      S.grow+=12; render(); break;
    case 'variants':  variantPop(node); break;
    case 'sort':      sortPop(node); break;
    case 'groupmenu': groupPop(node); break;
    case 'cols':      colsPop(node); break;
    case 'export':    toast('Export started. The spreadsheet will download when it is ready.'); break;
    case 'share':     toast('Share link copied. It expires in 30 days.'); break;
    case 'massshare': toast(Object.keys(S.sel).length+' contracts shared with the counterparty contact on record.'); S.sel={}; render(); break;
    case 'readall':   NOTI_READ=NOTIS.length; $('#noti-badge').hidden=true; closePops(); toast('All notifications marked as read.'); break;
    case 'edit':      S.edit=true; if(S.tab!=='general'&&S.tab!=='terms') S.tab='general'; render(); break;
    case 'canceledit':S.edit=false; render(); break;
    case 'save':      S.edit=false; render(); toast('Contract saved. Version 4 recorded in the history.'); break;
    case 'closestrip':S.strip=false; render(); break;
    case 'sendreview':toast('Sent to N. Wanjiru for internal review. Held changes will not travel until they hand back.'); break;
    case 'overflow':  popAt(node,'<div class="pop-b">'+
        '<button class="mitem" data-act="toast:Evidence pack generated.">'+ic('i-shield')+'Evidence Pack</button>'+
        '<button class="mitem" data-act="toast:Duplicated as a new draft.">'+ic('i-doc')+'Duplicate</button>'+
        '<button class="mitem" data-act="toast:Filed to the archive shelf. It stays findable in search.">'+ic('i-folder')+'Archive</button>'+
        '</div>'); break;
    case 'sign': {
      const c=byId(S.cid);
      dialog('Sign contract',
        '<div class="mstrip warn" style="margin-bottom:.75rem">'+ic('i-alert')+'<div>Once you sign, the wording freezes. '+
        'Later changes need an amendment.</div></div>'+
        '<div class="frow"><span class="k">Contract</span><span class="v"><b>'+esc(c.name)+'</b></span></div>'+
        '<div class="frow"><span class="k">Counterparty</span><span class="v">'+esc(c.cp)+'</span></div>'+
        '<div class="frow"><span class="k">Value</span><span class="v num">'+(c.val?money(c.val):'—')+'</span></div>'+
        '<div class="frow"><span class="k">Signing as</span><span class="v">Alice Otieno, Director · account with two-step</span></div>',
        '<button class="btn btn-tr" data-act="closedlg">Cancel</button>'+
        '<button class="btn btn-emph" data-act="toast:Signed. The seal is recorded and '+esc(c.cp)+' has been told.">Sign</button>');
      break; }
  }
}
function readFilters(root){
  $$('[data-f]',root).forEach(function(el){ S.filters[el.getAttribute('data-f')]=el.value; });
}

/* ---- one delegated click listener ------------------------------------- */
document.addEventListener('click', function(e){
  const cb=e.target.closest('[data-cb]');
  if(cb){ e.stopPropagation();
    const id=cb.getAttribute('data-cb');
    if(id==='*'){ const rows=sortRows(applyFilters(BOOK)).slice(0,S.grow);
      const all=rows.every(function(c){ return S.sel[c.id]; });
      S.sel={}; if(!all) rows.forEach(function(c){ S.sel[c.id]=1; });
    } else if(S.sel[id]) delete S.sel[id]; else S.sel[id]=1;
    render(); return; }

  const th=e.target.closest('[data-sort]');
  if(th){ const k=th.getAttribute('data-sort');
    if(S.sort.k===k) S.sort.d*=-1; else { S.sort.k=k; S.sort.d=1; }
    render(); return; }

  const pick=e.target.closest('[data-sortpick]');
  if(pick){ const k=pick.getAttribute('data-sortpick');
    if(S.sort.k===k) S.sort.d*=-1; else { S.sort.k=k; S.sort.d=1; }
    closePops(); render(); return; }

  const col=e.target.closest('[data-col]');
  if(col){ const k=col.getAttribute('data-col'); S.hide[k]=!S.hide[k]; colStyle(); colsPop($('[data-act="cols"]')); return; }

  const gr=e.target.closest('[data-group]');
  if(gr){ S.group=gr.getAttribute('data-group'); closePops(); render(); return; }

  const va=e.target.closest('[data-variant]');
  if(va){ S.variant=va.getAttribute('data-variant');
    if(S.variant==='My Contracts') S.filters.owner='A. Otieno';
    else if(S.filters.owner==='A. Otieno') S.filters.owner='';
    closePops(); render(); return; }

  const th2=e.target.closest('[data-theme]');
  if(th2){ S.theme=th2.getAttribute('data-theme');
    $('#app').setAttribute('data-sap', S.theme==='auto'?'auto':S.theme);
    closePops(); toast('Theme: '+({auto:'follow my device',light:'SAP Quartz Light',dark:'SAP Quartz Dark',horizon:'SAP Morning Horizon'})[S.theme]);
    return; }

  const cl=e.target.closest('[data-clear]');
  if(cl){ S.filters[cl.getAttribute('data-clear')]=''; render(); return; }

  const tab=e.target.closest('[data-tab]');
  if(tab){ S.tab=tab.getAttribute('data-tab'); S.strip=true; render();
    const n=$('.itb'); if(n) window.scrollTo(0, Math.max(0, n.offsetTop-44)); return; }

  const pg=e.target.closest('[data-page]');
  if(pg){ S.page=pg.getAttribute('data-page'); render(); return; }

  const tpl=e.target.closest('[data-tpl]');
  if(tpl){ $$('#dlgs tr').forEach(function(r){ r.classList.remove('sel'); }); tpl.classList.add('sel'); return; }

  const act=e.target.closest('[data-act]');
  if(act){ doAct(act.getAttribute('data-act'), act); return; }

  const row=e.target.closest('[data-cid]');
  if(row){ go('object',{cid:row.getAttribute('data-cid')}); return; }
}, false);

document.addEventListener('change', function(e){
  if(e.target.matches('[data-f]')) S.filters[e.target.getAttribute('data-f')]=e.target.value;
});

/* ---- shell ------------------------------------------------------------ */
$('#btn-home').addEventListener('click', function(){ S.page='home'; go('home'); });
$('#btn-back').addEventListener('click', function(){
  if(S.app==='object') go('list',{keep:true}); else go('home');
});
$('#sb-title').addEventListener('click', function(){ appsPop(this); });
$('#btn-apps').addEventListener('click', function(){ this.classList.add('on'); appsPop(this); });
$('#btn-noti').addEventListener('click', function(){ this.classList.add('on'); notiPop(this); });
$('#btn-me').addEventListener('click', function(){ this.classList.add('on'); mePop(this); });
$('#btn-search').addEventListener('click', function(){
  const box=$('#sb-search'); box.classList.toggle('on');
  if(box.classList.contains('on')) $('#sb-search-in').focus();
  else { S.q=''; $('#sb-search-in').value=''; if(S.app==='list') render(); }
});
$('#sb-search-in').addEventListener('input', function(){
  S.q=this.value;
  if(S.app!=='list'){ if(S.q) go('list',{keep:true}); else return; }
  S.grow=12; render(); $('#sb-search-in').focus();
});
$('#sb-search-in').addEventListener('keydown', function(e){ if(e.key==='Enter'){ S.grow=12; go('list',{keep:true}); this.focus(); } });

render();
