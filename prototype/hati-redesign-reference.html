<title>HaTi Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#EEF2F0; --surface-3:#E6ECEA;
  --line:#E2E7E5; --line-2:#CBD3D0;
  --ink:#141F1D; --ink-2:#5A6866; --ink-3:#6B7876; --ink-inv:#FFFFFF;
  --accent:#0E5F58; --accent-ink:#0B4A45; --accent-soft:#E1F0ED; --accent-line:#9CCFC6;
  --amber:#B0560A; --amber-soft:#FBEEDB; --amber-dot:#E8A317;
  --ruby:#B3261E; --ruby-soft:#FBE5E3;
  --good:#1E7D4E; --good-soft:#DFF2E7;
  --steel:#48639A; --steel-soft:#E6ECF6;
  --paper:#FFFDF9; --paper-line:#ECE6D8; --paper-ink:#1C1A16;
  --ins:#0B6B5F; --ins-bg:#DDF2ED; --del:#8F3A2E; --del-bg:#F8E4E0;
  --them:#8A5A0A; --them-bg:#FBEEDB;
  --shadow-1:0 1px 2px rgba(10,40,36,.06),0 1px 3px rgba(10,40,36,.04);
  --shadow-2:0 8px 24px rgba(10,40,36,.10),0 2px 6px rgba(10,40,36,.06);
  --shadow-3:0 24px 64px rgba(10,40,36,.18),0 4px 12px rgba(10,40,36,.08);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:4px; --r-lg:8px;
  --nav-w:224px; --bar-h:48px; --row-h:40px;
  --t-micro:11px; --t-label:12px; --t-body:13px; --t-md:14px; --t-title:16px; --t-h:20px; --t-figure:26px;
  --dur:140ms;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1312; --surface:#151B1A; --surface-2:#1B2221; --surface-3:#212A28;
  --line:#26302E; --line-2:#36423F;
  --ink:#E6ECEA; --ink-2:#A0ACA9; --ink-3:#8B9895; --ink-inv:#0E1312;
  --accent:#5EC2B3; --accent-ink:#8ADACF; --accent-soft:#12302C; --accent-line:#1F5A52;
  --amber:#EBAD46; --amber-soft:#3A2A0F; --amber-dot:#E8A317;
  --ruby:#F0857B; --ruby-soft:#3F1C19;
  --good:#5CC48E; --good-soft:#153224;
  --steel:#8FA8DE; --steel-soft:#1D2637;
  --paper:#1B1F1D; --paper-line:#2C3230; --paper-ink:#E8E6DF;
  --ins:#6FD0BF; --ins-bg:#143A34; --del:#F09A8E; --del-bg:#3E1F1B;
  --them:#EBAD46; --them-bg:#3A2A0F;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 24px rgba(0,0,0,.5); --shadow-3:0 24px 64px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1312; --surface:#151B1A; --surface-2:#1B2221; --surface-3:#212A28;
  --line:#26302E; --line-2:#36423F;
  --ink:#E6ECEA; --ink-2:#A0ACA9; --ink-3:#8B9895; --ink-inv:#0E1312;
  --accent:#5EC2B3; --accent-ink:#8ADACF; --accent-soft:#12302C; --accent-line:#1F5A52;
  --amber:#EBAD46; --amber-soft:#3A2A0F; --amber-dot:#E8A317;
  --ruby:#F0857B; --ruby-soft:#3F1C19;
  --good:#5CC48E; --good-soft:#153224;
  --steel:#8FA8DE; --steel-soft:#1D2637;
  --paper:#1B1F1D; --paper-line:#2C3230; --paper-ink:#E8E6DF;
  --ins:#6FD0BF; --ins-bg:#143A34; --del:#F09A8E; --del-bg:#3E1F1B;
  --them:#EBAD46; --them-bg:#3A2A0F;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 24px rgba(0,0,0,.5); --shadow-3:0 24px 64px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t-body)/1.5 var(--sans);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent-ink);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:0}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
#app{height:100%;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);grid-template-rows:100%;}
#app.portal{grid-template-columns:minmax(0,1fr)}
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.nav-brand{height:var(--bar-h);display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.nav-brand .mark{width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.02em}
.nav-brand b{font-size:var(--t-md);font-weight:600}
.nav-brand small{color:var(--ink-3);font-size:var(--t-label);margin-left:auto}
.nav-scroll{overflow:auto;padding:10px 8px 8px;flex:1}
.nav-group{font-size:var(--t-micro);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 4px;font-weight:600}
.nav-group:first-child{padding-top:2px}
.nav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r);color:var(--ink-2);font-size:var(--t-body);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink)}
.nav a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav a .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.nav a .cnt.hot{color:var(--amber);font-weight:600}
.nav-foot{border-top:1px solid var(--line);padding:10px}
.nav-user{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r)}
.nav-user:hover{background:var(--surface-2)}
.nav-user .who{line-height:1.25}
.nav-user .who b{display:block;font-size:var(--t-body);font-weight:600}
.nav-user .who span{font-size:var(--t-micro);color:var(--ink-3)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:inline-grid;place-items:center;font-size:10px;font-weight:700;flex:none;letter-spacing:.02em}
.avatar.sm{width:20px;height:20px;font-size:9px}
.avatar.cp{background:var(--amber-soft);color:var(--amber)}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{height:var(--bar-h);display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.crumb{display:flex;align-items:center;gap:6px;font-size:var(--t-body);color:var(--ink-2);min-width:0}
.crumb a{color:var(--ink-2)}
.crumb a:hover{color:var(--ink)}
.crumb .sep{color:var(--line-2)}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sp{flex:1}
.search{display:flex;align-items:center;gap:8px;height:30px;width:300px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);color:var(--ink-3);font-size:var(--t-body)}
.search:hover{border-color:var(--line-2)}
.search svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.search>span:not(.kbd){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border:1px solid var(--line-2);border-radius:3px;color:var(--ink-3);margin-left:auto;background:var(--surface)}
.ibtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r);color:var(--ink-2);position:relative}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ibtn .dotn{position:absolute;top:4px;right:4px;min-width:14px;height:14px;padding:0 4px;border-radius:7px;background:var(--amber);color:#fff;font:600 9px/14px var(--mono);text-align:center}
.ibtn.on{background:var(--accent-soft);color:var(--accent-ink)}
.content{flex:1;overflow:auto;min-height:0;position:relative}
.page{padding:20px 24px 40px;max-width:1440px}
.page.wide{max-width:none}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.page-head h1{font-size:var(--t-h);font-weight:600;line-height:1.3}
.page-head .sub{color:var(--ink-2);font-size:var(--t-body);margin-top:2px}
.page-head .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:var(--t-body);font-weight:500;white-space:nowrap;transition:background var(--dur),border-color var(--dur)}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:var(--ink-inv)}
:root[data-theme="light"] .btn.primary{color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-soft);border-color:transparent}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--ruby)}
.btn.sm{height:26px;padding:0 9px;font-size:var(--t-label)}
.btn.xs{height:22px;padding:0 7px;font-size:var(--t-micro);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .caret{width:12px;height:12px;opacity:.6}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px dashed var(--line-2);border-radius:13px;font-size:var(--t-label);color:var(--ink-2);background:var(--surface)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.chip .x{margin-left:2px;opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;height:30px}
.seg button{padding:0 12px;font-size:var(--t-body);color:var(--ink-2);border-right:1px solid var(--line-2);font-weight:500}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button.on,:root:not([data-theme="light"]) .seg button.on{color:var(--ink-inv)}
:root[data-theme="light"] .seg button.on{color:#fff}
.seg.sm{height:26px}.seg.sm button{padding:0 9px;font-size:var(--t-label)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:9px 12px;font-size:var(--t-body);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.tabs .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--surface-2);padding:0 5px;border-radius:3px;line-height:16px}
.tabs .n.hot{color:var(--amber);background:var(--amber-soft)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:var(--t-label);color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea,.inp{height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-size:var(--t-body);width:100%;color:var(--ink)}
.field textarea{height:auto;padding:8px 10px;resize:vertical;min-height:72px}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field .hint{font-size:var(--t-micro);color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-label);font-weight:500;color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.review::before,.pill.amber::before{background:var(--amber-dot)}
.pill.review,.pill.amber{color:var(--amber)}
.pill.sig::before,.pill.steel::before{background:var(--steel)}
.pill.sig,.pill.steel{color:var(--steel)}
.pill.exec::before,.pill.good::before{background:var(--good)}
.pill.exec,.pill.good{color:var(--good)}
.pill.hold::before,.pill.ruby::before{background:var(--ruby)}
.pill.hold,.pill.ruby{color:var(--ruby)}
.pill.draft::before{background:var(--ink-3)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:3px;font-size:var(--t-micro);font-weight:600;letter-spacing:.02em;background:var(--surface-2);color:var(--ink-2)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.ruby{background:var(--ruby-soft);color:var(--ruby)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.steel{background:var(--steel-soft);color:var(--steel)}
.tag.accent{background:var(--accent-soft);color:var(--accent-ink)}
.stream{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-label);color:var(--ink-2)}
.stream i{width:3px;height:12px;border-radius:2px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:var(--t-md);font-weight:600}
.card-h .sub{font-size:var(--t-label);color:var(--ink-3)}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px 16px}
.sec-label{font-size:var(--t-micro);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.hr{height:1px;background:var(--line);margin:12px 0}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.ok{color:var(--good)}.warn{color:var(--amber)}.bad{color:var(--ruby)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}

/* ---------- table ---------- */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tbl-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1120px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:var(--t-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 12px;height:34px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:0 12px;height:var(--row-h);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;font-size:var(--t-body)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr.sel td{background:var(--accent-soft)}
.tbl td .t{font-weight:500;color:var(--ink)}
.tbl td .s{font-size:var(--t-label);color:var(--ink-3)}
.tbl .acts{opacity:0;display:flex;gap:2px;justify-content:flex-end}
.tbl tr:hover .acts{opacity:1}
.tbl-foot{display:flex;align-items:center;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:var(--t-label);color:var(--ink-2)}
.tbl-foot .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.dense{--row-h:32px}
.comfy{--row-h:46px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line-2);border-radius:var(--r-lg);padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:104px;transition:border-color var(--dur)}
button.kpi:hover{border-color:var(--ink-3)}
.kpi .l{font-size:var(--t-label);color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--mono);font-size:var(--t-figure);font-weight:600;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .v small{font:500 var(--t-label) var(--sans);color:var(--ink-2);margin-left:6px}
.kpi .d{font-size:var(--t-label);color:var(--ink-3);margin-top:auto}
.kpi.hot .v{color:var(--amber)}
.kpi.zero{opacity:.7}
.spark{height:22px;width:100%;margin-top:4px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:500;font-size:var(--t-body)}
.li .s{font-size:var(--t-label);color:var(--ink-2);margin-top:1px}
.li .verbs{display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.amber{background:var(--amber-dot)}.dot.ruby{background:var(--ruby)}.dot.good{background:var(--good)}.dot.steel{background:var(--steel)}.dot.accent{background:var(--accent)}
.empty{padding:36px 24px;text-align:center;color:var(--ink-2)}
.empty .ic{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:inline-grid;place-items:center;margin-bottom:10px;color:var(--ink-3)}
.empty .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.empty h3{font-size:var(--t-md);color:var(--ink);margin-bottom:4px}
.empty p{font-size:var(--t-body);max-width:44ch;margin:0 auto 12px}
.empty .verbs{display:flex;gap:8px;justify-content:center}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:800px){.doors{grid-template-columns:1fr}}
.door{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color var(--dur)}
.door:hover{border-color:var(--accent-line)}
.door .ic{width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
.door .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.door b{font-size:var(--t-md);font-weight:600}
.door span{font-size:var(--t-label);color:var(--ink-2)}
.door .go{margin-top:auto;font-size:var(--t-label);color:var(--accent-ink);font-weight:600}

/* ---------- contract room ---------- */
.room-head{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px 0}
.room-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.room-top h1{font-size:18px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:10px;min-width:0}
.room-top .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.room-sub{font-size:var(--t-label);color:var(--ink-2);margin-top:2px}
.facts{display:flex;gap:0;margin-top:12px;flex-wrap:wrap}
.fact{padding:0 20px 0 0;margin-right:20px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact .l{font-size:var(--t-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.fact .v{font-size:var(--t-md);font-weight:600;margin-top:1px;display:flex;gap:6px;align-items:center}
.fact .v.mono{font-size:13px;font-weight:600}
.room-tabs{display:flex;gap:2px;margin-top:10px}
.room-tabs button{padding:8px 12px;font-size:var(--t-body);color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;display:flex;gap:6px;align-items:center}
.room-tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.room-tabs .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.room-tabs .n.hot{color:var(--amber);font-weight:600}
.room-body{padding:16px 24px 40px}
.doc-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1100px){.doc-grid{grid-template-columns:1fr}}
.paper{background:var(--paper);border:1px solid var(--paper-line);color:var(--paper-ink);padding:44px 56px;max-width:820px;font-size:14px;line-height:1.7;font-family:var(--sans);box-shadow:var(--shadow-1)}
.paper.serif{font-family:Georgia,'Times New Roman',serif;font-size:15px}
.paper .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.paper h2{text-align:center;font-size:20px;font-weight:700;margin:6px 0 4px;text-wrap:balance}
.paper .parties{text-align:center;color:var(--ink-2);margin-bottom:20px;font-size:13px}
.paper .cl{margin:0 0 18px;position:relative;padding-left:0}
.paper .cl h4{font-size:14px;font-weight:700;margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
.paper .cl h4 .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-weight:500}
.paper .cl p{margin:0 0 6px}
.paper .cl.changed::before{content:"";position:absolute;left:-18px;top:0;bottom:0;width:3px;background:var(--ruby);border-radius:2px}
.paper .cl .pencil{position:absolute;right:0;top:0;opacity:0;transition:opacity var(--dur)}
.paper .cl:hover .pencil{opacity:1}
.paper .fld{background:var(--accent-soft);color:var(--accent-ink);padding:0 4px;border-radius:2px;font-weight:600;border-bottom:1px dashed var(--accent-line)}
.paper .fld.empty{background:var(--amber-soft);color:var(--amber);border-bottom-color:var(--amber);min-width:36px;display:inline-block;text-align:center}
.paper .fld.lit{outline:2px solid var(--accent);outline-offset:1px}
.paper ins{text-decoration:underline;text-decoration-thickness:1.5px;background:var(--ins-bg);color:var(--ins)}
.paper del{background:var(--del-bg);color:var(--del)}
.paper ins.them{background:var(--them-bg);color:var(--them)}
.paper del.them{background:transparent;color:var(--them)}
.paper .duty{background:var(--amber-soft);border-bottom:1.5px solid var(--amber-dot)}
.paper .sigs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px;padding-top:20px;border-top:1px solid var(--paper-line)}
.paper .sigs .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.paper .sigs .line{border-bottom:1px solid var(--paper-ink);height:32px;margin:8px 0 4px}
.paper .spot{border:1px dashed var(--accent-line);background:var(--accent-soft);color:var(--accent-ink);padding:6px 10px;font-size:12px;border-radius:var(--r);display:inline-block;margin-top:8px}
.paper .chip-l{display:inline-flex;gap:4px;align-items:center;white-space:nowrap;font:500 11px var(--sans);color:var(--ink-3);border:1px solid var(--line-2);border-radius:10px;padding:0 6px;height:18px;margin-left:8px;background:var(--surface)}
.doc-tools{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.doc-tools .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.rail{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
.check-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.check-row:last-child{border-bottom:0}
.check-row .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.check-row .ic.warn{background:var(--amber-soft);color:var(--amber)}
.check-row .ic.ok{background:var(--good-soft);color:var(--good)}
.check-row .ic.na{background:var(--surface-2);color:var(--ink-3)}
.check-row .ic.ruby{background:var(--ruby-soft);color:var(--ruby)}
.check-row .t{font-weight:500}
.check-row .s{font-size:var(--t-label);color:var(--ink-2)}
.check-row .verbs{display:flex;gap:6px;align-items:center}
.plain{background:var(--surface);border:1px solid var(--line);padding:12px 14px;border-radius:var(--r);font-size:13px;color:var(--ink-2)}
.plain b{color:var(--ink)}
.stage-l{font-size:var(--t-micro);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 0 4px}
.deal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px}
@media (max-width:900px){.deal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.deal .f .l{font-size:var(--t-micro);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.deal .f .v{font-size:var(--t-body);font-weight:600;margin-top:2px}
.deal .f .v.none{color:var(--ink-3);font-weight:400}
.deal .f .v.mono{font-weight:600}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.sec-h{display:flex;align-items:center;gap:10px;padding:11px 16px;width:100%;text-align:left}
.sec-h h3{font-size:var(--t-md);font-weight:600}
.sec-h .sum{font-size:var(--t-label);color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-h .chev{margin-left:auto;color:var(--ink-3);transition:transform var(--dur)}
.sec-h .chev svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.sec.open .sec-h .chev{transform:rotate(90deg)}
.sec-b{display:none;padding:4px 16px 16px;border-top:1px solid var(--line)}
.sec.open .sec-b{display:block;padding-top:14px}
.tri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:900px){.tri{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tri button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px}
.tri button:hover{border-color:var(--ink-3)}
.tri .h{display:flex;align-items:center;gap:6px;font-size:var(--t-label);font-weight:600}
.tri .h .st{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700}
.tri .h .st.ok{background:var(--good-soft);color:var(--good)}
.tri .h .st.steel{background:var(--steel-soft);color:var(--steel)}
.tri .h .st.amber{background:var(--amber-soft);color:var(--amber)}
.tri .b{font-size:var(--t-label);color:var(--ink-2);height:calc(1.4em*2);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tri .go{font-size:var(--t-micro);color:var(--accent-ink);font-weight:600}
.trail{position:relative;padding-left:0}
.ev{display:grid;grid-template-columns:76px 20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .when{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-top:2px}
.ev .dot{margin-top:6px}
.ev .t{font-weight:500}
.ev .s{font-size:var(--t-label);color:var(--ink-2)}
.ev .rnd{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.band-h{display:flex;align-items:center;gap:8px;padding:14px 0 6px;font-size:var(--t-label);font-weight:600;color:var(--ink-2)}
.band-h .n{font-family:var(--mono);color:var(--ink-3);font-weight:500}
.band-h .r{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:500}
.obl{display:grid;grid-template-columns:auto minmax(0,1fr) 110px 120px auto;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.obl:last-child{border-bottom:0}
.obl .t{font-weight:500}
.obl .s{font-size:var(--t-label);color:var(--ink-2)}
.obl .who{font-size:var(--t-label);color:var(--ink-2);display:flex;gap:6px;align-items:center}
.obl.done .t{color:var(--ink-3);text-decoration:line-through}
.chk{width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:3px;display:inline-grid;place-items:center;background:var(--surface);flex:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chk svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5}

/* ---------- negotiation ---------- */
.nego-ctl{display:flex;align-items:center;gap:8px;padding:8px 24px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.nego-ctl .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.rtabs{display:flex;gap:2px}
.rtabs button{padding:6px 10px;font-size:var(--t-body);color:var(--ink-2);border-radius:var(--r);font-weight:500}
.rtabs button.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.nego-grid{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:0;min-height:0}
@media (max-width:1100px){.nego-grid{grid-template-columns:1fr}}
.nego-paper{padding:20px 24px 40px;background:var(--bg)}
.nego-paper .paper{margin:0 auto;padding-left:64px}
.nego-col{border-left:1px solid var(--line);background:var(--surface);min-height:100%;display:flex;flex-direction:column}
.nego-col-h{padding:12px 16px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:8px}
.nego-col-h h3{font-size:var(--t-md);font-weight:600}
.nego-col-h .n{font-family:var(--mono);color:var(--ink-3);font-size:12px}
.nego-col-h .r{margin-left:auto;display:flex;gap:6px}
.pile{padding:0}
.pile-h{display:flex;align-items:center;padding:12px 16px 4px;font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.pile-h.hot{color:var(--amber)}
.pile-h .n{margin-left:auto;font-family:var(--mono);letter-spacing:0;text-transform:none}
.rl{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.rl:hover{background:var(--surface-2)}
.rl.sel{background:var(--accent-soft)}
.rl .t{font-weight:600;font-size:var(--t-body);display:flex;gap:8px;align-items:center}
.rl .t .ref{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:500;margin-left:auto}
.rl .a{font-size:var(--t-label);color:var(--ink-2)}
.rl .a b{color:var(--ink);font-weight:600}
.rl .verbs{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.verb{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;border-radius:var(--r);font-size:var(--t-label);font-weight:600;color:var(--accent-ink)}
.verb:hover{background:var(--accent-soft)}
.verb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.verb.ruby{color:var(--ruby)}.verb.ruby:hover{background:var(--ruby-soft)}
.verb.quiet{color:var(--ink-2)}.verb.quiet:hover{background:var(--surface-2)}
.verb.ai{color:#6D4BB5}
:root[data-theme="dark"] .verb.ai,:root:not([data-theme="light"]) .verb.ai{color:#B39CF0}
.rl.quiet .t,.rl.quiet .a{color:var(--ink-3)}
.ladder-chip{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--sans);color:var(--ink-2);border:1px solid var(--line-2);border-radius:10px;padding:0 7px;height:18px;background:var(--surface)}
.ladder-chip.reading{border-color:var(--ruby);color:var(--ruby)}
.cp-panel{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;z-index:2}
.cp-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cp-h h3{font-size:var(--t-md)}
.cp-sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.cp-sec h4{font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.cp-src{font-size:13px;line-height:1.6;color:var(--ink)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ladder li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:var(--t-label);padding:6px 8px;border:1px solid var(--line);border-radius:var(--r)}
.ladder li .rn{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:600}
.ladder li.win{border-color:var(--accent-line);background:var(--accent-soft)}
.ladder li .who{color:var(--ink-2)}
.ladder li .fig{font-family:var(--mono);font-size:11px;font-weight:600}
.scale{position:relative;height:28px;margin:10px 4px 4px}
.scale .line{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line-2)}
.scale .pt{position:absolute;top:6px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3);transform:translateX(-50%)}
.scale .pt.std{border-color:var(--accent)}.scale .pt.fb{border-color:var(--accent);background:var(--accent)}.scale .pt.them{border-color:var(--amber-dot);background:var(--amber-dot)}
.scale .lab{position:absolute;top:24px;font-size:10px;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap;font-family:var(--mono)}

/* ---------- portal ---------- */
.portal-bar{height:52px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:14px;padding:0 24px}
.portal-bar .from{font-size:var(--t-body);color:var(--ink-2)}
.portal-bar .from b{color:var(--ink)}
.portal-wrap{padding:20px 24px 60px;max-width:1240px;margin:0 auto}
.p-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px}
.p-head .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.p-head h1{font-size:18px;font-weight:600}
.p-head .row2{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.wall{font-size:var(--t-label);color:var(--ink-2);display:flex;gap:8px;align-items:center}
.wall::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.p-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1000px){.p-grid{grid-template-columns:1fr}}
.decide{display:flex;gap:6px;margin-top:6px}

/* ---------- panels, modals ---------- */
.side{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-3);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 180ms ease}
.side.open{transform:none}
.side-h{height:var(--bar-h);display:flex;align-items:center;gap:8px;padding:0 14px 0 16px;border-bottom:1px solid var(--line);flex:none}
.side-h h3{font-size:var(--t-md);font-weight:600}
.side-h .r{margin-left:auto;display:flex;gap:4px}
.side-b{overflow:auto;flex:1;padding:14px 16px}
.side-f{border-top:1px solid var(--line);padding:12px 16px;flex:none}
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.35);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.scrim.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-3);width:100%;max-width:520px;max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden}
.modal.l{max-width:640px}.modal.xl{max-width:960px}.modal.s{max-width:400px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:var(--t-title);font-weight:600}
.modal-h .sub{font-size:var(--t-label);color:var(--ink-2)}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.modal-f .r{margin-left:auto;display:flex;gap:8px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:var(--t-body);font-weight:600}
.opt span{font-size:var(--t-micro);color:var(--ink-2)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on b{color:var(--accent-ink)}
.cmd{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-3);width:100%;max-width:600px;align-self:flex-start;margin-top:8vh;overflow:hidden}
.cmd input{width:100%;height:48px;border:0;padding:0 18px;font-size:var(--t-md);background:transparent;border-bottom:1px solid var(--line);outline:none}
.cmd .grp{font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 18px 4px;font-weight:600}
.cmd .it{display:flex;align-items:center;gap:10px;padding:7px 18px;font-size:var(--t-body);width:100%;text-align:left}
.cmd .it:hover,.cmd .it.on{background:var(--surface-2)}
.cmd .it .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.cmd .it svg{width:14px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:1.8}
.toasts{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:var(--ink-inv);padding:8px 14px;border-radius:6px;font-size:var(--t-body);box-shadow:var(--shadow-2);display:flex;gap:10px;align-items:center;animation:up 160ms ease}
.toast.warn{background:var(--amber)}
.toast b{font-weight:600}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ai-msg{display:flex;gap:10px;margin-bottom:14px}
.ai-msg .b{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55;flex:1}
.ai-msg.me .b{background:var(--accent-soft);color:var(--accent-ink)}
.ai-src svg,.chip-l svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.ai-src{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-micro);color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:0 5px;height:18px;margin:6px 4px 0 0}
.demo{position:fixed;left:12px;bottom:100px;width:200px;z-index:45;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;box-shadow:var(--shadow-2);font-size:var(--t-label);color:var(--ink-2)}
.demo select{border:0;background:var(--surface-2);border-radius:14px;height:24px;padding:0 8px;font-size:var(--t-label);color:var(--ink)}
.demo b{font-weight:600;color:var(--ink)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--steel);padding:10px 14px;border-radius:var(--r);font-size:var(--t-body);color:var(--ink-2);display:flex;gap:10px;align-items:center}
.notice b{color:var(--ink)}
.person-row{display:grid;grid-template-columns:32px minmax(0,1.4fr) 100px minmax(0,1fr) 120px 110px 24px;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.person-row:last-child{border-bottom:0}
.person-row:hover{background:var(--surface-2)}
.person-row .t{font-weight:500}.person-row .s{font-size:var(--t-label);color:var(--ink-2)}

function calHorizon(){
  const d=data().filter(c=>c.expiry&&!['expired','draft'].includes(c.status)).sort((a,b)=>a.expiry.localeCompare(b.expiry));
  if(!d.length) return `<div class="card"><div class="empty"><h3>No expiries to draw</h3><p>The horizon draws one bar per live agreement with an end date. Nothing here yet.</p></div></div>`;
  const months=[]; for(let i=0;i<12;i++){ const m=new Date(2026,8+i,1); months.push(m.toLocaleDateString('en-GB',{month:'short'})+(m.getMonth()===0?" '"+String(m.getFullYear()).slice(2):'')); }
  const span=365;
  const ladder=[['Ends in 30 days',d.filter(c=>daysTo(c.expiry)<=30).length,'ruby'],['31–90 days',d.filter(c=>daysTo(c.expiry)>30&&daysTo(c.expiry)<=90).length,'amber'],['91–180 days',d.filter(c=>daysTo(c.expiry)>90&&daysTo(c.expiry)<=180).length,''],['181–365 days',d.filter(c=>daysTo(c.expiry)>180&&daysTo(c.expiry)<=365).length,''],['Beyond a year',d.filter(c=>daysTo(c.expiry)>365).length,'good']];
  const rows=d.map(c=>{ const days=daysTo(c.expiry), w=Math.min(100,Math.max(1.5,days/span*100)), over=days>span; const tone=days<=30?'var(--ruby)':days<=90?'var(--amber-dot)':days>365?'var(--good)':'var(--accent)'; const decide=c.id==='MK-2029'?'Decision open · notice by 1 Oct':c.id==='MK-2017'?'Renegotiate · decided 2 Sep':c.id==='MK-2008'?'Let it end · decided':''; return `<button class="li" data-go="contract/${c.id}" style="grid-template-columns:260px minmax(0,1fr) 150px;padding:9px 16px"><span><div class="t ell">${esc(c.name)}</div><div class="s ell">${esc(c.cp)} · <span class="mono">${c.id}</span> · ${c.value?KES(c.value):'—'}</div></span><span style="position:relative;height:30px"><span style="position:absolute;inset:0;background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100%/12));"></span><span style="position:absolute;left:0;top:6px;height:8px;width:${w}%;background:${tone};border-radius:${over?'4px 0 0 4px':'4px'}" title="${days} days left"></span>${over?`<span style="position:absolute;left:calc(100% - 6px);top:4px;font-size:11px;color:var(--good)">›</span>`:''}<span class="mono" style="position:absolute;left:${Math.min(w,88)}%;top:16px;font-size:10px;color:var(--ink-3);white-space:nowrap">${fmtD(c.expiry)} · ${days} d</span></span><span class="s" style="text-align:right;${decide.startsWith('Decision')?'color:var(--amber);font-weight:600':''}">${decide||'<span class="faint">No decision yet</span>'}</span></button>`; }).join('');

function cmdHtml(){
  return `<div class="cmd" role="dialog" aria-label="Search"><input id="cmd-in" placeholder="Search contracts, clauses, people — or type a command…" autocomplete="off"><div id="cmd-list">${cmdList('')}</div></div>`;

function cmdList(q){
  q=q.toLowerCase();
  const cs = data().filter(c=>!q||(c.id+c.name+c.cp).toLowerCase().includes(q)).slice(0,5);
  const cmds=[['New agreement','draft','plus','N'],['Upload a contract','upload','upload','U'],['Open Copilot','copilot','spark','⌘J'],['Go to Approvals','go:approvals','check','G A'],['Go to Templates','go:templates','tpl','G T'],['Toggle dark theme','theme','eye','']].filter(x=>!q||x[0].toLowerCase().includes(q));
  return `${cs.length?`<div class="grp">Contracts</div>${cs.map(c=>`<button class="it" data-go="contract/${c.id}">${ic('doc')}<span class="mono faint">${c.id}</span><span>${esc(c.name)}</span><span class="faint">· ${esc(c.cp)}</span><span class="k">↵</span></button>`).join('')}`:''}
  ${q&&q.length>2?`<div class="grp">In the wording</div><button class="it" data-go="contract/MK-2041/document">${ic('search')}<span>“${esc(q)}” in 3 contracts</span><span class="k">↵</span></button><button class="it" data-side="copilot">${ic('spark')}<span>Ask Copilot about “${esc(q)}”</span><span class="k">↵</span></button>`:''}
  ${cmds.length?`<div class="grp">Commands</div>${cmds.map(x=>`<button class="it" data-cmd="${x[1]}">${ic(x[2])}<span>${x[0]}</span><span class="k">${x[3]}</span></button>`).join('')}`:''}`;
}

function render(){
  const r = route();
  const app = document.getElementById('app');
  app.className = r.p==='portal' ? 'portal' : '';
  let html='';
  if (r.p==='portal') html = pagePortal();
  else if (r.p==='contract') { const c=byId(r.a); if (r.b) S.room.tab=r.b; html = shell('contracts',[['Contracts','contracts'],[c.id+' · '+c.name,'']],pageContract(c)); }
  else if (r.p==='negotiate') { const c=byId(r.a); html = shell('negotiations',[['Negotiations','negotiations'],[c.id+' · '+c.name,'']],pageNegotiate(c)); }
  else if (r.p==='edit') { const c=byId(r.a); S.edit.cl = r.b||'3'; html = shell('negotiations',[['Negotiations','negotiations'],[c.id,'negotiate/'+c.id],['Edit clause '+S.edit.cl,'']],pageEditor(c)); }
  else {
    const map = {home:['Home',pageHome],contracts:['Contracts',pageContracts],negotiations:['Negotiations',pageNegotiations],approvals:['Approvals & signing',pageApprovals],obligations:['Obligations',pageObligations],calendar:['Calendar',pageCalendar],templates:['Templates',pageTemplates],standards:['Our standards',pageStandards],requests:['Requests',pageRequests],people:['People',pagePeople],insights:['Insights',pageInsights],reports:['Reports',pageReports],advice:['Advice desk',pageAdvice],import:['Import contracts',pageImport],settings:['Team & settings',pageSettings]};
    const m = map[r.p] || map.home;
    if (r.p==='contracts' && r.a==='expiring') S.reg.view='expiring';
    if (r.p==='settings' && r.a) S.set.tab = r.a;
    if (r.p==='insights' && r.a) S.intel.tab = r.a;
    html = shell(r.p in map ? r.p : 'home',[[m[0],'']],m[1]());
  }
  app.innerHTML = html;
  document.getElementById('side').className = 'side' + (S.side?' open':'');
  document.getElementById('side').innerHTML = S.side ? sideHtml(S.side) : '';
  demoHtml();
  const inp = document.getElementById('reg-q'); if (inp && document.activeElement!==inp && S.reg.qFocus) { inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
  const tq = document.getElementById('tpl-q'); if (tq && S.tpl.qFocus) { tq.focus(); tq.setSelectionRange(tq.value.length,tq.value.length); }
  const sq = document.getElementById('set-q'); if (sq && S.set.qFocus) { sq.focus(); sq.setSelectionRange(sq.value.length,sq.value.length); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-open],[data-side],[data-modal],[data-tab],[data-sec],[data-chip],[data-view],[data-mode],[data-density],[data-act],[data-plain],[data-duty],[data-read],[data-board],[data-seat],[data-panel],[data-decide],[data-undo],[data-edit],[data-pread],[data-pdecide],[data-pundo],[data-ttab],[data-bucket],[data-atab],[data-appr],[data-stab],[data-person],[data-switch],[data-obl],[data-cmd],[data-tplsec],[data-pick]');

  if ('sec' in d) { S.room.secs[d.sec]=!S.room.secs[d.sec]; render(); return; }
  if ('tplsec' in d) { t.closest('.sec').classList.toggle('open'); if(!t.closest('.sec').querySelector('.sec-b')) t.closest('.sec').insertAdjacentHTML('beforeend',`<div class="sec-b"><div class="cards4" style="grid-template-columns:repeat(6,minmax(0,1fr))">${Object.entries(STREAMS).map(([k,[l,col]])=>`<button class="tcard" style="border-top-color:${col}" data-bucket="${k}"><span class="h">${l}<span class="n">${TEMPLATES.filter(t=>t[4]===k).length}</span></span><span class="m"><span>Used<b>${[4,2,3,5,1,7][Object.keys(STREAMS).indexOf(k)]}</b></span><span>Deviation<b>${k==='sales'?'50%':k==='proc'?'20%':'—'}</b></span></span></button>`).join('')}</div></div>`); return; }
  if ('chip' in d) { const k=d.chip; if (k==='more') { toast('Also: Counterparty, Signed year, Payment terms, Documents held, On hold'); return; } const cur=S.reg[k]; if (cur) { S.reg[k]=null; } else { const opts = k==='stage'?Object.keys(STATUS):k==='stream'?Object.keys(STREAMS):PEOPLE.map(p=>p.id); const pick = prompt(`Filter by ${k} — one of: ${opts.join(', ')}`, k==='stage'?'review':k==='stream'?'proc':'dk'); if (pick && opts.includes(pick)) S.reg[k]=pick; } render(); return; }
  if ('view' in d) { S.reg.view=d.view; render(); return; }
  if ('mode' in d) { S.reg.mode=d.mode; render(); return; }
  if ('density' in d) { S.density=d.density; save(); render(); return; }
  if ('plain' in d) { S.room.plain=d.plain==='1'; render(); return; }
  if ('duty' in d) { S.room.duty=!S.room.duty; render(); return; }
  if ('read' in d) { S.nego.read=d.read; S.nego.board=false; render(); return; }
  if ('board' in d) { S.nego.board=!S.nego.board; render(); return; }
  if ('seat' in d) { S.nego.seat=d.seat; render(); return; }
  if ('panel' in d) { S.nego.panel=d.panel||null; render(); return; }
  if ('decide' in d) { const [id,v]=d.decide.split(':'); S.nego.decided[id]=v; render(); toast(v==='accept'?`<b>${id}</b> accepted — the clause now reads with their wording.`:`<b>${id}</b> refused — back to agreed wording. Send tells Nandi.`); return; }
  if ('undo' in d) { delete S.nego.decided[d.undo]; render(); return; }
  if ('edit' in d) { openModal(''); S.side=null; S.edit={cl:d.edit,text:null,applied:false,tab:'chat',dirty:false}; go('edit/'+(route().a||'MK-2041')+'/'+d.edit); return; }
  if ('pread' in d) { S.portal.read=d.pread; render(); return; }
  if ('pdecide' in d) { const [id,v]=d.pdecide.split(':'); S.portal.decided[id]=v; render(); return; }
  if ('pundo' in d) { delete S.portal.decided[d.pundo]; render(); return; }
  if ('ttab' in d) { S.tpl.tab=d.ttab; render(); return; }
  if ('bucket' in d) { S.tpl.bucket=d.bucket; S.tpl.tab='list'; render(); return; }
  if ('atab' in d) { S.appr.tab=d.atab; render(); return; }
  if ('appr' in d) { const [id,v]=d.appr.split(':'); S.appr.done[id]=v; render(); toast(v==='ok'?`<b>Approved.</b> ${id} moves to signing — the requester is told.`:`<b>Rejected.</b> ${id} goes back to its owner with your reason.`); return; }
  if ('stab' in d) { S.set.tab=d.stab; render(); document.getElementById('content').scrollTop=0; return; }
  if ('person' in d) { S.set.drawer=d.person; S.side='person'; render(); return; }

  if ('pick' in d) { toast(`<b>${d.pick}</b> chosen — the questions on the right are its own.`); return; }
  if ('cmd' in d) { openModal(''); const c=d.cmd; if (c==='draft'||c==='upload') openModal(c); else if (c==='copilot') { S.side='copilot'; render(); } else if (c.startsWith('go:')) go(c.slice(3)); else if (c==='theme') { const r=document.documentElement; r.dataset.theme = r.dataset.theme==='dark'?'light':'dark'; render(); } return; }
  if ('act' in d) { const a=d.act;

  if (e.key==='Enter' && e.target.id==='cmd-in') { const f=document.querySelector('#cmd-list .it'); f && f.click(); }
});

function vbars(cols, fmt, opts={}){ /* cols: [label, value, tone, sub] */

  if (t==='learned') body=`<div class="grid2" style="grid-template-columns:1fr 1fr">${panel('What the last quarter taught us','signed outcomes, last 92 days · proposals need 3 repeats',`<div class="list">${[['Payment terms','Fallback 45 → keep. Settled at 45 in 4 of 5 supply deals; 60 was refused twice.','Adopt as fallback','ok'],['Termination for convenience','Position 90 days departed on 2 of 9. Not enough to propose a move.','Watch',''],['Liability cap','Nandi and Naivas both asked for 24 months. Two is not a pattern yet.','Watch','']].map(([a,b,v,t])=>`<div class="li" style="padding:10px 0"><span class="dot ${t==='ok'?'good':''}"></span><span><div class="t">${a}</div><div class="s">${b}</div></span><span class="verbs"><button class="btn xs ${t?'':'quiet'}" data-stdact="adopt">${v}</button></span></div>`).join('')}</div>`)}${panel('A first playbook, read off what you signed','where nothing is set yet, the book proposes',`<div class="list">${[['Rejection window','You usually sign 3 days · 6 of 8 · matches the position'],['Notice period','You usually sign 90 days · 7 of 9 · matches the position'],['Governing law','Kenya on 12 of 14 · Sweden on 2 · the market setting is the door, nothing proposed']].map(([a,b])=>`<div class="li" style="padding:10px 0"><span class="dot good"></span><span><div class="t">${a}</div><div class="s">${b}</div></span><span></span></div>`).join('')}</div>`)}</div>`;

    <div class="tabs"><button class="${t==='positions'?'on':''}" data-stdtab="positions">Positions<span class="n">12</span></button><button class="${t==='library'?'on':''}" data-stdtab="library">Clause library<span class="n">28</span></button><button class="${t==='learned'?'on':''}" data-stdtab="learned">What the book taught us<span class="n hot">2</span></button></div>${body}</div>`;
}

/* =========================== EDIT WITH COPILOT =========================== */
function pageEditor(c){
  const E=S.edit, n=E.cl, cl=CLAUSES.find(x=>x.n===n)||CLAUSES[2];
  const clauseBody = x => {
    if (x.n!==n) return x.p.map(p=>`<p>${p.replace(/<span class="duty">(.*?)<\/span>/g,'$1')}</p>`).join('');
    if (n==='3') { const first = E.applied ? `The Buyer shall pay each undisputed invoice within <del class="them">forty-five (45)</del><del class="them">sixty (60)</del><ins>forty-five (45)</ins> days of receipt<ins>, the Supplier's invoice to be accompanied by the delivery note</ins>. Interest on late payment accrues at CBK base rate plus 2% per annum.` : x.p[0].replace(/<span class="duty">(.*?)<\/span>/g,'$1'); return `<div contenteditable="true" spellcheck="false" id="ce-box"><p>${first}</p><p>${x.p[1].replace(/<span class="duty">(.*?)<\/span>/g,'$1')}</p></div>`; }
    return `<div contenteditable="true" spellcheck="false" id="ce-box">${x.p.map(p=>`<p>${p.replace(/<span class="duty">(.*?)<\/span>/g,'$1')}</p>`).join('')}</div>`;
  };
  const paper = `<article class="paper"><div class="kick">Kenya · Raw material supply</div><h2>${esc(c.name)}</h2><div class="parties">Between Highland Corporate Ltd and ${esc(c.cp)}</div>
    ${CLAUSES.map(x=>`<div class="cl ${x.n===n?'typing':''} ${x.changed||(x.n===n&&E.applied)?'changed':''}" data-cl="${x.n}"><h4><span class="n">${x.n}.</span>${x.h}${x.n==='3'?`<span class="chip-l">${ic('ladder')} R2 · their ask</span>`:x.n==='6'?'<span class="chip-l">R2 · yours · not sent</span>':''}</h4>${x.n===n?`<button class="done" data-eact="done">${ic('pen')} ${E.applied||E.dirty?'Done — file it':'Done'}</button>`:`<button class="verb pencil" data-eact="go:${x.n}">${ic('pen')}</button>`}${clauseBody(x)}</div>`).join('')}</article>`;
  const railTabs=[['chat','Suggestions'],['ladder','Ladder'],['figure','Figure'],['scan','Playbook scan']];
  let rail='';
  if (E.tab==='chat') rail = `<div class="ce-card"><h5>What moved</h5><p>Nandi asks for <b>60 days</b> on clause 3, written on your R1 ask of 45. Your R1 stands on the drafted 30.</p><h5>On your ladder</h5><p>Standard 30 · fallback 45 · precedent 45 (settled 4 of 5 times) · walk-away — none held.</p><h5>Suggested reply</h5><div class="w">The Buyer shall pay each undisputed invoice within <del>sixty (60)</del><ins>forty-five (45)</ins> days of receipt<ins>, the Supplier's invoice to be accompanied by the delivery note</ins>.</div><h5>Note to send with it</h5><p class="muted" style="font-size:12px">“45 days is what we settled on last time, and matches our payment run. We can add the delivery-note condition so invoices are never queried late.”</p><div class="row" style="gap:6px;flex-wrap:wrap">${E.applied?`<span class="tag good">Applied to the box</span><button class="btn xs quiet" data-eact="unapply">${ic('undo')} Undo</button>`:`<button class="btn xs primary" data-eact="apply">Apply to the box</button>`}<button class="btn xs quiet" data-eact="note">Keep the note for filing</button><button class="btn xs quiet" data-eact="accept">Accept their R2 instead</button></div><div class="row" style="margin-top:8px;gap:4px;flex-wrap:wrap"><span class="ai-src">${ic('book')} Playbook · Payment terms</span><span class="ai-src">${ic('clock')} MK-1877 · R2</span><span class="ai-src">${ic('doc')} Clause 3, their R2</span></div></div>
    <div class="ai-msg me"><span class="avatar">AO</span><div class="b">Can we give them 60 on the second invoice only?</div></div>
    <div class="ai-msg"><span class="avatar" style="background:#EDE7FA;color:#6D4BB5">✦</span><div class="b">Yes — a split term is not in your playbook but nothing forbids it. Wording that keeps 45 as the rule: <div class="w" style="margin-top:6px">…within forty-five (45) days of receipt, <ins>save that the first invoice of each quarter may be paid within sixty (60) days</ins>.</div><button class="btn xs" data-eact="apply2">Apply to the box</button> <span class="faint" style="font-size:11px">+14 words</span></div></div>`;
  if (E.tab==='ladder') rail = `<div class="ce-card"><h5>3. Payment Terms · 3 rungs</h5><ol class="ladder"><li><span class="rn">R0</span><span class="who">As drafted</span><span class="fig">30 d</span></li><li><span class="rn">R1</span><span class="who">Highland asked · Nandi accepted</span><span class="fig">45 d</span></li><li class="win"><span class="rn">R2</span><span class="who">Nandi asks · <b>you are writing on it</b></span><span class="fig">60 d</span></li></ol><div class="row" style="margin-top:8px;gap:6px"><button class="btn xs quiet">Read as it stood at R1</button><button class="btn xs quiet">Compare R0 → R2</button></div></div><div class="ce-card"><h5>Your playbook</h5><div class="scale"><div class="line"></div><span class="pt std" style="left:8%"></span><span class="lab" style="left:8%">30 std</span><span class="pt fb" style="left:42%"></span><span class="lab" style="left:42%">45 fallback</span><span class="pt them" style="left:82%"></span><span class="lab" style="left:82%">60 theirs</span></div></div>`;
  if (E.tab==='figure') rail = `<div class="ce-card"><h5>The figure · days</h5><p>Type a number and it is written into the clause in words and digits. Nothing else moves.</p><div class="row" style="gap:6px"><input class="inp" style="width:90px" value="45" id="ce-fig"><span class="faint" style="font-size:12px">days</span><button class="btn xs" data-eact="apply">Write it into the clause</button></div><div class="scale" style="margin-top:16px"><div class="line"></div><span class="pt std" style="left:8%"></span><span class="lab" style="left:8%">30</span><span class="pt fb" style="left:42%"></span><span class="lab" style="left:42%">45</span><span class="pt them" style="left:82%"></span><span class="lab" style="left:82%">60</span></div></div>`;
  if (E.tab==='scan') rail = `<div class="ce-card"><h5>This clause against Our standards</h5><div class="list"><div class="li" style="padding:8px 0"><span class="dot amber"></span><span><div class="t">Payment terms · 60 is over the fallback</div><div class="s">Position 30 · fallback 45 · the smallest change is the figure</div></span><span class="verbs"><button class="btn xs" data-eact="apply">Use the fitted wording</button></span></div><div class="li" style="padding:8px 0"><span class="dot good"></span><span><div class="t">Late-payment interest · matches</div><div class="s">CBK base + 2% is your position</div></span><span></span></div></div></div><div class="ce-card"><h5>Missing from this contract · may only be added</h5><div class="list"><div class="li" style="padding:8px 0"><span class="dot"></span><span><div class="t">Set-off</div><div class="s">Your library has a preferred wording · adds a clause, never edits one</div></span><span class="verbs"><button class="btn xs quiet">Add</button></span></div></div></div>`;
  return `<div class="ce">
    <div class="ce-strip"><div class="seg sm"><button class="mono" style="padding:0 8px">14 ▾</button></div><span class="sep"></span><button class="ibtn" title="Bold">${ic('bold')}</button><button class="ibtn" title="Italic">${ic('italic')}</button><button class="ibtn" title="Underline"><b style="text-decoration:underline;font-size:13px">U</b></button><button class="ibtn" title="Strike"><s style="font-size:13px">S</s></button><span class="sep"></span><button class="ibtn" title="Bullets">${ic('list')}</button><button class="ibtn" title="Numbered"><b class="mono" style="font-size:11px">1.</b></button><button class="ibtn" title="Indent">${ic('chev')}</button><span class="sep"></span><button class="ibtn" title="Ink">A</button><button class="ibtn" title="Highlight">${ic('pen')}</button><span class="say" id="ce-say">${E.applied?'Applied. The marks are painted into the box — keep typing on them.':''}</span><span class="grow"></span><button class="ibtn" title="Undo">${ic('undo')}</button><button class="btn sm" data-eact="exit">${ic('exit')} Exit</button></div>
    <div class="ce-grid">
      <div class="ce-left"><div class="ce-readrow"><div class="rtabs"><button class="on">Redlined</button><button>As agreed</button><button>With changes</button></div><div class="r"><span>${E.applied?'1 change in the box':'no change yet'}</span><div class="seg sm"><button>−</button><button class="mono" style="padding:0 8px">100%</button><button>+</button></div></div></div>
        <div class="ce-scroll">${paper}</div>
        <div class="ce-foot"><span>${E.applied?'<b>+9 −3</b> words on clause 3':'No changes yet'}</span><button class="btn xs quiet" ${E.applied?'':'disabled'} data-eact="unapply">Undo the last change</button><div class="r"><button class="btn sm" ${E.applied?'':'disabled'} data-eact="discard">Discard</button><button class="btn sm primary" ${E.applied?'':'disabled'} data-eact="file">File as a change</button></div></div></div>
      <div class="ce-rail"><div class="ce-rail-h"><b>✦ Copilot</b><div class="tabs">${railTabs.map(([k,l])=>`<button class="${E.tab===k?'on':''}" data-etab="${k}">${l}</button>`).join('')}</div></div>
        <div class="ce-rail-b"><div class="faint" style="font-size:11px;margin-bottom:10px">Written by Copilot. Check it before you send it. Nothing here files anything — only the pencil or File does.</div>${rail}</div>
        <div class="ce-rail-f"><div class="row" style="gap:4px;flex-wrap:wrap;margin-bottom:8px">${['Softer version','What does our playbook say?','What if we accept?','Say it in plainer words'].map(q=>`<button class="chip">${q}</button>`).join('')}</div><div class="row" style="gap:6px"><textarea class="inp" id="ce-ask" style="height:56px;padding:8px 10px" placeholder="Ask for different wording, or a scenario…"></textarea><button class="btn primary" style="height:56px">${ic('send')}</button></div></div></div>
    </div></div>`;
}
const _modalHtml = modalHtml;
modalHtml = function(kind, el){
  if (kind==='note') return `<div class="modal" role="dialog"><div class="modal-h"><div><h3><span class="ok">✓</span> CHG-017 filed</h3><div class="sub">3. Payment Terms · your counter on their R2 · not sent yet</div></div><button class="ibtn x" data-modal="">${ic('x')}</button></div><div class="modal-b"><div class="tabs" style="margin-bottom:10px"><button class="on">Internal <span class="n">draft</span></button><button>For Nandi Dairy</button></div><div class="plain" style="margin-bottom:10px"><q>within forty-five (45) days of receipt, the Supplier's invoice to be accompanied by the delivery note</q></div><div class="field"><label>Add a note · internal</label><textarea id="note-int" placeholder="@David — holding at 45, added the delivery-note condition so late queries stop.">@David holding at 45; added the delivery-note condition.</textarea></div></div><div class="modal-f"><span class="faint" style="font-size:12px">A draft in the other room posts to its room in the same breath.</span><div class="r"><button class="btn" data-modal="">Skip</button><button class="btn primary" data-eact="noted">Add note</button></div></div></div>`;
  return _modalHtml(kind, el);
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-calview],[data-itab],[data-irange],[data-icut],[data-igask],[data-stdtab],[data-stdact],[data-etab],[data-eact]');
  if (!t) return; const d=t.dataset;
  if ('itab' in d) { S.intel.tab=d.itab; render(); }
  else if ('calview' in d) { S.cal.view=d.calview; render(); }
  else if ('irange' in d) { S.intel.range=d.irange; render(); }
  else if ('icut' in d) { S.intel.cut = (d.icut && S.intel.cut!==d.icut) ? d.icut : null; render(); }
  else if ('igask' in d) { const q=d.igask||document.getElementById('ig-ask')?.value||''; if(/counterparty/i.test(q)){S.intel.group='cp';render();toast('Grouped by <b>counterparty</b> — HaTi cut the buckets, Copilot only named the dimension.');} else if(/expire|Q2/i.test(q)){toast('Lens on: <b>expires before Q2 2027</b> · 4 nodes stay lit.');} else if(/read/i.test(q)){toast('1 node nobody has read: <b>MK-2019 Mutual NDA — Arla</b>. Press it to read now.');} else if(q) toast('Copilot answers with a grouping, a lens or a count — never a figure it added up itself.'); }
  else if ('stdtab' in d) { S.std.tab=d.stdtab; render(); }
  else if ('stdact' in d) { toast('<b>Adopted.</b> Fallback for Payment terms is 45 days from today — every reading uses it from the next scan.'); }
  else if ('etab' in d) { S.edit.tab=d.etab; render(); }
  else if ('eact' in d) { const a=d.eact;
    if (a==='apply'||a==='apply2') { S.edit.applied=true; render(); }
    else if (a==='unapply'||a==='discard') { S.edit.applied=false; render(); toast(a==='discard'?'Discarded. The clause reads as it did when you opened it.':'Undone.'); }
    else if (a==='exit') { if (S.edit.applied && !confirm('Leave clause 3 with an unfiled change?\n\n“…within forty-five (45) days of receipt, the Supplier\'s invoice to be accompanied by the delivery note”\n\nThe draft is thrown away.')) return; S.edit.applied=false; go('negotiate/'+(route().a||'MK-2041')); }
    else if (a.startsWith('go:')) { if (S.edit.applied && !confirm('Move to clause '+a.slice(3)+'? Your unfiled change on clause 3 would be thrown away.')) return; S.edit.cl=a.slice(3); S.edit.applied=false; render(); }
    else if (a==='done'||a==='file') { if(!S.edit.applied){ toast('Nothing has moved yet — type in the clause or apply a suggestion first.','warn'); return; } openModal('note'); }
    else if (a==='noted') { openModal(''); if(!REDLINES.some(r=>r.id==='CHG-017')) REDLINES.unshift({id:'CHG-017',cl:'3',name:'3. Payment Terms',side:'us',pile:'drafts',arg:'R3 · yours on their R2 · 60 → 45 days + delivery-note condition · not sent'}); S.edit.applied=false; toast('<b>CHG-017 filed</b> and noted. It sits under “Your drafts, not yet sent” until you press Send.'); go('negotiate/'+(route().a||'MK-2041')); }
    else if (a==='note') toast('Kept. The note rides with the change when you file it.');
    else if (a==='accept') { if(confirm('Accept Nandi\'s R2 (60 days) as it stands? This leaves the editor and accepts their ask on the negotiation page.')) { S.nego.decided['CHG-014']='accept'; go('negotiate/'+(route().a||'MK-2041')); } }
  }
});
document.addEventListener('change', e => { if (e.target.id==='ig-group') { S.intel.group=e.target.value; render(); } });
document.addEventListener('input', e => { if (e.target.id==='ce-box') { S.edit.dirty=true; const b=document.querySelector('.paper .cl.typing .done'); if(b) b.innerHTML=ic('pen')+' Done — file it'; const f=document.querySelector('.ce-foot > span'); if(f) f.innerHTML='<b>edited</b> · clause '+S.edit.cl; document.querySelectorAll('.ce-foot .btn').forEach(x=>x.disabled=false); S.edit.applied=true; } });
render();
</script>
