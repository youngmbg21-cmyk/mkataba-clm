     content read as one undifferentiated field and the eye had to find the
     boundary by the hairline alone. The rail now carries the deep teal the
     brand already uses on its mark, its primary buttons and the Copilot
     launcher — so the frame is obviously frame, and the white page inside it
     is obviously the work.

     ONLY COLOUR IS SET HERE. Every width, height, padding and breakpoint the
     shell already had is untouched: the collapsed rail, the floating layer
     below 1280 and the short-laptop rules all still drive this sidebar, and
     they are all layout rules, which is why none of them appear below. */
  /* ---- THE SIDEBAR'S OWN RAMP ----
     Deeper than the accent ramp reaches, and it always was: a navigation column
     is a ground, not an accent. Four values, named here so a theme sets them in
     one place instead of four files finding their own dark green. */
  :root{ --nav-bg:#093733; --nav-line:#0C4741; --nav-ink:#9fd8d1; --nav-ink-strong:#ffffff;
         --nav-deep:#0f4c46; }

  /* ============================================================
     NAVY — the second brand, and the ONLY thing it changes is colour
     ============================================================
     Every value below has a twin in the green ramp above and nothing else
     here: no spacing, no radius, no rule about what is bold. A theme that
     could change more than colour would eventually be used to, and then two
     themes would be two layouts to maintain.

     It sets the same names, so nothing downstream knows which brand it is
     wearing. That is the whole return on gathering the colours into one place:
     493 utility classes, every chip, every gradient and every icon follow from
     this one block.

     WHAT IS NOT HERE is as deliberate: no --st-green, no --st-ruby, no
     --n-ins/--n-del. Accepted stays green and rejected stays red on a navy
     platform, because those two are not brand — they are the redline's
     grammar, and a lawyer reads them before they read anything else. */
  :root[data-brand="navy"]{
    --color-accent-50:#eef3fb;   --color-accent-100:#dce5f7;
    --color-accent-200:#b8caf0;  --color-accent-300:#8aa8e2;
    --color-accent-400:#5b82cf;  --color-accent-500:#3560b4;
    --color-accent-600:#24488f;  --color-accent-700:#1c3872;
    --color-accent-800:#16295a;  --color-accent-900:#111f45;
    --color-accent-50-rgb:238 243 251;   --color-accent-100-rgb:220 229 247;
    --color-accent-200-rgb:184 202 240;  --color-accent-300-rgb:138 168 226;
    --color-accent-400-rgb:91 130 207;   --color-accent-500-rgb:53 96 180;
    --color-accent-600-rgb:36 72 143;    --color-accent-700-rgb:28 56 114;
    --color-accent-800-rgb:22 41 90;     --color-accent-900-rgb:17 31 69;
    /* The companion hue and the hero's deep stop, stepped to match: on green
       these lean cyan, on navy they lean a lighter, cleaner blue. */
    --brand-cyan:#3f7ac4; --brand-cyan-600:#2f63a8; --brand-cyan-700:#2b5c9e;
    --brand-hero-deep:#0f2447;
    /* The sidebar's own ground, deeper than the ramp reaches. */
    --nav-bg:#0F2648; --nav-line:#1A3A66; --nav-ink:#a5bde0; --nav-deep:#17376b;
    /* Navy wore the green band's pale teal second line, because that colour was
       typed into the dashboard rather than named. Now that it has a name, navy
       answers it. */
    --brand-hero-sub:#c3d6f2;
  }
  /* Accent text that stays READABLE in both themes. The deep teal that reads
     well on white is 2.4:1 on the dark surface — the app's existing answer for
     accent words in the dark is accent-400, so this token carries it. Use it
     for accent-coloured LABELS; --color-accent still fills shapes. */
  :root{ --accent-ink:var(--color-accent-800); }
  html.dark{ --accent-ink:var(--color-accent-400); }

  /* ============ THE CONTRACT ROOM ============
     ONE style, TWO shells. The Docs page and the negotiation workbench are
     separate views that draw the same room, and each used to carry its own
     switcher in its own markup — which is precisely how two tab rows for one
     room drift apart. Both now call roomTabsHtml() and land here.

     Underline tabs, not pills: the room is one place with several faces, and
     pills would read as a toolbar of buttons instead. (Four faces since Aug
     2026 — Negotiate left the row for a door of its own in the sidebar.) */
  /* ---- THE ROOM'S HEAD: A NAME AND THREE ACTS ----
     This was a bordered card carrying eight controls in a row — Share, Import,
     Save-as-template, Compare, History, Export, Delete, Draft new agreement,
     plus a collapse — before one line of the contract was visible. A toolbar
     that wide is not read; it is scanned past. The name is the biggest thing
     on the page now, and beside it sit the only three acts a reader reaches
     for from here: everything else, unchanged and undeleted, is one press away
     under the "⋯".

     No card. The head is the page's title block, not an object on it. */
  /* ---- THE HEAD IS TIGHT SO THE CONTRACT IS NOT (owner-asked 22 Aug 2026:
     "HaTi is not efficiently using the space to give the contracts a proper
     space") ---- MEASURED at 1440x900 before this: 291px sat above the first
     line of the agreement on the Document tab — a third of the window — where
     the design spends about 190. The savings come out of the CHROME and never
     out of the paper: the sheet keeps its own 34px top margin, because that is
     the document's margin and it is what makes it read as a document.

     gap:12px was doing double duty — it separated the crumb row from the title
     row AND the title from the fact band, so one number spent 24px on two
     joins that want different amounts. 6px here; the fact band carries its own
     space below. */
  /* ---- THE HEAD IS ONE WHITE BAND (owner-asked 23 Aug 2026) ----
     "The highlighted area should be white just like in the attached html."
     The mock-up's three head strips (.h-title, .h-hc, .h-anchor) are all
     var(--surface) over a grey page; this room painted none of them.

     FULL BLEED BY NEGATIVE MARGIN, PADDING PUT BACK INSIDE. The view wrapper
     carries padding:6px 16px 12px, so the band cancels the top and the two
     sides and re-adds them within itself: the white runs edge to edge while
     the crumb, title, facts and tabs stay on exactly the vertical they were
     on. No bottom padding — the tab row's own hairline is the band's lower
     edge, which is what makes it read as one object rather than a box.

     THE GAP INSIDE IT IS WHITE-ON-WHITE and therefore invisible, which is the
     whole reason this is a wrapper rather than a background on each strip:
     painting them separately leaves the 8px flex gap grey and gives three
     bars instead of one band. */
  .room-band{ display:flex; flex-direction:column; gap:8px; flex:none;
    background:var(--color-surface); margin:-6px -16px 0; padding:6px 16px 0; }

  .room-head{ display:flex; align-items:flex-start; gap:6px; flex:none; flex-wrap:wrap;
    padding:0 2px; }
  .room-head .room-id{ flex:1; min-width:min(100%,240px); }
  /* ---- THE STATUS SHARES THE TITLE'S LINE, ALWAYS (owner-reported 22 Aug
     2026: "the words drafting, in review etc should always be in the same line
     as the name of the contract ... the feature should never take a second
     line because that is space taken from the contract") ----
     It was flex-wrap:wrap, so a long name pushed the status word onto a line of
     its own and the head grew by ~26px — height the document below it pays for.
     NOWRAP, and the TITLE is the thing that gives: it already carries
     ellipsis, so the name shortens and the status keeps its place. min-width:0
     on the h1 is what actually lets a flex item shrink below its content —
     without it the ellipsis never engages and the row overflows instead. */
  .room-head .room-name{ display:flex; align-items:center; gap:10px; flex-wrap:nowrap; min-width:0; }
  .room-head .room-name > *{ flex:none; }
  .room-head .room-name h1{ flex:0 1 auto; min-width:0; }
  /* The workbench's one-row head: the reference leads the title, the round
     follows the status. Both quiet — they are facts, and the title and the
     status are what the row is for. */
  .room-name-id{ font-size:15px; color:var(--color-neutral-600);
    font-variant-numeric:tabular-nums; white-space:nowrap; }
  .room-name-id i{ font-style:normal; margin-left:7px; color:var(--color-neutral-400); }
  .room-round{ font-size:14px; color:var(--color-neutral-600); white-space:nowrap; }
  /* ---- THE TWO HEADS SAY THE NAME AT ONE SIZE (owner-reported 22 Aug 2026,
     off two screenshots side by side: "the font size in the documents page
     header should be the same size as in the negotiations page") ----
     This REVERSES the same day's "700 AND A FIXED 22px, both the design's" in
     place, and the half of that decision worth keeping is kept: the size is a
     FIXED rung, never fluid. It was weight 600 at
     clamp(19px, 15px + 0.45vw, 24px), which resolves to 21.48px at 1440 and to
     a different fraction at every other width, so the largest text on the page
     was the softest thing on it — that fault does not come back.
     WHAT MOVED IS WHICH RUNG. The negotiation page's head was drawn to the
     owner's own approved render at 15px/600 and the room's to the mock-up's
     22px/700, so one contract wore two title sizes depending on which of its
     pages you were standing on. 15/600 is the one that was approved against a
     render, so it is the one that wins. .redline-page's own block still states
     it for that page; the two now agree rather than disagreeing. */
  .room-head h1{ font-family:var(--font-heading); font-weight:600; margin:0; line-height:1.2;
    font-size:15px; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .room-head .room-sub{ font-size:13px; color:var(--color-neutral-600); margin-top:3px;
    overflow-wrap:anywhere; }
  .room-head .room-acts{ display:flex; align-items:center; gap:6px; flex:none; }
  /* ---- THE MENU ENDS THE GROUP WHERE THE ACT LEADS IT ----
     On the workbench the mock-up draws Publish round, then the alternatives,
     then Share, then More — the act first and the overflow last. The head
     builds its children in the contract page's order, so the two are
     reconciled with `order` rather than by writing the group twice: one
     arrangement in the markup, two readings of it. Everything else stays at
     the default 0 and therefore keeps source order. */
  .room-acts-lead > div:has(#ws-more){ order:3; }
  /* ---- THE BREADCRUMB (22 Aug 2026) ----
     #ws-back is still the button and still carries every route it carried as a
     34px arrow; only its clothes changed. It sits on its own line ABOVE the
     title, which is what makes the row below it a clean title-plus-acts line
     rather than a title with a box bolted to its left. .room-back is retired —
     flag any mention as stale. */
  .room-head{ position:relative; }
  .room-crumb{ flex-basis:100%; display:flex; align-items:center; gap:7px;
    font-size:12px; color:var(--color-neutral-500); min-height:16px; margin-bottom:2px; }
  .room-crumb button{ font:inherit; color:var(--color-accent-700); background:none;
    border:0; padding:0; cursor:pointer; max-width:40ch; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .room-crumb button:hover{ text-decoration:underline; }
  .room-crumb i{ font-style:normal; color:var(--color-neutral-400); }
  .room-crumb-here{ font-variant-numeric:tabular-nums; }
  /* Status as words. The tone comes inline from STATUS_META, so this rule
     carries only the shape — see contractStatusTextHtml. */
  .room-stat{ font-size:14px; font-weight:700; white-space:nowrap; flex:none; }
  /* ---- THE FACT ROW ----
     Label above value, divided by hairlines, four across. The same treatment
     Key terms uses one screen down, which is the point: a reader who learns to
     read facts here reads them the same way there. */
  /* RULED TOP AND BOTTOM (owner-asked 22 Aug 2026, marked on a screenshot).
     It carried only the lower rule, so the facts ran straight on from the
     sub-line above with nothing to say they were a different kind of thing.
     Two hairlines make it a band — which is what it is — and they are the same
     divider, so it reads as one object rather than as a box. */
  .room-facts{ flex-basis:100%; position:relative; margin-top:2px;
    padding-top:10px; padding-bottom:10px;
    box-shadow:inset 0 1px var(--color-divider), inset 0 -1px var(--color-divider);
    /* A ROW, SO THE CHECK SYMBOLS SHARE THE FACTS' LINE (WO-10, 24 Aug 2026).
       This was a plain block, so its two children stacked and the symbols took
       a whole line of their own — MEASURED, 28px added to a head that is meant
       to be compact, with the symbols at the left wall rather than the right
       where the owner drew them. margin-left:auto on a block pushes nothing;
       it needs a flex parent to push against. */
    display:flex; align-items:center; gap:12px; }
  .room-facets{ display:flex; flex-wrap:wrap; row-gap:10px; flex:1; min-width:0; }
  .room-facet{ margin-right:28px; padding-right:28px;
    border-right:1px solid var(--color-divider); min-width:0; }
  .room-facet:last-child{ border-right:0; margin-right:0; padding-right:0; }
  .room-facet .l{ font-size:12px; color:var(--color-neutral-500); line-height:16px; }
  .room-facet .v{ font-size:15px; line-height:20px; color:var(--color-text);
    max-width:34ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .room-facet-none{ color:var(--color-neutral-400); }
  /* The whose-move facet borrows the register's builder, which brings its own
     class and colour; it must not also inherit the facet's ellipsis clamp. */
  .room-facet .v .ngl-w{ font-weight:700; }
  /* Overhangs the row's lower rule, centred — the mock-up's own placement. */
  .room-snap{ position:absolute; left:0; right:0; bottom:-9px; height:18px;
    display:flex; justify-content:center; pointer-events:none; }
  .room-snap button{ pointer-events:auto; background:var(--color-surface);
    border:1px solid var(--color-divider); height:18px; padding:0 10px; display:flex;
    align-items:center; gap:6px; font:inherit; font-size:12px;
    color:var(--color-neutral-600); cursor:pointer; line-height:1; }
  .room-snap button:hover{ color:var(--color-text); border-color:var(--color-neutral-400); }
  /* Folded: the FACTS go, the title, status and acts do not move. */
  .room-facts.is-folded .room-facets{ display:none; }
  /* ---- THE THREE CHECK SYMBOLS (WO-10) ----
     margin-left:auto puts them at the right wall of the fact line, which is
     where the owner drew them. They are OUTSIDE .room-facets, so Collapse
     never takes them away. Symbols only — the name and the state live on the
     hover, per the owner's ruling that no state dot is wanted. */
  .room-checks{ display:flex; align-items:center; gap:2px; margin-left:auto; flex:none; }
  .room-check{ width:28px; height:28px; display:grid; place-items:center; padding:0;
    border:1px solid transparent; border-radius:0; background:transparent; cursor:pointer;
    color:var(--color-neutral-600); }
  .room-check:hover{ background:var(--nav-well); color:var(--accent-ink); }
  .room-check.has-run{ color:var(--accent-ink); }
  .room-check:disabled{ opacity:.4; cursor:default; }
  .room-check:disabled:hover{ background:transparent; color:var(--color-neutral-600); }
  .room-check:focus-visible{ outline:2px solid var(--color-accent-600); outline-offset:-2px; }
  /* Folded, the band has no content, so it keeps ONE rule rather than two —
     a 1px-tall box with a line top and bottom reads as a mistake. */
  .room-facts.is-folded{ padding-top:0; padding-bottom:0; margin-top:6px;
    box-shadow:inset 0 -1px var(--color-divider); }
  /* ---- THE TITLE AS A DOOR, ON THE NEGOTIATION SCREEN ONLY ----
     That page has no tab row, so the head's arrow is the only way off it — and
     the name beside the arrow is the biggest target on the screen, which is
     where readers aim. It is a real <button> for the keyboard and the screen
     reader, and it inherits the h1's type completely: nothing about the title
     should LOOK different, only the cursor and the hover say it can be pressed.
     `font:inherit` alone is not enough — a button brings its own colour,
     background, border and text-align with it. */
  .room-title-back{ font:inherit; color:inherit; background:none; border:0; padding:0;
    margin:0; text-align:left; cursor:pointer; max-width:100%; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .room-title-back:hover{ color:var(--accent-ink); }
  .room-title-back:focus-visible{ outline:2px solid var(--color-accent); outline-offset:3px; border-radius:0; }
  /* ---- WHAT THE NEGOTIATE TAB'S COUNT BECAME ----
     The amber pill on that tab was how a reader on Key terms knew answers were
     owed. The tab is gone, so the signal reads on the round line instead — same
     number, same arithmetic (negoNeedsYouIds), and pressable, because a line
     that reports work owed and cannot be pressed sends the reader hunting.
     Inline, in the flow of the sub-line, so it reads as one sentence. */
  .room-sub-needs{ font:inherit; font-weight:600; color:var(--st-amber-fg);
    background:none; border:0; padding:0; margin:0; cursor:pointer; }
  .room-sub-needs:hover{ text-decoration:underline; }
  .room-sub-needs:focus-visible{ outline:2px solid var(--color-accent); outline-offset:2px; border-radius:0; }
  /* The Document tab's one door, when it has answers waiting behind it. The
     button is already the head's filled primary; this is the amber dot that
     says the press is owed rather than merely available. */
  .ws-to-nego-due::before{ content:""; display:inline-block; width:7px; height:7px;
    border-radius:50%; background:var(--st-amber-dot); margin-right:7px; vertical-align:1px; }

  /* ============ THE NEGOTIATIONS LIST ============
     What the sidebar door shows when there is no last negotiation to reopen.

     IT IS THE CONTRACTS TABLE NOW (owner's call, 12 Aug 2026), built by
     renderRegister with a scope — so the rules below dress two things and no
     more: the page's own heading, and the band that heads each group. The .ngl-w
     pill survives unchanged because it is the one thing both shells draw, and
     the .ngl-row / .ngl-list rules survive because the EMPTY state (no live
     negotiation anywhere) is still a page of its own rather than an empty table
     under a filter bar. */
  .ngl-wrap{ padding:var(--page-pad); max-width:900px; }
  /* 700, not 600 — Home sets the tone at 20/700 and every page head matches it
     (owner-asked 25 Aug 2026). The SIZE was already right here; only the weight
     was a shade light against the rest. */
  .ngl-head h2{ font-family:var(--font-heading); font-weight:700; font-size:20px;
    margin:0 0 4px; line-height:1.2; }
  .ngl-head p{ margin:0 0 18px; font-size:14px; color:var(--color-neutral-600); }
  .ngl-list{ display:flex; flex-direction:column; gap:8px; }
  .ngl-row{ display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    font:inherit; cursor:pointer; padding:13px 15px; border-radius:0;
    border:1px solid var(--color-divider); background:var(--color-surface);
    color:var(--color-text); transition:border-color .12s, background .12s; }
  .ngl-row:hover{ border-color:var(--color-accent); background:var(--color-accent-100); }
  .ngl-row:focus-visible{ outline:2px solid var(--color-accent); outline-offset:2px; }
  .ngl-main{ flex:1; min-width:0; display:block; }
  .ngl-name{ display:block; font-weight:600; font-size:15px; line-height:1.35;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ngl-sub{ display:block; font-size:13px; color:var(--color-neutral-600); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Three states, three readings. Amber is the only one that asks for anything;
     the other two are told quietly on purpose — a list where every row shouts
     is a list where the one that matters is invisible.

     ---- A STATE IN WORDS, NOT A CHIP (owner-asked, 19 Aug 2026) ----
     Every row ended in a filled capsule, and sixteen of them down the right of
     the page read as sixteen buttons — on a column that is a STATE and whose
     press belongs to the row. The words keep the colour, which is the part
     that does the work, and lose the pill: the same treatment the contracts
     page gives its action text, on the page that is the contracts table. The
     press is unchanged and is the row's, so pressing the words still opens the
     negotiation; the underline on hover says so. */
  /* ---- THE WHOSE-MOVE WORDS READ LIKE THE REST OF THE ROW (owner-asked
     23 Aug 2026) ---- 14px regular, like every other cell on Negotiations; the
     THREE INKS below are what carry the state and none of them moved. The
     contract room's fact row sets its own 700 a few rules up
     (.room-facet .v .ngl-w) and is untouched — that is a head, not a row. */
  /* 13px with the rest of the row — WO-16. The whose-move words are a CELL
     like any other and the 23 Aug ruling is that every cell reads at one size.
     .room-facet .v .ngl-w keeps its own weight: one builder, two homes, and
     only the LIST was in the ask. */
  .ngl-w{ flex:none; font-size:13px; font-weight:400; white-space:nowrap;
    background:none; border:0; padding:0; border-radius:0; }
  .ngl-w-you{ color:var(--st-amber-fg); }
  .ngl-w-them{ color:var(--st-gray-fg); }
  .ngl-w-clear{ color:var(--st-green-fg); }
  tr[data-nego-row]:hover .ngl-w{ text-decoration:underline; }
  .ngl-empty{ background:var(--color-surface); border:1px solid var(--color-divider);
    border-radius:0; padding:34px; text-align:center; box-shadow:var(--shadow-sm); }
  /* ---- THE BAND ----
     A full-width heading between rows: a coloured dot, the name in small caps,
     the count. It is the thing a flat register cannot produce, and it is what
     stops this page being mistaken for Contracts. NOT A ROW — no hover tint, no
     pointer, no cell padding, and the markup carries role="presentation" so it
     is never announced as one either. */
  /* ---- THE BAND PINS TO THE HEADER, AND THE HEADER IS MEASURED (owner-
     reported 22 Aug 2026: "when you scroll in the negotiations list of
     contracts, it breaks") ----
     It was `top:38px`, typed. MEASURED, the register's sticky header renders
     35px tall, so there was a 3px slot between the two pinned things that
     every row slid visibly through on the way past — the reported break. A
     number that has to agree with another element's height is one that agrees
     until somebody changes a padding or a type size, which this file did on
     22 Aug and nothing said so. regFitBandOffset writes --reg-head-h off the
     header's own box and re-reads it on a ResizeObserver, so the two cannot
     come apart again. The fallback is today's measured 35px, for the one
     reader that never runs script. */
  .ngl-band > td{ padding:0!important; border-bottom:0!important;
    background:var(--color-bg); position:sticky; top:var(--reg-head-h,35px); z-index:2; }
  .reg-table tbody tr.ngl-band:hover{ background:none; }
  .ngl-band-in{ display:flex; align-items:center; gap:9px; padding:7px 16px;
    border-top:1px solid var(--color-divider); border-bottom:1px solid var(--color-divider); }
  .ngl-band-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .ngl-band-k{ font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--color-neutral-600); }
  .ngl-band-n{ font-family:var(--font-mono); font-size:12px; font-weight:700;
    color:var(--color-neutral-600); background:var(--color-surface);
    border:1px solid var(--color-divider); border-radius:0; padding:0 7px; }
  /* ---- ITS TITLE STARTS WHERE EVERY OTHER PAGE'S DOES (owner-asked 25 Aug
     2026: "the distance between the edge at the top and the header should be
     the same across all pages") ----
     This page draws its OWN head INSIDE the register's body wrapper, which
     pads 14px down, while the shared #page-head pads 16 — so its title sat 2px
     high. SCOPED TO .ngl-page, which only this page carries: the Contracts
     page uses the same wrapper and its head is the shared one, already at 16,
     so widening this to the wrapper would move that page's filter bar for no
     reason. */
  .ngl-page{ padding-top:16px!important; }
  .ngl-head-table h2{ margin:0; display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  .ngl-head-table p{ margin:2px 0 0; }
  .ngl-live{ font-family:var(--font-mono); font-size:13px; font-weight:700;
    color:var(--color-accent-800); background:var(--color-accent-100);
    border:1px solid var(--color-accent-300); border-radius:0; padding:1px 9px; }
  .ngl-empty h3{ margin:0 0 6px; font-size:16px; font-weight:700; }
  .ngl-empty p{ margin:0 0 16px; font-size:14px; color:var(--color-neutral-600);
    max-width:46ch; margin-inline:auto; line-height:1.6; }
  /* ---- THE NEGOTIATION DESK, IN THE HEADER AND NOWHERE ELSE ----
     Who leads a negotiation is a fact about the contract, so it rides with the
     contract's other facts. This is the whole visual cost of the feature: one
     pill, no new row, ~34px matching every other control on the strip. A band
     is drawn only where something actually refuses (see deskNoticeHtml), and
     that band shares the review banner's single slot. */
  /* ---- NO BOX ROUND IT, ON EITHER HEAD (owner-reported 22 Aug 2026: "do not
     put a grey box around it similar to negotiations page") ----
     This drew a bordered grey pill 34px tall. The negotiation page had already
     stripped it — quiet text with a hairline before the acts — in its own
     scoped rule, so ONE contract wore two different chips depending on which
     of its pages you stood on. MEASURED on one contract: the room's chip 34px
     tall on --color-bg with a 1px border, the negotiation page's 24px,
     transparent, borderless.
     THE FLAT TREATMENT MOVES TO THE BASE RULE rather than being copied into a
     second scoped one. It is a STATEMENT, not a control (see deskChipHtml —
     both halves of it stopped being buttons in August), and a bordered pill is
     what makes a reader try to press it. One rule, both heads, nothing to keep
     in step — and the 34px went with the box, so it no longer stands taller
     than the buttons beside it.
     THE WORDS ALREADY AGREED: both pages call deskChipHtml, and on one
     contract both read "AO You lead". Only the dress differed. */
  /* ---- THE UPLOAD CONFIRM'S FIELDS SIT ON SHARED ROWS ----
     (owner-reported 22 Aug 2026: "the right and left entry fields should never
     be misaligned.")
     Each field is label · box · hint stacked in its own cell, and HaTi appends
     "✦ READ FROM THE DOCUMENT" to anything it read out of the file — so the
     left label routinely wraps to two lines while its neighbour stays on one,
     and the box under it drops a whole line. MEASURED before the fix: 0px out
     at a wide dialog, 20px out at 560px on the counterparty row, 20px out on
     two rows at 480px.
     SUBGRID IS THE FIX AND IT IS THE RIGHT TOOL. The cells take the parent's
     own rows (`grid-template-rows:subgrid` over three of them), so labels
     share a row with labels and boxes with boxes however long either wraps —
     at every width, not at the two that happened to be reported.
     WHERE SUBGRID IS NOT SUPPORTED the declaration is ignored and the dialog
     falls back to exactly what it did before: readable, occasionally a line
     out. A fallback that degrades to the old behaviour is the right shape for
     a layout nicety.
     THE HINT ROW IS ALWAYS EMITTED, empty or not — see the note at `cell` in
     js/views/contract.js. A cell with two children would put its box in the
     label's row and shift the whole column. */
  /* ---- THE SIGNING COLUMN ON A CLOSED CONTRACT ----
     Drawn, kept, and plainly finished (owner-reported 22 Aug 2026). The
     controls are genuinely disabled in the renderer — this only says so. The
     cards keep their own surface and border: they are still the record, and
     greying the whole column would make it read as broken rather than closed. */
  .sign-closed-note{ margin:0; padding:9px 12px; font-size:13px; line-height:1.55;
    border:1px solid var(--st-green-line); background:var(--st-green-bg);
    color:var(--st-green-fg); border-radius:0; }
  .sign-side-closed button:disabled,
  .sign-side-closed select:disabled,
  .sign-side-closed input:disabled{ opacity:.5; cursor:default; }
  .sign-side-closed [aria-disabled="true"]{ cursor:default; text-decoration:none; }
  .up-grid{ grid-auto-rows:auto; align-items:start; }
  .up-grid > .up-f{ display:grid; grid-template-rows:subgrid; grid-row:span 3; gap:0; }
  .up-grid > .up-f > .up-l{ align-self:start; }
  .up-grid > .up-f > .up-h:empty{ display:none; }
  .dk-chip{ display:inline-flex; align-items:center; gap:7px; flex:none; cursor:default;
    padding:0 14px 0 0; margin-right:2px; border-radius:0; font:inherit; font-size:13px;
    border:0; border-right:1px solid var(--color-divider); background:none;
    color:var(--color-neutral-600); box-shadow:none;
    max-width:min(46vw,260px); }
  .dk-chip .dk-who{ font-weight:400; }
  .dk-chip.dk-chip-empty{ padding:0 14px 0 0; color:var(--color-neutral-600); }
  /* THE EMPTY CHIP HAS NO FACES, so it must keep its WORD at every width. The
     720px rule below hides .dk-who on the reasoning that a face still says
     "somebody owns this" — true of the claimed chip, and the exact opposite
     here, where dropping the word leaves a blank pill saying nothing at all.
     Placed after that rule in the cascade; see the media query below. */
  /* The hover is GONE with the box: nothing here is pressable, and a thing
     that lights up under the pointer is a thing a reader will try to press.
     The focus ring stays for the one case that still takes focus — a keyboard
     reader tabbing past it. */
  .dk-chip:focus-visible{ outline:2px solid var(--color-accent); outline-offset:2px; }
  /* ---- THE CLAIMED CHIP IS A LABEL, AND HAS TO LOOK LIKE ONE ----
     It stopped being a door (see deskChipHtml). A thing that lights up under
     the pointer is a thing a reader will try to press, so the hover the shared
     rule gives every .dk-chip is taken back here — the cursor stays an arrow,
     the border stays put, and nothing invites a press that does nothing. The
     THE EMPTY CHIP FOLLOWED ON 13 Aug 2026 — it was the last half of this
     control that was still a button, reading "Start negotiation", and it read
     as a door into the negotiation that it never was. It carries
     .dk-chip-static too now, so both halves of one chip behave alike. */
  /* .dk-chip-static took the hover back when only the claimed half had stopped
     being a door. Both halves are flat now and neither has a hover to take
     back, so the class is left as a marker the renderer still emits and the
     rules it needed are gone. */
  .dk-chip .dk-faces{ display:inline-flex; flex:none; }
  .dk-chip .dk-who{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dk-face{ width:24px; height:24px; border-radius:50%; flex:none; display:inline-flex;
    align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px;
    font-weight:700; letter-spacing:.02em; background:var(--color-accent-100);
    color:var(--color-accent-800); border:1px solid var(--color-divider);
    box-shadow:0 0 0 2px var(--color-bg); }
  .dk-face-lead{ background:var(--color-accent); color:#fff; border-color:var(--color-accent); }
  /* Below the tablet break the header is already wrapping; the name goes and
     the faces stay, because a face still says "somebody owns this" and a
     truncated name says nothing at all. */
  @media (max-width:720px){ .dk-chip .dk-who{ display:none; } .dk-chip{ padding:0 4px; }
    /* …except the empty one, which has no faces to fall back on. */
    .dk-chip.dk-chip-empty .dk-who{ display:inline; }
    .dk-chip.dk-chip-empty{ padding:0 10px; } }
  .dk-face-more{ background:var(--color-bg); color:var(--color-neutral-600); font-size:10px; }
  .dk-pip{ flex:none; min-width:17px; height:17px; padding:0 4px; border-radius:0;
    background:var(--st-amber-fg); color:var(--color-surface); font-family:var(--font-mono);
    font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
  /* ---- THE ONE NOTICE, AND ONLY FOR SOMEBODY WHO CANNOT ACT ----
     It shares the review banner's slot rather than opening a second one; see
     rlOneNoticeHtml. A lead and a contributor never see it at all.

     It is no longer a BAND on the desktop workbench: it floats bottom-right
     with the other notices (rlFloatingNoticesHtml) so it is never over the
     contract. The phone still stacks it inline, where a floating card would
     cover the very document it is talking about. */
  .dk-notice{ display:flex; align-items:center; gap:10px; padding:9px 13px; margin:0 0 10px;
    border-radius:0; border:1px solid var(--st-amber-line); background:var(--st-amber-bg);
    color:var(--st-amber-fg); font-size:13px; line-height:1.5; }
  /* The dismiss. Quiet, in the notice's own ink, and the same shape as the
     review banner's — two notices in one corner should not close two ways. */
  .dk-notice-x{ flex:none; align-self:flex-start; font:inherit; font-size:15px; line-height:1;
    cursor:pointer; border:0; background:transparent; color:inherit; opacity:.65;
    padding:1px 2px; margin:-1px -3px 0 2px; }
  .dk-notice-x:hover{ opacity:1; }
  .dk-notice-tag{ flex:none; font-family:var(--font-mono); font-size:10px; font-weight:700;
    letter-spacing:.07em; border:1px solid currentColor; border-radius:0; padding:2px 6px; }
  .dk-notice-txt{ flex:1; min-width:0; }
  .dk-notice-said{ flex:none; opacity:.8; font-style:italic; }
  .dk-notice-btn{ flex:none; font:inherit; font-size:12px; font-weight:700; cursor:pointer;
    border-radius:0; padding:4px 10px; border:1.5px solid currentColor; background:transparent;
    color:inherit; }
  /* Rows in the desk sheet. */
  .dk-row{ display:flex; align-items:center; gap:9px; border:1px solid var(--color-divider);
    border-radius:0; padding:7px 10px; margin-bottom:6px; background:var(--color-surface); }
  .dk-row-id{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .dk-row-name{ font-size:14px; font-weight:600; color:var(--color-text); }
  .dk-row-sub{ font-size:12px; color:var(--color-neutral-600); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .dk-row-ask{ border-color:var(--st-amber-line); background:var(--st-amber-bg); }
  /* The row that is the dialog's SUBJECT rather than one of a list — the
     desk's lead. Image 3's selected card, in the same tint. */
  .dk-row-lead{ border-color:var(--color-accent-300); background:var(--color-accent-100); }

  /* ---- ONE SET OF CLOTHES FOR THIS FEATURE'S DIALOGS ----
     The desk sheet, the review ask, the entry chooser, the hand-back and the
     two pickers were eight bare white boxes: a heading, a grey sentence, a
     stack of fields. Reported as exactly that (Young, 10 Aug 2026) — "add
     some light color and character to the pop ups ... They are currently very
     bland" — beside a screenshot of the SHARE dialog, which has a coloured
     heading, an accent-tinted chosen card and green status chips.

     So the vocabulary is QUOTED FROM THAT DIALOG rather than invented: its
     accent tint for the chosen purpose (--color-accent-100 over
     --color-accent-300) becomes the head band, and .rvd-note is its
     #share-hist-note. Nothing here is a new colour; both are combinations the
     product already ships, which is also why they answer correctly on the
     navy brand — the ramp changes, the relationship does not.

     WRITTEN ONCE AND USED BY BOTH FILES. Eight dialogs dressed eight times is
     the duplication this codebase's own map opens with, and it is how six of
     them end up updated and two do not. js/review.js builds the head
     (reviewDialogHeadHtml) and js/desk.js calls it. */
  .rvd-head{ display:flex; align-items:flex-start; gap:11px; padding:15px 20px 13px;
    background:var(--color-accent-100); border-bottom:1px solid var(--color-accent-300); }
  .rvd-ico{ flex:none; width:30px; height:30px; border-radius:0; display:grid;
    place-items:center; font-size:15px; line-height:1; background:var(--color-surface);
    border:1px solid var(--color-accent-300); box-shadow:0 1px 2px rgba(15,23,42,.06); }
  .rvd-htxt{ flex:1; min-width:0; }
  .rvd-title{ font-family:var(--font-heading); font-weight:600; font-size:17px; margin:0;
    line-height:1.3; color:var(--color-accent-800); }
  .rvd-sub{ font-size:13px; line-height:1.55; margin:3px 0 0; color:var(--color-accent-800);
    opacity:.82; }
  .rvd-body{ padding:15px 20px 2px; }
  /* The actions sit on the quiet ground with a rule above them, so a dialog
     ends on a shelf rather than trailing off. */
  .rvd-foot{ display:flex; gap:8px; justify-content:flex-end; align-items:center;
    padding:12px 20px 14px; margin-top:14px; border-top:1px solid var(--color-divider);
    background:var(--color-bg); }
  /* The one line a dialog ends on that is a FACT rather than a control — what
     the counterparty is told, what the reviewer will be looking at. */
  .rvd-note{ border:1px solid var(--color-accent-300); background:var(--color-accent-100);
    color:var(--color-accent-800); border-radius:0; padding:10px 12px;
    font-size:13px; line-height:1.55; }
  /* The entry chooser's two big options. */
  .rvd-opt{ display:flex; flex-direction:column; align-items:flex-start; gap:3px; width:100%;
    text-align:left; padding:12px 14px; margin-top:9px; border-radius:0; cursor:pointer;
    font:inherit; border:1.5px solid var(--color-divider); background:var(--color-surface);
    transition:border-color .12s, background .12s; }
  .rvd-opt:hover{ border-color:var(--color-accent); background:var(--color-accent-100); }
  .rvd-opt b{ font-size:14px; font-weight:700; color:var(--color-text); }
  .rvd-opt:hover b{ color:var(--color-accent-800); }
  .rvd-opt span{ font-size:13px; line-height:1.5; color:var(--color-neutral-600);
    white-space:normal; }
  /* ============================================================
     SETTINGS & RULES — four tabs and one drawer
     ============================================================
     The drawer hangs off <body>, not off #content, because the page underneath
     it genuinely rebuilds (the market's language-follow redraw) and because
     "Your account" opens the same drawer from views that are not this page.
     It is the Activity panel's own mechanism: transform, a dimmed scrim, and
     dismissed by scrim / Escape / its own ✕. */
  .st-page{ padding:var(--page-pad); }
  /* ---- THE ADMIN TAB ROWS ARE DRAWN LIKE THE ROOM'S (owner-asked 23 Aug
     2026: "the design of images 1 and 2 need to resemble how image 3 was
     designed") ---- Image 3 is the contract room's tab row, and the difference
     was the BOX, not the type: .room-tab hugs its text (padding 9px 1px) and
     lets a 22px gap do the separating, so the words read as words and the live
     underline is exactly as wide as the word above it. These rows padded each
     tab 14px a side and left a 2px gap, so every tab was a slab and the
     underline ran the full slab. Same numbers as .room-tab now — one control,
     three pages. .st-tabs and .room-tabs are still two rules because the two
     rows sit in different containers; change one, change the other. */
  .st-tabs{ display:flex; gap:22px; border-bottom:1px solid var(--color-divider); }
  /* ---- A RESTING TAB IS DARK INK, NOT A CAPTION (owner-asked 23 Aug 2026) --
     "The font I have highlighted should also be the font used in the tab
     navigation panels within the administration tabs."

     The same fault .room-tab was corrected for on 22 Aug, in the same words,
     never swept past that one row. MEASURED, these tabs already agreed with
     the negotiation page's reading tabs on everything that matters — Inter,
     14px, 400 resting, 700 and accent when live, a 2px underline — and
     differed on exactly one value: they rested on --color-neutral-600, the
     LABEL shade, against the reference's --color-text. A tab is a thing you
     read and press, not metadata about one; the live state is what marks the
     live tab, and the resting ones do not have to be faded as well.

     AND THE STACK IS THE PAGE'S OWN. It declared font:inherit and then
     overrode it with var(--font-heading) — which resolves to the SAME face
     (both tokens are Inter-first, one family end to end since 22 Aug) but to a
     different fallback ORDER, so the two rows agreed only for as long as Inter
     loads. The override is dropped rather than re-pointed: `font:inherit` on
     the line above already says what this row wants, and the reference tabs
     take the body stack by inheriting it too.

     ---- AND THIS RULE WAS UNPARSEABLE FOR A DAY (found 23 Aug 2026) ----
     The two notes above were written in separate passes and the second was
     inserted AFTER the first one had already been closed, so eight lines of
     prose and an orphaned comment-terminator sat in the stylesheet as raw CSS.
     (Do not write that terminator inside a comment to describe this — spelling
     it out closes the comment on the spot, which is how this was reproduced a
     second time while the note was being written.) A CSS parser recovers from
     garbage by skipping to the end of the next block — which was `.st-tab`
     itself, so THE WHOLE RULE WAS DROPPED: no padding, no size, no
     border-bottom, no transparent underline reserving the row's height.
     MEASURED on main: `.st-tab` computed `padding:0px` from the button reset,
     and the browser's own stylesheet listed `.st-tabs`, `.st-tab:hover`,
     `.st-tab.on` and `.st-tabsub` while `.st-tab` was absent entirely. That is
     what made these tabs read as cramped, and it is the whole of the owner's
     report on the Settings and Our-standards rows.

     THE TEST DID NOT CATCH IT, and the reason is worth keeping: it asked about
     the resting tabs' INK, which was still correct — by accident, because a
     tab with no rule of its own inherits --color-text from the body. A check
     that reads one property cannot see a rule that vanished. */
  .st-tab{ appearance:none; border:0; background:none; cursor:pointer; font:inherit;
    font-weight:400; font-size:14px; padding:9px 1px;
    color:var(--color-text); border-bottom:2px solid transparent; margin-bottom:-1px;
    white-space:nowrap; }
  .st-tab:hover{ color:var(--color-text); }
  .st-tab.on{ color:var(--accent-ink); border-bottom-color:var(--accent-solid,var(--color-accent));
    font-weight:700; }
  .st-tabsub{ font-size:13px; line-height:1.55; color:var(--color-neutral-600);
    margin:10px 0 14px; }
  /* A ROW STATES WHAT THE SETTING IS RIGHT NOW — status dot, name, one line of
     current state, whether it has to be answered. It is a button because it is
     a door; nothing on it is a control of its own. */
  .st-rows{ display:flex; flex-direction:column; border:1px solid var(--color-divider);
    border-radius:0; overflow:hidden; background:var(--color-surface);
    box-shadow:var(--shadow-sm); }
  .st-row{ display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:11px 14px; border:0; border-bottom:1px solid var(--color-divider);
    background:var(--color-surface); cursor:pointer; font:inherit; color:inherit;
    transition:background .12s; }
  .st-row:last-child{ border-bottom:0; }
  .st-row:hover{ background:var(--color-accent-100); }
  .st-row[disabled]{ cursor:default; }
  .st-row[disabled]:hover{ background:var(--color-surface); }
  .st-dot{ flex:none; width:8px; height:8px; border-radius:50%; }
  .st-row-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .st-row-name{ font-size:14px; font-weight:600; color:var(--color-text); }
  .st-row-state{ font-size:12px; color:var(--color-neutral-600); line-height:1.45;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st-row-tag{ flex:none; font-size:11px; font-family:var(--font-mono);
    letter-spacing:.09em; text-transform:uppercase; color:var(--color-neutral-500); }
  .st-row-tag[data-req]{ color:var(--st-amber-fg); font-weight:700; }
  .st-row-chip{ flex:none; font-size:12px; font-weight:700; font-family:var(--font-mono);
    border-radius:0; padding:2px 9px; background:var(--color-accent-200);
    color:var(--color-accent-800); }
  .st-row-go{ flex:none; color:var(--color-neutral-400); font-size:15px; line-height:1; }
  /* ---- people ---- */
  .st-people-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .st-people-count{ font-family:var(--font-heading); font-weight:600; font-size:15px;
    color:var(--color-text); flex:1; }
  .st-people{ display:flex; flex-direction:column; border:1px solid var(--color-divider);
    border-radius:0; overflow:hidden; background:var(--color-surface);
    box-shadow:var(--shadow-sm); }
  .st-person{ display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 14px; border:0; border-bottom:1px solid var(--color-divider);
    background:var(--color-surface); cursor:pointer; font:inherit; color:inherit;
    transition:background .12s; }
  .st-person:last-child{ border-bottom:0; }
  .st-person:hover{ background:var(--color-accent-100); }
  .st-person-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .st-person-name{ font-size:14px; font-weight:600; color:var(--color-text); }
  .st-person-sub{ display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:12px; color:var(--color-neutral-600); }
  /* ---- PEOPLE: the read-only directory ----
     Beside the settings roster deliberately, because they list the same people
     and must not drift apart in look. What differs is what they ARE: that one
     is a column of buttons that open an editor, this one is a table you read.
     So no cursor, no hover tint, no ›, and the only press on the page is a
     mailto — a directory you cannot act on is a list. */
  .dir-card{ border:1px solid var(--color-divider); border-radius:0; overflow:hidden;
    background:var(--color-surface); box-shadow:var(--shadow-sm); }
  .dir-head{ display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--color-divider); background:var(--color-bg); }
  .dir-head-n{ font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--color-neutral-600); }
  .dir-rows{ display:flex; flex-direction:column; }
  .dir-row{ display:flex; align-items:center; gap:11px; padding:10px 14px;
    border-bottom:1px solid var(--color-divider); }
  .dir-row:last-child{ border-bottom:0; }
  .dir-av{ width:30px; height:30px; border-radius:50%; flex:none; display:inline-grid;
    place-items:center; font-size:12px; font-weight:700; font-family:var(--font-mono);
    background:var(--color-accent-200); color:var(--color-accent-800); }
  .dir-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .dir-name{ font-size:14px; font-weight:600; color:var(--color-text); }
  .dir-you{ font-weight:400; color:var(--color-neutral-500); font-size:12px; }
  .dir-title{ font-size:12px; color:var(--color-neutral-600); }
  .dir-role{ flex:none; font-size:12px; font-weight:600; letter-spacing:.04em;
    padding:3px 10px; border-radius:0; background:var(--st-gray-bg); color:var(--st-gray-fg); }
  .dir-mail{ flex:none; width:15rem; max-width:38%; font-size:12px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; text-align:right; }
  .dir-mail a{ color:var(--color-accent-700); text-decoration:none; }
  .dir-mail a:hover{ text-decoration:underline; }
  .dir-none{ color:var(--color-neutral-400); }
  .dir-note{ font-size:12px; color:var(--color-neutral-500); line-height:1.5;
    padding:9px 14px; border-top:1px solid var(--color-divider); margin:0; }
  .dir-empty{ padding:18px 14px; font-size:13px; color:var(--color-neutral-600); margin:0; }
  /* On a narrow window the address drops under the name rather than squeezing
     every column — the same trade the register makes. */
  @media (max-width:719px){
    .dir-row{ flex-wrap:wrap; }
    .dir-mail{ width:100%; max-width:100%; text-align:left; padding-left:41px; }
  }
  .st-chip{ flex:none; font-size:12px; font-weight:700; border-radius:0;
    padding:3px 10px; background:var(--st-green-bg); color:var(--st-green-fg); }
  .st-chip[data-tone="warn"]{ background:var(--st-amber-bg); color:var(--st-amber-fg); }
  /* AN AMBER COUNT WITH NOBODY'S NAME ON IT IS A NUMBER YOU CANNOT ACT ON. */
  .st-banner{ display:flex; align-items:flex-start; gap:10px; border:1px solid var(--st-amber-line);
    background:var(--st-amber-bg); border-left:4px solid var(--st-amber-dot); border-radius:0;
    padding:10px 13px; margin-bottom:12px; font-size:13px; line-height:1.5;
    color:var(--st-amber-fg); }
  .st-banner-ic{ flex:none; color:var(--st-amber-dot); display:inline-flex; margin-top:1px; }
  /* ---- the drawer ---- */
  .st-scrim{ position:fixed; inset:0; background:rgba(15,23,42,.34);
    opacity:0; transition:opacity .18s; z-index:70; }
  .st-scrim.open{ opacity:1; }
  .st-drawer{ position:fixed; top:0; right:0; bottom:0; width:min(560px,100vw);
    display:flex; flex-direction:column; background:var(--color-surface);
    border-left:1px solid var(--color-divider); box-shadow:-18px 0 40px -22px rgba(15,23,42,.45);
    transform:translateX(100%); transition:transform .2s ease; z-index:71; }
  .st-drawer.open{ transform:translateX(0); }
  .st-dhead{ position:relative; flex:none; }
  .st-dhead .rvd-head{ padding-right:44px; }
  .st-dx{ position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:0;
    border:1px solid var(--color-accent-300); background:var(--color-surface); cursor:pointer;
    font-size:13px; line-height:1; color:var(--color-accent-800); }
  .st-dbody{ flex:1; min-height:0; overflow-y:auto; padding:15px 20px; }
  .st-dfoot{ flex:none; display:flex; flex-direction:column; gap:9px;
    padding:12px 20px; border-top:1px solid var(--color-divider); background:var(--color-bg); }
  .st-dfoot-acts{ display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  /* A REFUSAL IS SHOWN IN THE DRAWER, in words, never as a toast over the page
     behind it and never silently — and it sits in the FOOT beside the button it
     refused, not above the fields. Above them it moved everything under it by
     46px the moment it appeared, which is the fault this page was rebuilt to
     stop; pinned in the foot it also cannot be scrolled out of view. */
  .st-refusal{ border:1px solid var(--st-ruby-line); background:var(--st-ruby-bg);
    color:var(--st-ruby-fg); border-radius:0; padding:9px 12px;
    font-size:13px; line-height:1.55; font-weight:600; }
  .st-sec{ margin-bottom:18px; padding-bottom:2px; }
  .st-sec + .st-sec{ border-top:1px solid var(--color-divider); padding-top:15px; }
  .st-sec-h{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono);
    font-weight:600; font-size:14px; color:var(--color-text); margin:0 0 8px; }
  .st-sec-n{ flex:none; width:19px; height:19px; border-radius:50%; display:inline-grid;
    place-items:center; font-size:12px; font-weight:700; background:var(--color-accent-200);
    color:var(--color-accent-800); }
  .st-note{ display:block; font-size:12px; line-height:1.5; color:var(--color-neutral-600);
    margin-top:4px; }
  .st-quiet{ border:1px solid var(--color-divider); background:var(--color-bg);
    border-radius:0; padding:10px 12px; font-size:13px; line-height:1.55;
    color:var(--color-neutral-700); }
  .st-facts{ display:flex; flex-direction:column; gap:5px; font-size:13px; }
  .st-facts > div{ display:flex; align-items:baseline; gap:8px; }
  .st-facts > div > span{ flex:none; min-width:118px; color:var(--color-neutral-600);
    font-size:12px; }
  .st-facts > div > b{ min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; color:var(--color-text); }
  .st-roles{ display:flex; flex-direction:column; gap:6px; }
  .st-role, .st-toggle{ display:flex; align-items:flex-start; gap:9px; padding:9px 11px;
    border:1px solid var(--color-divider); border-radius:0; cursor:pointer;
    font-size:13px; background:var(--color-surface); }
  .st-role:hover, .st-toggle:hover{ border-color:var(--color-accent); }
  .st-role[data-locked]{ cursor:default; opacity:.65; }
  .st-role[data-locked]:hover{ border-color:var(--color-divider); }
  .st-role input, .st-toggle input{ margin-top:2px; flex:none; accent-color:var(--color-accent); }
  .st-role-name{ display:block; font-size:14px; font-weight:600; color:var(--color-text); }
  .st-danger{ margin-top:16px; padding-top:13px; border-top:1px solid var(--color-divider); }
  .st-frow{ display:flex; align-items:center; gap:9px; padding:7px 2px;
    border-bottom:1px solid var(--color-divider); font-size:13px; }
  .st-frow:last-child{ border-bottom:0; }
  .st-fdot{ flex:none; width:9px; height:9px; border-radius:0; }
  .st-fname{ flex:1; min-width:0; font-size:13px; font-weight:600; color:var(--color-text);
    border:1px solid transparent; background:none; border-radius:0; padding:3px 5px;
    font-family:inherit; outline:none; }
  input.st-fname:hover, input.st-fname:focus{ border-color:var(--color-divider);
    background:var(--color-surface); }
  .st-fmeta{ flex:none; font-size:12px; color:var(--color-neutral-600); }
  .st-fdel{ flex:none; border:0; background:none; cursor:pointer; color:var(--color-neutral-500);
    font-size:15px; line-height:1; padding:0 3px; }
  .st-fdel:hover{ color:var(--st-ruby-dot); }
  .st-you{ max-width:620px; }
  /* Below 768 the desktop shell is hidden outright and the phone draws instead
     — its account sheet is where these live there. Said in the stylesheet
     rather than left to a width check in script. */
  @media (max-width:767px){ .st-drawer, .st-scrim{ display:none!important; } }

  /* ---- ON THE CARD ----
     Who wrote it, and the sentence where a verb would have been. Both are the
     smallest type on the card on purpose: the wording is the subject and these
     are the two questions a SHARED draft adds to it, not new subjects of their
     own. */
  .dk-card-by{ display:flex; align-items:center; gap:6px; font-size:12px;
    color:var(--color-neutral-600); margin:0 0 7px; min-width:0; }
  .dk-card-by span:last-child{ min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  .dk-face-sm{ width:18px; height:18px; font-size:8px; box-shadow:none; }
  .dk-card-instead{ font-size:12px; line-height:1.5; color:var(--color-neutral-700);
    background:var(--color-bg); border:1px solid var(--color-divider);
    border-radius:0; padding:6px 9px; margin-top:7px; }
  /* Draft new agreement. Solid green, by the owner's call: starting the next
     agreement is a first-class act here, not a second thought beside whatever
     this one contract happens to need. .ui-btn-primary carries the fill; this
     only stops it being squeezed when the header runs out of room. */
  .room-new{ flex:none; }
  /* The overflow menu. Its items keep the ids they had on the old toolbar, so
     every handler and every test presses exactly the control it always did. */
  /* ---- THE "MORE" BUTTON ---- see the note at its markup (js/views/contract.js).
     It was a bare glyph on a hairline square beside two filled buttons, which
     is how a control comes to read as punctuation. A word, a chevron and a
     border that is actually visible; the caret turns over with the menu. */
  /* ---- IT TAKES .ui-btn-lg's HEIGHT, IT DOES NOT SET ITS OWN (owner-reported
     22 Aug 2026: "the height of the buttons for more, internal review, share,
     publish round should be the same height") ----
     This carried height:34px against .ui-btn-lg's 28 — and against its 30
     before that, so More has been the odd one out on both head rows for as
     long as this class has existed. MEASURED: 34 beside 28, on the contract
     room's head and the negotiation page's alike.
     A BUTTON IN A HEAD ROW HAS NO BUSINESS NAMING ITS OWN HEIGHT. .ui-btn-lg
     is where that number lives, and one class quietly overriding it is how a
     row of four ends up with three heights. The padding and the size stay —
     they are this control's own and they do not fight anything. */
  /* ---- IT WEARS THE ROW'S OWN OUTLINE (owner-reported 23 Aug 2026: "the more
     buttons should have the same color outline like the other buttons") ----
     It carried .ui-btn-plain (no border) and then took a NEUTRAL grey one back,
     so in a row of accent-outlined buttons it was the one grey box. That is
     this product's most-repeated lesson — a neutral-grey control reads as
     furniture — and it applies to an outline as much as to a face.
     BOTH halves go: the class comes off the button in js/views/contract.js and
     the grey override comes off here, so it simply inherits .ui-btn's accent
     border like Share and Draft new agreement beside it. Reaches the contract
     room's head and the negotiation page's, which draw one builder. */
  .ws-more-btn{ padding:0 10px; gap:6px; font-size:14px; }
  .ws-more-btn:hover{ border-color:var(--color-accent); color:var(--color-accent-800); }
  .ws-more-btn .ws-more-caret{ display:inline-flex; transition:transform .15s; }
  .ws-more-btn[aria-expanded="true"]{ border-color:var(--color-accent);
    background:var(--color-accent-100); color:var(--color-accent-800); }
  .ws-more-btn[aria-expanded="true"] .ws-more-caret{ transform:rotate(180deg); }
  /* The word folds away before the button does — a narrow header keeps the
     control and loses the label, never the other way round. */
  @media (max-width:1180px){ .ws-more-btn .ws-more-word{ display:none; }
    .ws-more-btn{ padding:0 8px; } }
  .room-menu{ position:absolute; right:0; top:calc(100% + 6px); z-index:60; min-width:252px;
    background:var(--color-surface); border:1px solid var(--color-divider); border-radius:0;
    box-shadow:0 10px 30px rgba(15,23,42,.16); padding:6px; }
  .room-menu button{ display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    border:0; background:none; cursor:pointer; font:inherit; font-size:14px; font-weight:400;
    color:var(--color-text); border-radius:0; padding:8px 10px; }
  .room-menu button:hover{ background:var(--color-neutral-100); }
  .room-menu button .mnote{ margin-left:auto; font-size:12px; color:var(--color-neutral-500);
    font-weight:400; }
  /* ---- THE SYMBOLS CARRY THE COLOUR, THE WORDS STAY BLACK ----
     These were grey, which made a menu of nine verbs read as one grey block —
     the eye had nothing to aim at and had to read every line to find the one
     it wanted. Coloured marks give each row something to aim at without
     shouting: the colour is on the symbol only, the label stays plain text,
     and the destructive row keeps its red so it can never be mistaken for one
     of the safe ones.

     SOLID, NOT HOLLOW. The app's icons are hairline outlines — 1.6px of stroke
     around empty space — which at 14px is a faint wire drawing that dissolves
     into the row. The insides are filled now and the colour darkened to
     accent-800, so each reads as a small solid glyph: heavier on the page, and
     dark enough to hold its weight beside black text rather than floating off
     it.

     THE STROKE IS KNOCKED OUT IN THE ROW'S OWN COLOUR, and that is the whole
     trick. Filling these paths in one flat colour and leaving the stroke the
     same colour destroys them: Compare versions becomes a plain square, Word
     becomes a rectangle with no fold, the bin loses its lid. Every line that
     made the glyph readable was an INTERIOR line, and a solid fill swallows
     it. Painting the stroke in the surface colour cuts those same lines back
     out as white — so the mark is a solid dark-green shape with its detail
     showing through, which is what a filled icon set actually looks like.

     stroke-width is nudged up for that reason too: a knocked-out line has to
     survive being drawn over a dark ground at 14px. */
  .room-menu button svg,
  .reg-act svg{ flex:none; color:var(--color-accent-800); fill:currentColor;
    stroke:var(--color-surface); stroke-width:1.9; paint-order:stroke fill; }
  .room-menu button:hover svg{ color:var(--color-accent-800); }
  /* ---- THE ONE GLYPH WITH NOTHING TO KNOCK OUT OF ----
     Collapse the header is a single horizontal line. A line encloses no area,
     so the fill above paints nothing and the knock-out stroke paints it in the
     row's own white — an invisible icon, and the row went blank. Anything drawn
     as strokes alone keeps its stroke; there is exactly one, and it is named
     rather than guessed at. */
  /* Ruby beats the accent on both menus, and on hover — hover must never turn
     Delete into a row that looks safe. */
  .room-menu .danger svg,
  .room-menu .danger:hover svg,
  .reg-act.danger svg{ color:var(--st-ruby-fg); }
  /* The register's row menu is the menu in the reference shot — a ⋯ per row on
     a table — and it was six lines of unmarked text. */
  .reg-act:hover{ background:var(--color-neutral-100); }
  /* On the dark paper accent-800 is a near-black green. The ramp inverts for
     the reason every other token does: the mark has to sit ON the ground, not
     sink into it. */
  html.dark .room-menu button svg,
  html.dark .room-menu button:hover svg,
  html.dark .reg-act svg{ color:var(--color-accent-300); }
  .room-menu .mgroup{ font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    color:var(--color-neutral-500); padding:7px 10px 4px; }
  .room-menu hr{ border:0; border-top:1px solid var(--color-divider); margin:5px 4px; }
  .room-menu .danger{ color:var(--st-ruby-fg); }

  /* The rule under the tabs belongs to the ROW, not to the tab group — the row
     runs the full width and the group is only as wide as five words. The tabs
     stretch inside it and pull their own underline down onto that rule. */
  .room-tabrow{ display:flex; align-items:stretch; gap:14px; flex:none;
    border-bottom:1px solid var(--color-divider); }
  .room-tabs{ display:flex; align-items:stretch; align-self:stretch; gap:22px; flex:none; }
  /* WEIGHT IS HALF THE ACTIVE STATE (20 Aug 2026, measured against the SAP
     render, which sets every tab `active ? 700 : 400`). Every tab here used to
     be a flat 600 whatever was selected, so the row carried no weight contrast
     at all — the live tab was told apart by colour and the underline alone,
     and because 600 is the duplex cut it did not even gain width. Regular
     when resting, Bold when live, exactly as the render draws it. */
  /* ---- A RESTING TAB IS DARK INK, NOT A CAPTION (owner-reported 22 Aug 2026:
     "the font type for the tab navigation highlighted should also be similar to
     what we have in the negotiations page") ----
     MEASURED, the two rows already agreed on everything else — 14px resting,
     700 live, the same teal, the same 2px underline — and differed on exactly
     one value: a resting tab here was --color-neutral-500 (the LABEL shade)
     while the negotiation page's reading tabs rest on --color-text. That is the
     four-shades rule this file states elsewhere pointing the wrong way: a tab
     is a thing you read and press, not metadata about one, and at the label
     shade the three resting tabs read as captions under the live one. The live
     state is what marks the live tab; the resting ones do not have to be faded
     as well. */
  .room-tab{ display:flex; align-items:center; gap:6px; border:0; border-radius:0;
    border-bottom:2px solid transparent; background:none; margin-bottom:-1px;
    padding:9px 1px; font:inherit; font-size:14px; font-weight:400; cursor:pointer;
    white-space:nowrap; color:var(--color-text);
    transition:color .13s, border-color .13s; }
  .room-tab:hover{ color:var(--color-text); }
  .room-tab.on{ color:var(--accent-ink); border-bottom-color:var(--accent-solid,var(--color-accent)); font-weight:700; }
  /* .rt-n WAS THE COUNT BESIDE NEGOTIATE and went with that tab (12 Aug 2026).
     No tab carries a count any more, so the rules are deleted rather than left
     to be found and reused by somebody who assumes a tab may still have one.
     The signal itself did not disappear: it reads on the round line under the
     contract's name (.room-sub-needs) and on the sidebar door — a negotiation
     that needs an answer must never be discoverable only by clicking. */

  /* The quiet line under the tabs: one sentence saying what this tab is for,
     and at most one button. Not a card — it explains the page, it is not part
     of it. */
  .room-quiet{ display:flex; align-items:center; gap:9px; flex:none; flex-wrap:wrap;
    background:var(--color-surface); border:1px solid var(--color-divider); border-radius:0;
    padding:7px 13px; font-size:13px; line-height:1.5; color:var(--color-neutral-700); }
  .room-quiet .rq-go{ margin-left:auto; flex:none; }

  /* ---- A COMPLETED TERM, IN THE PROSE IT BELONGS TO ----
     readOnlyDocHtml replaces each field with the text it holds, and that text
     used to arrive in bold monospace — which reads as a code sample. A
     counterparty's NAME set in Courier in the middle of a recital does not
     look like a contract; it looks like a form dump. Same weight and face as
     the sentence around it, marked as a filled term by a quiet accent tint and
     a soft rule underneath, exactly as the live field is marked. The em-dash a
     BLANK term leaves is the one thing that still shouts, because an unfilled
     commercial term is something a reader must be able to point at. */
  .field-frozen{ font-family:inherit!important; font-weight:600;
    color:var(--color-doc-text); background:var(--color-accent-100);
    border-bottom:1.5px solid var(--color-accent-400); border-radius:0;
    padding:0 4px; }
  html.dark .field-frozen{ background:rgb(var(--color-accent-500-rgb)/.15); border-bottom-color:var(--color-accent-500); }
  .field-frozen[title]{ background:var(--st-amber-bg); border-bottom-color:var(--st-amber-dot);
    color:var(--st-amber-fg); font-weight:700; }

  /* ---- THE SIGNATURE BLOCK ----
     One box per party, in signing order. A dashed edge while it is empty — a
     line waiting to be signed on — turning solid and tinted once a mark lands,
     so "who is still missing" reads across the row without any label saying so. */
  /* The block on the left, what is holding it up on the right. Stacks below
     980px, where two columns would leave the signature boxes too narrow to
     hold a drawn mark. */
  /* ---- KEY TERMS: THE FACTS, AND WHAT THEY COMMIT YOU TO ---- */
  /* ---- THE TWO CARDS HAVE A DIVIDER BETWEEN THEM (owner-asked, 19 Aug 2026)
     ----
     "Keep the size of the card on the left intact and next changes the size.
     Add a divider between the two cards so that you can scroll on the right
     hand side especially when you can ran a renewal reason."

     THREE TRACKS, NOT TWO: card · handle · card. The split is set by dragging,
     in pixels written by ktFitSplit, exactly as the negotiation page's divider
     writes its own two columns — one mechanism in this product, not two. The
     fr values below are the fallback the layout holds before any measurement
     and after a stack, so a stage that never measures still draws the old
     proportions.

     THE RIGHT-HAND COLUMN SCROLLS INSIDE ITSELF, which is the half of the ask
     that is not about width: a tall card there — a renewal reasoning that runs
     to a dozen lines — used to grow the row and run off the bottom of the
     window. And the LEFT card is back to its own height (align-self:start),
     reversing the "the two cards square off" rule for this grid: squaring off
     was right when both cards were short lists, and it is what would stretch
     Key terms to the height of whatever the right-hand card has to say. */
  /* ---- THE CARDS FILL THE PAGE MEASURE (owner-asked 23 Aug 2026: "widen the
     cards to resemble the width of the cards in the html in the same page")
     ---- The mock-up's own two-card grid on this page is
     `.h-c2{grid-template-columns:minmax(0,58fr) minmax(0,42fr)}` inside
     `.h-content`, with NO cap of its own: it is as wide as the page minus the
     page's padding, and at the mock-up's 1440 that is 1104px of cards. This
     grid was capped at 1040 and centred, so on a 1500 window it left about
     80px of empty page down each side and the cards were narrower than the
     design's on a wider screen than the design's.

     THE CEILING IS KEPT AND RAISED, not deleted. The mock-up needs no cap
     because an artboard is 1440 wide; a real window is not, and a key-terms
     row stretched across an ultra-wide monitor is a label at one end and its
     value at the other. 1440 is the design's own page width, so the cards fill
     the measure on every laptop this product is used on and stop growing
     exactly where the design stops describing them. */
  .terms-grid{ display:grid;
    grid-template-columns:minmax(0,1.15fr) var(--kt-gap,14px) minmax(0,1fr);
    gap:0; max-width:1440px; width:100%; margin:0 auto;
    /* A DEFINITE HEIGHT IS WHAT MAKES THE RIGHT COLUMN SCROLL. The pane is a
       flex column; taking its height (flex:1, min-height:0) gives the grid a
       bound to scroll inside instead of a height derived from its own tallest
       card — which is the height a long renewal card would have grown without
       limit. If the LEFT card outgrows that bound the pane scrolls, as it
       always did. */
    flex:1; min-height:0; }
  .terms-grid > *:first-child{ align-self:start; }
  .terms-grid #kt-side{ align-self:stretch; min-height:0; overflow-y:auto;
    overscroll-behavior:contain; }
  /* THE COLUMN TAKES THE HEIGHT; THE CARD IN IT TAKES ITS CONTENT. Measured on
     the real page: with the card stretched as well, a short Agreement family
     card became a floor-to-ceiling box with a paragraph at the top of it. The
     COLUMN is what has to be tall — that is what gives a long card somewhere to
     scroll — and the card sizing to its own content is what keeps a short one
     looking finished. The .kt-side-card rules below (a flex column whose list
     scrolls) are untouched and still do their job inside whatever height the
     card ends up with. */
  .terms-grid #kt-side > .kt-side-card{ flex:0 1 auto; }
  /* The handle sits IN the gap it is dividing: it is the whole middle track, so
     there is no separate gutter to keep in step with it. Its grab area is the
     track's full width and the line it draws is 1px in the middle of that. */
  /* The currency search shouts its VALUE, never its prompt — see the note at
     the field. text-transform applies to the placeholder as well, and an inline
     style has no way to say "not that". */
  #st-fx-code::placeholder{ text-transform:none; }
  .kt-resizer{ position:relative; cursor:col-resize; align-self:stretch;
    background:none; border:0; padding:0; touch-action:none; }
  .kt-resizer::before{ content:''; position:absolute; top:2px; bottom:2px;
    left:50%; width:1px; margin-left:-0.5px; background:var(--color-divider);
    border-radius:0; transition:background .12s, width .12s; }
  .kt-resizer:hover::before,.kt-resizer:focus-visible::before,
  .kt-resizer[data-drag]::before{ background:var(--color-accent); width:3px; margin-left:-1.5px; }
  .kt-resizer:focus-visible{ outline:2px solid var(--color-accent); outline-offset:-2px; }
  /* AND IT SAYS WHEN IT WILL NOT GO FURTHER — the negotiation divider's own
     rule: a splitter that stops following the cursor in silence reads as
     broken exactly when somebody is pushing hardest at it. */
  .kt-resizer[data-kt-at-limit]::before{ background:var(--st-amber-dot,#f59e0b); width:3px; margin-left:-1.5px; }
  @media (max-width:980px){
    /* Stacked: one column, no divider, and the pane scrolls as one page again —
       there is no split to set and no second column to scroll inside. */
    .terms-grid{ grid-template-columns:1fr !important; max-width:640px; gap:14px;
      flex:0 0 auto; }
    .terms-grid > *:first-child{ align-self:stretch; }
    .terms-grid #kt-side{ overflow-y:visible; align-self:stretch; }
    .kt-resizer{ display:none; }
  }
  /* ---- A SUMMARY THAT BECOMES A FORM ONE ROW AT A TIME ----
     Values read as values. The row lights faintly on hover to say it can be
     changed, and only the row you press turns into a field. */
  .kt-row{ display:flex; align-items:center; gap:10px; min-height:34px;
    padding:5px 8px; margin:0 -8px; border-radius:0;
    border-bottom:1px solid var(--color-divider); }
  .kt-row:last-of-type{ border-bottom:0; }
  .kt-k{ color:var(--color-neutral-600); font-size:13px; flex:1; min-width:0; }
  .kt-v{ font-size:13px; font-weight:600; text-align:right; min-width:0; max-width:62%; }
  /* ---- AN ENTRY FIELD HAS TO LOOK LIKE ONE WHEN NOBODY IS POINTING AT IT ----
     These values are buttons that open an input, and they were drawn with a
     TRANSPARENT border and no background — the box only appeared on hover. So
     at rest "Not set" was grey text on white with nothing round it, sitting in
     a column of other grey text, and the three empty rows read as a blank gap
     in a table rather than as three things waiting to be filled in. Nobody
     hovers over what they have already decided is a label.
     The box is now there at rest. Filled rows get a quiet one; EMPTY rows get
     a dashed accent one, because those are the ones with something to do.

     AND AN EMPTY BOX IS FIELD-SIZED, not word-sized (Young, 10 Aug 2026:
     "it should be clear that the boxes are entry fields"). The first pass gave
     the empty read a border and stopped — but a border shrink-wrapped around
     the two words "Not set" is a TAG, and tags are what the rest of this panel
     puts values in. What says "type here" is a box with room in it that the
     content does not fill: min-width holds that room open, and the cue icon
     sits at the far end of it, so the eye reads a field with a prompt in it
     rather than a label with a line round it. */
  .kt-row.is-editable .kt-read{ display:inline-flex; align-items:center; gap:6px;
    justify-content:flex-end;
    border:1px solid var(--color-divider); background:var(--color-bg);
    cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:inherit;
    padding:3px 7px; margin:-3px -7px; border-radius:0; text-align:right;
    transition:border-color .12s, background .12s; }
  .kt-row.is-editable .kt-read[data-kt-empty]{ border-style:dashed;
    min-width:138px; justify-content:space-between;
    border-color:color-mix(in srgb,var(--color-accent) 55%,var(--color-divider));
    background:color-mix(in srgb,var(--color-accent) 5%,var(--color-bg)); }
  .kt-row.is-editable .kt-read[data-kt-empty] .kt-none{ color:var(--accent-ink); font-weight:600; }
  /* The cue leads, because it is answering "what goes in here?" and that
     question is asked before the prompt is read. Softer than the words so it
     stays a mark and does not become a second label. */
  .kt-cue{ flex:none; display:inline-flex; color:var(--accent-ink); opacity:.7; }
  .kt-row.is-editable:hover .kt-read[data-kt-empty] .kt-cue,
  .kt-row.is-editable .kt-read[data-kt-empty]:hover .kt-cue{ opacity:1; }
  .kt-row.is-editable:hover .kt-read,
  .kt-row.is-editable .kt-read:hover{ border-style:solid; border-color:var(--color-accent);
    background:var(--color-surface); }
  .kt-row.is-editable .kt-read:focus-visible{ outline:2px solid var(--color-accent); outline-offset:1px; }
  .kt-row .kt-field{ flex:none; min-width:0; max-width:66%; width:100%; }
  .kt-row.is-open{ background:var(--color-bg); }
  .kt-none{ color:var(--color-neutral-400); font-weight:400; }

  /* ---- THE OBLIGATIONS LIST ---- see the note at its markup (js/obligations.js).
     The cap is on the ROWS so the head and the two buttons stay put. 322px is
     four rows and the top of a fifth: a list that ends flush at its boundary
     looks finished, and one that is visibly cut mid-row says "keep going". */
  /* ---- THE TWO CARDS NO LONGER SQUARE OFF, AND THAT IS A REVERSAL ----
     (owner-asked 19 Aug 2026: "keep the size of the card on the left intact".)
     They were stretched to a common height so neither half of the screen ended
     in mid-air. That was right while the right-hand slot held a short list; it
     is wrong now that it can hold a paragraph of renewal reasoning, because the
     card that grows would drag Key terms up with it. The RIGHT-hand column
     stretches and scrolls inside itself (see .terms-grid above), and the left
     card is its own height again.
     The .kt-side-card rules below are unchanged and still do their own job:
     the card fills the column it was given and the list inside it scrolls. */
  .terms-grid{ align-items:start; }
  .kt-side-card{ display:flex; flex-direction:column; min-height:0; flex:1; }
  .kt-side-card > div{ display:flex; flex-direction:column; min-height:0; flex:1; }
  .ob-list{ flex:1; min-height:120px; max-height:322px; overflow-y:auto; padding-right:4px; }
  /* ---- THE OBLIGATIONS CARD IN THE SIDE PANEL ----
     It is the same card, moved whole, into openSidePanel's 400px host. Two
     things that were right in a stretched column are wrong in a panel that
     scrolls on its own: the 322px cap on the rows (a second scrollbar inside a
     scroller, for no reason — the panel has the height) and the flex:1 that
     stretched the list to fill a column this host does not have. Both stand
     down here; neither changes on Key terms, where the card no longer is. */
  #side-panel .ob-list{ flex:0 1 auto; max-height:none; }
  #side-panel #obligations-section > div{ padding:0; }

  /* ---- AGREEMENT FAMILY ---- see renderFamilySection (js/family.js).
     The acts are a row of their own under the head rather than beside the
     title: a standalone agreement offers three of them, and the primary among
     them has to be able to say "Create an amendment" without folding to a stub.
     wrap, so a narrow column drops the third one to a second line instead of
     pushing it out of the card. */
  .fam-acts{ display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 10px; }
  .fam-acts button{ cursor:pointer; }
  /* The family's rows absorb the height the way .ob-list did — a master with
     nine amendments scrolls them rather than growing the card past its
     neighbour. min-height 0 because there is often only one row. */
  .fam-list{ flex:1; min-height:0; overflow-y:auto; padding-right:4px; }
  /* The obligation's own sentence — see the note at the field (js/obligations.js).
     resize:vertical, not both: the dialog is a two-column grid and a textarea
     dragged wider would push the Due date and Recurring pair out of it.

     THREE LINES AT REST, not two. Two showed a sliver of the third — which is
     an honest overflow cue on a long list and reads as broken on a single
     sentence, because the eye takes a half-height row of letters as clipping
     rather than as an invitation. Three holds the common obligation whole:
     the ones in the panel run to about 150 characters. */
