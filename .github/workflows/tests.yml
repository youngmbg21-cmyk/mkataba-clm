# Every check — the proofreader, the node suite, and ALL of the browser
# harnesses — on every piece of work before it merges, and on main every night.
# (Until 13 Nov 2026 it was every push; see WHEN IT RUNS below.)
#
# The browser checks existed and were green-capable for a day while nine of
# them sat red, because they only ran when somebody remembered to run them:
# a deliberate redesign (the floated sheet, the soft-wash verbs, the menu
# rename to "Edit with Copilot") updated the jsdom tests and sailed straight
# past the assertions nobody's routine touched. A check that does not run on
# every change is a diary, not an alarm. This workflow is the alarm.
#
# IT WAS STILL A DIARY FOR FIFTY-THREE OF THEM. This file ran redline-verify
# and selection-verify; the other fifty-three browser harnesses ran only by
# hand, which is the very habit the paragraph above was written about. They
# were left out for a real reason rather than an oversight — each starts a
# Chromium and takes minutes, so run one after another they cost hours — and
# the answer to that is to run them SIDE BY SIDE. test/chromium/run-all.js
# does that, two at a time per machine, and this workflow puts six machines on
# it, so the whole set lands in about the time a single slow one used to take.
#
# DEALT BY TIME, NOT BY NAME (25 Oct 2026, owner-asked "make them faster"):
# run-all.js hands each machine the same amount of work from
# test/chromium/durations.json (seconds per check, read off a green run).
# Dealt round-robin by name, four machines finished at 13.6, 17.9, 18.0 and
# 22.6 minutes — everyone waited for the unlucky one. Six balanced machines
# each get about 12 minutes of checks. The cost: a check now borrows eight of
# the ~20 machines GitHub lends this account (it was six), so two checks can
# run at once without waiting, where three could before.
#
# A FILE THAT IS EXPECTED TO FAIL IS NAMED IN run-all.js's KNOWN_RED, with the
# reason, and is printed on every run. Everything else must pass. That is what
# keeps a red run meaningful: there is nowhere for a new failure to hide.
name: tests

# WHEN IT RUNS (owner, 13 Nov 2026: "yes, start"; the repository is going
# private, where GitHub bills every minute). MEASURED the day before: one run
# is about 110 billed minutes (six browser machines at about 16, the node suite
# 10, the proofreader 2) and it ran about 43 times a day — some 120,000 minutes
# a month against 2,000 free ones. Of the last 100 runs, 28 were main testing
# again what its pull request had just tested, and the rest were every push of
# a branch, finished or not.
#
#   1. A PULL REQUEST: when it is opened, and on every push to it after that.
#      A branch pushed with no pull request runs NOTHING ("push to GitHub"
#      saves the work; "push and merge when green" opens the pull request, and
#      that is the test). GitHub tests the branch AS MERGED INTO MAIN, so two
#      pieces of work that clash show red here. A pull request that conflicts
#      with main is not tested at all until the conflict is resolved.
#   2. EVERY NIGHT, on main (01:17 UTC): the safety net for two merges that
#      each passed alone, and main's daily record — what "red on the base
#      branch too" is measured against. It was one record per merge.
#   3. BY HAND: Actions → tests → Run workflow, on any branch (a risky change
#      before its pull request; a new check that must be seen red on main).
#
# NOT ON PUSH, AND NOT ON MAIN AFTER A MERGE. This REVERSES "push only" of
# 18 Oct 2026, which chose push over pull_request to stop the same commit being
# tested twice; with push gone there is no twin.
#
# A NEWER PUSH CANCELS THE OLDER CHECK of the same pull request (or the same
# branch, for a run started by hand or by the clock), waiting or running.
on:
  pull_request:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The proofreader runs first and alone: it takes seconds, needs no browser,
  # and a name that does not exist is worth knowing before anything is booted.
  lint:
    name: proofreader (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  node:
    name: node suite (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install, not npm ci: the lockfile is deliberately untracked
      # (see .gitignore), so there is nothing for ci to hold the build to.
      - run: npm install
      # The suite's output is kept in a file so that a failure can be NAMED at
      # the end of the log. Twelve thousand tests print thousands of lines, and
      # "fail 1" at the bottom tells nobody which one: for a week in October
      # 2026 main stayed red with one unnamed failing test because the line
      # that named it sat far above what anyone reads. The exit code is the
      # suite's own, not tee's.
      - run: |
          set -o pipefail
          npm test 2>&1 | tee node-suite.log
      - name: name the failing tests
        if: failure()
        run: |
          echo "=== FAILING TESTS (every 'not ok' line, with its reason) ==="
          grep -n -A 12 -E '^\s*not ok ' node-suite.log | grep -v -E '^\S*-\s*(ok |# Subtest|\.\.\.$|---$|type:|duration_ms)' || echo "(no 'not ok' line found — the run died before a result)"

  browser:
    name: browser checks ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      # ONE SHARD'S FAILURE MUST NOT CANCEL THE OTHERS. The point of a run
      # is the whole picture — "these four broke" is a diagnosis, "one broke and
      # we stopped looking" is another push to find out the rest.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # playwright-core ships no browser of its own; the harnesses resolve
      # the registry copy this installs (see EXEC in test/chromium/*.js —
      # the dev sandbox's fixed path wins only where it exists).
      #
      # NO --with-deps (26 Oct 2026, owner-asked). That flag asked Ubuntu's
      # package mirror for 21 MB of fonts the checks never draw (Japanese,
      # Thai, Chinese, Unifont, FreeFont) and an xvfb a headless Chrome never
      # starts; every library Chrome does need was "already the newest
      # version" on ubuntu-latest. MEASURED on runs 4312, 4313 and 4326: on one
      # or two machines in six that apt fetch crawled at 27 kB/s and took 8 to
      # 13 minutes, where Chrome's own 311 MB from Playwright's CDN took 3 s;
      # the whole run waited for that machine, 23 minutes against 13. If a
      # future runner image drops a library Chrome needs, the launch fails on
      # every machine at once and says which — put --with-deps back then.
      - run: npx playwright-core install chromium
      - run: node test/chromium/run-all.js --shard ${{ matrix.shard }}/6 --jobs 2
      # The measurements are numbers, but a failure is usually a LOOK — keep
      # the screenshots so a red run can be seen, not only read.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-screenshots-${{ matrix.shard }}
          path: test/chromium/shots/
          if-no-files-found: ignore
          retention-days: 14
