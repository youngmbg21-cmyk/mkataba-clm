<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HaTi — negotiation room, Chromium verification</title>
<style>
  /* The workspace chrome the room mounts inside. Deliberately minimal: the
     room brings its own stylesheet (js/views/negotiation.js scopes every rule
     to .nego-room / #nego-root) and this page must not supply any of it, or
     the screenshot would be proving this file rather than the component. */
  :root{ --shadow-sm:0 1px 2px rgba(38,55,74,.06); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f2f4f7;color:#2b3440}
  .ui-btn{border:1px solid #d6e0ea;background:#fff;border-radius:7px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .ui-btn-primary{background:#33475c;color:#fff;border-color:#33475c}
  /* Verbatim from index.html. The app's own utility class, which the share
     dialog toggles to switch between its two steps — without it here both
     steps would render at once and the harness would be measuring its own
     omission rather than the product. */
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="app-shell"></div>
<div id="content"></div>
<div id="nego-tab"></div>
<div id="modal-root"></div>

<!-- The application shell's own Copilot panel and stylesheet, lifted OUT OF
     index.html at load rather than copied here.

     Copied markup would drift from the markup that ships, and this harness
     exists to check the room against the real thing. It has to happen before
     js/ai.js runs, because ai.js wires itself to #ai-send, #ai-close and
     friends the moment it loads — so the request is synchronous. That is a
     deliberate choice in a test harness and nowhere else. -->
<script>
(function(){
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/index.html', false);
  xhr.send(null);
  var doc = new DOMParser().parseFromString(xhr.responseText, 'text/html');
  Array.prototype.forEach.call(doc.querySelectorAll('style'), function(st){
    var el = document.createElement('style'); el.textContent = st.textContent;
    document.head.appendChild(el);
  });
  ['ai-scrim', 'ai-panel'].forEach(function(id){
    var node = doc.getElementById(id);
    if (node) document.body.appendChild(document.importNode(node, true));
  });
})();
</script>

<script>
/* The application shell, stood in for. Everything below this line that matters
   is the product's own code, loaded unmodified from js/. */
window.FIRST_PARTY = 'Wanjiru Catering Ltd';
window.PORTAL_MODE = false;
/* A signed-in owner, seeded where js/core.js actually reads it. Assigning
   window.currentUser is not enough: core.js declares it as a lexical `const`,
   so its own callers — buildSharePayload among them — resolve to that binding
   and never see a replacement. Share is an owner action and needs a real one. */
try{
  localStorage.setItem('hati.v1.users', JSON.stringify([{ id:'u_w', name:'Wanjiru Kamau', role:'legal', email:'wanjiru@company.co.ke' }]));
  localStorage.setItem('hati.v1.session', JSON.stringify({ userId:'u_w' }));
}catch(e){}
window.currentUser = () => ({ id:'u_w', name:'Wanjiru Kamau', role:'legal' });
window.canEdit = () => true;
window.isAdmin = () => false;
window.API_MODE = () => false;
window.nowISO = () => new Date('2026-07-27T09:14:00Z').toISOString();
window.todayStr = () => '27 Jul 2026';
window.fmtDT = iso => '27 Jul 2026, 09:14';
window.fmtKES = n => 'KES ' + Number(n||0).toLocaleString('en-KE');
window.icon = () => '<svg width="14" height="14"></svg>';
window.persist = () => {};
window.saveContract = () => {};
window.renderWorkspace = () => {};
window.renderVersionsSection = () => {};
window.renderNegotiationSection = () => {};
window.renderAuditSection = () => {};
window.renderSharesSection = () => {};
window.refreshShareOverview = () => {};
window.setView = () => {};
window.toast = () => {};
window.openModal = html => { document.getElementById('modal-root').innerHTML = html; };
window.closeModal = () => { document.getElementById('modal-root').innerHTML = ''; };
window.confirmDialog = async () => true;
window.promptDialog = async () => '';
window.logAudit = (c, action, detail) => { (c.audit = c.audit || []).push({ at: nowISO(), user: 'Wanjiru Kamau', action, detail }); };
window.isUpload = c => !!(c && c.source === 'upload');
window.emailOff = () => true;
window.counterpartySeenState = () => ({ kind: 'opened' });
window.customTemplates = () => [];
window.uploadMax = () => 25*1024*1024;
</script>

<!-- The product's own modules, in js/app.js order, loaded unmodified. -->
<script src="../../js/components.js"></script>

<script src="../../js/core.js"></script>

<script>
/* core.js defines its own currentUser, canEdit, persist, toast and friends over
   the top of the shell above — which is correct, it IS the product — so the few
   the harness genuinely has to stand in for are re-applied here, AFTER it. Only
   the shell: nothing under test is replaced. */
window.currentUser = () => ({ id:'u_w', name:'Wanjiru Kamau', role:'legal' });
window.canEdit = () => true;
window.persist = () => {};
window.saveContract = () => {};
window.renderWorkspace = () => {};
window.setView = () => {};
window.toast = () => {};
window.emailOff = () => true;
window.counterpartySeenState = () => ({ kind: 'opened' });
window.FIRST_PARTY = 'Wanjiru Catering Ltd';
if (!window.TEMPLATES.WH) window.TEMPLATES.WH = { id:'WH', name:'Warehousing and Logistics Services Agreement', folder:'dist' };
</script>

<script>
/* prototype.html's own contract, verbatim: six clauses numbered 1, 4, 5, 6, 9
   and 12, with the four asks Erik has on the table. */
const CL = [
  ['1','Scope of Services',["The Provider shall receive, store, handle, and dispatch the Client's goods at the designated facility, and shall perform related logistics services including inventory reporting, order picking, and outbound carrier coordination, in accordance with the service schedule in Annex A."]],
  ['4','Payment Terms',['All invoices are payable within thirty (30) days from the date of issue (Net-30). Late payments will incur a service charge of 1.5% per month on the outstanding balance. Invoices shall be issued monthly in arrears and delivered electronically.']],
  ['5','Storage Conditions and Duration',['Stored goods may remain in the facility for a maximum of one hundred and twenty (120) days.',"After that period, the Provider reserves the right to charge additional fees or relocate the goods to an alternative facility at the Client's cost."]],
  ['6','Liability and Insurance',["The Provider's aggregate liability for loss of or damage to stored goods shall not exceed the full replacement value of the affected goods. The Provider shall maintain warehouse legal liability insurance adequate to cover such exposure."]],
  ['9','Termination Notice',["Either party may terminate this Agreement for convenience by giving the other party not less than sixty (60) days' written notice. Termination shall not affect fees accrued for services already rendered."]],
  ['12','Governing Law and Disputes',['This Agreement is governed by the laws of Kenya. Any dispute arising out of or in connection with this Agreement shall first be referred to good-faith negotiation between senior representatives of the parties before any formal proceedings.']],
];
const RICH = '<h1>Warehousing and Logistics Services Agreement</h1>'
  + '<p>Between Wanjiru Catering Ltd (Nairobi, Kenya) and Nordfrakt Logistik AB (Malmö, Sweden) · Drafted in HaTi wizard · Template WH</p>'
  + CL.map(([n,t,body]) => `<h2>Clause ${n} · ${t}</h2>` + body.map(b=>`<p>${b}</p>`).join('')).join('');

const ASKS = {
  '4': ['Payment terms extended from Net-30 to Net-45',
    '<p>All invoices are payable within forty-five (45) days from the date of issue (Net-45). Late payments will incur a service charge of 1.5% per month on the outstanding balance. Invoices shall be issued monthly in arrears and delivered electronically.</p>'],
  '5': ['Storage term reduced to 90 days with extended-stay premium',
    '<p>Stored goods may remain in the facility for a maximum of ninety (90) days. Any extension beyond 90 days will incur a 1.25% premium rate.</p><p>After that period, the Provider reserves the right to charge additional fees or relocate the goods to an alternative facility at the Client\'s cost.</p>'],
  '6': ['Liability capped at EUR 250,000 per contract year',
    "<p>The Provider's aggregate liability for loss of or damage to stored goods shall not exceed EUR 250,000 in the aggregate per contract year. The Provider shall maintain warehouse legal liability insurance adequate to cover such exposure.</p>"],
  '9': ['Termination notice shortened from 60 to 30 days',
    "<p>Either party may terminate this Agreement for convenience by giving the other party not less than thirty (30) days' written notice. Termination shall not affect fees accrued for services already rendered.</p>"],
};

window.READY = (async () => {
  const c = { id:'MK-191', name:'Warehousing and Logistics Services Agreement',
    counterparty:'Nordfrakt Logistik AB', template:'WH', status:'Under Review',
    folder:'dist', fields:{}, metadata:{}, audit:[], rounds:[], versions:[],
    signatures:[], comments:[], redlineText: RICH, format:'rich' };
  negoInit(c);
  for (const [num, [summary, body]] of Object.entries(ASKS)){
    const cl = negoClauseList(c).find(x => x.num === num);
    await negoEditClause(c, cl.clauseId, body,
      { side:'counterparty', author:'Erik Lindqvist · Nordfrakt Logistik AB', summary });
  }
  negoPostComment(c, negoChanges(c)[0].id,
    'Our AP cycle runs monthly — Net-30 forces out-of-cycle payments. Net-45 matches every other supplier we run.',
    { side:'counterparty', author:'Erik Lindqvist' });
  await negoRefreshVerification(c);
  window.CONTRACT = c;
  openNegotiationRoom(c, { side:'owner', by:'Wanjiru Kamau', persist:false,
    /* The same hook js/views/contract.js supplies — the room renders Share
       Link, it does not implement sharing. Without it the button is inert, and
       the harness would be measuring its own omission. */
    onShareLink: x => openShareModal(x) });
  return true;
})();
</script>
</body>
</html>
