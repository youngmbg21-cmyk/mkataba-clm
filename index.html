<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HaTi — Contract Lifecycle Management</title>
<script>
  // Apply the saved theme BEFORE first paint. This runs ahead of the
  // stylesheet on purpose: set it any later and every visitor on Navy or Dark
  // gets one frame of green first, which reads as a flicker on every load.
  //
  // Deliberately duplicated from THEMES in js/app.js rather than shared —
  // nothing is loaded yet, so there is nothing to share with. Three keys and
  // two lines; if a fourth theme is ever added, it is added here too.
  // 'light' is what the old two-position switch wrote and is still in
  // people's browsers; it means green.
  try{
    var t = localStorage.getItem('hati-theme') || 'green';
    if (t === 'light') t = 'green';
    if (t === 'dark') document.documentElement.classList.add('dark');
    else if (t === 'navy') document.documentElement.setAttribute('data-brand', 'navy');
  }catch(e){}
</script>
<script>
  // HaTi — CLM redesign (teal brand on slate, light/dark via the `dark` class).
  // Inter / Plus Jakarta Sans typography, white surfaces on slate-50, a teal
  // accent (#0d9488), 12px radii and an amber / emerald / rose status model.
  // The Tailwind palette below is repointed onto the new tokens so class-based
  // views inherit the flip; new work sources exact values from the CSS
  // variables in :root (with dark overrides under html.dark).
  window.__twConfig = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: {
        display: ['"Plus Jakarta Sans"','system-ui','sans-serif'],
        heading: ['"Plus Jakarta Sans"','system-ui','sans-serif'],
        serif:   ['Inter','system-ui','sans-serif'],
        sans:    ['Inter','system-ui','sans-serif'],
        // `font-mono` marks data (ids, counts, timestamps) in this codebase,
        // not code — so it resolves to the figure face, same as --font-mono.
        mono:    ['Inter','system-ui','sans-serif'],
        code:    ['ui-monospace','SFMono-Regular','Menlo','Monaco','Consolas','"Liberation Mono"','"Courier New"','monospace'],
      },
      colors: {
        canvas:'#f8fafc',     // page ground (slate-50)
        ink:'#1e293b',        // text
        // teal brand ramp (HaTi redesign)
        brand:{50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a',accent:'#06b6d4',purple:'#8b5cf6'},
        // amber (In Review / pending)
        gold:{300:'#fde68a',400:'#f59e0b',500:'#f59e0b',600:'#b45309'},
        // rose (Closed / Expired / risk / danger)
        rose:{50:'#fff1f2',100:'#ffe4e6',200:'#fecdd3',300:'#fda4af',400:'#fb7185',500:'#f43f5e',600:'#e11d48',700:'#be123c',900:'#881337'},
        // emerald (Executed / active)
        emerald:{50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857'},
        // chrome tokens (hairline dividers)
        hair:'#e2e8f0',
        line:'#cbd5e1',
        inputln:'#cbd5e1',
        faint:'#f8fafc',
        docbg:'#f8fafc',
        amber:'#f59e0b',
        danger:'#dc2626',
      },
    }},
  };
</script>

<!-- The design's two faces, and only those: Inter for body copy, Plus Jakarta
     Sans for headings. Served from the repo rather than Google Fonts so the
     platform renders identically offline, behind a restrictive network and
     inside a strict content policy — a silent fallback to a system face is the
     exact drift this redesign removes. See fonts/fonts.css. -->


<!-- The separate document faces (Google Sans Flex / Google Sans Code) are
     retired: the platform runs on the design's two families throughout, contract
     text included, so --font-doc now resolves to Inter. -->

<style>

     ============================================================ */
  :root{
    --color-bg:#f8fafc;

    --color-accent:var(--color-accent-600);
    --color-divider:#e2e8f0;

    --color-neutral-100:#f1f5f9; --color-neutral-200:#e2e8f0; --color-neutral-300:#cbd5e1;
    --color-neutral-400:#94a3b8; --color-neutral-500:#64748b; --color-neutral-600:#475569;
    --color-neutral-700:#334155; --color-neutral-800:#1e293b; --color-neutral-900:#0f172a;

    --color-accent-100:#ccfbf1; --color-accent-200:#99f6e4; --color-accent-300:#5eead4;
    --color-accent-400:#2dd4bf; --color-accent-500:#14b8a6; --color-accent-600:#0d9488;
    --color-accent-700:#0f766e; --color-accent-800:#115e59; --color-accent-900:#134e4a;
    /* ---- THE SAME RAMP, AS CHANNELS ----
       Tailwind compiles `bg-brand-600` to `rgb(var(--color-accent-600-rgb)/var(--tw-bg-opacity))`
       so that `/60` opacity modifiers work. A hex cannot go inside that; the
       three numbers can. Every compiled brand class now reads these, which is
       what makes 493 utility classes follow the theme instead of ignoring it.
       They are the SAME colours as the hex ramp above — change both together,
       or the platform will disagree with itself about what its colour is. */
    --color-accent-50:#f0fdfa;
    --color-accent-50-rgb:240 253 250;   --color-accent-100-rgb:204 251 241;
    --color-accent-200-rgb:153 246 228;  --color-accent-300-rgb:94 234 212;
    --color-accent-400-rgb:45 212 191;   --color-accent-500-rgb:20 184 166;
    --color-accent-600-rgb:13 148 136;   --color-accent-700-rgb:15 118 110;
    --color-accent-800-rgb:17 94 89;     --color-accent-900-rgb:19 78 74;

    /* solid brand fills that must NOT flip with the theme (nav active, primary
       buttons, the Copilot header) — always teal, always white-on-top */
    --accent-solid:var(--color-accent-600); --accent-solid-hover:var(--color-accent-700);
    /* The gradient's second colour is a cyan that is not on the accent ramp —
       it is the brand's companion hue, so it gets a name of its own rather than
       being hidden inside a gradient nobody can find. */
    --brand-cyan:#06b6d4; --brand-cyan-600:#0891b2;
    /* The dashboard's welcome band. It was a gradient typed into the middle of
       the markup — the single most brand-defining thing on the platform, and
       the one place a colour change could not reach. */
    /* Its own deep stop, NOT --nav-bg. The two are the same colour in light
       mode, which is why reaching for the sidebar's token looked right — but
       --nav-bg goes darker under the dark theme and this band never did. The
       verifier caught it as one shade on one screen. A colour that happens to
       match is not the same colour. */
    --brand-hero-deep:#0b3d3a;
    --brand-hero:linear-gradient(120deg,var(--brand-hero-deep) 0%,var(--color-accent-600) 62%,var(--brand-cyan-700) 100%);
    --brand-cyan-700:#0aa2b8;
    --brand-grad:linear-gradient(135deg,var(--color-accent-600),var(--brand-cyan));

    /* HOW TALL A FULL-HEIGHT VIEW MAY BE. The views that fill the window —
       the register, the calendar, the workspace, the queue — used to subtract a
       hardcoded 52px, which was already the wrong number and became wronger
       when the command strip was replaced by a per-page header whose height
       depends on whether the page has a subtitle and whether it wraps.
       renderPageHeader measures the scroll container and writes the real value
       here after every render; this is only the value before the first one. */
    --view-h:calc(100vh - 126px);

    /* HOW WIDE THE ACTIVITY COLUMN IS. This was a hard number baked into the
       shell markup (292px), which — together with the sidebar — is why a
       smaller laptop squeezed the middle until content fell off the edge with
       no scrollbar to reach it. It is a token now, retuned per
       breakpoint in the RESPONSIVE SHELL block further down. The values here
       are exactly what shipped before, so the standard-desktop layout is
       unchanged. --shell-panel-w is read by applyPanelLayout (js/app.js),
       which is the ONLY writer of #body-grid's columns — it writes an inline
       style, so a media query aimed at that element would silently lose. */
    --shell-panel-w:292px;
    --font-heading:"Plus Jakarta Sans",Inter,system-ui,sans-serif;
    --font-body:Inter,system-ui,sans-serif;
    /* THE FIGURE FACE, not a code face. This token is used ~160 times for
       reference ids, dates, day counts and money — data, not code — and the
       design sets all of that in Inter. Pointing it at a monospace stack made
       every zero in the product a slashed or dotted zero (SF Mono, Consolas and
       DejaVu Sans Mono all draw one), so "0" in a metric did not match "0" in
       the sentence beside it. Inter's digits are uniform-width by default, so
       columns still line up without borrowing a typewriter face to do it. */
    --font-mono:Inter,system-ui,sans-serif;
    /* True monospace, kept for the two things that are genuinely code: a
       SHA-256 fingerprint and a keyboard chip. */
    --font-code:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;

    /* The DOCUMENT faces. These apply to contract text only — the pane you
       read a contract in, the counterparty portal, the template preview and
       the PDF export.
       They used to be a separate pair (Google Sans Flex / Google Sans Code) so
       that "the product" and "the paper" were distinguishable at a glance. The
       redesign runs one type system end to end, so they now resolve to the
       interface faces. Contract text is still governed by its own tokens — the
       .doc-surface size, leading and ink below are unchanged — so the paper
       keeps its own measure even though it shares a family with the app. */
    --font-doc:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-doc-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;

    /* Document text colour. A solid token, deliberately NOT an opacity
       modifier. `text-brand-800/85` composited the blue-grey #2c455d onto the
       #fbfbfc document page and landed at 6.29:1 — under WCAG AAA's 7:1 for
       body copy, and the /65 and /60 labels beside it were 3.67:1 and 3.24:1,
       under AA's 4.5:1. Opacity also means the same class reads differently on
       every background it lands on, which is why the fix is a colour and not a
       smaller number. Measured ratios are in SUMMARY.md.
         --color-doc-text  #15181a on #fbfbfc = 17.25:1  (17.84:1 on white)
         --color-doc-muted #4a4f54 on #fbfbfc =  8.00:1
       Both are measured with the WCAG relative-luminance formula, not judged
       by eye. See also print-color-adjust, further down. */
    --color-doc-text:#15181a;
    --color-doc-muted:#4a4f54;         /* secondary document copy only */
    --color-doc-rule:#c9ccd1;
    /* The sheet itself. Views must paint the paper with this token — never a
       literal #fbfbfc — so the document joins the theme flip. Print pins it
       back to white (see @media print). */
    --color-doc-surface:#fbfbfc;

    --space-1:3.4px; --space-2:6.8px; --space-3:10.2px; --space-4:13.6px; --space-6:20.4px; --space-8:27.2px;
    --radius-sm:8px; --radius-md:12px; --radius-lg:12px;

    --shadow-sm:0 1px 2px rgba(15,23,42,.05), 0 10px 26px -12px rgba(15,23,42,.18);
    --shadow-md:0 4px 10px rgba(15,23,42,.07), 0 18px 40px -14px rgba(15,23,42,.25);
    --shadow-lg:0 12px 32px color-mix(in srgb,#0f172a 22%,transparent);

    /* legacy elevation aliases kept so un-migrated views still separate cleanly */
    --ring:0 0 0 1px var(--color-divider);
    --sh1:var(--shadow-sm); --sh2:var(--shadow-sm); --sh3:var(--shadow-md); --sh4:var(--shadow-lg);
    --focus:0 0 0 2px color-mix(in srgb,var(--color-accent) 45%,transparent);
    --ease:cubic-bezier(.2,.7,.3,1);

    /* danger / destructive-action tone (used by confirmDialog, delete, decline) */
    --danger:#dc2626; --danger-hover:#b91c1c; --red-tint:rgba(220,38,38,.1);

    /* status palette (wash bg / fg / dot / line for bordered callouts) */
    --st-gray-bg:#f1f5f9;  --st-gray-fg:#475569;  --st-gray-dot:#94a3b8;  --st-gray-line:#cbd5e1;
    --st-amber-bg:#fef3c7; --st-amber-fg:#b45309; --st-amber-dot:#f59e0b; --st-amber-line:#e0c48a;
    --st-green-bg:#d1fae5; --st-green-fg:#047857; --st-green-dot:#10b981; --st-green-line:#a8cbb8;
    --st-ruby-bg:#ffe4e6;  --st-ruby-fg:#be123c;  --st-ruby-dot:#f43f5e;  --st-ruby-line:#e6c9c1;
    --st-steel-bg:var(--color-accent-100); --st-steel-fg:var(--color-accent-800); --st-steel-dot:var(--color-accent-500); --st-steel-line:var(--color-accent-200);

    /* tone tiles (icon tiles: tile-bg / tile-fg) */
    --tile-steel-bg:var(--color-accent-100);   --tile-steel-fg:var(--color-accent-800);
    --tile-emerald-bg:#d1fae5; --tile-emerald-fg:#047857;
    --tile-amber-bg:#fef3c7;   --tile-amber-fg:#b45309;
    --tile-ruby-bg:#ffe4e6;    --tile-ruby-fg:#be123c;

    /* tone gradients (hero stat cards only) */
    --grad-steel:linear-gradient(135deg,var(--color-accent-500),var(--brand-cyan-600));
    --grad-emerald:linear-gradient(135deg,#34d399,#059669);
    --grad-amber:linear-gradient(135deg,#fbbf24,#d97706);
    --grad-ruby:linear-gradient(135deg,#fb7185,#e11d48);
  }

  /* ============================================================
     DARK THEME — html.dark (toggled from the top header, persisted
     as 'hati-theme'). Everything on screen flips, the document
     included: in dark mode the contract pane is a dark surface with
     light ink, set apart from the app by its border and shadow — the
     HaTi reference treats the paper as part of the theme, not an
     exemption. Only print/PDF stays ink-on-white (see @media print).
     Anything reading these tokens inherits a coherent dark
     automatically.
     ============================================================ */
  html.dark{
    --color-bg:#020617;
    --color-surface:#0f172a;
    --color-text:#e2e8f0;
    --color-divider:#1e293b;

    --color-doc-text:#e2e8f0;
    --color-doc-muted:#94a3b8;
    --color-doc-rule:#334155;
    --color-doc-surface:#0f172a;

    --color-neutral-100:#1e293b; --color-neutral-200:#334155; --color-neutral-300:#475569;
    --color-neutral-400:#64748b; --color-neutral-500:#94a3b8; --color-neutral-600:#94a3b8;
    --color-neutral-700:#cbd5e1; --color-neutral-800:#e2e8f0; --color-neutral-900:#f1f5f9;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -12px rgba(0,0,0,.55);
    --shadow-md:0 4px 10px rgba(0,0,0,.45), 0 18px 40px -14px rgba(0,0,0,.6);
    --shadow-lg:0 12px 32px rgba(0,0,0,.6);

    --st-gray-bg:rgba(148,163,184,.14);  --st-gray-fg:#94a3b8;  --st-gray-dot:#64748b;  --st-gray-line:rgba(148,163,184,.3);
    --st-amber-bg:rgba(245,158,11,.15);  --st-amber-fg:#fbbf24; --st-amber-dot:#f59e0b; --st-amber-line:rgba(245,158,11,.35);
    --st-green-bg:rgba(16,185,129,.15);  --st-green-fg:#34d399; --st-green-dot:#10b981; --st-green-line:rgba(16,185,129,.35);
    --st-ruby-bg:rgba(244,63,94,.15);    --st-ruby-fg:#fb7185;  --st-ruby-dot:#f43f5e;  --st-ruby-line:rgba(244,63,94,.35);
    --st-steel-bg:rgb(var(--color-accent-500-rgb)/.15);  --st-steel-fg:var(--color-accent-300); --st-steel-dot:var(--color-accent-500); --st-steel-line:rgb(var(--color-accent-500-rgb)/.35);

    --tile-steel-bg:rgb(var(--color-accent-500-rgb)/.16);  --tile-steel-fg:var(--color-accent-300);
    --tile-emerald-bg:rgba(16,185,129,.16);--tile-emerald-fg:#34d399;
    --tile-amber-bg:rgba(245,158,11,.16);  --tile-amber-fg:#fbbf24;
    --tile-ruby-bg:rgba(244,63,94,.16);    --tile-ruby-fg:#fb7185;
  }

  *,*::before,*::after{box-sizing:border-box;}
  .hidden{display:none!important;}
  /* OI-5: a deletion directly followed by its replacement rendered
     </del><ins> welded together — "…days (Net-30).forty-five (45)…". The
     seam is opened here, in CSS, and ONLY here: a character injected by the
     renderer would leak into every text projection, export and copy (f36
     pins that). Classed marks only, so Word-imported or hand-written
     del/ins in stored content are left exactly as authored. */
  del[class]+ins[class]{margin-inline-start:.3em;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    color:var(--color-text);
    font-family:var(--font-body);
    background:var(--color-bg);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    /* 100dvh, not 100vh: on a phone 100vh includes the retracting address bar,
       so a full-height view is cut off by exactly that bar's height until you
       scroll. dvh is the visible viewport. The vh line stays first as the
       fallback for anything that does not know dvh. */
    min-height:100vh; min-height:100dvh;
    /* A BARELY-PERCEPTIBLE FLUID BASE, not a rescale. 13px was a hard number;
       this firms text up a touch on a small laptop and relaxes it on a large
       monitor, staying inside half a pixel of the designed size at 1440. The
       dense 10-13px interface type is deliberately NOT scaled — that density
       is the design. */
    font-size:clamp(12.5px, 12px + 0.12vw, 14px); line-height:1.5;
  }
  h1,h2,h3,h4,h5,h6,.font-display{font-family:var(--font-heading);font-weight:600;letter-spacing:-0.01em;}
  a{color:var(--color-accent-700);}
  a:hover{color:var(--color-accent-800);}
  ::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent);}
  input::placeholder,textarea::placeholder{color:var(--color-neutral-500);}

  /* elevation utilities (mapped onto the Industry shadow scale) */
  .elev-1{box-shadow:var(--shadow-sm)} .elev-2{box-shadow:var(--shadow-sm)}
  .elev-3{box-shadow:var(--shadow-md)} .elev-4{box-shadow:var(--shadow-lg)}
  .lift{transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .15s}
  .lift:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .tnum{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  button,[role=button]{transition:background .15s,color .15s,box-shadow .15s,border-color .15s}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px;}

  /* ---- soft card frame: the old "blueprint" corner-registration marks are
     retired in favour of larger radii + diffuse layered shadows. The corner
     adornments are hidden; the element and its (now soft) border remain. ---- */
  .blueprint{position:relative;border:1px solid var(--color-divider);}
  .blueprint>.corner{display:none;}

  /* card rounding */
  .bp-round{border-radius:10px;}
  /* the Doc right panel is a scrolling flex column; its cards carry
     overflow:hidden (→ flex min-height:0), so pin flex-shrink to stop them
     collapsing to zero height when the content is taller than the panel */
  #doc-right>*{flex-shrink:0;}

  /* status badge — pill-shaped chip (optional leading dot) */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap;font-family:var(--font-body);}
  .badge>.dot{width:6px;height:6px;border-radius:50%;flex:none;}

  /* scan-finding severity (SEV_META in js/ai.js) — status tokens, so the
     chips re-map in dark mode like every other status wash */
  .sev-high{background:var(--st-ruby-bg);color:var(--st-ruby-fg);border-color:var(--st-ruby-line);}
  .sev-med{background:var(--st-amber-bg);color:var(--st-amber-fg);border-color:var(--st-amber-line);}
  .sev-low{background:var(--st-gray-bg);color:var(--st-gray-fg);border-color:var(--st-gray-line);}
  .sev-dot-high{background:var(--st-ruby-dot);}
  .sev-dot-med{background:var(--st-amber-dot);}
  .sev-dot-low{background:var(--st-gray-dot);}
  .sev-text-high{color:var(--st-ruby-fg);}
  .sev-text-med{color:var(--st-amber-fg);}
  .sev-text-low{color:var(--st-gray-fg);}

  /* shared compact contract row (contractRow in js/components.js) */
  .crow{border-bottom:1px solid var(--color-divider);}
  .crow:last-child{border-bottom:0;}
  .crow:hover{background:color-mix(in srgb,var(--color-accent) 7%,transparent);}

  /* ============================================================
     DARK RE-MAP FOR COMPILED UTILITIES.
     The Tailwind sheet above was compiled without dark: variants, so every
     bg-white / text-ink / border-hair in the older markup is a light-mode
     literal. These overrides give those utilities their dark meaning in one
     place — html.dark + class outranks the single-class utility — so views
     built on them join the theme without per-call-site edits. New work
     should still source the CSS variables directly.
     ============================================================ */
  /* surfaces */
  html.dark .bg-white{background-color:var(--color-surface);}
  html.dark .bg-canvas,html.dark .bg-docbg,html.dark .bg-slate-50{background-color:var(--color-bg);}
  html.dark .bg-canvas\/60,html.dark .bg-slate-50\/60{background-color:color-mix(in srgb,var(--color-bg) 60%,transparent);}
  html.dark .bg-slate-200{background-color:var(--color-neutral-200);}
  html.dark .bg-brand-50,html.dark .bg-brand-50\/30,html.dark .bg-brand-50\/40,html.dark .bg-brand-50\/50{background-color:rgb(var(--color-accent-500-rgb)/.08);}
  html.dark .bg-brand-100{background-color:rgb(var(--color-accent-500-rgb)/.16);}
  html.dark .bg-emerald-50,html.dark .bg-green-100{background-color:var(--st-green-bg);}
  html.dark .bg-rose-50,html.dark .bg-red-100{background-color:var(--st-ruby-bg);}
  html.dark .bg-blue-50{background-color:rgba(59,130,246,.15);}
  html.dark .bg-indigo-100{background-color:rgba(99,102,241,.18);}
  html.dark .from-brand-50{--tw-gradient-from:rgb(var(--color-accent-500-rgb)/.10) var(--tw-gradient-from-position);--tw-gradient-to:rgb(var(--color-accent-500-rgb)/0) var(--tw-gradient-to-position);}
  html.dark .to-white{--tw-gradient-to:var(--color-surface) var(--tw-gradient-to-position);}
  /* ink */
  html.dark .text-ink,html.dark .text-brand-900,html.dark .text-brand-800{color:var(--color-text);}
  html.dark .text-brand-800\/85{color:color-mix(in srgb,var(--color-text) 85%,transparent);}
  html.dark .text-brand-800\/80,html.dark .text-ink\/80{color:color-mix(in srgb,var(--color-text) 80%,transparent);}
  html.dark .text-brand-800\/75{color:color-mix(in srgb,var(--color-text) 75%,transparent);}
  html.dark .text-brand-800\/70,html.dark .text-ink\/70{color:color-mix(in srgb,var(--color-text) 72%,transparent);}
  html.dark .text-brand-800\/65,html.dark .text-ink\/65{color:color-mix(in srgb,var(--color-text) 68%,transparent);}
  html.dark .text-brand-800\/60,html.dark .text-ink\/60{color:color-mix(in srgb,var(--color-text) 64%,transparent);}
  html.dark .text-ink\/55{color:color-mix(in srgb,var(--color-text) 58%,transparent);}
  html.dark .text-ink\/50{color:color-mix(in srgb,var(--color-text) 54%,transparent);}
  html.dark .text-brand-800\/45,html.dark .text-ink\/45{color:color-mix(in srgb,var(--color-text) 50%,transparent);}
  html.dark .text-ink\/40{color:color-mix(in srgb,var(--color-text) 46%,transparent);}
  html.dark .text-brand-800\/35{color:color-mix(in srgb,var(--color-text) 42%,transparent);}
  html.dark .text-brand-700,html.dark .text-brand-600{color:var(--color-accent-400);}
  html.dark .text-gold-600{color:var(--st-amber-fg);}
  html.dark .text-emerald-700,html.dark .text-green-800{color:var(--st-green-fg);}
  html.dark .text-rose-600,html.dark .text-rose-700,html.dark .text-rose-800,html.dark .text-rose-700\/80,html.dark .text-red-800{color:var(--st-ruby-fg);}
  html.dark .text-blue-900{color:#93c5fd;}
  html.dark .text-indigo-800{color:#a5b4fc;}
  /* hairlines */
  html.dark .border-hair,html.dark .border-line,html.dark .border-inputln,
  html.dark .border-slate-200,html.dark .border-slate-300,
  html.dark .border-brand-100,html.dark .border-brand-100\/50,html.dark .border-brand-100\/60,
  html.dark .border-brand-200{border-color:var(--color-divider);}
  html.dark .border-brand-300{border-color:rgb(var(--color-accent-500-rgb)/.4);}
  html.dark .border-emerald-200{border-color:var(--st-green-line);}
  html.dark .border-rose-200{border-color:var(--st-ruby-line);}
  html.dark .border-blue-200{border-color:rgba(59,130,246,.35);}
  /* interactive states */
  html.dark .hover\:bg-brand-50:hover,html.dark .hover\:bg-brand-50\/50:hover,html.dark .hover\:bg-brand-50\/60:hover{background-color:rgb(var(--color-accent-500-rgb)/.12);}
  html.dark .hover\:bg-slate-50:hover{background-color:var(--color-neutral-100);}
  html.dark .hover\:bg-rose-50:hover{background-color:var(--st-ruby-bg);}
  html.dark .hover\:text-brand-800:hover,html.dark .hover\:text-brand-900:hover{color:var(--color-accent-300);}
  html.dark .hover\:text-ink:hover{color:var(--color-text);}
  html.dark .hover\:text-ink\/70:hover{color:color-mix(in srgb,var(--color-text) 72%,transparent);}
  html.dark .hover\:border-indigo-300:hover{border-color:rgba(99,102,241,.5);}

  /* buttons */
  .ui-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:13px;line-height:1.2;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:8px;padding:6px 12px;transition:background .15s,border-color .15s,color .15s;}
  .ui-btn:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent);}
  .ui-btn-primary{background:var(--accent-solid);color:#fff;border-color:var(--accent-solid);box-shadow:0 4px 14px -4px color-mix(in srgb,var(--accent-solid) 55%,transparent);}
  .ui-btn-primary:hover{background:var(--accent-solid-hover);}
  /* Secondary action beside a primary: outlined in the accent so it reads as
     a button against the page background, without competing with the filled
     primary next to it. */
  .ui-btn-secondary{color:var(--color-accent-700);border-color:color-mix(in srgb,var(--accent-solid) 45%,transparent);}
  .ui-btn-secondary:hover{background:color-mix(in srgb,var(--accent-solid) 9%,transparent);border-color:var(--accent-solid);}
  .ui-btn:disabled{opacity:.45;cursor:not-allowed;}

  /* view enter */
  .view-enter{animation:viewIn .24s var(--ease);}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  /* `backwards` (not `forwards`) so the row settles to its normal static state
     after the intro — a lingering forwards-filled transform animation keeps a
     stacking context on every row, which traps absolute popovers (e.g. the row
     ⋯ menu) behind later rows and makes them look transparent. */
  .stagger>*{animation:rowIn .34s var(--ease) backwards}
  @keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  /* The intro plays for a NAVIGATION, not for a repaint. Every render rebuilds
     its view from scratch, so to the browser a background refresh, a theme
     flip or a search keystroke is indistinguishable from arriving at the page
     — and the whole screen replayed the fade-and-slide, reading as a flash of
     reload. setView marks #content with this class for same-view repaints
     (and once a navigation's intro has finished), so only a genuine change of
     page animates and everything else holds still. */
  .no-view-anim .view-enter,.no-view-anim .stagger>*{animation:none!important;}

  /* live ping (workspace status + activity live dots) */
  @keyframes livePing{0%{box-shadow:0 0 0 0 rgb(var(--color-accent-600-rgb)/.45)}70%{box-shadow:0 0 0 6px rgb(var(--color-accent-600-rgb)/0)}100%{box-shadow:0 0 0 0 rgb(var(--color-accent-600-rgb)/0)}}
  .live-ping{animation:livePing 2.4s infinite;}
  .live-dot{position:relative;}
  .live-dot::after{content:'';position:absolute;inset:-3px;border-radius:9999px;background:currentColor;opacity:.35;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;}
  @keyframes ping{75%,100%{transform:scale(2.1);opacity:0;}}

  /* scrollbars */
  /* Thin means thin. At 9px with a full-width thumb these read as a second
     border down the inside of every card — three of them across the pipeline
     alone. The bar keeps its full hit area; only the thumb is drawn narrow,
     inset from the track by a transparent border, so it is still easy to grab
     and no longer competes with the card's own edge. */
  .scroll-thin::-webkit-scrollbar{width:9px;height:9px;}
  .scroll-thin::-webkit-scrollbar-thumb{background:var(--color-neutral-300);border-radius:999px;
    border:2px solid transparent;background-clip:content-box;}
  .scroll-thin::-webkit-scrollbar-thumb:hover{background:var(--color-neutral-400);background-clip:content-box;}
  .scroll-thin::-webkit-scrollbar-track{background:transparent;}
  /* Firefox has no thumb geometry of its own — this is the whole control. */
  .scroll-thin{scrollbar-width:thin;scrollbar-color:var(--color-neutral-300) transparent;}
  main{scrollbar-width:thin;scrollbar-color:var(--color-neutral-300) transparent;}

  /* ============================================================
     SHELL — top header / sidebar / command bar / context panel
     ============================================================ */
  .nav-item{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:1px solid transparent;background:none;color:var(--color-neutral-600);font:inherit;font-family:var(--font-body);font-size:12px;font-weight:600;padding:9px 12px;cursor:pointer;text-align:left;border-radius:12px;transition:background .12s,color .12s,border-color .12s;}
  .nav-item .nav-rail{position:absolute;left:0;top:4px;bottom:4px;width:2px;background:transparent;border-radius:2px;}
  .nav-item svg,.nav-item i{flex:none;opacity:.85;}
  .nav-item:hover{background:var(--color-neutral-100);color:var(--color-text);}
  .nav-item:hover svg{opacity:1;}
  .nav-item.active{background:color-mix(in srgb,var(--accent-solid) 10%,transparent);color:var(--color-accent-600);border-color:color-mix(in srgb,var(--accent-solid) 20%,transparent);}
  html.dark .nav-item.active{color:var(--color-accent-400);}
  .nav-item.active svg{opacity:1;}
  /* Portfolio Intel keeps the accent whether or not it is the current page —
     the reference tints this one glyph on purpose, because the contract graph
     is the thing it wants a reader's eye to find in the list. */
  .nav-item[data-view="intel"] svg{color:var(--accent-solid);opacity:1;}
  html.dark .nav-item[data-view="intel"] svg{color:var(--color-accent-400);}
  .nav-item[data-view="intel"].active svg{color:inherit;}
  /* Nav counts as tinted pills (the design's "AI Active" / "3 Open" tags):
     teal for portfolio totals, amber for work waiting on someone, neutral
     gray for everything else — and a zero always renders neutral, because a
     colored tag with nothing behind it is a false alarm. */
  .nav-count{flex:none;font-size:9.5px;font-family:var(--font-mono);font-weight:700;padding:1px 7px;border-radius:999px;background:var(--color-neutral-100);color:var(--color-neutral-500);white-space:nowrap;}
  .nav-count:empty{display:none;}
  .nav-count[data-tone="teal"]{background:color-mix(in srgb,var(--accent-solid) 14%,transparent);color:var(--color-accent-600);}
  html.dark .nav-count[data-tone="teal"]{color:var(--color-accent-400);}
  .nav-count[data-tone="amber"]{background:rgba(245,158,11,.18);color:#b45309;}
  html.dark .nav-count[data-tone="amber"]{color:#fcd34d;}
  /* the design's right-aligned tag on a nav row ("2 Open" on Redline) */
  .nav-badge{margin-left:auto;flex:none;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;
    background:rgba(245,158,11,.2);color:#b45309;white-space:nowrap;}
  html.dark .nav-badge{color:#fcd34d;}
  /* Collapsible nav sections: the group label is a +/- toggle that shows or
     hides its tabs. Only ADMINISTRATION folds now — its header is the one
     button left carrying data-section-toggle and the +/− glyph; every other
     section is permanently open under a .static label, because a nav that can
     hide its own destinations makes people hunt for tabs they use daily. The
     section holding the active view is still auto-opened in setActiveNav(). */
  .nav-section-head{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;cursor:pointer;font:inherit;font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-400);padding:12px 12px 6px;text-align:left;transition:color .12s;}
  .nav-section:first-child .nav-section-head{padding-top:4px;}
  .nav-section-head:hover{color:var(--color-accent-600);}
  /* a label, not a control: no pointer, no hover invitation, nothing to press */
  .nav-section-head.static{cursor:default;}
  .nav-section-head.static:hover{color:var(--color-neutral-400);}
  .nav-plus{margin-left:auto;position:relative;width:12px;height:12px;flex:none;opacity:.8;}
  .nav-plus::before,.nav-plus::after{content:'';position:absolute;background:currentColor;border-radius:1px;transition:opacity .15s;}
  .nav-plus::before{left:1px;right:1px;top:5px;height:2px;}   /* horizontal bar (always shown) */
  .nav-plus::after{top:1px;bottom:1px;left:5px;width:2px;}    /* vertical bar (hidden when open → minus) */
  .nav-section.open .nav-plus::after{opacity:0;}
  .nav-section-head:hover .nav-plus{opacity:1;}
  .nav-section:not(.open) .nav-section-body{display:none;}

  /* .panel-tab is gone with the Activity panel's tab strip — it dressed a
     lone tab that had nothing to switch to, and the slide-over carries a
     plain header instead. */

  /* top-header global search (⌘K) — a flex item that may shrink, so the
     jurisdiction switcher and the search never overlap on narrower shells */
  .cmd-search{display:flex;align-items:center;gap:8px;border:1px solid var(--color-divider);background:var(--color-neutral-100);padding:6px 12px;flex:0 1 24rem;min-width:130px;border-radius:12px;transition:border-color .15s,box-shadow .15s;}
  .cmd-search:focus-within{border-color:var(--color-accent-500);box-shadow:0 0 0 1px var(--color-accent-500);}
  .cmd-search input{border:0;outline:0;background:transparent;font:inherit;font-family:var(--font-body);font-size:12.5px;flex:1;min-width:0;color:inherit;}

  /* top-header square icon buttons (theme toggle, notifications) */
  /* ============================================================
     THE SIDEBAR, COLLAPSED TO ITS ICONS
     ============================================================
     One class on the shell, and the 256px column becomes a 64px rail. The
     doors do not change, their order does not change and none of them is
     dropped — only the words come off, and they come off to the `title` each
     button already carries, so the labels move rather than disappear.

     WHY NATIVE TOOLTIPS AND NOT A DRAWN ONE. #nav is a scroller
     (overflow-y:auto), which clips a ::after tooltip at the rail's edge — the
     one place it has to be able to reach. The browser's own tooltip is not
     clipped by anything, is already wired to markup that has carried titles
     since the sidebar was written, and is reachable from the keyboard.

     WHAT IS DELIBERATELY NOT HIDDEN: the workspace status at the foot. It
     loses its wording and keeps its dot, because "is this workspace live" is
     the one thing on the sidebar that is not navigation and not recoverable by
     opening the door to look. */
  /* ---- THE HEADER BAR THE CONTROL LIVES ON ----
     Deep green, so the one control that changes the shape of the window reads
     as chrome rather than as another door in the list below it. It is the only
     filled block on the sidebar, which is what makes it findable at a glance in
     both states — the thing that was missing when this was a grey square in the
     far corner. */
  .rail-head{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;
    background:linear-gradient(135deg,var(--nav-deep),var(--color-accent-800) 70%);color:#fff;}
  .rail-head-label{font-family:var(--font-heading);font-size:10px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rail-toggle{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.14);color:#fff;cursor:pointer;padding:0;
    transition:background .12s,transform .12s;}
  .rail-toggle:hover{background:rgba(255,255,255,.3);}
  .rail-toggle:active{transform:scale(.94);}
  .rail-toggle:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  /* Collapsed the bar keeps its height and its colour and centres the control,
     so the rail still opens on the same block rather than on a door. */
  #app-shell.rail .rail-head{justify-content:center;padding:0;}
  #app-shell.rail .rail-head-label{display:none;}
  #app-shell.rail .rail-toggle{margin-left:0;}

  #app-shell.rail aside #nav{padding:12px 0;align-items:center;}
  #app-shell.rail aside .nav-item{width:44px;justify-content:center;padding:9px 0;gap:0;margin:0 auto;}
  /* The label spans carry inline flex:1, so this has to outrank them. */
  #app-shell.rail aside .nav-item>span:not(.nav-rail),
  #app-shell.rail aside .nav-count{display:none!important;}
  #app-shell.rail aside .nav-item .nav-rail{left:-8px;}
  /* A section heading cannot be re-worded from CSS, so its text is set to
     nothing and the stub is drawn in its place — ADMINISTRATION does not fit
     in 64px and an ellipsis of it says less than three letters do. */
  #app-shell.rail aside .nav-section-head{font-size:0;justify-content:center;padding:12px 0 4px;}
  #app-shell.rail aside .nav-section-head::before{content:"ADM";font-size:9px;font-weight:700;letter-spacing:.1em;}
  #app-shell.rail aside .nav-plus{display:none;}
  #app-shell.rail aside .copilot-wrap{padding:8px 0;display:flex;justify-content:center;}
  #app-shell.rail aside #side-copilot{width:44px;padding:10px 0;}
  #app-shell.rail aside .sc-label{display:none;}
  /* The rail is 60px wide — no room for a labelled reading, so the card falls
     back to its two dots and keeps its tooltips. */
  #app-shell.rail aside .foot-wrap{padding:10px 0;}
  #app-shell.rail aside .foot-card{background:none;border:0;padding:0;align-items:center;gap:9px;}
  #app-shell.rail aside .foot-card-head{justify-content:center;}
  #app-shell.rail aside .foot-card-title,
  #app-shell.rail aside .foot-kpi,
  #app-shell.rail aside .foot-note{display:none;}
  #app-shell.rail aside #side-ai-usage{justify-content:center;border-top:0;padding:0;margin:0;}
  #app-shell.rail aside #side-ai-usage .foot-ai-dot{margin-top:0;}

  /* ============================================================
     THE SIDEBAR IS THE BRAND'S OWN BLOCK.
     ============================================================
     The doors used to sit on the same white as the page, so the frame and the
     content read as one undifferentiated field and the eye had to find the
     boundary by the hairline alone. The rail now carries the deep teal the
     brand already uses on its mark, its primary buttons and the Copilot
     launcher — so the frame is obviously frame, and the white page inside it
     is obviously the work.

     ONLY COLOUR IS SET HERE. Every width, height, padding and breakpoint the
     shell already had is untouched: the collapsed rail, the off-canvas drawer
     below 900 and the short-laptop rules all still drive this sidebar, and
     they are all layout rules, which is why none of them appear below. */
  /* ---- THE SIDEBAR'S OWN RAMP ----
     Deeper than the accent ramp reaches, and it always was: a navigation column
     is a ground, not an accent. Four values, named here so a theme sets them in
     one place instead of four files finding their own dark green. */
  :root{ --nav-bg:#0b3d3a; --nav-line:#0a3532; --nav-ink:#9fd8d1; --nav-ink-strong:#ffffff;
         --nav-deep:#0f4c46; }

  /* ============================================================
     NAVY — the second brand, and the ONLY thing it changes is colour
     ============================================================
     Every value below has a twin in the green ramp above and nothing else
     here: no spacing, no radius, no rule about what is bold. A theme that
     could change more than colour would eventually be used to, and then two
     themes would be two layouts to maintain.

     It sets the same names, so nothing downstream knows which brand it is
     wearing. That is the whole return on gathering the colours into one place:
     493 utility classes, every chip, every gradient and every icon follow from
     this one block.

     WHAT IS NOT HERE is as deliberate: no --st-green, no --st-ruby, no
     --n-ins/--n-del. Accepted stays green and rejected stays red on a navy
     platform, because those two are not brand — they are the redline's
     grammar, and a lawyer reads them before they read anything else. */
  :root[data-brand="navy"]{
    --color-accent-50:#eef3fb;   --color-accent-100:#dce5f7;
    --color-accent-200:#b8caf0;  --color-accent-300:#8aa8e2;
    --color-accent-400:#5b82cf;  --color-accent-500:#3560b4;
    --color-accent-600:#24488f;  --color-accent-700:#1c3872;
    --color-accent-800:#16295a;  --color-accent-900:#111f45;
    --color-accent-50-rgb:238 243 251;   --color-accent-100-rgb:220 229 247;
    --color-accent-200-rgb:184 202 240;  --color-accent-300-rgb:138 168 226;
    --color-accent-400-rgb:91 130 207;   --color-accent-500-rgb:53 96 180;
    --color-accent-600-rgb:36 72 143;    --color-accent-700-rgb:28 56 114;
    --color-accent-800-rgb:22 41 90;     --color-accent-900-rgb:17 31 69;
    /* The companion hue and the hero's deep stop, stepped to match: on green
       these lean cyan, on navy they lean a lighter, cleaner blue. */
    --brand-cyan:#3f7ac4; --brand-cyan-600:#2f63a8; --brand-cyan-700:#2b5c9e;
    --brand-hero-deep:#0f2447;
    /* The sidebar's own ground, deeper than the ramp reaches. */
    --nav-bg:#122a4d; --nav-line:#0e2140; --nav-ink:#a5bde0; --nav-deep:#17376b;
  }
  /* Accent text that stays READABLE in both themes. The deep teal that reads
     well on white is 2.4:1 on the dark surface — the app's existing answer for
     accent words in the dark is accent-400, so this token carries it. Use it
     for accent-coloured LABELS; --color-accent still fills shapes. */
  :root{ --accent-ink:var(--color-accent-800); }
  html.dark{ --accent-ink:var(--color-accent-400); }

  /* ============ THE CONTRACT ROOM ============
     ONE style, TWO shells. The Docs page and the negotiation workbench are
     separate views that draw the same room, and each used to carry its own
     switcher in its own markup — which is precisely how two tab rows for one
     room drift apart. Both now call roomTabsHtml() and land here.

     Underline tabs, not pills: the room has five tabs, and five pills read as
     a toolbar of buttons rather than as one place with five faces. */
  /* ---- THE ROOM'S HEAD: A NAME AND THREE ACTS ----
     This was a bordered card carrying eight controls in a row — Share, Import,
     Save-as-template, Compare, History, Export, Delete, Draft new agreement,
     plus a collapse — before one line of the contract was visible. A toolbar
     that wide is not read; it is scanned past. The name is the biggest thing
     on the page now, and beside it sit the only three acts a reader reaches
     for from here: everything else, unchanged and undeleted, is one press away
     under the "⋯".

     No card. The head is the page's title block, not an object on it. */
  .room-head{ display:flex; align-items:flex-start; gap:12px; flex:none; flex-wrap:wrap;
    padding:2px 2px 0; }
  .room-head .room-id{ flex:1; min-width:min(100%,240px); }
  .room-head .room-name{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .room-head h1{ font-family:var(--font-heading); font-weight:600; margin:0; line-height:1.2;
    font-size:clamp(19px, 15px + 0.45vw, 24px); min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .room-head .room-sub{ font-size:11.5px; color:var(--color-neutral-600); margin-top:3px;
    overflow-wrap:anywhere; }
  .room-head .room-acts{ display:flex; align-items:center; gap:8px; flex:none; }
  .room-back{ width:34px; height:34px; padding:0; flex:none; margin-top:2px; }
  /* Draft new agreement. Solid green, by the owner's call: starting the next
     agreement is a first-class act here, not a second thought beside whatever
     this one contract happens to need. .ui-btn-primary carries the fill; this
     only stops it being squeezed when the header runs out of room. */
  .room-new{ flex:none; }
  /* The overflow menu. Its items keep the ids they had on the old toolbar, so
     every handler and every test presses exactly the control it always did. */
  .room-menu{ position:absolute; right:0; top:calc(100% + 6px); z-index:60; min-width:252px;
    background:var(--color-surface); border:1px solid var(--color-divider); border-radius:11px;
    box-shadow:0 10px 30px rgba(15,23,42,.16); padding:6px; }
  .room-menu button{ display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    border:0; background:none; cursor:pointer; font:inherit; font-size:12.5px; font-weight:500;
    color:var(--color-text); border-radius:7px; padding:8px 10px; }
  .room-menu button:hover{ background:var(--color-neutral-100); }
  .room-menu button .mnote{ margin-left:auto; font-size:10.5px; color:var(--color-neutral-500);
    font-weight:400; }
  /* ---- THE SYMBOLS CARRY THE COLOUR, THE WORDS STAY BLACK ----
     These were grey, which made a menu of nine verbs read as one grey block —
     the eye had nothing to aim at and had to read every line to find the one
     it wanted. Coloured marks give each row something to aim at without
     shouting: the colour is on the symbol only, the label stays plain text,
     and the destructive row keeps its red so it can never be mistaken for one
     of the safe ones.

     SOLID, NOT HOLLOW. The app's icons are hairline outlines — 1.6px of stroke
     around empty space — which at 14px is a faint wire drawing that dissolves
     into the row. The insides are filled now and the colour darkened to
     accent-800, so each reads as a small solid glyph: heavier on the page, and
     dark enough to hold its weight beside black text rather than floating off
     it.

     THE STROKE IS KNOCKED OUT IN THE ROW'S OWN COLOUR, and that is the whole
     trick. Filling these paths in one flat colour and leaving the stroke the
     same colour destroys them: Compare versions becomes a plain square, Word
     becomes a rectangle with no fold, the bin loses its lid. Every line that
     made the glyph readable was an INTERIOR line, and a solid fill swallows
     it. Painting the stroke in the surface colour cuts those same lines back
     out as white — so the mark is a solid dark-green shape with its detail
     showing through, which is what a filled icon set actually looks like.

     stroke-width is nudged up for that reason too: a knocked-out line has to
     survive being drawn over a dark ground at 14px. */
  .room-menu button svg,
  .reg-act svg{ flex:none; color:var(--color-accent-800); fill:currentColor;
    stroke:var(--color-surface); stroke-width:1.9; paint-order:stroke fill; }
  .room-menu button:hover svg{ color:var(--color-accent-800); }
  /* ---- THE ONE GLYPH WITH NOTHING TO KNOCK OUT OF ----
     Collapse the header is a single horizontal line. A line encloses no area,
     so the fill above paints nothing and the knock-out stroke paints it in the
     row's own white — an invisible icon, and the row went blank. Anything drawn
     as strokes alone keeps its stroke; there is exactly one, and it is named
     rather than guessed at. */
  #ws-collapse svg{ stroke:currentColor; stroke-width:2; }
  /* Ruby beats the accent on both menus, and on hover — hover must never turn
     Delete into a row that looks safe. */
  .room-menu .danger svg,
  .room-menu .danger:hover svg,
  .reg-act.danger svg{ color:var(--st-ruby-fg); }
  /* The register's row menu is the menu in the reference shot — a ⋯ per row on
     a table — and it was six lines of unmarked text. */
  .reg-act:hover{ background:var(--color-neutral-100); }
  /* On the dark paper accent-800 is a near-black green. The ramp inverts for
     the reason every other token does: the mark has to sit ON the ground, not
     sink into it. */
  html.dark .room-menu button svg,
  html.dark .room-menu button:hover svg,
  html.dark .reg-act svg{ color:var(--color-accent-300); }
  .room-menu .mgroup{ font-size:9px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    color:var(--color-neutral-500); padding:7px 10px 4px; }
  .room-menu hr{ border:0; border-top:1px solid var(--color-divider); margin:5px 4px; }
  .room-menu .danger{ color:var(--st-ruby-fg); }

  /* The rule under the tabs belongs to the ROW, not to the tab group — the row
     runs the full width and the group is only as wide as five words. The tabs
     stretch inside it and pull their own underline down onto that rule. */
  .room-tabrow{ display:flex; align-items:stretch; gap:14px; flex:none;
    border-bottom:1px solid var(--color-divider); }
  .room-tabs{ display:flex; align-items:stretch; align-self:stretch; gap:22px; flex:none; }
  .room-tab{ display:flex; align-items:center; gap:6px; border:0; border-radius:0;
    border-bottom:2px solid transparent; background:none; margin-bottom:-1px;
    padding:9px 1px; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap; color:var(--color-neutral-500);
    transition:color .13s, border-color .13s; }
  .room-tab:hover{ color:var(--color-text); }
  .room-tab.on{ color:var(--accent-ink); border-bottom-color:var(--accent-solid,var(--color-accent)); }
  /* The count beside Negotiate. Plain when it is only a total; amber and
     filled when some of it is waiting on THIS reader — a negotiation that
     needs an answer must never be discoverable only by clicking. */
  .room-tab .rt-n{ font-family:var(--font-mono); font-size:10.5px; font-weight:700;
    color:var(--color-neutral-500); }
  .room-tab.on .rt-n{ color:var(--accent-ink); }
  .room-tab .rt-n.due{ background:var(--st-amber-dot); color:#fff; border-radius:999px; padding:1px 6px; }

  /* The quiet line under the tabs: one sentence saying what this tab is for,
     and at most one button. Not a card — it explains the page, it is not part
     of it. */
  .room-quiet{ display:flex; align-items:center; gap:9px; flex:none; flex-wrap:wrap;
    background:var(--color-surface); border:1px solid var(--color-divider); border-radius:8px;
    padding:7px 13px; font-size:12px; line-height:1.5; color:var(--color-neutral-700); }
  .room-quiet .rq-go{ margin-left:auto; flex:none; }

  /* ---- A COMPLETED TERM, IN THE PROSE IT BELONGS TO ----
     readOnlyDocHtml replaces each field with the text it holds, and that text
     used to arrive in bold monospace — which reads as a code sample. A
     counterparty's NAME set in Courier in the middle of a recital does not
     look like a contract; it looks like a form dump. Same weight and face as
     the sentence around it, marked as a filled term by a quiet accent tint and
     a soft rule underneath, exactly as the live field is marked. The em-dash a
     BLANK term leaves is the one thing that still shouts, because an unfilled
     commercial term is something a reader must be able to point at. */
  .field-frozen{ font-family:inherit!important; font-weight:600;
    color:var(--color-doc-text); background:var(--color-accent-100);
    border-bottom:1.5px solid var(--color-accent-400); border-radius:3px 3px 0 0;
    padding:0 4px; }
  html.dark .field-frozen{ background:rgb(var(--color-accent-500-rgb)/.15); border-bottom-color:var(--color-accent-500); }
  .field-frozen[title]{ background:var(--st-amber-bg); border-bottom-color:var(--st-amber-dot);
    color:var(--st-amber-fg); font-weight:700; }

  /* ---- THE SIGNATURE BLOCK ----
     One box per party, in signing order. A dashed edge while it is empty — a
     line waiting to be signed on — turning solid and tinted once a mark lands,
     so "who is still missing" reads across the row without any label saying so. */
  /* The block on the left, what is holding it up on the right. Stacks below
     980px, where two columns would leave the signature boxes too narrow to
     hold a drawn mark. */
  /* ---- KEY TERMS: THE FACTS, AND WHAT THEY COMMIT YOU TO ---- */
  .terms-grid{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
    gap:14px; max-width:1040px; width:100%; margin:0 auto; }
  @media (max-width:980px){ .terms-grid{ grid-template-columns:1fr; max-width:640px; } }
  /* ---- A SUMMARY THAT BECOMES A FORM ONE ROW AT A TIME ----
     Values read as values. The row lights faintly on hover to say it can be
     changed, and only the row you press turns into a field. */
  .kt-row{ display:flex; align-items:center; gap:10px; min-height:34px;
    padding:5px 8px; margin:0 -8px; border-radius:6px;
    border-bottom:1px solid var(--color-divider); }
  .kt-row:last-of-type{ border-bottom:0; }
  .kt-k{ color:var(--color-neutral-600); font-size:11.5px; flex:1; min-width:0; }
  .kt-v{ font-size:11.5px; font-weight:600; text-align:right; min-width:0; max-width:62%; }
  .kt-row.is-editable .kt-read{ border:1px solid transparent; background:none; cursor:pointer;
    font:inherit; font-size:11.5px; font-weight:600; color:inherit; padding:3px 7px;
    margin:-3px -7px; border-radius:5px; text-align:right; }
  .kt-row.is-editable:hover .kt-read{ border-color:var(--color-divider); background:var(--color-bg); }
  .kt-row.is-editable .kt-read:focus-visible{ outline:2px solid var(--color-accent); outline-offset:1px; }
  .kt-row .kt-field{ flex:none; min-width:0; max-width:66%; width:100%; }
  .kt-row.is-open{ background:var(--color-bg); }
  .kt-none{ color:var(--color-neutral-400); font-weight:400; }

  .kt-read-row{ padding:6px 0; border-top:1px solid var(--color-divider); }
  .kt-read-row:first-of-type{ border-top:0; }
  .kt-read-k{ display:block; font-size:11.5px; font-weight:600; }
  .kt-read-v{ display:block; font-size:11px; line-height:1.5; color:var(--color-neutral-600);
    font-style:italic; margin-top:1px; }
  .risk-row{ display:flex; align-items:center; gap:9px; padding:4px 0; font-size:11.5px; }
  .risk-k{ flex:0 0 40%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--color-neutral-700); }
  .risk-bar{ flex:1; height:6px; border-radius:999px; background:var(--color-neutral-200); overflow:hidden; }
  .risk-bar i{ display:block; height:100%; border-radius:999px; }
  .risk-n{ flex:none; font-family:var(--font-mono); font-size:10.5px; color:var(--color-neutral-500);
    min-width:22px; text-align:right; }

  /* ---- HISTORY: THE STORY, AND THE VERSIONS BESIDE IT ---- */
  .hist-grid{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);
    gap:14px; max-width:1120px; width:100%; margin:0 auto; }
  @media (max-width:980px){ .hist-grid{ grid-template-columns:1fr; max-width:680px; } }
  .hist-rail{ position:relative; padding-left:26px; }
  .hist-rail::before{ content:""; position:absolute; left:10px; top:10px; bottom:10px;
    width:1px; background:var(--color-divider); }
  .hist-ev{ position:relative; padding:7px 0; }
  .hist-mark{ position:absolute; left:-26px; top:6px; width:21px; height:21px; border-radius:50%;
    display:grid; place-items:center; font-size:11px; line-height:1;
    background:var(--color-surface); border:1px solid var(--color-divider); }
  .hist-text{ font-size:12.5px; line-height:1.5; }
  .hist-meta{ font-size:10.5px; color:var(--color-neutral-500); margin-top:1px; }
  .hist-fp{ font-family:var(--font-mono); font-size:9.5px; color:var(--color-neutral-400); }
  /* The redline itself, under the event that made it — the same green-added /
     red-removed convention the exported report prints. */
  .hist-redline{ border:1px solid var(--color-divider); border-radius:6px; padding:8px 10px;
    margin-top:6px; font-size:11.5px; line-height:1.6; background:var(--color-surface); }
  .hist-redline ins{ background:var(--st-green-bg); color:var(--st-green-fg); text-decoration:underline; }
  .hist-redline del{ background:var(--st-ruby-bg); color:var(--st-ruby-fg); }
  .hist-note{ font-size:11px; color:var(--color-neutral-700); margin-top:5px;
    border-left:2px solid var(--color-divider); padding-left:9px; }
  /* Everyone / Ours / Theirs. One control with three states rather than three
     buttons that happen to be next to each other — the joined pill says only
     one of them can be true, before anything is pressed. */
  .hist-segs{ display:inline-flex; border:1px solid var(--color-divider); border-radius:7px;
    overflow:hidden; background:var(--color-surface); flex:none; }
  .hist-seg{ border:0; background:none; cursor:pointer; font:inherit; font-size:11px;
    font-weight:600; color:var(--color-neutral-600); padding:4px 10px; white-space:nowrap; }
  .hist-seg + .hist-seg{ border-left:1px solid var(--color-divider); }
  .hist-seg:hover{ background:var(--color-neutral-100); color:var(--color-text); }
  .hist-seg.is-on{ background:var(--color-accent); color:#fff; }
  .hist-seg.is-on:hover{ background:var(--color-accent); color:#fff; }
  .hist-filters{ display:flex; gap:8px; flex-wrap:wrap; padding-bottom:11px;
    border-bottom:1px solid var(--color-divider); }
  .hist-f{ display:flex; flex-direction:column; gap:2px; font-size:9.5px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--color-neutral-500); }
  .hist-f select{ font:inherit; font-size:11.5px; font-weight:400; text-transform:none;
    letter-spacing:0; border:1px solid var(--color-divider); border-radius:5px; padding:4px 6px;
    background:var(--color-surface); color:var(--color-text); max-width:150px; }

  .sign-grid{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
    gap:14px; max-width:1080px; width:100%; margin:0 auto; }
  @media (max-width:980px){ .sign-grid{ grid-template-columns:1fr; max-width:660px; } }
  .sig-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:11px; }
  .sig-box{ border:1px dashed var(--color-neutral-300); border-radius:9px; padding:12px 13px;
    text-align:center; background:var(--color-bg); }
  .sig-box.is-signed{ border-style:solid; border-color:var(--st-green-line);
    background:color-mix(in srgb, var(--st-green-bg) 55%, transparent); }
  .sig-mark{ min-height:46px; display:grid; place-items:center; }
  .sig-mark img{ height:42px; max-width:100%; object-fit:contain; }
  .sig-name{ font-family:var(--font-heading); font-size:19px; font-weight:600;
    color:var(--st-green-fg); }
  .sig-none{ font-size:12px; color:var(--color-neutral-500); }
  .sig-who{ border-top:1px solid var(--color-divider); margin-top:9px; padding-top:8px;
    font-size:11px; line-height:1.5; color:var(--color-neutral-600); }
  .sig-at{ font-family:var(--font-mono); font-size:10px; }
  .pill-x{ font-size:10px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }

  /* The Checks card's rows — an icon, a name, and the verb. Replaces two
     full-height cards that each carried a paragraph and a filled button
     before anything had been run. */
  .check-row{ display:flex; align-items:center; gap:10px; padding:8px 0;
    border-top:1px solid var(--color-divider); font-size:12.5px; }
  .check-row .ci{ flex:none; width:26px; height:26px; border-radius:7px; display:grid;
    place-items:center; background:var(--color-accent-100); color:var(--color-accent-700); }
  html.dark .check-row .ci{ background:rgb(var(--color-accent-500-rgb)/.16); color:var(--color-accent-300); }
  .check-row .cn{ flex:1; min-width:0; font-weight:600; }
  .check-row .cg{ flex:none; border:0; background:none; cursor:pointer; font:inherit;
    font-size:11.5px; font-weight:700; color:var(--accent-ink); padding:2px 0; }
  .check-row .cg:hover{ text-decoration:underline; }

  html.dark{ --nav-bg:#07302e; --nav-line:#062825; --nav-ink:#87cec5; }
  #side-nav .nav-item{ color:var(--nav-ink); }
  #side-nav .nav-item svg{ opacity:.9; }
  #side-nav .nav-item:hover{ background:rgba(255,255,255,.08); color:var(--nav-ink-strong); border-color:transparent; }
  #side-nav .nav-item:hover svg{ opacity:1; }
  #side-nav .nav-item.active{ background:rgba(255,255,255,.15); color:var(--nav-ink-strong); border-color:transparent; }
  html.dark #side-nav .nav-item.active{ color:var(--nav-ink-strong); }
  /* Insights kept a teal glyph to mark itself out on white; on teal it needs
     the opposite treatment or it disappears into its own background. */
  #side-nav .nav-item[data-view="intel"] svg{ color:inherit; }
  #side-nav .nav-count{ background:rgba(255,255,255,.14); color:var(--nav-ink); }
  #side-nav .nav-item.active .nav-count{ background:rgba(255,255,255,.24); color:#fff; }
  #side-nav .nav-count[data-tone="teal"]{ background:rgb(var(--color-accent-300-rgb)/.22); color:var(--color-accent-100); }
  #side-nav .nav-count[data-tone="amber"]{ background:rgba(245,158,11,.26); color:#fde68a; }
  #side-nav .nav-section-head{ color:rgba(255,255,255,.62); }
  #side-nav .nav-section-head:hover{ color:rgba(255,255,255,.78); }
  #side-nav .nav-section-head.static:hover{ color:rgba(255,255,255,.62); }
  #side-nav .nav-plus{ color:rgba(255,255,255,.55); }
  #app-shell.rail #side-nav .nav-section-head::before{ color:rgba(255,255,255,.62); }
  /* The head block sat on deep green to stand off a white rail. On a teal rail
     it has to go the other way — a lighter panel — or the one control that
     changes the window's shape vanishes into the wall behind it. */
  #side-nav .rail-head{ background:rgba(255,255,255,.10); }
  #side-nav .rail-head-label{ color:rgba(255,255,255,.7); }
  /* ---- THE STATUS CARD AT THE FOOT OF THE SIDEBAR ----
     THE SIDEBAR IS DARK IN EVERY THEME (--nav-bg is deep green or deep navy,
     never light), so this card is styled ONCE, for a dark ground. It used to
     be written for a white rail — a --color-neutral-100 panel with
     --color-neutral-700 text — and then repainted for the dark by the two
     rules below it. One override further down was missed, which is how the
     open drawer ended up drawing a near-white block and then writing white
     text on it: the card was legible in neither theme, at exactly the size
     where it is the only status a reader can see. Nothing here reads a
     light-theme token. */
  #side-nav .foot-wrap{ border-top-color:rgba(255,255,255,.12); }
  #side-nav .foot-card{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13);
    border-radius:12px; padding:9px 11px 10px; display:flex; flex-direction:column; gap:5px; min-width:0; }
  #side-nav .foot-card-head{ display:flex; align-items:center; gap:7px; min-width:0; padding-bottom:1px; }
  #side-nav .foot-card-title{ font-family:var(--font-heading); font-size:9.5px; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:rgba(255,255,255,.55);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* label left, figure right — the figure is the thing being read, so it is
     the brighter of the two and never wraps under its own label */
  #side-nav .foot-kpi{ display:flex; align-items:baseline; justify-content:space-between;
    gap:8px; min-width:0; font-size:10.5px; line-height:1.35; }
  #side-nav .foot-k{ color:rgba(255,255,255,.58); white-space:nowrap; flex:none; }
  #side-nav .foot-v{ color:rgba(255,255,255,.92); font-weight:600; min-width:0;
    text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #side-nav .foot-v[data-tone="on"]{ color:#6ee7b7; }
  #side-nav .foot-v[data-tone="off"]{ color:rgba(255,255,255,.55); font-weight:500; }
  #side-nav .foot-note{ display:block; font-size:9.5px; line-height:1.35;
    color:rgba(255,255,255,.46); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* the spend meter is a button, so it has to be told it is not one */
  #side-nav #side-ai-usage{ align-items:flex-start; gap:7px; border:0; background:none;
    cursor:pointer; padding:6px 0 0; margin-top:1px; text-align:left; font:inherit;
    color:inherit; min-width:0; border-top:1px solid rgba(255,255,255,.10); }
  #side-nav #side-ai-usage .foot-ai-dot{ margin-top:4px; }
  #side-nav .foot-ai-body{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  #side-nav #side-ai-usage:hover .foot-v{ text-decoration:underline; }
  #app-shell.rail #side-nav .foot-card{ background:none; border:0; }
  /* the drawer below 900 floats this same block over the page */
  #side-nav .scroll-thin::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); }

  /* The header's icon controls lose their box. Three bordered grey tiles in a
     row read as a toolbar of equal weights; they are secondary to the search
     and the Copilot, and now look it. */
  .hdr-icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--color-neutral-500);cursor:pointer;transition:background .15s,color .15s;}
  .hdr-icon-btn:hover{background:var(--color-neutral-100);color:var(--color-text);}

  /* jurisdiction switcher (Sweden / Kenya) */
  .region-btn{display:flex;align-items:center;gap:6px;border:0;background:none;font:inherit;font-family:var(--font-body);font-size:11px;font-weight:600;padding:4px 10px;border-radius:9px;cursor:pointer;color:var(--color-neutral-500);transition:background .15s,color .15s;white-space:nowrap;}
  .region-btn:hover{color:var(--color-text);}
  .region-btn.active{background:var(--accent-solid);color:#fff;box-shadow:0 1px 4px rgba(15,23,42,.18);}
  .region-flag{display:inline-flex;flex:none;line-height:0;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(15,23,42,.12);}
  /* The letters ride with the flag only once the words are dropped — with the
     full label showing they would read as a stutter ("SE Sweden"). */
  .region-abbr{display:none;font-weight:700;letter-spacing:.03em;}
  @media (max-width:1430px){ .region-abbr{display:inline;} }

  /* theme toggle: both glyphs live in the button; html.dark picks which shows */
  /* The theme control. Its face is a swatch of the theme you are wearing —
     the shortest possible answer to "which one am I on", readable without
     opening anything. The rows below carry their own swatch for the same
     reason: naming a colour is slower than showing it. */
  #theme-swatch{ width:15px; height:15px; border-radius:5px; display:block;
    background:var(--brand-grad); border:1px solid rgb(0 0 0/.14); }
  html.dark #theme-swatch{ background:var(--color-neutral-800); border-color:rgb(255 255 255/.22); }
  #theme-menu button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    border:0; background:none; cursor:pointer; font:inherit; font-size:12.5px; font-weight:500;
    color:var(--color-text); border-radius:7px; padding:8px 10px; }
  #theme-menu button:hover{ background:var(--color-neutral-100); }
  #theme-menu .tsw{ width:16px; height:16px; border-radius:5px; flex:none;
    border:1px solid rgb(0 0 0/.16); }
  html.dark #theme-menu .tsw{ border-color:rgb(255 255 255/.2); }
  #theme-menu .tnote{ display:block; font-size:10.5px; font-weight:400;
    color:var(--color-neutral-500); }
  #theme-menu .ttick{ margin-left:auto; flex:none; color:var(--color-accent-700); font-weight:700; }
  html.dark #theme-menu .ttick{ color:var(--color-accent-300); }
  #side-copilot:hover{filter:brightness(1.07);}
  /* narrow shells: shed the "Jurisdiction:" caption first, then the switcher,
     then the global search and the profile text */
  @media (max-width:1620px){ #region-switch>span:first-child{display:none;} }
  /* Flags only, not gone. Hiding it outright removed a control that changes
     money, the governing-law checks and the Copilot's briefing — survivable
     while narrow windows were unusable, not survivable now they are not. */
  @media (max-width:1430px){ #region-switch .region-btn{font-size:0;gap:5px;padding:4px 8px;} #region-switch .region-btn>span{font-size:10.5px;} }
  /* Below 900 it moves into the nav drawer instead (placeRegionSwitch,
     js/app.js), where there is room for its full labels again. */
  @media (max-width:899px){
    /* Stacked, not side by side: the two labels ("Sweden (EU/GDPR)",
       "Kenya (KICA/ODPC)") need 251px between them and the drawer is 240px
       wide, so in a row they were clipped. A column fits both at full width
       and reads as the pair of choices it is. */
    #side-nav #region-switch{margin:0 12px 4px;flex-direction:column;align-items:stretch!important;gap:2px;}
    #side-nav #region-switch>span:first-child{display:none;}
    #side-nav #region-switch .region-btn{font-size:11px;gap:6px;padding:6px 9px;justify-content:flex-start;}
    #side-nav #region-switch .region-btn>span{font-size:13px;}
  }
  /* Retuned. The old single step at 1000 fired too late: at 1024 the right-hand
     actions were still 504px wide, which left the brand block 117px of the
     137px it needs and clipped "HaTi" itself. The profile text and the Copilot
     label — the two widest optional things — now stand down a breakpoint
     earlier, before anything has to be cut. */
  @media (max-width:1199px){ #hdr-profile-meta{display:none!important;} .cmd-ai-label{display:none!important;} }
  @media (max-width:1000px){ .cmd-search{display:none!important;} }

  /* ============================================================
     RESPONSIVE SHELL — the two side strips, and what happens to them.

     THE DEFECT THIS REPLACES. The shell was three strips: a 256px sidebar, the
     middle, and a 292px activity column, all three hard numbers with no
     breakpoint anywhere. Neither side strip ever gave up a pixel, so the
     middle was squeezed from both sides — 732px of working room at 1280, 476px
     at 1024, and negative at 390. And because #app-shell is position:fixed the
     page can never grow a horizontal scrollbar, so what did not fit was not
     scrolled to, it was silently CLIPPED. Zooming the browser out was the only
     way to get the room back. Measured: at 1280 the contract's own name on its
     own page rendered in 31px of the 175px it needed.

     Five sizes, named once here and honoured by every view:
       ultrawide >=1800 | desktop 1440-1799 | laptop 1200-1439
       tablet 900-1199  | phone <900
     Desktop is deliberately IDENTICAL to what shipped before — the density is
     the design, and only the widths that were already broken move.
     ============================================================ */

  /* -- ultrawide: the activity column takes a little more -- */
  @media (min-width:1800px){ :root{ --shell-panel-w:320px; } }
  /* -- laptop: trim it before anything has to be clipped -- */
  @media (max-width:1439px){ :root{ --shell-panel-w:264px; } }

  /* -- THE SIDEBAR'S WIDTH IS NOT DECIDED HERE --
        An earlier version of this block collapsed the sidebar to an icon rail
        on a breakpoint. It no longer does, because the rail is already a
        feature: #app-shell.rail, toggled from the header and remembered per
        browser (applyRail in js/app.js, and the rules further up this file).
        That design is deliberate and it argues its case where it is written —
        a sidebar that folds itself while you are reading has moved every door
        you were aiming at for a reason you did not ask for. Two systems both
        claiming the sidebar's width is exactly the duplication this codebase
        keeps paying for, so there is one, and it is that one. applyRail writes
        the column inline, which would beat anything written here in any case.

        The one exception is the phone, below. At 390px an expanded sidebar
        leaves 134px for the page, which is not a choice between two layouts —
        it is the app not working. -- */

  /* -- phone: the sidebar leaves the grid entirely and becomes a drawer over
        the page, opened from the menu button in the header. applyRail writes
        the 0px column (it owns that inline style); everything here is what the
        drawer looks like once it is out of the grid. -- */
  @media (max-width:899px){
    #nav-toggle{ display:grid!important; }
    #side-nav{
      position:fixed; top:64px; left:0; bottom:0; z-index:55; width:240px;
      transform:translateX(-105%); transition:transform .25s var(--ease);
      box-shadow:var(--shadow-lg);
    }
    /* Open, it is the FULL sidebar — labels, counts and all. There is room for
       them in a 240px drawer, and the rail's compaction is for a column that
       has to share the width, which this no longer does. So the rail rules
       further up are unwound here for the duration. */
    #side-nav.open{ transform:none; }
    #app-shell.rail #side-nav.open .nav-item{ width:auto; justify-content:flex-start; padding:9px 12px; gap:11px; margin:0; }
    #app-shell.rail #side-nav.open .nav-item>span:not(.nav-rail){ display:inline!important; }
    #app-shell.rail #side-nav.open .nav-count:not(:empty){ display:inline-block!important; }
    #app-shell.rail #side-nav.open .nav-item .nav-rail{ left:0; }
    #app-shell.rail #side-nav.open .nav-section-head{ font-size:10px; justify-content:flex-start; padding:12px 12px 6px; }
    #app-shell.rail #side-nav.open .nav-section-head::before{ content:none; }
    #app-shell.rail #side-nav.open .nav-plus{ display:block; margin-left:auto; }
    #app-shell.rail #side-nav.open #nav{ padding:12px; align-items:stretch; }
    #app-shell.rail #side-nav.open .copilot-wrap{ padding:12px; display:block; }
    #app-shell.rail #side-nav.open #side-copilot{ width:100%; padding:10px; }
    #app-shell.rail #side-nav.open .sc-label{ display:inline; }
    /* THE DRAWER IS NOT THE RAIL. It is 240px of dark sidebar floating over
       the page, so the card comes back in full — dark ground, dark-ground
       ink. This rule used to hand it a light-grey panel while the ink rules
       above kept writing white on it, which is the washed-out block the
       drawer was showing. */
    #app-shell.rail #side-nav.open .foot-wrap{ padding:12px; }
    #app-shell.rail #side-nav.open .foot-card{ background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.13); padding:9px 11px 10px; align-items:stretch; gap:5px; }
    #app-shell.rail #side-nav.open .foot-card-head{ justify-content:flex-start; }
    #app-shell.rail #side-nav.open .foot-card-title,
    #app-shell.rail #side-nav.open .foot-note{ display:block; }
    #app-shell.rail #side-nav.open .foot-kpi{ display:flex; }
    #app-shell.rail #side-nav.open #side-ai-usage{ justify-content:flex-start;
      border-top:1px solid rgba(255,255,255,.10); padding:6px 0 0; margin-top:1px; }
    #app-shell.rail #side-nav.open #side-ai-usage .foot-ai-dot{ margin-top:4px; }
    /* the rail's own header toggle has nothing to toggle inside a drawer */
    #side-nav .rail-head{ display:none; }
    #nav-scrim:not([hidden]){
      display:block; position:fixed; inset:64px 0 0 0; z-index:54;
      background:color-mix(in srgb,#020617 45%,transparent);
    }
  }

  /* ============================================================
     THE SHORT LAPTOP — the dimension the first responsive pass missed.

     THE DEFECT THIS REPLACES. That pass tested nine WIDTHS at a single height
     of 900px. Almost no laptop has 900px of page. A 1920x1080 ThinkPad at the
     Windows-recommended 150% scaling reports 1280x720 to the browser, and once
     Chrome's tabs, address bar and bookmarks bar are taken off, the page gets
     about 590. A 1366x768 laptop gets about 638. Those are the two most common
     machines a customer will first open HaTi on, and the layout was built for
     a canvas half as tall again.

     Measured on the real thing before this block existed:
       · the calendar's last week was cut off inside its card (the grid needs
         392px of day cells and had 287px)
       · the negotiation's change list got 83px of height for a 110px card
       · 61% of the first screen was banners and the hero, with ZERO contracts
         visible — you landed on HaTi and saw nothing it is for

     So the vertical rhythm tightens with the window, exactly as the horizontal
     one does. Nothing is removed and nothing is reordered: this is padding,
     gaps and one type step. Above 820px of page nothing here applies at all,
     so the big-screen design is untouched.
     ============================================================ */

  /* -- short: most laptops, including 1366x768 and 1080p at 125% -- */
  @media (max-height:820px){
    .hm-page{gap:7px!important;padding-top:10px!important;padding-bottom:12px!important;}
    .hm-hero{padding:19px 24px!important;gap:14px!important;}
    .hm-hero h2{font-size:clamp(21px,16px + 0.55vw,27px)!important;}
    .hm-hero p{margin-top:0!important;}
    #gs-card{padding:12px 16px 10px!important;}
    #email-setup-banner{padding:9px 14px!important;}
    /* the page header above every view */
    #page-head>div{padding-top:8px!important;padding-bottom:8px!important;}
  }
  /* -- very short: a 1080p panel at 150%, which is the Windows default on a
        14-inch ThinkPad and therefore the most common single configuration -- */
  @media (max-height:680px){
    .hm-page{gap:6px!important;padding-top:8px!important;}
    .hm-hero{padding:15px 20px!important;}
    .hm-hero h2{font-size:clamp(19px,15px + 0.45vw,24px)!important;}
    /* Taken from the card's own frame rather than from the hero: on a 590px
       page the last 8px have to come from somewhere, and a card's padding is
       worth less than the banner a reader actually looks at. */
    .hm-pipe-card{padding:12px 14px!important;}
    .hm-decisions>div>section{padding:12px 14px!important;}
    #gs-card{padding:10px 14px 8px!important;}
    #email-setup-banner{padding:8px 12px!important;}
    #page-head>div{padding-top:6px!important;padding-bottom:6px!important;}
  }

  /* ============================================================
     RESPONSIVE VIEW GRIDS.
     These column counts used to be hard numbers written inline at each call
     site — repeat(4,1fr), 2fr 1fr, 268px … 292px — so a card row that needed
     1013px was still asked to fit 978px and the last card left the window.
     They live here instead: one file, one set of breakpoints, and the same
     five sizes the shell uses. The widest rule in every block is what shipped
     before, so nothing moves at desktop width.
     ============================================================ */

  /* ---- THE DASHBOARD FILLS ITS WINDOW ----
     THE DEFECT THIS REPLACES. Every other full-page view sets its own height
     from --view-h; the dashboard did not, so it was only ever as tall as its
     content and the rest of the window was left blank. The pipeline row is the
     bottom of that content and it never grew — a constant 245px at every size
     — so the taller the screen, the bigger the dead band underneath it.
     Measured: 31px of empty page on a 1280x590 laptop, 162px at 1600x770 and
     306px at 1920x950, which is a third of the screen showing nothing.

     Shrinking the hero for short laptops made that band more visible, which is
     how it was reported, but the band was there before and on a big monitor it
     was three times worse.

     --view-h is the scroll container's own measured height (syncViewHeight,
     js/app.js), so this is the real room the page has rather than a guess. The
     row takes what the hero and the metrics leave, and the columns inside it
     fill and scroll — so the space becomes contracts instead of nothing.
