# Render Blueprint for HaTi CLM.
# Deploy: on render.com choose "New +" → "Blueprint", connect this repo, and
# Render reads this file to create the web service. Then set RESEND_API_KEY
# (your Resend key) in the dashboard — it is intentionally not stored here.
#
# Real email (invites + signing codes) turns on automatically once
# RESEND_API_KEY is present. HTTPS=true issues Secure cookies and makes the
# share links in emails use https://<your-render-url>.
#
# ALSO SET APP_URL to this service's public address (e.g.
# https://hati-clm.onrender.com). Mail that HaTi composes on a SCHEDULE —
# obligation reminders, the daily/weekly brief, intake decisions and the nudge
# to a counterparty who has not opened a shared contract — has no incoming
# request to read the host from, so without APP_URL every link in it points at
# http://localhost and is dead for the person who receives it.
#
# PERSISTENCE: the app stores its SQLite database and uploaded files under
# HATI_DATA. That MUST point at a mounted persistent disk, otherwise Render's
# filesystem is wiped on every deploy and all contracts/accounts are lost. The
# `disk` below provides that permanent storage and HATI_DATA points the app at
# it — together they keep data across deploys and restarts.
#
# NODE_ENV=production tells the server it is running live (Young said yes,
# 27 Sep 2026). Express then keeps its own development behaviour out of
# answers, and the build's `npm install` skips the three packages only the
# tests use (eslint, jsdom, playwright-core) — the server needs express alone.
services:
  - type: web
    name: hati-clm
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HTTPS
        value: "true"
      - key: HATI_DATA
        value: /var/data
      - key: EMAIL_FROM
        value: HaTi <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false   # set this in the Render dashboard; never committed to git
      - key: APP_URL
        sync: false   # set to this service's public https URL — scheduled email links depend on it
